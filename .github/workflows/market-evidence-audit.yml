name: Read-only market EOD evidence audit
on:
  push:
    paths:
      - ".github/workflows/market-evidence-audit.yml"
  workflow_dispatch:
    inputs:
      date:
        description: "Target trading session YYYY-MM-DD"
        required: false
        default: "2026-10-21"
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read VNDIRECT full consistent index history and compute audit
        env:
          TARGET_DATE: ${{ github.event.inputs.date || '2026-10-21' }}
        run: |
          node --input-type=module <<'NODE'
          const date = process.env.TARGET_DATE;
          if (!/^20\d{2}-\d{2}-\d{2}$/.test(date)) throw new Error('Bad date');
          const q = 'code:VNINDEX~date:gte:2025-10-01~date:lte:' + date;
          const url = 'https://api-finfo.vndirect.com.vn/v4/vnmarket_prices?sort=date&q=' + q + '&size=500';
          let payload;
          for (let trial=0; trial<5;trial++){
            try {
              const response = await fetch(url, {headers: {'User-Agent':'XuanLeMarketEvidenceAudit/1.0','Accept':'application/json'},signal:AbortSignal.timeout(25000)});
              if (!response.ok) throw new Error('HTTP '+response.status);
              payload=await response.json();break;
            }catch(err){if(trial===4)throw err;await new Promise(r=>setTimeout(r,2500*(trial+1)));}
          }
          const raw=Array.isArray(payload?.data)?payload.data:[];
          const rows=raw.filter(z=>String(z.code).toUpperCase()==='VNINDEX'&&String(z.date).slice(0,10)<=date)
            .map(z=>({date:String(z.date).slice(0,10),open:Number(z.open),high:Number(z.high),low:Number(z.low),close:Number(z.close),pctChange:Number(z.pctChange),nmValue:Number(z.nmValue),nmVolume:Number(z.nmVolume)}))
            .sort((a,b)=>a.date.localeCompare(b.date));
          if(rows.length<210||rows.at(-1)?.date!==date)throw new Error('Incomplete EOD history '+rows.length+' last='+rows.at(-1)?.date);
          const dates=new Set(rows.map(x=>x.date));
          if(dates.size!==rows.length)throw new Error('Duplicate dates in source');
          if(rows.some(x=>!Number.isFinite(x.close)||x.close<=0||!Number.isFinite(x.nmValue)||x.nmValue<=0))throw new Error('Invalid price/turnover');
          const mean=x=>x.reduce((a,b)=>a+b,0)/x.length;
          const ma=n=>mean(rows.slice(-n).map(x=>x.close));
          const ma20FiveAgo=mean(rows.slice(-25,-5).map(x=>x.close));
          const turnoverToBillion=amount=>amount/1e9;
          const today=rows.at(-1);
          const liquidity20=mean(rows.slice(-21,-1).map(x=>x.nmValue));
          // V3.3.1: index ETF rebalance session 18/09/2026 is excluded from distribution count.
          // Reference: ACBS FTSE GEIS rebalancing note (25/08/2026); index effective 21/09.
          const excludedEventSessions = new Set(['2026-09-18','2026-10-15']);
          // 2026-10-15 VN30F2610 expiry: HNX third Thursday of October; exclude from distribution
          // https://eoffice.hnx.vn/vi-vn/huong-dan/chi-tiet-thu-tuc-36-65.html
          // https://www.dsc.com.vn/kien-thuc/dao-han-phai-sinh-la-gi
          const activeDistributions=[];
          const recent=rows.slice(-26);
          for(let j=1;j<recent.length;j++){
            const current=recent[j],prev=recent[j-1];
            const changePct=(current.close/prev.close-1)*100;
            if(changePct<=-0.2&&current.nmValue>prev.nmValue&&!excludedEventSessions.has(current.date)){
              const after=recent.slice(j+1);
              if(!after.some(x=>x.close>=current.close*1.05))activeDistributions.push({date:current.date,pct:changePct,turnoverBillion:turnoverToBillion(current.nmValue)});
            }
          }
          const output={
            source:url,sourceInstitution:'VNDIRECT Finfo',count:rows.length,first:rows[0].date,last:today.date,
            session:today,prior:rows.at(-2),last5:rows.slice(-5),
            ma20:ma(20),ma50:ma(50),ma200:ma(200),ma20FiveAgo,
            liquidityTodayBillion:turnoverToBillion(today.nmValue),
            liquidityPriorBillion:turnoverToBillion(rows.at(-2).nmValue),
            liquidityMean20Billion:turnoverToBillion(liquidity20),
            liquidityRatio:today.nmValue/liquidity20,
            closePositionInRange:(today.close-today.low)/(today.high-today.low),
            activeDistributions,
            activeDistributionCount:activeDistributions.length,
            // V3.3.1: independently confirmed ETF index rebalance on 2026-09-18.
            // The ETF event is excluded from distribution counting.
            validDistributions:activeDistributions.filter(x=>x.date!=='2026-09-18'),
            validDistributionCount:activeDistributions.filter(x=>x.date!=='2026-09-18').length,
            excludedEventDates:[...excludedEventSessions],excludedEventSessions:[...excludedEventSessions],
            prior20Low:Math.min(...rows.slice(-21,-1).map(x=>x.low)),
            prior20High:Math.max(...rows.slice(-21,-1).map(x=>x.high)),
            formula:"MA(n)=arithmetic mean last n closes; turnoverMean20=mean prev20 nmValue; distribution=drop>=0.2pct and nmValue>prev and never recovered >=5pct"
          };
          // Fully expose the source rows used in all calculations for independent review.
          console.log('SOURCE_HISTORY_ROWS_JSON '+JSON.stringify(rows));
          const samples = ['2026-10-14', '2026-10-15'].map(day => rows.find(r=>r.date===day));
          if(samples.some(r=>!r)) throw new Error('Missing exact-date quoted sample rows');
          console.log('EXACT_SOURCE_SAMPLE_ROWS '+JSON.stringify(samples));
          const literal = raw.find(x=>String(x.date).slice(0,10)===date && String(x.code).toUpperCase()==='VNINDEX');
          if(!literal) throw new Error('Raw original index entry missing');
          console.log('RAW_VENDOR_INDEX_QUOTE '+JSON.stringify(literal));

          // One-off non-mutating validation of ICG vendor records; no inferred price.
          const diagUrls={
            vndirect:'https://api-finfo.vndirect.com.vn/v4/stock_prices?sort=date&q=code:ICG~date:2026-10-14&size=10',
            kbs:'https://kbbuddywts.kbsec.com.vn/iis-server/investment/stocks/ICG/data_day?sdate=14-10-2026&edate=14-10-2026'
          };
          for (const [provider,endpoint] of Object.entries(diagUrls)) {
            try{
              const res=await fetch(endpoint,{headers:{'User-Agent':'XuanLeTVS-ExactDateEvidence/1.0'},signal:AbortSignal.timeout(20000)});
              const json=await res.json();
              console.log('ICG_14_10_VENDOR_DIAG '+JSON.stringify({provider,httpStatus:res.status,response:json}));
            }catch(error){console.log('ICG_14_10_VENDOR_DIAG '+JSON.stringify({provider,error:String(error.message)}));}
          }

          try{
            const rawHtml=await (await fetch('https://cophieu68.vn/quote/history.php?id=ICG',{headers:{'User-Agent':'Mozilla/5.0 XuanLeDataAudit'},signal:AbortSignal.timeout(20000)})).text();
            const at=rawHtml.indexOf('14/10/2026');
            console.log('ICG_NO_TRADE_PROVIDER_SAMPLE '+JSON.stringify({match:at>=0,context:at>=0?rawHtml.slice(at-500,at+1800):rawHtml.slice(0,400)}));
          }catch(err){console.log('ICG_NO_TRADE_PROVIDER_SAMPLE '+JSON.stringify({error:String(err.message)}));}
          console.log('VERIFIED_MARKET_EVIDENCE_JSON '+JSON.stringify(output));
          NODE
