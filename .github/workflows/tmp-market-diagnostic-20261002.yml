name: Temporary market diagnostic 2026-10-02

on:
  push:
    paths:
      - ".github/workflows/tmp-market-diagnostic-20261002.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Compute verified market diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';

          const getJson = async (url) => {
            const r = await fetch(url, { headers: { "user-agent": "Mozilla/5.0 XuanLeTVS-Diagnostic/3.2" } });
            if (!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
            return r.json();
          };
          const avg = a => a.reduce((s,x)=>s+x,0)/a.length;
          const median = a => {
            const x=[...a].sort((a,b)=>a-b);
            if(!x.length) return null;
            const m=Math.floor(x.length/2);
            return x.length%2?x[m]:(x[m-1]+x[m])/2;
          };
          const emaSeries=(values,period)=>{
            const k=2/(period+1);
            let e=avg(values.slice(0,period));
            const out=Array(period-1).fill(null).concat([e]);
            for(let i=period;i<values.length;i++){ e=values[i]*k+e*(1-k); out.push(e); }
            return out;
          };
          const rsiWilder=(values,period=14)=>{
            if(values.length<=period) return null;
            let gains=0,losses=0;
            for(let i=1;i<=period;i++){const d=values[i]-values[i-1]; if(d>=0) gains+=d; else losses-=d;}
            let ag=gains/period, al=losses/period;
            for(let i=period+1;i<values.length;i++){const d=values[i]-values[i-1]; const g=d>0?d:0; const l=d<0?-d:0; ag=(ag*(period-1)+g)/period; al=(al*(period-1)+l)/period;}
            if(al===0) return 100;
            const rs=ag/al; return 100-(100/(1+rs));
          };

          const date = "2026-10-02";
          const histUrl = "https://api-finfo.vndirect.com.vn/v4/vnmarket_prices?sort=date&q=code:VNINDEX~date:gte:2025-10-01~date:lte:2026-10-02&size=500";
          const hist = await getJson(histUrl);
          const rows = (Array.isArray(hist?.data) ? hist.data : [])
            .filter(x => String(x?.code||'').toUpperCase() === "VNINDEX" && x?.date <= date)
            .sort((a,b) => String(a.date).localeCompare(String(b.date)));
          if (rows.length < 210) throw new Error(`VNINDEX history insufficient: ${rows.length}`);
          const closes = rows.map(x => Number(x.close));
          const values = rows.map(x => Number(x.nmValue ?? x.value ?? x.totalValue));
          const maAt=(endIndex,n)=>avg(closes.slice(endIndex-n+1,endIndex+1));
          const lastIndex=rows.length-1;
          const last=rows[lastIndex], prev=rows[lastIndex-1];
          const ma20=maAt(lastIndex,20), ma50=maAt(lastIndex,50), ma200=maAt(lastIndex,200);
          const ma20FiveAgo=maAt(lastIndex-5,20);
          const prior20Values=values.slice(-21,-1).filter(Number.isFinite);
          const avgValuePrev20=prior20Values.length===20?avg(prior20Values):null;
          const prior5=values.slice(-6,-1).filter(Number.isFinite);
          const prior10=values.slice(-11,-1).filter(Number.isFinite);
          const avgValuePrev5=prior5.length===5?avg(prior5):null;
          const avgValuePrev10=prior10.length===10?avg(prior10):null;
          const low20Prev=Math.min(...rows.slice(-21,-1).map(x=>Number(x.low)).filter(Number.isFinite));
          const closeLow20Prev=Math.min(...closes.slice(-21,-1));
          const candlePos=(Number(last.close)-Number(last.low))/(Number(last.high)-Number(last.low));
          const candleThird=candlePos<=1/3?"lower":candlePos>=2/3?"upper":"middle";

          const ema12=emaSeries(closes,12), ema26=emaSeries(closes,26);
          const macd=closes.map((_,i)=>ema12[i]!=null&&ema26[i]!=null?ema12[i]-ema26[i]:null);
          const macdClean=macd.filter(Number.isFinite);
          const signalSeries=emaSeries(macdClean,9);
          const macdLast=macdClean.at(-1) ?? null;
          const signalLast=signalSeries.at(-1) ?? null;

          const startIdx=rows.length-25;
          const distributionCandidates=[];
          for(let i=startIdx;i<rows.length;i++){
            if(i<=0) continue;
            const r=rows[i], p=rows[i-1];
            const pct=(Number(r.close)/Number(p.close)-1)*100;
            const val=Number(r.nmValue), prevVal=Number(p.nmValue);
            if(pct<=-0.2 && Number.isFinite(val) && Number.isFinite(prevVal) && val>prevVal){
              const laterRows=rows.slice(i+1);
              const laterMax=laterRows.length ? Math.max(...laterRows.map(x=>Number(x.close)).filter(Number.isFinite)) : Number(r.close);
              const expiredByRally=laterMax>=Number(r.close)*1.05;
              distributionCandidates.push({date:r.date,close:Number(r.close),pct,nmValue:val,prevValue:prevVal,laterMax,expiredByRally,active:!expiredByRally});
            }
          }
          const activeDistribution=distributionCandidates.filter(x=>x.active);

          const start = Math.floor(Date.parse("2026-10-01T17:00:00Z")/1000);
          const stop = Math.floor(Date.parse("2026-10-02T09:30:00Z")/1000);
          const futUrl = `https://api.dnse.com.vn/chart-api/v2/ohlcs/derivative?symbol=VN30F1M&resolution=1&from=${start}&to=${stop}`;
          let futClose=null, futCount=0, futShape=null;
          try {
            const fut=await getJson(futUrl);
            futShape=Array.isArray(fut)?["array",fut.length]:Object.keys(fut||{});
            if (Array.isArray(fut)) {
              const vals=fut.map(x=>Number(x?.close ?? x?.c)).filter(Number.isFinite);
              futCount=vals.length; futClose=vals.at(-1) ?? null;
            } else {
              const vals = Array.isArray(fut?.c) ? fut.c.map(Number).filter(Number.isFinite)
                : Array.isArray(fut?.data) ? fut.data.map(x=>Number(x?.close ?? x?.c)).filter(Number.isFinite) : [];
              futCount=vals.length; futClose=vals.at(-1) ?? null;
            }
          } catch(e) { console.log("DNSE_ERROR", String(e)); }

          const code=fs.readFileSync('src/data/research-data.js','utf8');
          const sandbox={window:{}};
          vm.runInNewContext(code,sandbox,{filename:'src/data/research-data.js'});
          const data=sandbox.window.RESEARCH_DATA;
          if(data?.meta?.updated!==date) throw new Error(`Research EOD not current: ${data?.meta?.updated}`);

          const sectorByTicker=new Map();
          for(const r of data.reports||[]) {
            const t=String(r?.ticker||'').toUpperCase();
            if(t && !sectorByTicker.has(t) && r?.sector) sectorByTicker.set(t,String(r.sector));
          }
          const groups=new Map();
          for(const q of data.coverage||[]) {
            const t=String(q?.ticker||'').toUpperCase();
            const sector=sectorByTicker.get(t)||'CHƯA PHÂN LOẠI';
            const pct=Number(q?.changePct);
            if(!Number.isFinite(pct)) continue;
            if(!groups.has(sector)) groups.set(sector,[]);
            groups.get(sector).push({ticker:t,pct,close:q.close,volume:q.volume});
          }
          const sectorStats=[...groups].map(([sector,items])=>({
            sector,n:items.length,adv:items.filter(x=>x.pct>0).length,flat:items.filter(x=>x.pct===0).length,
            dec:items.filter(x=>x.pct<0).length,medianPct:median(items.map(x=>x.pct)),avgPct:avg(items.map(x=>x.pct)),
            top:[...items].sort((a,b)=>b.pct-a.pct).slice(0,3),
            bottom:[...items].sort((a,b)=>a.pct-b.pct).slice(0,3)
          })).sort((a,b)=>b.n-a.n);
          const movers=(data.coverage||[]).map(q=>({ticker:q.ticker,pct:Number(q.changePct),close:q.close,volume:q.volume,sector:sectorByTicker.get(String(q.ticker||'').toUpperCase())||null}))
            .filter(x=>Number.isFinite(x.pct));
          const topGainers=[...movers].sort((a,b)=>b.pct-a.pct).slice(0,15);
          const topLosers=[...movers].sort((a,b)=>a.pct-b.pct).slice(0,15);
          const vn30=(data.marketSession?.indices||[]).find(x=>x.code==='VN30');
          const vn=(data.marketSession?.indices||[]).find(x=>x.code==='VN-INDEX');

          console.log("DIAGNOSTIC", JSON.stringify({
            date,rowCount:rows.length,firstDate:rows[0]?.date,lastDate:last?.date,
            open:Number(last?.open),high:Number(last?.high),low:Number(last?.low),close:Number(last?.close),
            change:Number(last?.change),changePct:Number(last?.pctChange),nmValue:Number(last?.nmValue),nmVolume:Number(last?.nmVolume),
            prevClose:Number(prev?.close),prevNmValue:Number(prev?.nmValue),
            ma20,ma20FiveAgo,ma50,ma200,low20Prev,closeLow20Prev,
            rsi14:rsiWilder(closes,14),macd:macdLast,macdSignal:signalLast,
            candlePos,candleThird,
            avgValuePrev5,avgValuePrev10,avgValuePrev20,
            liquidityRatio20:avgValuePrev20?Number(last.nmValue)/avgValuePrev20:null,
            distributionCandidates,activeDistributionCount:activeDistribution.length,
            vn30Close:vn30?.close ?? null,vn30ChangePct:vn30?.changePct ?? null,
            vnIndexChangePct:vn?.changePct ?? null,
            futClose,futCount,futShape,basis:(futClose!=null&&vn30?.close!=null)?futClose-vn30.close:null,
            basisPct:(futClose!=null&&vn30?.close!=null)?(futClose-vn30.close)/vn30.close*100:null,
            breadth:data.marketSession?.breadth,sectorStats,topGainers,topLosers,histUrl,futUrl
          }));
          NODE
