name: Apply verified EOD overrides 2026-09-10

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-eod-override-2026-09-10.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Add date-scoped verified overrides
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('scripts/update-eod-market-data.mjs')
          s = p.read_text()
          marker = '\n  })\n});\n\nconst argValue'
          if '"2026-09-10": Object.freeze({' in s:
              raise SystemExit('2026-09-10 override already exists')
          if s.count(marker) != 1:
              raise SystemExit(f'override insertion marker count={s.count(marker)}')
          block = '''\n  }),\n  "2026-09-10": Object.freeze({\n    DRI: Object.freeze({\n      close: 14700,\n      source: "https://kbbuddywts.kbsec.com.vn/iis-server/investment/stocks/DRI/data_day?sdate=10-09-2026&edate=10-09-2026",\n      reason: "CafeF 10/09 trả 14.600; KBS date-specific xác nhận OHLC 15.0/15.0/14.5/14.7, khối lượng 858.800 và Cophieu68 lịch sử đúng ngày ghi 14.700, trùng VNDIRECT."\n    }),\n    OIL: Object.freeze({\n      close: 13800,\n      source: "https://kbbuddywts.kbsec.com.vn/iis-server/investment/stocks/OIL/data_day?sdate=10-09-2026&edate=10-09-2026",\n      reason: "CafeF 10/09 trả 13.700; KBS date-specific xác nhận OHLC 14.0/14.1/13.6/13.8, khối lượng 1.302.700; Cophieu68 và 24HMoney lịch sử đúng ngày cùng ghi 13.800, trùng VNDIRECT."\n    })\n'''
          s = s.replace(marker, block + '  })\n});\n\nconst argValue', 1)
          p.write_text(s)

          t = Path('tests/eod-market-data.test.mjs')
          ts = t.read_text()
          anchor = '\ntest("không bỏ qua lần chạy cùng ngày khi coverage mới chưa được khóa đủ hai nguồn", () => {'
          if 'ngoại lệ 10/09 chỉ chấp nhận đúng giá KBS' in ts:
              raise SystemExit('2026-09-10 test already exists')
          if ts.count(anchor) != 1:
              raise SystemExit(f'test insertion marker count={ts.count(anchor)}')
          test_block = '''\ntest("ngoại lệ 10/09 chỉ chấp nhận đúng giá KBS exact-date đã xác minh", () => {\n  const cases = [\n    ["DRI", 14700, 14600],\n    ["OIL", 13800, 13700]\n  ];\n  for (const [ticker, primaryClose, cafeFClose] of cases) {\n    const decision = secondaryCloseDecision({ ticker, date: "2026-09-10", primaryClose, cafeFClose });\n    assert.equal(decision.ok, true);\n    assert.equal(decision.mode, "third-source-override");\n    assert.match(decision.source, /kbsec\\.com\\.vn/);\n    const wrong = secondaryCloseDecision({ ticker, date: "2026-09-10", primaryClose: primaryClose + 100, cafeFClose });\n    assert.equal(wrong.ok, false);\n  }\n});\n'''
          ts = ts.replace(anchor, test_block + anchor, 1)
          t.write_text(ts)
          PY

      - name: Run full test suite before commit
        run: node --test tests/*.test.mjs

      - name: Commit verified gate patch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update-eod-market-data.mjs tests/eod-market-data.test.mjs
          changed="$(git diff --cached --name-only)"
          [[ "$changed" == $'scripts/update-eod-market-data.mjs\ntests/eod-market-data.test.mjs' || "$changed" == $'tests/eod-market-data.test.mjs\nscripts/update-eod-market-data.mjs' ]]
          git commit -m "Verify DRI and OIL EOD exceptions for 2026-09-10 [skip ci]"
          git push origin HEAD:main

      - name: Dispatch verified EOD 2026-09-10
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/eod-daily.yml/dispatches" \
            -d '{"ref":"main","inputs":{"date":"2026-09-10"}}'
