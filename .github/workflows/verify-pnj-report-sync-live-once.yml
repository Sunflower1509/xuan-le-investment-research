name: Verify PNJ report synchronization live once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact main data and action synchronization
        run: |
          node --test tests/*.test.mjs
          node scripts/audit-site.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm';
          import { buildPriorityUniverse, evaluatePriorityCandidate, latestReportDates, openPositionTickers } from './src/scripts/priority-engine.mjs';
          import { projectTradeLedger } from './src/scripts/trade-ledger.mjs';
          const s={window:{}}; vm.runInNewContext(fs.readFileSync('src/data/research-data.js','utf8'),s); const d=s.window.RESEARCH_DATA;
          const valuations=d.reports.filter(r=>r.reportType!=='trading');
          if(valuations.length!==52 || d.coverage.length!==52) throw new Error(`Expected 52/52, got ${valuations.length}/${d.coverage.length}`);
          const pnjReport=valuations.find(r=>r.ticker==='PNJ'); const pnjCoverage=d.coverage.find(c=>c.ticker==='PNJ');
          if(!pnjReport || !pnjCoverage) throw new Error('PNJ report/coverage missing');
          if(pnjReport.action?.eligibility!=='active' || pnjCoverage.action?.eligibility!=='active') throw new Error('PNJ eligibility not synchronized active');
          if(pnjReport.action.zoneLow!==25187 || pnjReport.action.zoneHigh!==26986) throw new Error('PNJ MOS zone changed');
          if(pnjCoverage.close<=pnjCoverage.action.zoneHigh) throw new Error('PNJ current EOD should remain above buy zone');
          if(pnjReport.status!=='wait' || !String(pnjReport.recommendation).includes('CHỜ')) throw new Error('PNJ current recommendation must remain CHỜ');
          const ledger=JSON.parse(fs.readFileSync('src/data/trade-ledger.json','utf8'));
          const projection=projectTradeLedger(ledger,d.coverage);
          const ctx={openTickers:openPositionTickers(projection),reportDates:latestReportDates(d.reports),asOfDate:d.meta.updated};
          for(const t of ['BSI','MSB','PNJ','TCB','VIB','VNM']){
            const c=d.coverage.find(x=>x.ticker===t); const state=evaluatePriorityCandidate(c,ctx);
            if(!state.eligible) throw new Error(`${t} not entry-priority eligible: ${state.reason}`);
          }
          const u=buildPriorityUniverse(d.coverage,ctx);
          const pnjRank=u.findIndex(x=>x.ticker==='PNJ')+1;
          if(!pnjRank) throw new Error('PNJ absent from Priority/Buy Zone universe');
          console.log(JSON.stringify({valuationReports:52,coverage:52,pnjRank,pnjClose:pnjCoverage.close,pnjBuyZone:[25187,26986],pnjStatus:pnjReport.recommendation,prioritySynchronized:['BSI','MSB','PNJ','TCB','VIB','VNM']}));
          NODE
      - name: Build exact production artifact
        run: |
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"
      - name: Verify live bytes and VNM PDF
        run: |
          node scripts/verify-live-site.mjs \
            --site-url 'https://sunflower1509.github.io/xuan-le-investment-research/' \
            --artifact-root "${RUNNER_TEMP}/site" \
            --attempts 24 \
            --wait-ms 10000
          curl -fL --retry 5 --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://sunflower1509.github.io/xuan-le-investment-research/reports/VNM_2026-08-19.pdf?verify=20260820-pnj' \
            -o /tmp/vnm-live.pdf
          test "$(stat -c%s /tmp/vnm-live.pdf)" = '660336'
          echo '10840a5b68a843cea98eda91f4b77f48922c6025f643a112bc69542a32dadcb0  /tmp/vnm-live.pdf' | sha256sum -c -
