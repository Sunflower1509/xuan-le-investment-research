name: Dispatch Pages for verified 2026-09-16 refresh

on:
  push:
    paths:
      - ".github/workflows/pages-dispatch-20260916.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Pages on latest main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
          echo "Dispatched Pages workflow on latest main."
