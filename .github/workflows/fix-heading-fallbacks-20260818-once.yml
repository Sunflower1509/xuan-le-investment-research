name: Fix heading fallbacks 20260818 once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair stale heading fallbacks only
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';

          const researchText = fs.readFileSync('src/data/research-data.js', 'utf8');
          const ctx = { window: {} };
          vm.runInNewContext(researchText, ctx);
          const data = ctx.window.RESEARCH_DATA;
          if (!data?.meta?.updated || !Array.isArray(data.reports) || !Array.isArray(data.coverage)) {
            throw new Error('Research data unavailable');
          }

          const [y,m,d] = data.meta.updated.split('-');
          const dotted = `${d}.${m}.${y}`;
          const shortDotted = `${d}.${m}`;
          const reportCount = data.reports.length;
          const coverageCount = data.coverage.length;

          const path = 'index.html';
          let html = fs.readFileSync(path, 'utf8');
          const before = html;

          html = html.replace(
            /(<p class="terminal-eyebrow" data-role="coverage-eod-label">)Action Radar • EOD \d{2}\.\d{2}\.\d{4}(<\/p>)/,
            `$1Action Radar • EOD ${dotted}$2`
          );
          html = html.replace(
            /(<strong data-role="coverage-lock-label">)Giá khóa \d{2}\.\d{2}(<\/strong>)/,
            `$1Giá khóa ${shortDotted}$2`
          );
          html = html.replace(
            /(<span data-role="report-tab-count">)\d+(<\/span>)/,
            `$1${reportCount}$2`
          );
          html = html.replace(
            /(<span data-role="coverage-tab-count">)\d+(<\/span>)/,
            `$1${coverageCount}$2`
          );
          html = html.replace(
            '<h2>PHÂN LOẠI NHÓM NGÀNH.</h2>',
            '<h2>PHÂN LOẠI NHÓM NGÀNH</h2>'
          );

          const mustContain = [
            `<p class="terminal-eyebrow" data-role="coverage-eod-label">Action Radar • EOD ${dotted}</p>`,
            '<h2>XẾP HẠNG ƯU TIÊN</h2>',
            '<h3>VÙNG MUA THAM KHẢO</h3>',
            '<h2 id="position-ledger-title">NHẬT KÝ ĐIỂM MUA ĐÃ KÍCH HOẠT</h2>',
            '<h2>PHÂN LOẠI NHÓM NGÀNH</h2>',
            `<strong data-role="coverage-lock-label">Giá khóa ${shortDotted}</strong>`,
            `<span data-role="report-tab-count">${reportCount}</span>`,
            `<span data-role="coverage-tab-count">${coverageCount}</span>`
          ];
          for (const token of mustContain) {
            if (!html.includes(token)) throw new Error(`Heading integrity token missing: ${token}`);
          }
          if (html.includes('PHÂN LOẠI NHÓM NGÀNH.</h2>')) throw new Error('Trailing punctuation remains');
          if (html === before) throw new Error('No heading corrections were applied');
          fs.writeFileSync(path, html);
          console.log(JSON.stringify({ date: data.meta.updated, reportCount, coverageCount }, null, 2));
          NODE
      - name: Run regression suite
        run: node --test tests/*.test.mjs
      - name: Build production assets
        run: bash scripts/build/build-assets.sh
      - name: Audit site integrity
        run: node scripts/audit-site.mjs
      - name: Verify page structure unchanged
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html','utf8');
          const order=[...html.matchAll(/<section\b[^>]*\bid=(['"])([^'"]+)\1[^>]*>/g)].map(m=>m[2]);
          const expected=['overview','daily-market','position-ledger','action-radar','research'];
          if(order.join(',')!==expected.join(',')) throw new Error(`Section order changed: ${order.join(',')}`);
          console.log('Section order preserved:', order.join(' -> '));
          NODE
      - name: Commit corrected headings and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-heading-fallbacks-20260818-once.yml
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Fix stale website heading labels [skip ci]'
            git push origin HEAD:main
          fi
