name: Visual smoke QA

on:
  pull_request:
    paths:
      - "index.html"
      - "src/scripts/**"
      - "src/styles/**"
      - "assets/css/**"
      - "qa/visual/**"
      - ".github/workflows/visual-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financial-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: http://127.0.0.1:4173/
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify Google Chrome
        run: google-chrome --version

      - name: Install Playwright test runner
        working-directory: qa/visual
        run: npm install --no-audit --no-fund

      - name: Install Chromium and WebKit runtime dependencies
        working-directory: qa/visual
        run: npx playwright install --with-deps chromium webkit

      - name: Run unit and regression tests
        run: node --test tests/*.test.mjs

      - name: Build branch production assets
        run: bash scripts/build/build-assets.sh

      - name: Serve branch locally for visual QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/xltvs-visual-qa-http.log 2>&1 &
          echo $! >/tmp/xltvs-visual-qa-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/xltvs-visual-qa-http.log
          exit 1

      - name: Run cross-browser visual smoke QA
        working-directory: qa/visual
        run: npm test

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-evidence
          path: |
            qa/visual/playwright-report
            qa/visual/test-results
          retention-days: 14
          if-no-files-found: warn
