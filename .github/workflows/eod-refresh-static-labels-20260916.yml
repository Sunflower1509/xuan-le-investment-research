name: Refresh static EOD labels 2026-09-16

on:
  push:
    paths:
      - ".github/workflows/eod-refresh-static-labels-20260916.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Refresh only static EOD date labels
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'index.html';
          const before = fs.readFileSync(path, 'utf8');
          const expectedOrder = ['overview', 'daily-market', 'position-ledger', 'action-radar', 'research'];
          const sectionOrder = (html) => [...html.matchAll(/<section\b[^>]*\bid=(['"])([^'"]+)\1[^>]*>/g)].map((m) => m[2]);
          if (sectionOrder(before).join(',') !== expectedOrder.join(',')) throw new Error(`Unexpected pre-change section order: ${sectionOrder(before).join(' -> ')}`);
          const replacements = [
            ['giá đóng cửa 15/09/2026', 'giá đóng cửa 16/09/2026'],
            ['Giá theo dõi khóa EOD 15.09.2026', 'Giá theo dõi khóa EOD 16.09.2026']
          ];
          let after = before;
          for (const [from, to] of replacements) {
            const count = after.split(from).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one occurrence of ${from}, found ${count}`);
            after = after.replace(from, to);
          }
          if (sectionOrder(after).join(',') !== expectedOrder.join(',')) throw new Error(`Section order changed: ${sectionOrder(after).join(' -> ')}`);
          const normalizedBefore = before.replace('giá đóng cửa 15/09/2026', 'giá đóng cửa DATE').replace('Giá theo dõi khóa EOD 15.09.2026', 'Giá theo dõi khóa EOD DATE');
          const normalizedAfter = after.replace('giá đóng cửa 16/09/2026', 'giá đóng cửa DATE').replace('Giá theo dõi khóa EOD 16.09.2026', 'Giá theo dõi khóa EOD DATE');
          if (normalizedBefore !== normalizedAfter) throw new Error('Detected change outside the two allowed date strings');
          fs.writeFileSync(path, after);
          NODE

      - name: Run complete tests and site audit
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          node scripts/audit-site.mjs

      - name: Guard exact mutation scope and commit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [[ "$changed" != "index.html" ]]; then
            echo "Unexpected changed paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh static EOD labels for 2026-09-16"
          git push origin HEAD:main
