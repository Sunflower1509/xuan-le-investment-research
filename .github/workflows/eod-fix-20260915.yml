name: Apply verified EOD fix 2026-09-15

on:
  push:
    paths:
      - ".github/workflows/eod-fix-20260915.yml"

permissions:
  contents: write
  actions: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Apply verified date-specific overrides
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-eod-20260915.mjs
          node --check scripts/update-eod-market-data.mjs
          changed="$(git diff --name-only)"
          if [[ "$changed" != "scripts/update-eod-market-data.mjs" ]]; then
            echo "Unexpected patch scope: $changed" >&2
            exit 2
          fi

      - name: Commit verified exception patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update-eod-market-data.mjs
          git commit -m "Verify 2026-09-15 EOD mismatch exceptions [skip ci]"
          git push origin HEAD:main

      - name: Dispatch verified EOD
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run eod-daily.yml --ref main -f date=2026-09-15
