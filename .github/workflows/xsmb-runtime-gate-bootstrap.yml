name: XSMB Runtime Gate Bootstrap

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/xsmb-runtime-gate-bootstrap.yml"
  workflow_dispatch:

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"

      - name: Install exact frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install             numpy==2.3.5             scipy==1.17.0             scikit-learn==1.8.0             openpyxl==3.1.5

      - name: Verify runtime exactly
        shell: bash
        run: |
          python - <<'PY' | tee XSMB_RUNTIME_GATE_RESULT.json
          import json, os, platform, sys
          from importlib.metadata import version

          expected = {
              "python_major_minor": "3.12",
              "numpy": "2.3.5",
              "scipy": "1.17.0",
              "scikit-learn": "1.8.0",
              "openpyxl": "3.1.5",
          }
          thread_vars = [
              "OMP_NUM_THREADS",
              "OPENBLAS_NUM_THREADS",
              "MKL_NUM_THREADS",
              "NUMEXPR_NUM_THREADS",
          ]
          observed = {
              "python": platform.python_version(),
              "numpy": version("numpy"),
              "scipy": version("scipy"),
              "scikit-learn": version("scikit-learn"),
              "openpyxl": version("openpyxl"),
              "thread_env": {k: os.environ.get(k) for k in thread_vars},
          }
          checks = {
              "python_3_12_x": f"{sys.version_info.major}.{sys.version_info.minor}" == expected["python_major_minor"],
              "numpy": observed["numpy"] == expected["numpy"],
              "scipy": observed["scipy"] == expected["scipy"],
              "scikit-learn": observed["scikit-learn"] == expected["scikit-learn"],
              "openpyxl": observed["openpyxl"] == expected["openpyxl"],
              "thread_env": all(observed["thread_env"][k] == "1" for k in thread_vars),
          }
          payload = {
              "schema": "XSMB_RUNTIME_GATE_V1",
              "expected": expected,
              "observed": observed,
              "checks": checks,
              "pass": all(checks.values()),
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          if not payload["pass"]:
              raise SystemExit(2)
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: xsmb-runtime-gate-python312
          path: XSMB_RUNTIME_GATE_RESULT.json
          if-no-files-found: error
