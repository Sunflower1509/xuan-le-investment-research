name: XSMB Feature Attribution 2026-09-21

on:
  push:
    branches: ["xsmb-v2.1-python312-runtime"]
    paths:
      - "xsmb_runtime/xsmb_feature_attribution_20260921.py"
      - ".github/workflows/xsmb-feature-attribution-20260921.yml"
  workflow_dispatch:

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"

      - name: Install exact frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r xsmb_runtime/requirements-runtime.txt

      - name: Download original locked forecast artifact
        uses: actions/download-artifact@v4
        with:
          name: xsmb-run-forecast-20260921-locked
          path: original-forecast
          github-token: ${{ github.token }}
          run-id: 35518134400

      - name: Prepare read-only state
        run: |
          mkdir -p manifests
          cp xsmb_runtime/fixtures/XSMB_OBSERVED_NO_FORECAST_20260920.json manifests/XSMB_OBSERVED_NO_FORECAST_20260920.json
          cp original-forecast/manifests/*.forecast.json manifests/

      - name: Verify frozen runner
        run: |
          echo "7c9f1bf773a484c20a09942a90a31613179963869dca30e65be8541d5bc7fd7b  xsmb_runtime/xsmb_reference_runner_R3_final.py" | sha256sum -c -

      - name: Compute exact feature attribution
        run: |
          python xsmb_runtime/xsmb_feature_attribution_20260921.py             original-forecast/XSMB_RECONCILIATION_R5_1200_v2_1_PRODUCTION.xlsx             manifests             | tee FEATURE_ATTRIBUTION_SUMMARY_20260921.json

      - name: Assert locked forecast identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("FEATURE_ATTRIBUTION_20260921.json").read_text())
          s=json.loads(Path("FEATURE_ATTRIBUTION_SUMMARY_20260921.json").read_text())
          assert s["top5"] == ["09","07","34","82","80"], s
          assert s["data_hash"] == "824bf0c9f30475477ca904ff442f331741c7287d8c21c2df6f128e446278ffff", s
          assert s["runner_sha256"] == "7c9f1bf773a484c20a09942a90a31613179963869dca30e65be8541d5bc7fd7b", s
          assert r["calibrator_monotonic_direction"] == "decreasing", r["calibrator_slope"]
          print("FEATURE_ATTRIBUTION_IDENTITY=PASS")
          PY

      - name: Upload attribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsmb-feature-attribution-20260921
          path: |
            FEATURE_ATTRIBUTION_20260921.json
            FEATURE_ATTRIBUTION_SUMMARY_20260921.json
          if-no-files-found: error
          retention-days: 90
