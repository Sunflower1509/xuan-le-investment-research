name: Temporary EOD recovery 2026-09-08

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eod-recovery-2026-09-08.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch verified EOD workflow for 2026-09-08
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run eod-daily.yml --ref main -f date=2026-09-08
