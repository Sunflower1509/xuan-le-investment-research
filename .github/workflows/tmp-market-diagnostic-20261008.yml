name: Temporary market diagnostic 2026-10-08

on:
  push:
    paths:
      - ".github/workflows/tmp-market-diagnostic-20261008.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Compute verified market diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm';
          const getJson=async u=>{const r=await fetch(u,{headers:{"user-agent":"Mozilla/5.0 XuanLeTVS-Diagnostic/3.2"}});if(!r.ok)throw new Error(`HTTP ${r.status} ${u}`);return r.json();};
          const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
          const median=a=>{const x=[...a].sort((a,b)=>a-b);if(!x.length)return null;const m=Math.floor(x.length/2);return x.length%2?x[m]:(x[m-1]+x[m])/2;};
          const ema=(v,p)=>{const k=2/(p+1);let e=avg(v.slice(0,p));const o=Array(p-1).fill(null).concat([e]);for(let i=p;i<v.length;i++){e=v[i]*k+e*(1-k);o.push(e);}return o;};
          const rsi=(v,p=14)=>{let g=0,l=0;for(let i=1;i<=p;i++){const d=v[i]-v[i-1];if(d>=0)g+=d;else l-=d;}let ag=g/p,al=l/p;for(let i=p+1;i<v.length;i++){const d=v[i]-v[i-1],gg=d>0?d:0,ll=d<0?-d:0;ag=(ag*(p-1)+gg)/p;al=(al*(p-1)+ll)/p;}return al===0?100:100-100/(1+ag/al);};
          const date="2026-10-08";
          const histUrl="https://api-finfo.vndirect.com.vn/v4/vnmarket_prices?sort=date&q=code:VNINDEX~date:gte:2025-10-01~date:lte:2026-10-08&size=500";
          const hist=await getJson(histUrl);
          const rows=(hist?.data||[]).filter(x=>String(x?.code||'').toUpperCase()==="VNINDEX"&&x.date<=date).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
          if(rows.length<210)throw new Error("insufficient history "+rows.length);
          const closes=rows.map(x=>Number(x.close)),values=rows.map(x=>Number(x.nmValue)),i=rows.length-1,last=rows[i],prev=rows[i-1];
          const ma=(end,n)=>avg(closes.slice(end-n+1,end+1));
          const ma20=ma(i,20),ma50=ma(i,50),ma200=ma(i,200),ma20FiveAgo=ma(i-5,20);
          const avg20=avg(values.slice(-21,-1));
          const ema12=ema(closes,12),ema26=ema(closes,26),macd=closes.map((_,j)=>ema12[j]!=null&&ema26[j]!=null?ema12[j]-ema26[j]:null).filter(Number.isFinite),sig=ema(macd,9);
          const dist=[];
          for(let j=Math.max(1,rows.length-25);j<rows.length;j++){const a=rows[j],b=rows[j-1],pct=(Number(a.close)/Number(b.close)-1)*100,val=Number(a.nmValue),pv=Number(b.nmValue);if(pct<=-0.2&&val>pv){const later=rows.slice(j+1),mx=later.length?Math.max(...later.map(x=>Number(x.close))):Number(a.close),exp=mx>=Number(a.close)*1.05;dist.push({date:a.date,close:Number(a.close),pct,nmValue:val,prevValue:pv,laterMax:mx,expiredByRally:exp,active:!exp});}}
          const active=dist.filter(x=>x.active);
          const start=Math.floor(Date.parse("2026-10-07T17:00:00Z")/1000),stop=Math.floor(Date.parse("2026-10-08T09:30:00Z")/1000);
          const futUrl=`https://api.dnse.com.vn/chart-api/v2/ohlcs/derivative?symbol=VN30F1M&resolution=1&from=${start}&to=${stop}`;
          let futClose=null,futCount=0;try{const f=await getJson(futUrl);const vs=Array.isArray(f?.c)?f.c.map(Number).filter(Number.isFinite):Array.isArray(f)?f.map(x=>Number(x?.close??x?.c)).filter(Number.isFinite):[];futCount=vs.length;futClose=vs.at(-1)??null;}catch(e){console.log("DNSE_ERROR",String(e));}
          const code=fs.readFileSync('src/data/research-data.js','utf8'),sb={window:{}};vm.runInNewContext(code,sb);const data=sb.window.RESEARCH_DATA;if(data?.meta?.updated!==date)throw new Error("research not current");
          const sectorByTicker=new Map();for(const r of data.reports||[]){const t=String(r?.ticker||'').toUpperCase();if(t&&!sectorByTicker.has(t)&&r?.sector)sectorByTicker.set(t,String(r.sector));}
          const groups=new Map();for(const q of data.coverage||[]){const t=String(q?.ticker||'').toUpperCase(),s=sectorByTicker.get(t)||'CHƯA PHÂN LOẠI',p=Number(q?.changePct);if(!Number.isFinite(p))continue;if(!groups.has(s))groups.set(s,[]);groups.get(s).push({ticker:t,pct:p,close:q.close,volume:q.volume});}
          const sectors=[...groups].map(([sector,items])=>({sector,n:items.length,adv:items.filter(x=>x.pct>0).length,flat:items.filter(x=>x.pct===0).length,dec:items.filter(x=>x.pct<0).length,medianPct:median(items.map(x=>x.pct)),avgPct:avg(items.map(x=>x.pct)),top:[...items].sort((a,b)=>b.pct-a.pct).slice(0,3),bottom:[...items].sort((a,b)=>a.pct-b.pct).slice(0,3)})).sort((a,b)=>b.n-a.n);
          const vn30=(data.marketSession.indices||[]).find(x=>x.code==='VN30');
          console.log("DIAGNOSTIC",JSON.stringify({
            date,rowCount:rows.length,firstDate:rows[0].date,lastDate:last.date,
            open:Number(last.open),high:Number(last.high),low:Number(last.low),close:Number(last.close),change:Number(last.change),changePct:Number(last.pctChange),nmValue:Number(last.nmValue),nmVolume:Number(last.nmVolume),
            prevClose:Number(prev.close),prevNmValue:Number(prev.nmValue),ma20,ma20FiveAgo,ma50,ma200,rsi14:rsi(closes),macd:macd.at(-1),macdSignal:sig.at(-1),
            low20Prev:Math.min(...rows.slice(-21,-1).map(x=>Number(x.low))),high20Prev:Math.max(...rows.slice(-21,-1).map(x=>Number(x.high))),
            candlePos:(Number(last.close)-Number(last.low))/(Number(last.high)-Number(last.low)),
            avgValuePrev20:avg20,liquidityRatio20:Number(last.nmValue)/avg20,
            distributionCandidates:dist,activeDistributionCount:active.length,
            breadth:data.marketSession.breadth,coverageCount:data.coverage.length,
            vn30Close:vn30.close,vn30ChangePct:vn30.changePct,futClose,futCount,basis:futClose-vn30.close,basisPct:(futClose-vn30.close)/vn30.close*100,
            sectorStats:sectors,histUrl,futUrl
          }));
          NODE
