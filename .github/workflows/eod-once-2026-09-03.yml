name: Dispatch verified EOD 2026-09-03

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eod-once-2026-09-03.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified EOD workflow for 2026-09-03
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run eod-daily.yml --repo "$GITHUB_REPOSITORY" --ref main -f date=2026-09-03
