name: Generate QA lockfile once

on:
  push:
    branches:
      - maintenance/qa-lockfile-20260927
    paths:
      - ".github/workflows/generate-qa-lockfile-once.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/qa-lockfile-20260927
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate deterministic QA lockfile
        working-directory: qa/visual
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- qa/visual/package-lock.json && git ls-files --error-unmatch qa/visual/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/visual/package-lock.json
          git commit -m "Lock Playwright QA dependencies [skip ci]"
          git push origin HEAD:maintenance/qa-lockfile-20260927
