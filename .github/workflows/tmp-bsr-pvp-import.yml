name: Temporary BSR PVP valuation import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-bsr-pvp-import.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download and verify BSR and PVP valuation PDFs
        shell: bash
        env:
          FIRE_API: "https://api.firestorage.ai/dev/file"
          SHARE_ID: "ohqS9lSv8Qio"
          BSR_NAME: "BSR_2026-09-30 (1).pdf"
          BSR_SHA: "5d0f9fa93726acd3b72466b450741a8a75d13cfaa3fcfa796224fa5a4131fdb4"
          BSR_SIZE: "622046"
          PVP_NAME: "PVP_2026-09-30.pdf"
          PVP_SHA: "58ef4ef482091339e6c2d68a214ea6d16c89eab7b0e995665d687241180e51b4"
          PVP_SIZE: "419924"
        run: |
          set -euo pipefail
          listing="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL "${FIRE_API}/shares/${SHARE_ID}/files?maxResults=1000")"

          download_one() {
            local wanted_name="$1"
            local output="$2"
            local expected_sha="$3"
            local expected_size="$4"

            local file_id
            file_id="$(printf '%s' "$listing" | python3 -c 'import json,sys; wanted=sys.argv[1]; d=json.load(sys.stdin); m=[f for f in d.get("files",[]) if f.get("fileName")==wanted or f.get("name")==wanted]; len(m)==1 or (_ for _ in ()).throw(SystemExit(f"Expected exactly one file named {wanted!r}, got {len(m)}")); print(m[0].get("fileId") or m[0].get("id") or "")' "$wanted_name")"
            [[ -n "$file_id" ]] || { echo "Missing Firestorage fileId for $wanted_name" >&2; exit 2; }

            local payload download_url
            payload="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL -X POST "${FIRE_API}/shares/${SHARE_ID}/files/$file_id/download")"
            download_url="$(printf '%s' "$payload" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["downloadUrl"])')"
            [[ "$download_url" == https://* ]] || { echo "Invalid download URL for $wanted_name" >&2; exit 2; }

            mkdir -p reports
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSL "$download_url" -o "$output"

            [[ "$(wc -c < "$output" | tr -d ' ')" == "$expected_size" ]] || { echo "Size mismatch for $wanted_name" >&2; exit 2; }
            echo "$expected_sha  $output" | sha256sum -c -
            [[ "$(head -c 5 "$output")" == "%PDF-" ]] || { echo "Invalid PDF signature for $wanted_name" >&2; exit 2; }
          }

          download_one "$BSR_NAME" "reports/BSR_2026-09-30.pdf" "$BSR_SHA" "$BSR_SIZE"
          download_one "$PVP_NAME" "reports/PVP_2026-09-30.pdf" "$PVP_SHA" "$PVP_SIZE"

          rm -f reports/BSR_Equity_Research_Valuation_2026.pdf
          rm -f reports/PVP_2026-08-26.pdf

      - name: Replace BSR and PVP valuation registry without touching layout or EOD snapshot
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");

          const path = "src/data/research-data.js";
          const code = fs.readFileSync(path, "utf8");
          const context = { window: {} };
          vm.runInNewContext(code, context, { filename: path });
          const data = context.window.RESEARCH_DATA;

          if (!data || !Array.isArray(data.reports) || !Array.isArray(data.coverage)) {
            throw new Error("RESEARCH_DATA invalid");
          }

          const tickersToReplace = new Set(["BSR", "PVP"]);
          const oldReports = data.reports.filter((r) => tickersToReplace.has(String(r.ticker || "").toUpperCase()));
          for (const r of oldReports) {
            if (String(r.date || "") > "2026-09-30") {
              throw new Error("Repository already contains a newer valuation report for " + r.ticker);
            }
          }

          const bsr = {
            id: "BSR-20260930",
            ticker: "BSR",
            company: "CTCP - Tổng Công ty Lọc hóa dầu Việt Nam",
            sector: "Năng lượng",
            exchange: "HOSE",
            date: "2026-09-30",
            recommendation: "TRÁNH / LOẠI",
            status: "reject",
            marketPrice: 31350,
            marketPriceDate: "2026-09-30",
            baseValue: 21255,
            valueLabel: "Giá trị kỳ vọng",
            rangeLow: 14591,
            rangeHigh: 28802,
            gapLabel: "Theo báo cáo, P0 31.350 đồng/cp cao hơn cận trên 28.802 đồng/cp; biên an toàn so với GTKV 21.255 đồng/cp là -47,5%, nên tín hiệu định giá là TRÁNH.",
            method: "PP-13 lợi nhuận chuẩn hóa là mô hình chính; DCF-FCFF và EV/EBITDA khu vực kiểm chứng; PP-18 reverse DCF kiểm tra kỳ vọng thị trường",
            summary: "BSR là doanh nghiệp lọc hóa dầu có tính chu kỳ cao. Vùng giá trị tổng hợp 14.591-28.802 đồng/cp, GTKV 21.255 đồng/cp; giá tham chiếu trong báo cáo 31.350 đồng/cp vượt cận trên. Trạng thái giao dịch 1-3 tuần là LOẠI dù xu hướng kỹ thuật còn tích cực vì định giá đang ở trạng thái TRÁNH và phiên 30/09 chưa có xác nhận khối lượng >=1,5x trung bình 20 phiên.",
            action: {
              triggerType: "at-or-below",
              triggerPrice: 14591,
              zoneLow: null,
              zoneHigh: null,
              baseValue: 21255,
              stop: null,
              targets: [],
              basisDate: "2026-09-30",
              recommendation: "LOẠI / TRÁNH MUA MỚI",
              eligibility: "veto",
              condition: "Trạng thái 1-3 tuần theo báo cáo là LOẠI: không thiết lập vùng mua, stoploss, target hay R/R cho lệnh mới. Mốc <=14.591 đồng/cp chỉ là ngưỡng định giá lại/tích lũy trung-dài hạn sau khi cập nhật dữ liệu mới, không phải tín hiệu mua tự động. Giá >28.802 đồng/cp: TRÁNH mua mới theo khung định giá."
            },
            file: "reports/BSR_2026-09-30.pdf",
            edition: "Bản định giá 30.09.2026",
            visual: {
              src: "assets/images/reports/bsr.webp?v=20260930-cover1",
              alt: "Trang bìa báo cáo định giá BSR ngày 30/09/2026",
              caption: "Bìa báo cáo định giá BSR",
              sourceLabel: "Xuân Lê TVS Equity Research",
              sourceUrl: "reports/BSR_2026-09-30.pdf",
              kind: "report-cover"
            }
          };

          const pvp = {
            id: "PVP-20260930",
            ticker: "PVP",
            company: "CTCP Vận tải Dầu khí Thái Bình Dương",
            sector: "Năng lượng",
            exchange: "HOSE",
            date: "2026-09-30",
            recommendation: "THEO DÕI / CHỜ",
            status: "wait",
            marketPrice: 21900,
            marketPriceDate: "2026-09-29",
            baseValue: 28552,
            valueLabel: "Giá trị kỳ vọng",
            rangeLow: 22127,
            rangeHigh: 35249,
            gapLabel: "P0 21.900 đồng/cp thấp hơn GTKV 28.552 đồng/cp khoảng 23,3% và thấp hơn cận dưới 22.127 đồng/cp khoảng 1,0%, nhưng vẫn cao hơn ngưỡng mua M 21.414 đồng/cp; tín hiệu định giá là THEO DÕI.",
            method: "PP-13 lợi nhuận chuẩn hóa là mô hình chính; DCF-FCFF và EV/EBITDA kiểm chứng; P/B và reverse DCF dùng để kiểm tra",
            summary: "PVP có 6T/2026 tăng trưởng mạnh, tiền ròng và chất lượng dòng tiền tốt, nhưng vận tải biển mang tính chu kỳ và chương trình đầu tư đội tàu làm tăng độ nhạy vốn. Vùng giá trị 22.127-35.249 đồng/cp, GTKV 28.552 đồng/cp. Trạng thái 1-3 tuần là CHỜ vì giá tham chiếu 21.900 đồng/cp sát đỉnh 52 tuần 22.300 và mua đuổi không đạt R/R >=2.",
            action: {
              zoneLow: 19200,
              zoneHigh: 19700,
              baseValue: 28552,
              stop: 18600,
              targets: [22300, 25000],
              basisDate: "2026-09-30",
              recommendation: "CHỜ - CHỈ MUA KHI PULLBACK HỢP LỆ",
              eligibility: "active",
              condition: "IF giá điều chỉnh về 19.200-19.700 đồng/cp và xuất hiện xác nhận hồi phục trên dữ liệu EOD/AmiBroker THEN có thể kích hoạt; stop 18.600 (rủi ro tối đa khoảng 5,6%), T1 22.300, T2 tham chiếu 25.000, R/R T1 khoảng 2,36. IF breakout >22.300 nhưng chưa tạo nền mới với stop 3-7% và R/R >=2 THEN tiếp tục CHỜ. IF đóng cửa <18.600 sau khi kích hoạt THEN LOẠI/cắt lỗ theo kỷ luật."
            },
            file: "reports/PVP_2026-09-30.pdf",
            edition: "Bản định giá 30.09.2026",
            visual: {
              src: "assets/images/reports/pvp.webp?v=20260930-cover1",
              alt: "Trang bìa báo cáo định giá PVP ngày 30/09/2026",
              caption: "Bìa báo cáo định giá PVP",
              sourceLabel: "Xuân Lê TVS Equity Research",
              sourceUrl: "reports/PVP_2026-09-30.pdf",
              kind: "report-cover"
            }
          };

          const replacements = new Map([["BSR", bsr], ["PVP", pvp]]);
          data.reports = data.reports.filter((r) => !tickersToReplace.has(String(r.ticker || "").toUpperCase()));
          data.reports.push(bsr, pvp);
          data.reports.sort((a, b) => b.date.localeCompare(a.date) || a.ticker.localeCompare(b.ticker));

          const preservedEod = {};
          for (const ticker of tickersToReplace) {
            const coverage = data.coverage.find((c) => String(c.ticker || "").toUpperCase() === ticker);
            if (!coverage) throw new Error(ticker + " coverage missing");
            if (coverage.priceDate !== "2026-09-30") throw new Error(ticker + " EOD snapshot is not locked at 2026-09-30; refusing report-only migration");

            preservedEod[ticker] = {
              close: coverage.close,
              priceDate: coverage.priceDate,
              changePct: coverage.changePct,
              volume: coverage.volume,
              priceSource: coverage.priceSource,
              priceSourceSecondary: coverage.priceSourceSecondary
            };

            const report = replacements.get(ticker);
            coverage.reportId = report.id;
            coverage.action = structuredClone(report.action);

            for (const [key, value] of Object.entries(preservedEod[ticker])) {
              if (coverage[key] !== value) throw new Error(ticker + " EOD field mutated during report migration: " + key);
            }
          }

          if (typeof data.meta?.note === "string") {
            data.meta.note = data.meta.note.replace(
              "Báo cáo định giá MSN đã được thay bằng bản 30/09/2026; bản 03/08/2026 đã được loại theo quy tắc latest-only. Vùng mua, fair value, target, stop, recommendation và điều kiện hành động giữ nguyên theo hồ sơ đang công bố.",
              "Báo cáo định giá MSN, BSR và PVP đã được thay bằng bản 30/09/2026; các bản cũ tương ứng đã được loại theo quy tắc latest-only. Vùng mua, fair value, target, stop, recommendation và điều kiện hành động của BSR/PVP được cập nhật đúng theo báo cáo mới; dữ liệu EOD 30/09/2026 được giữ nguyên."
            );
          }

          const valuationReports = data.reports.filter((r) => r.reportType !== "trading");
          if (valuationReports.length !== 130 || data.coverage.length !== 130) {
            throw new Error("Expected 130 valuation reports/coverage, got " + valuationReports.length + "/" + data.coverage.length);
          }
          const tickers = valuationReports.map((r) => r.ticker);
          if (new Set(tickers).size !== tickers.length) throw new Error("Duplicate valuation ticker after migration");
          const ids = valuationReports.map((r) => r.id);
          if (new Set(ids).size !== ids.length) throw new Error("Duplicate valuation report id after migration");

          for (const ticker of tickersToReplace) {
            if (valuationReports.filter((r) => r.ticker === ticker).length !== 1) throw new Error("Latest-only invariant failed for " + ticker);
            if (data.coverage.filter((c) => c.ticker === ticker).length !== 1) throw new Error("Duplicate coverage for " + ticker);
            const report = replacements.get(ticker);
            const coverage = data.coverage.find((c) => c.ticker === ticker);
            if (coverage.reportId !== report.id) throw new Error(ticker + " coverage reportId mismatch");
            if (coverage.action?.basisDate !== report.date) throw new Error(ticker + " coverage action basisDate mismatch");
          }

          fs.writeFileSync(path, "window.RESEARCH_DATA = " + JSON.stringify(data, null, 2) + ";" + String.fromCharCode(10));
          console.log(JSON.stringify({
            replacedReports: oldReports.map((r) => ({ ticker: r.ticker, id: r.id, date: r.date, file: r.file })),
            newReports: [bsr, pvp].map((r) => ({ ticker: r.ticker, id: r.id, date: r.date, file: r.file })),
            preservedEod
          }, null, 2));
          NODE

      - name: Force-regenerate BSR and PVP report covers
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/images/reports/bsr.webp assets/images/reports/pvp.webp
          node scripts/sync-report-covers.mjs

      - name: Full integrity preflight
        shell: bash
        run: |
          set -euo pipefail

          command -v pdfinfo >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null; }
          [[ "$(pdfinfo reports/BSR_2026-09-30.pdf | awk '/^Pages:/ {print $2}')" == "25" ]] || { echo "Unexpected BSR page count" >&2; exit 2; }
          [[ "$(pdfinfo reports/PVP_2026-09-30.pdf | awk '/^Pages:/ {print $2}')" == "23" ]] || { echo "Unexpected PVP page count" >&2; exit 2; }

          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          node scripts/audit-report-covers.mjs
          node scripts/audit-company-logos.mjs

          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends imagemagick >/dev/null
          fi
          node scripts/audit-company-visuals.mjs

          layout_changes="$(git status --porcelain --untracked-files=all -- index.html src/index.css src/styles src/scripts)"
          if [[ -n "$layout_changes" ]]; then
            echo "Refusing import because page structure/UI code changed." >&2
            echo "$layout_changes" >&2
            exit 2
          fi

          bsr_pdfs="$(find reports -maxdepth 1 -type f -iname 'BSR*.pdf' -print | sed 's#^reports/##' | sort)"
          [[ "$bsr_pdfs" == "BSR_2026-09-30.pdf" ]] || { echo "BSR latest-only PDF invariant failed: $bsr_pdfs" >&2; exit 2; }

          pvp_pdfs="$(find reports -maxdepth 1 -type f -iname 'PVP*.pdf' -print | sed 's#^reports/##' | sort)"
          [[ "$pvp_pdfs" == "PVP_2026-09-30.pdf" ]] || { echo "PVP latest-only PDF invariant failed: $pvp_pdfs" >&2; exit 2; }

          actual_paths="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -v '^\.github/workflows/tmp-bsr-pvp-import.yml$' | sort)"
          while IFS= read -r p; do
            case "$p" in
              assets/images/reports/bsr.webp|assets/images/reports/pvp.webp|reports/BSR_2026-09-30.pdf|reports/BSR_Equity_Research_Valuation_2026.pdf|reports/PVP_2026-08-26.pdf|reports/PVP_2026-09-30.pdf|src/data/research-data.js) ;;
              "") ;;
              *) echo "Unexpected changed path after preflight: $p" >&2; exit 2 ;;
            esac
          done <<< "$actual_paths"

      - name: Commit BSR and PVP synchronization atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- reports/BSR_2026-09-30.pdf reports/BSR_Equity_Research_Valuation_2026.pdf reports/PVP_2026-09-30.pdf reports/PVP_2026-08-26.pdf src/data/research-data.js assets/images/reports/bsr.webp assets/images/reports/pvp.webp

          echo "== staged paths =="
          git diff --cached --name-status
          git diff --cached --quiet && { echo "No BSR/PVP import changes to commit" >&2; exit 3; }

          git commit -m "Publish BSR and PVP 30 Sep 2026 valuation reports"
          git push origin HEAD:main

      - name: Remove temporary import workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git reset --hard origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-bsr-pvp-import.yml
          git commit -m "Remove temporary BSR PVP import workflow"
          git push origin HEAD:main
