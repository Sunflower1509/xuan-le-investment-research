name: Verify live report visibility 20260819 once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regression, build and audit
        run: |
          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"
      - name: Verify live artifact byte-for-byte
        run: |
          node scripts/verify-live-site.mjs \
            --site-url 'https://sunflower1509.github.io/xuan-le-investment-research/' \
            --artifact-root "${RUNNER_TEMP}/site" \
            --attempts 18 \
            --wait-ms 10000
      - name: Verify newest-report default and five current reports
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const app=fs.readFileSync('src/scripts/app.js','utf8');
          if(!app.includes('sort: "newest"')) throw new Error('Reports tab does not initialize newest');
          if(!app.includes('defaultSortForTab = (tab) => tab === "reports" ? "newest" : "priority"')) throw new Error('Per-tab default sort missing');
          if(app.includes('refs.sort.value = "priority";')) throw new Error('Stale hard-coded reset sort remains');
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('<option value="newest" selected>Mới nhất</option>')) throw new Error('Fallback newest option not selected');
          const code=fs.readFileSync('src/data/research-data.js','utf8');
          const sandbox={window:{}}; vm.runInNewContext(code,sandbox);
          const data=sandbox.window.RESEARCH_DATA;
          const ordered=[...data.reports].sort((a,b)=>b.date.localeCompare(a.date));
          const top5=ordered.slice(0,5).map(r=>r.ticker);
          const expected=new Set(['MSB','VIB','TCB','PNJ','BSI']);
          if(top5.length!==5 || new Set(top5).size!==5 || top5.some(t=>!expected.has(t))) throw new Error(`Unexpected newest top5: ${top5.join(',')}`);
          console.log('NEWEST_TOP5',top5.join(' -> '));
          console.log('REPORT_COUNT',data.reports.length);
          NODE
          curl -fsSL -H 'Cache-Control: no-cache' 'https://sunflower1509.github.io/xuan-le-investment-research/assets/js/site.min.js?visibility-proof=20260819' -o /tmp/live.js
          for id in MSB-20260819 VIB-20260819 TCB-20260819 PNJ-20260819 BSI-20260819; do grep -Fq "$id" /tmp/live.js; done
