name: Read-only VCI third-source diagnostic 2026-09-08

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vci-eod-third-source-2026-09-08.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query exact-date Vietcap OHLC for DRI MSR VGI
        run: |
          node --input-type=module <<'NODE'
          const target = '2026-09-08';
          const expected = { DRI: 14700, MSR: 47900, VGI: 86200 };
          const to = Math.floor(new Date('2026-09-10T00:00:00+07:00').getTime() / 1000);
          const formatVnDate = (raw) => {
            const n = Number(raw);
            if (!Number.isFinite(n)) return null;
            const ms = n < 1e12 ? n * 1000 : n;
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Ho_Chi_Minh', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date(ms));
            const v = Object.fromEntries(parts.filter((p) => p.type !== 'literal').map((p) => [p.type, p.value]));
            return `${v.year}-${v.month}-${v.day}`;
          };
          const normalize = (v) => {
            const n = Number(v);
            if (!(n > 0)) return null;
            return n < 1000 ? Math.round(n * 1000) : Math.round(n);
          };
          const results = [];
          for (const symbol of Object.keys(expected)) {
            const response = await fetch('https://trading.vietcap.com.vn/api/chart/OHLCChart/gap-chart', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                accept: 'application/json, text/plain, */*',
                'user-agent': 'Mozilla/5.0 XuanLeTVS-EOD-ThirdSource/1.0'
              },
              body: JSON.stringify({ timeFrame: 'ONE_DAY', symbols: [symbol], to, countBack: 5 }),
              signal: AbortSignal.timeout(20000)
            });
            if (!response.ok) throw new Error(`${symbol} VCI HTTP ${response.status}`);
            const payload = await response.json();
            const data = Array.isArray(payload) ? payload : Array.isArray(payload?.data) ? payload.data : [];
            const first = data[0] || null;
            let rows = [];
            if (first && Array.isArray(first.t) && Array.isArray(first.c)) {
              rows = first.t.map((t, i) => ({ t, o: first.o?.[i], h: first.h?.[i], l: first.l?.[i], c: first.c?.[i], v: first.v?.[i] }));
            } else if (Array.isArray(data)) {
              rows = data;
            }
            const dated = rows.map((r) => ({ ...r, date: formatVnDate(r.t) }));
            const row = dated.find((r) => r.date === target);
            if (!row) throw new Error(`${symbol} VCI missing exact ${target}; rows=${JSON.stringify(dated)}`);
            const quote = { open: normalize(row.o), high: normalize(row.h), low: normalize(row.l), close: normalize(row.c), volume: Number(row.v) };
            if (![quote.open, quote.high, quote.low, quote.close].every((x) => x > 0)) throw new Error(`${symbol} invalid VCI OHLC ${JSON.stringify(quote)}`);
            if (quote.high < Math.max(quote.open, quote.close) || quote.low > Math.min(quote.open, quote.close) || quote.low > quote.high) throw new Error(`${symbol} inconsistent VCI OHLC ${JSON.stringify(quote)}`);
            results.push({ symbol, date: target, expectedVndirect: expected[symbol], vci: quote, matchesVndirect: quote.close === expected[symbol] });
          }
          console.log('VCI_THIRD_SOURCE=' + JSON.stringify(results, null, 2));
          if (results.some((r) => !r.matchesVndirect)) process.exit(2);
          NODE
