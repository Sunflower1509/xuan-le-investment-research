name: Fetch market snapshot 20260818 once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch bounded raw EOD market data with diagnostics
        run: |
          set -u
          mkdir -p tmp
          fetch() {
            name="$1"; url="$2"
            code=$(curl --connect-timeout 5 --max-time 20 --retry 1 --retry-delay 1 -sS -L -w '%{http_code}' -o "tmp/${name}.body" "$url" || true)
            printf '%s\n' "$code" > "tmp/${name}.status"
          }
          fetch vnmarket_api_finfo 'https://api-finfo.vndirect.com.vn/v4/vnmarket_prices?sort=code&q=date:2026-08-18&size=500'
          fetch vnmarket_finfo_api 'https://finfo-api.vndirect.com.vn/v4/vnmarket_prices?sort=code&q=date:2026-08-18&size=500'
          fetch hose_stocks_api_finfo 'https://api-finfo.vndirect.com.vn/v4/stock_prices?sort=code&q=floor:HOSE~date:2026-08-18&size=2000'
          fetch hose_stocks_finfo_api 'https://finfo-api.vndirect.com.vn/v4/stock_prices?sort=code&q=floor:HOSE~date:2026-08-18&size=2000'
          fetch vietstock_intel 'https://vietstock.info/api/intel/daily?date=2026-08-18'
          fetch vietstock_chart 'https://vietstock.info/api/hsx/vnindex-chart?range=1w'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const readJson = (p) => { try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return null; } };
          const market = readJson('tmp/vnmarket_api_finfo.body') || readJson('tmp/vnmarket_finfo_api.body') || {};
          const stocks = readJson('tmp/hose_stocks_api_finfo.body') || readJson('tmp/hose_stocks_finfo_api.body') || {};
          const rows = Array.isArray(market.data) ? market.data : [];
          const stockRows = Array.isArray(stocks.data) ? stocks.data : [];
          const wantedCodes = new Set(['VNINDEX','VN30','HNX','HNXINDEX','UPCOM','UPCOMINDEX']);
          const wanted = rows.filter(r => wantedCodes.has(String(r.code || '').toUpperCase()));
          const priceOf = r => Number(r.close ?? r.closePrice ?? r.adClose ?? r.price ?? NaN);
          const refOf = r => Number(r.reference ?? r.referencePrice ?? r.basicPrice ?? NaN);
          let advance=0, unchanged=0, decline=0, floor=0, ceiling=0, valid=0;
          for (const r of stockRows) {
            const c = priceOf(r); const ref = refOf(r);
            if (!(Number.isFinite(c) && Number.isFinite(ref) && c>0 && ref>0)) continue;
            valid++;
            if (c > ref) advance++; else if (c < ref) decline++; else unchanged++;
            const fl = Number(r.floor ?? r.floorPrice ?? NaN);
            const ce = Number(r.ceiling ?? r.ceilingPrice ?? NaN);
            if (Number.isFinite(fl) && Math.abs(c-fl)<1e-9) floor++;
            if (Number.isFinite(ce) && Math.abs(c-ce)<1e-9) ceiling++;
          }
          const statuses = Object.fromEntries(fs.readdirSync('tmp').filter(x=>x.endsWith('.status')).map(x=>[x.replace('.status',''),fs.readFileSync('tmp/'+x,'utf8').trim()]));
          const bodies = {};
          for (const name of ['vietstock_intel','vietstock_chart']) {
            const p='tmp/'+name+'.body';
            if (fs.existsSync(p)) bodies[name]=fs.readFileSync(p,'utf8').slice(0,12000);
          }
          const out = { fetchedAt: new Date().toISOString(), statuses, marketRows: wanted, rawMarketCount: rows.length, hoseStockCount: stockRows.length, breadth: { valid, advance, unchanged, decline, floor, ceiling }, supplementalBodies: bodies };
          console.log('MARKET_SNAPSHOT_JSON=' + JSON.stringify(out));
          if (!wanted.length && !bodies.vietstock_intel) process.exitCode = 2;
          NODE
