name: One-off verified EOD recovery 20260911

on:
  push:
    paths:
      - ".github/workflows/eod-recovery-20260911.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified EOD workflow for 2026-09-11
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"date":"2026-09-11"}}'
          printf '%s' "$payload" > "${RUNNER_TEMP}/dispatch.json"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/eod-daily.yml/dispatches" \
            --input "${RUNNER_TEMP}/dispatch.json"
