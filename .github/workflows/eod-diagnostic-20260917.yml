name: EOD diagnostic 2026-09-17

on:
  push:
    paths:
      - ".github/workflows/eod-diagnostic-20260917.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Query KBS exact-date OHLC for OIL and VGI
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const tickers = ["OIL", "VGI"];
          for (const ticker of tickers) {
            const url = `https://kbbuddywts.kbsec.com.vn/iis-server/investment/stocks/${ticker}/data_day?sdate=17-09-2026&edate=17-09-2026`;
            const response = await fetch(url, {
              headers: {
                accept: "application/json,text/plain,*/*",
                "user-agent": "Mozilla/5.0 XuanLeTVS-EOD-Diagnostic/1.0"
              }
            });
            const text = await response.text();
            console.log(`=== ${ticker} status=${response.status} ===`);
            console.log(text);
            if (!response.ok) process.exitCode = 1;
          }
          NODE
