name: Temporary HPG VPB valuation import

on:
  push:
    paths:
      - ".github/workflows/tmp-market-diagnostic-20260930.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Import verified valuation PDFs
        shell: bash
        env:
          FIRE_API: "https://api.firestorage.ai/dev/file"
          SHARE_ID: "p6ngxQo7oKky"
        run: |
          set -euo pipefail
          listing="$(curl -fsSL "${FIRE_API}/shares/${SHARE_ID}/files?maxResults=1000")"
          for spec in             "HPG_2026-10-01.pdf|reports/HPG_2026-10-01.pdf|f7f70e7ffea6e7dcc976b6a2a3cf8a185d692ed28b5419e9f9e3b972c1876fb9|541632"             "VPB_2026-10-01.pdf|reports/VPB_2026-10-01.pdf|9ba545e780a4796b83a8bc3a962de1706e30e1c2223f41a15785f392375bbf02|415597"; do
            IFS='|' read -r wanted output sha size <<< "$spec"
            file_id="$(printf '%s' "$listing" | python3 -c 'import json,sys; w=sys.argv[1]; d=json.load(sys.stdin); m=[f for f in d["files"] if f.get("fileName")==w or f.get("name")==w]; assert len(m)==1; print(m[0].get("fileId") or m[0].get("id"))' "$wanted")"
            payload="$(curl -fsSL -X POST "${FIRE_API}/shares/${SHARE_ID}/files/$file_id/download")"
            url="$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')"
            curl -fsSL "$url" -o "$output"
            test "$(wc -c < "$output" | tr -d ' ')" = "$size"
            echo "$sha  $output" | sha256sum -c -
          done
          rm -f reports/HPG_Valuation_Report_20260710_XuanLeTVS.pdf reports/VPB_2026-09-28.pdf

          node <<'NODE'
          const fs=require("node:fs"), vm=require("node:vm");
          const p="src/data/research-data.js";
          const s={window:{}}; vm.runInNewContext(fs.readFileSync(p,"utf8"),s);
          const d=s.window.RESEARCH_DATA;
          const old=d.reports.filter(r=>["HPG","VPB"].includes(r.ticker));
          if(old.some(r=>r.date>"2026-10-01")) throw new Error("Newer report already exists");

          const hpg={
            id:"HPG-20261001",ticker:"HPG",company:"Tập đoàn Hòa Phát",sector:"Thép",exchange:"HOSE",
            date:"2026-10-01",recommendation:"THEO DÕI / CHỜ",status:"wait",
            marketPrice:20150,marketPriceDate:"2026-09-30",baseValue:28162,valueLabel:"Giá trị kỳ vọng",
            rangeLow:17170,rangeHigh:39138,
            gapLabel:"P0 20.150 đồng/cp thấp hơn GTKV 28.162 đồng/cp khoảng 28,4% nhưng vẫn cao hơn cận dưới 17.170 đồng/cp, nên tín hiệu định giá là THEO DÕI.",
            method:"PP-13 lợi nhuận chuẩn hóa 40% + PP-16 P/B và EV/EBITDA chuẩn hóa 35% + PP-01 DCF-FCFF 25%; PP-18 DCF ngược kiểm chứng",
            summary:"HPG là doanh nghiệp thép chu kỳ. Báo cáo 01/10/2026 cho vùng giá trị 17.170-39.138 đồng/cp và GTKV 28.162 đồng/cp. Dù P0 thấp hơn GTKV 28,4%, trạng thái 1-3 tuần vẫn là CHỜ vì giá dưới MA20/MA50, chưa có xác nhận khối lượng và vùng kiểm tra 21.300-21.400 chỉ cho R/R thử nghiệm khoảng 0,89.",
            action:{zoneLow:null,zoneHigh:null,baseValue:28162,stop:null,targets:[],basisDate:"2026-10-01",recommendation:"CHỜ - CHƯA CÓ VÙNG MUA NGẮN HẠN HỢP LỆ",eligibility:"inactive",condition:"Khung 1-3 tuần: CHỜ. Vùng 21.300-21.400 đồng/cp chỉ là vùng kiểm tra, chưa phải vùng mua vì R/R thử nghiệm khoảng 0,89 < 2; stop thử nghiệm 20.500, T1 22.200, T2 23.570. IF giá <=17.170 THEN mới đạt ngưỡng M cho tích lũy dài hạn, ưu tiên quanh 16.300-17.170 nếu luận điểm không xấu đi. IF hình thành nền mới hoặc nhịp kiểm định hỗ trợ giúp R/R >=2 và xu hướng, khối lượng, sức mạnh tương đối được xác nhận THEN mới đánh giá lại trạng thái; không tự kích hoạt mua."},
            file:"reports/HPG_2026-10-01.pdf",edition:"Bản định giá 01.10.2026",
            visual:{src:"assets/images/reports/hpg.webp?v=20261001-cover1",alt:"Trang bìa báo cáo định giá HPG ngày 01/10/2026",caption:"Bìa báo cáo định giá HPG",sourceLabel:"Xuân Lê TVS Equity Research",sourceUrl:"reports/HPG_2026-10-01.pdf",kind:"report-cover"}
          };
          const vpb={
            id:"VPB-20261001",ticker:"VPB",company:"Ngân hàng TMCP Việt Nam Thịnh Vượng",sector:"Ngân hàng",exchange:"HOSE",
            date:"2026-10-01",recommendation:"THEO DÕI / CHỜ",status:"wait",
            marketPrice:23400,marketPriceDate:"2026-09-30",baseValue:23541,valueLabel:"Giá trị kỳ vọng",
            rangeLow:20671,rangeHigh:26927,
            gapLabel:"P0 23.400 đồng/cp thấp hơn GTKV 23.541 đồng/cp khoảng 0,60% nhưng cao hơn ngưỡng mua M 17.656 đồng/cp, nên tín hiệu định giá là THEO DÕI.",
            method:"PP-06 thu nhập thặng dư 35% + PP-07 P/B-ROE 35% + PP-16 P/B/P/E tương đối 30%; PP-18 ROE/Re ngầm định kiểm chứng",
            summary:"VPB có vùng giá trị 20.671-26.927 đồng/cp và GTKV 23.541 đồng/cp. P0 23.400 đồng/cp gần sát GTKV nên biên an toàn chỉ 0,60%. Trạng thái 1-3 tuần là CHỜ vì xác nhận khối lượng chưa đạt, MA50 đúng ngày chưa khóa và vùng quan sát 22.000-22.400 chỉ cho R/R khoảng 1,00.",
            action:{zoneLow:null,zoneHigh:null,baseValue:23541,stop:null,targets:[],basisDate:"2026-10-01",recommendation:"CHỜ - CHƯA CÓ VÙNG MUA NGẮN HẠN HỢP LỆ",eligibility:"inactive",condition:"Khung 1-3 tuần: CHỜ. Vùng 22.000-22.400 đồng/cp chỉ là vùng quan sát, chưa phải vùng mua vì R/R tại cận trên khoảng 1,00 < 2; stop kỹ thuật thử nghiệm 21.200, T1 23.600 và không kích hoạt T2 vì GTKV 23.541 thấp hơn T1. IF giá <=17.656 THEN mới đạt vùng tích lũy theo định giá. IF 17.656 < giá <=23.541 THEN tiếp tục theo dõi; IF 23.541 < giá <=26.927 THEN không mua mới; IF giá >26.927 THEN tránh mua mới. Chỉ đánh giá lại trade 1-3 tuần khi dữ liệu kỹ thuật được khóa và R/R >=2."},
            file:"reports/VPB_2026-10-01.pdf",edition:"Bản định giá 01.10.2026",
            visual:{src:"assets/images/reports/vpb.webp?v=20261001-cover1",alt:"Trang bìa báo cáo định giá VPB ngày 01/10/2026",caption:"Bìa báo cáo định giá VPB",sourceLabel:"Xuân Lê TVS Equity Research",sourceUrl:"reports/VPB_2026-10-01.pdf",kind:"report-cover"}
          };

          d.reports=d.reports.filter(r=>!["HPG","VPB"].includes(r.ticker)).concat([hpg,vpb]).sort((a,b)=>b.date.localeCompare(a.date)||a.ticker.localeCompare(b.ticker));
          for(const r of [hpg,vpb]){
            const c=d.coverage.find(x=>x.ticker===r.ticker);
            if(!c || c.priceDate!=="2026-10-01") throw new Error(r.ticker+" EOD not locked at 2026-10-01");
            const snap={close:c.close,priceDate:c.priceDate,changePct:c.changePct,volume:c.volume,priceSource:c.priceSource,priceSourceSecondary:c.priceSourceSecondary};
            c.reportId=r.id; c.action=structuredClone(r.action);
            for(const [k,v] of Object.entries(snap)) if(c[k]!==v) throw new Error(r.ticker+" EOD mutated: "+k);
          }
          const vr=d.reports.filter(r=>r.reportType!=="trading");
          if(vr.length!==130||d.coverage.length!==130||new Set(vr.map(r=>r.ticker)).size!==130||new Set(d.coverage.map(c=>c.ticker)).size!==130) throw new Error("Universe invariant failed");
          if(typeof d.meta?.note==="string"&&!d.meta.note.includes("Báo cáo định giá HPG và VPB đã được thay bằng bản 01/10/2026")){
            d.meta.note=d.meta.note.trim()+" Báo cáo định giá HPG và VPB đã được thay bằng bản 01/10/2026; các bản cũ tương ứng đã được loại theo quy tắc latest-only. Registry báo cáo, action plan và ảnh bìa được đồng bộ theo báo cáo mới; dữ liệu EOD 01/10/2026 được giữ nguyên.";
          }
          fs.writeFileSync(p,"window.RESEARCH_DATA = "+JSON.stringify(d,null,2)+";\n");
          NODE

          rm -f assets/images/reports/hpg.webp assets/images/reports/vpb.webp
          node scripts/sync-report-covers.mjs
          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          node scripts/audit-report-covers.mjs
          node scripts/audit-company-logos.mjs
          node scripts/audit-company-visuals.mjs

          test "$(pdfinfo reports/HPG_2026-10-01.pdf | awk '/^Pages:/ {print $2}')" = "15"
          test "$(pdfinfo reports/VPB_2026-10-01.pdf | awk '/^Pages:/ {print $2}')" = "14"

          test "$(find reports -maxdepth 1 -type f -iname 'HPG*.pdf' -print | sed 's#^reports/##')" = "HPG_2026-10-01.pdf"
          test "$(find reports -maxdepth 1 -type f -iname 'VPB*.pdf' -print | sed 's#^reports/##')" = "VPB_2026-10-01.pdf"

          layout_changes="$(git status --porcelain --untracked-files=all -- index.html src/index.css src/styles src/scripts)"
          test -z "$layout_changes"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- reports/HPG_2026-10-01.pdf reports/HPG_Valuation_Report_20260710_XuanLeTVS.pdf reports/VPB_2026-09-28.pdf reports/VPB_2026-10-01.pdf src/data/research-data.js assets/images/reports/hpg.webp assets/images/reports/vpb.webp
          git commit -m "Publish HPG and VPB 01 Oct 2026 valuation reports"
          git push origin HEAD:main
