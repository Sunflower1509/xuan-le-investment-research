name: Import verified valuation reports 2026-09-08

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-reports-20260908.yml'

permissions:
  contents: write

concurrency:
  group: report-import-20260908
  cancel-in-progress: false

jobs:
  import-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download five PDFs and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file/objects/xkNwqPaS9ygPaqRE/BUlNJV'
          mkdir -p reports
          download_one() {
            local id="$1" out="$2" expected_size="$3" expected_sha="$4"
            local json url size sha sig
            json="$(curl -fsSL -X POST "$BASE/files/$id/download")"
            url="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.downloadUrl) process.exit(2); process.stdout.write(x.downloadUrl)' "$json")"
            curl -fsSL "$url" -o "$out"
            size="$(stat -c%s "$out")"
            sha="$(sha256sum "$out" | awk '{print $1}')"
            sig="$(head -c 5 "$out")"
            [[ "$size" == "$expected_size" ]] || { echo "$out size mismatch: $size != $expected_size" >&2; exit 2; }
            [[ "$sha" == "$expected_sha" ]] || { echo "$out sha mismatch: $sha != $expected_sha" >&2; exit 2; }
            [[ "$sig" == '%PDF-' ]] || { echo "$out is not a valid PDF" >&2; exit 2; }
            echo "VERIFIED $out bytes=$size sha256=$sha"
          }
          download_one 01a07f43ac1276afa68fee09ba481309 reports/FRT_2026-09-08.pdf 202023 2588192104cc0171765cedc1614eac14f6cfe1d9f4080f43b95b741a99211666
          download_one 01a07f43e5d1708d9ab3168e382f2085 reports/CSV_2026-09-08.pdf 764620 7a38cbd33391d4adf591567eb0e6b5c8bc62a1247ae128f166484990621a5363
          download_one 01a07f4425047007b295b1894c7c0875 reports/PC1_2026-09-08.pdf 709129 d7cdf1b7f56a6f299885c0dd313a15ebec02a75430bbdfc1c6c88fa708a19acf
          download_one 01a07f44554876818c7876b79d0e0d21 reports/TCM_2026-09-08.pdf 102427 2bc661c876635460a1da4311ccf028f12601748139dd011191ade87e4d6fa68b
          download_one 01a07f4488c177918cdf456e67aaf514 reports/VDS_2026-09-08.pdf 261725 9da86ecbcda46e691a39080d22f776ec943fafb0ac0470ba51cbbffe753b9307

      - name: Replace same-ticker editions and synchronize research metadata
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const path = require('path');
          const { execFileSync } = require('child_process');

          const dataPath = 'src/data/research-data.js';
          const indexPath = 'index.html';
          const sandbox = { window: {} };
          vm.runInNewContext(fs.readFileSync(dataPath, 'utf8'), sandbox, { filename: dataPath });
          const data = sandbox.window.RESEARCH_DATA;
          if (!data || !Array.isArray(data.reports) || !Array.isArray(data.coverage)) throw new Error('Không đọc được research data.');

          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'index-before.html'), fs.readFileSync(indexPath, 'utf8'));
          const targets = new Set(['FRT','CSV','PC1','TCM','VDS']);
          const newPaths = new Set([
            'reports/FRT_2026-09-08.pdf',
            'reports/CSV_2026-09-08.pdf',
            'reports/PC1_2026-09-08.pdf',
            'reports/TCM_2026-09-08.pdf',
            'reports/VDS_2026-09-08.pdf'
          ]);

          const oldTargetReports = data.reports.filter((r) => r?.reportType !== 'trading' && targets.has(String(r.ticker || '').toUpperCase()));
          const oldTargetFiles = [...new Set(oldTargetReports.map((r) => String(r.file || '').split(/[?#]/,1)[0]).filter(Boolean))];
          const removedOldFiles = [];
          for (const relative of oldTargetFiles) {
            if (newPaths.has(relative)) continue;
            if (fs.existsSync(relative)) {
              fs.rmSync(relative);
              removedOldFiles.push(relative);
            }
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'old-target-files.json'), JSON.stringify({ oldTargetFiles, removedOldFiles }, null, 2));

          const newReports = [
            {
              id:'FRT-20260908', ticker:'FRT', company:'CTCP Bán lẻ Kỹ thuật số FPT', sector:'Bán lẻ chuyên dụng', exchange:'HOSE', date:'2026-09-08',
              recommendation:'THEO DÕI / CHỜ', status:'wait', marketPrice:139700, marketPriceDate:'2026-09-08', baseValue:140000,
              valueLabel:'Điểm giữa tham chiếu', rangeLow:118000, rangeHigh:162000,
              gapLabel:'Giá 139.700 đồng/cp gần điểm giữa 140.000 đồng/cp; MOS theo điểm giữa khoảng 0,21%, chưa đạt chuẩn 25-30%.',
              method:'DCF theo FCFF; P/E, P/B và EV/EBITDA kiểm chứng',
