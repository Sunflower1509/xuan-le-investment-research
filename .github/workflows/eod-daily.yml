name: Verified EOD market lock and deploy

on:
  schedule:
    - cron: "27 15 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "7 16 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:
    inputs:
      date:
        description: "Ngày EOD YYYY-MM-DD; để trống dùng ngày Việt Nam hiện tại"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  eod:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cross-check and lock EOD market data
        id: market
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [[ -n "${TARGET_DATE:-}" ]]; then
            RESOLVED_DATE="$TARGET_DATE"
          else
            RESOLVED_DATE="$(TZ=Asia/Ho_Chi_Minh date +%F)"
            if [[ "${GITHUB_EVENT_NAME:-}" == "schedule" ]]; then
              local_hour="$(TZ=Asia/Ho_Chi_Minh date +%H)"
              if (( 10#$local_hour < 12 )); then
                RESOLVED_DATE="$(TZ=Asia/Ho_Chi_Minh date -d 'yesterday' +%F)"
              fi
              while (( $(TZ=Asia/Ho_Chi_Minh date -d "$RESOLVED_DATE" +%u) >= 6 )); do
                RESOLVED_DATE="$(TZ=Asia/Ho_Chi_Minh date -d "$RESOLVED_DATE -1 day" +%F)"
              done
            fi
          fi
          echo "Resolved EOD target: $RESOLVED_DATE (event=${GITHUB_EVENT_NAME:-unknown})"
          node scripts/update-eod-market-data.mjs --date "$RESOLVED_DATE" --status-file "${RUNNER_TEMP}/eod-status.json"

      - name: Lock market indices and HOSE breadth
        if: steps.market.outputs.status == 'verified'
        env:
          EOD_DATE: ${{ steps.market.outputs.date }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';

          const date = process.env.EOD_DATE;
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '')) throw new Error(`Invalid EOD_DATE: ${date}`);
          const path = 'src/data/research-data.js';
          const code = fs.readFileSync(path, 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(code, sandbox, { filename: path });
          const data = sandbox.window.RESEARCH_DATA;
          if (data?.meta?.updated !== date) throw new Error(`Coverage date not locked: ${data?.meta?.updated}`);
          if (!Array.isArray(data.coverage) || !data.coverage.length || data.coverage.some((item) => item.priceDate !== date)) {
            throw new Error('Coverage is not fully current before market-session lock.');
          }

          const url = `https://api-finfo.vndirect.com.vn/v4/vnmarket_prices?sort=code&q=date:${date}&size=500`;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const finite = (value) => Number.isFinite(Number(value)) ? Number(value) : null;
          const key = (row) => String(row?.code || row?.indexCode || row?.symbol || '').toUpperCase();
          const parseIndex = (row, label) => {
            if (!row) throw new Error(`Missing ${label}`);
            const close = finite(row.close ?? row.index ?? row.value);
            const change = finite(row.change ?? row.changeValue);
            const changePct = finite(row.pctChange ?? row.changePct ?? row.percentChange);
            if (close === null || change === null || changePct === null) throw new Error(`Incomplete ${label}`);
            return { code: label, close, change, changePct };
          };

          let locked = null;
          for (let attempt = 1; attempt <= 10; attempt += 1) {
            try {
              const response = await fetch(url, {
                headers: { accept: 'application/json', 'user-agent': 'XuanLeTVS-MarketSession/1.4' },
                signal: AbortSignal.timeout(15000)
              });
              if (!response.ok) throw new Error(`VNDIRECT HTTP ${response.status}`);
              const payload = await response.json();
              const rows = Array.isArray(payload?.data) ? payload.data : [];
              const find = (aliases) => rows.find((row) => aliases.includes(key(row)));
              const vn = find(['VNINDEX', 'VN-INDEX', 'HOSE']);
              const vn30 = find(['VN30', 'VN30-INDEX']);
              const hnx = find(['HNX', 'HNXINDEX', 'HNX-INDEX']);
              const indices = [parseIndex(vn, 'VN-INDEX'), parseIndex(vn30, 'VN30'), parseIndex(hnx, 'HNX-INDEX')];
              const advance = finite(vn?.nmAdvances ?? vn?.advances ?? vn?.advance ?? vn?.up);
              const unchanged = finite(vn?.nmNoChange ?? vn?.noChange ?? vn?.unchanged ?? vn?.reference);
              const decline = finite(vn?.nmDeclines ?? vn?.declines ?? vn?.decline ?? vn?.down);
              const floor = finite(vn?.nmFloors ?? vn?.floorStocks ?? vn?.floors ?? vn?.floor);
              if ([advance, unchanged, decline, floor].some((value) => value === null)) throw new Error('HOSE breadth unavailable');
              locked = {
                date,
                status: 'Đã khóa EOD — VNDIRECT Finfo',
                indices,
                breadth: { advance, unchanged, decline, floor },
                sources: [{ label: `VNDIRECT Finfo — chỉ số & độ rộng EOD ${date.split('-').reverse().join('/')}`, url }]
              };
              break;
            } catch (error) {
              console.log(`Market-session attempt ${attempt}/10: ${error.message}`);
              if (attempt < 10) await sleep(30000);
              else throw error;
            }
          }

          data.marketSession = locked;
          fs.writeFileSync(path, `window.RESEARCH_DATA = ${JSON.stringify(data, null, 2)};\n`);
          console.log('MARKET_SESSION_LOCKED', JSON.stringify(locked));
          NODE

      - name: Record pre-processing ledger
        if: steps.market.outputs.status == 'verified'
        run: cp src/data/trade-ledger.json "${RUNNER_TEMP}/trade-ledger-before.json"

      - name: Process EOD activation ledger
        if: steps.market.outputs.status == 'verified'
        run: node scripts/process-trade-ledger.mjs

      - name: Reconcile expected versus actual activations
        if: steps.market.outputs.status == 'verified'
        run: |
          node scripts/reconcile-trade-ledger.mjs \
            --before "${RUNNER_TEMP}/trade-ledger-before.json" \
            --after src/data/trade-ledger.json \
            --research src/data/research-data.js \
            --report "${RUNNER_TEMP}/ledger-reconciliation.json"

      - name: Run all trigger and ledger tests
        if: steps.market.outputs.status == 'verified'
        run: node --test tests/*.test.mjs

      - name: Build production assets
        if: steps.market.outputs.status == 'verified'
        run: bash scripts/build/build-assets.sh

      - name: Update deterministic browser cache token
        if: steps.market.outputs.status == 'verified'
        run: node scripts/update-cache-token.mjs --date "${{ steps.market.outputs.date }}"

      - name: Refresh first-paint ledger date
        if: steps.market.outputs.status == 'verified'
        env:
          EOD_DATE: ${{ steps.market.outputs.date }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const date = process.env.EOD_DATE;
          const [year, month, day] = date.split('-');
          const dotted = `${day}.${month}.${year}`;
          const path = 'index.html';
          const before = fs.readFileSync(path, 'utf8');
          const pattern = /(<[^>]+data-role=["']ledger-asof["'][^>]*>)Giá theo dõi khóa EOD \d{2}\.\d{2}\.\d{4}(<\/[^>]+>)/g;
          const matches = before.match(pattern) || [];
          if (matches.length !== 1) throw new Error(`Expected one ledger-asof marker, found ${matches.length}`);
          fs.writeFileSync(path, before.replace(pattern, `$1Giá theo dõi khóa EOD ${dotted}$2`));
          NODE

      - name: Audit site integrity
        if: steps.market.outputs.status == 'verified'
        run: node scripts/audit-site.mjs

      - name: Prepare lean production artifact
        if: steps.market.outputs.status == 'verified'
        run: bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"

      - name: Guard mutation scope and public structure
        if: steps.market.outputs.status == 'verified'
        env:
          EOD_DATE: ${{ steps.market.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(src/data/research-data\.js|src/data/trade-ledger\.json|assets/js/site\.min\.js|assets/css/site\.min\.css|index\.html)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed paths:" >&2
            echo "$unexpected" >&2
            exit 2
          fi
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const order = [...html.matchAll(/<section\b[^>]*\bid=(['"])([^'"]+)\1[^>]*>/g)].map((match) => match[2]);
          const expected = ['overview', 'daily-market', 'position-ledger', 'action-radar', 'research'];
          if (order.join(',') !== expected.join(',')) throw new Error(`Section order changed: ${order.join(' -> ')}`);
          const code = fs.readFileSync('src/data/research-data.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(code, sandbox);
          const data = sandbox.window.RESEARCH_DATA;
          const date = process.env.EOD_DATE;
          if (data?.meta?.updated !== date || data?.meta?.release !== date) throw new Error(`Research meta date mismatch: ${data?.meta?.updated}/${data?.meta?.release}`);
          if (data?.marketSession?.date !== date) throw new Error(`marketSession date mismatch: ${data?.marketSession?.date}`);
          if (!Array.isArray(data?.coverage) || !data.coverage.length || data.coverage.some((item) => item.priceDate !== date)) throw new Error('Coverage date mismatch');
          NODE

      - name: Commit verified EOD state without recursive CI
        if: steps.market.outputs.status == 'verified'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/research-data.js src/data/trade-ledger.json assets/js/site.min.js assets/css/site.min.css index.html
            git commit -m "Lock verified EOD ${{ steps.market.outputs.date }} and reconcile ledger [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        if: steps.market.outputs.status == 'verified'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        if: steps.market.outputs.status == 'verified'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        if: steps.market.outputs.status == 'verified'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy byte verification
        if: steps.market.outputs.status == 'verified'
        run: |
          node scripts/verify-live-site.mjs \
            --site-url "${{ steps.deployment.outputs.page_url }}" \
            --artifact-root "${RUNNER_TEMP}/site"

      - name: First scheduled pass not ready - wait for final pass
        if: steps.market.outputs.status == 'not-ready' && github.event_name == 'schedule' && github.event.schedule == '27 15 * * 1-5'
        run: echo "EOD sources are not complete yet; the 16:07 Asia/Ho_Chi_Minh retry will re-check."

      - name: Fail closed when final pass is still not ready
        if: steps.market.outputs.status == 'not-ready' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '7 16 * * 1-5')
        run: |
          echo "EOD sources are still not complete. No data was written and no deployment was performed." >&2
          exit 2

      - name: Already current - safe no-op
        if: steps.market.outputs.status == 'already-current'
        run: echo "Repository already carries the requested EOD date; no duplicate processing or deployment is needed."
