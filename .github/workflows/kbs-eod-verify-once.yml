name: One-time KBS EOD verification

on:
  push:
    paths:
      - ".github/workflows/kbs-eod-verify-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch KBS date-specific EOD rows
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const date = '16-09-2026';
          for (const ticker of ['MSR', 'OIL']) {
            const url = `https://kbbuddywts.kbsec.com.vn/iis-server/investment/stocks/${ticker}/data_day?sdate=${date}&edate=${date}`;
            const response = await fetch(url, {
              headers: {
                accept: 'application/json',
                'accept-language': 'vi,en;q=0.8',
                'x-lang': 'vi',
                'user-agent': 'XuanLeTVS-KBS-EOD-Verification/1.0'
              },
              signal: AbortSignal.timeout(20000)
            });
            if (!response.ok) throw new Error(`${ticker} KBS HTTP ${response.status}`);
            const payload = await response.json();
            const rows = Array.isArray(payload?.data_day) ? payload.data_day : [];
            const row = rows.find((item) => String(item?.t ?? item?.time ?? '').startsWith('2026-09-16')) || rows[0] || null;
            if (!row) throw new Error(`${ticker} KBS missing 16/09/2026 row`);
            console.log('KBS_EOD_RESULT', JSON.stringify({ ticker, url, row }));
          }
          NODE
