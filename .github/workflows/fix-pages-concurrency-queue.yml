name: Fix Pages concurrency queue

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-pages-concurrency-queue.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Add FIFO queue to shared Pages concurrency group
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for name in [".github/workflows/eod-daily.yml", ".github/workflows/pages.yml"]:
              p = Path(name)
              s = p.read_text()
              old = "concurrency:\n  group: pages\n  cancel-in-progress: false"
              new = "concurrency:\n  group: pages\n  cancel-in-progress: false\n  queue: max"
              if new in s:
                  continue
              if old not in s:
                  raise SystemExit(f"Expected concurrency block not found in {name}")
              p.write_text(s.replace(old, new, 1))
          PY

      - name: Validate queue configuration and preserve EOD public-structure guard
        shell: bash
        run: |
          set -euo pipefail
          grep -A4 '^concurrency:' .github/workflows/eod-daily.yml | grep -q 'queue: max'
          grep -A4 '^concurrency:' .github/workflows/pages.yml | grep -q 'queue: max'
          grep -q "const expected = \['overview', 'daily-market', 'position-ledger', 'action-radar', 'research'\];" .github/workflows/eod-daily.yml

      - name: Commit workflow-only synchronization fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/eod-daily.yml .github/workflows/pages.yml
          if ! git diff --cached --quiet; then
            git commit -m "Queue Pages and EOD deployments instead of replacing pending runs [skip ci]"
            git push origin HEAD:main
          fi
