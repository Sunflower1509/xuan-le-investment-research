name: Recovery EOD 2026-09-07

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  recovery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Add verified third-source reconciliations
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'scripts/update-eod-market-data.mjs';
          let code = fs.readFileSync(path, 'utf8');
          const key = '"2026-09-07": Object.freeze({';
          if (!code.includes(key)) {
            const marker = '\n});\n\nconst argValue';
            if (!code.includes(marker)) throw new Error('Cannot locate SECONDARY_CLOSE_OVERRIDES terminator');
            const block = `,
  "2026-09-07": Object.freeze({
    MSR: Object.freeze({
      close: 48500,
      source: "https://vn.investing.com/equities/masan-resources-corp-historical-data",
      reason: "CafeF 07/09 trả 48.400; HNX chính thức và Investing lịch sử cùng xác nhận 48.500, trùng VNDIRECT."
    }),
    OIL: Object.freeze({
      close: 13500,
      source: "https://vn.investing.com/equities/petrovietnam-oil-historical-data",
      reason: "CafeF 07/09 trả 13.400; HNX chính thức và Investing lịch sử cùng xác nhận 13.500, trùng VNDIRECT."
    }),
    PHP: Object.freeze({
      close: 45800,
      source: "https://vn.investing.com/equities/port-of-hai-phong-jsc-historical-data",
      reason: "CafeF 07/09 trả 45.600; Investing lịch sử và VNSignal cùng xác nhận 45.800, trùng VNDIRECT."
    })
  })`;
            code = code.replace(marker, `${block}${marker}`);
            fs.writeFileSync(path, code);
          }
          NODE

      - name: Commit reconciliation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/recovery-eod-2026-09-07.yml
          changed="$(git diff --name-only | sort)"
          expected=$'.github/workflows/recovery-eod-2026-09-07.yml\nscripts/update-eod-market-data.mjs'
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected recovery mutation scope:" >&2
            printf '%s\n' "$changed" >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update-eod-market-data.mjs .github/workflows/recovery-eod-2026-09-07.yml
          git commit -m "Add verified 2026-09-07 EOD reconciliations"
          git push origin HEAD:main

      - name: Dispatch verified EOD recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          gh workflow run eod-daily.yml --ref main -f date=2026-09-07
          echo "Dispatched eod-daily.yml for 2026-09-07"

# trigger one-shot recovery after workflow registration
