name: XSMB OPS_HARDENED Wrapper Smoke

on:
  push:
    branches: ["xsmb-ops-hardening-v1"]
    paths:
      - ".github/workflows/xsmb-post-promotion-wrapper-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.12"
      - name: Install exact frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r xsmb_runtime/requirements-runtime.txt
      - name: Download final hardened 23 Sep artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xsmb-ops-hardened-run-next-20260923-locked
          path: final
          github-token: ${{ github.token }}
          run-id: 35724042838
      - name: Verify wrapper idempotency on hardened state
        run: |
          cp final/promoted.xlsx production.xlsx
          mkdir -p manifests test-evidence
          cp final/manifests/*.json manifests/
          cp final/test-evidence/OPS_TEST_EVIDENCE_MANIFEST_V1.json test-evidence/
          before="$(sha256sum production.xlsx | awk '{print $1}')"
          test "$before" = "7c2109160a590f3544b399d1f345f83b3355a3076066aca6b2ce84a0553ca28b"
          PYTHONPATH=xsmb_runtime python xsmb_runtime/xsmb_ops.py update-result             --workbook production.xlsx             --manifest-dir manifests             --actual-date 2026-09-22             --evidence-json does-not-need-to-exist-for-already-settled.json             > UPDATE_RESULT_IDEMPOTENT.json
          PYTHONPATH=xsmb_runtime python xsmb_runtime/xsmb_ops.py run-next             --workbook production.xlsx             --manifest-dir manifests             --test-evidence test-evidence/OPS_TEST_EVIDENCE_MANIFEST_V1.json             --forecast-date 2026-09-23             > RUN_NEXT_IDEMPOTENT.json
          after="$(sha256sum production.xlsx | awk '{print $1}')"
          test "$after" = "$before"
          python - <<'PY'
          import json
          u=json.load(open("UPDATE_RESULT_IDEMPOTENT.json"))
          r=json.load(open("RUN_NEXT_IDEMPOTENT.json"))
          assert u["operation"]=="UPDATE_RESULT"
          assert u["result"]["status"]=="ALREADY_SETTLED",u
          assert u["active_runner_sha256"]=="1634a48ecadef5fa9c366292fcbb9964b9a9121f4286e78f549bca77d2d0c614"
          assert u["operational_revision"]=="R4-OPS-HARDENED"
          assert r["operation"]=="RUN_NEXT"
          assert r["result"]["status"]=="ALREADY_EXISTS",r
          assert r["active_runner_sha256"]=="1634a48ecadef5fa9c366292fcbb9964b9a9121f4286e78f549bca77d2d0c614"
          assert r["operational_revision"]=="R4-OPS-HARDENED"
          print("OPS_HARDENED_WRAPPER_IDEMPOTENCY=PASS")
          PY
      - name: Upload smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xsmb-ops-hardened-wrapper-smoke
          path: |
            UPDATE_RESULT_IDEMPOTENT.json
            RUN_NEXT_IDEMPOTENT.json
          if-no-files-found: error
          retention-days: 90
