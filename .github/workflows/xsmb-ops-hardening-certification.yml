name: XSMB OPS_HARDENING V1 Certification

on:
  push:
    branches: ["xsmb-ops-hardening-v1"]
    paths:
      - "xsmb_runtime/**"
      - "XSMB_SYSTEM_HANDOFF.md"
      - ".github/workflows/xsmb-ops-hardening-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xsmb-ops-hardening-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.12"

      - name: Install exact frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r xsmb_runtime/requirements-runtime.txt

      - name: Verify production runners unchanged
        run: |
          test "$(sha256sum xsmb_runtime/xsmb_reference_runner_R3_final.py | awk '{print $1}')" = "7c9f1bf773a484c20a09942a90a31613179963869dca30e65be8541d5bc7fd7b"
          test "$(sha256sum xsmb_runtime/xsmb_reference_runner_R4_snapshot.py | awk '{print $1}')" = "71703fdc5fb26d83e19a65e974074a3d8c684aa921fabc359d55d80af306f9ea"
          echo "RUNNERS_UNCHANGED=PASS"

      - name: Materialize hardening fixtures
        run: |
          sudo mkdir -p /mnt/data/xsmb_R3_test_output /mnt/data/xsmb_R4_test_output /mnt/data/xsmb_OPS_test_output
          sudo chown -R "$USER":"$USER" /mnt/data
          cp xsmb_runtime/xsmb_reference_runner_R3_final.py /mnt/data/xsmb_reference_runner_R3_final.py
          cp xsmb_runtime/xsmb_reference_runner_R4_snapshot.py /mnt/data/xsmb_reference_runner_R4_snapshot.py
          cp xsmb_runtime/xsmb_reference_runner_R4_ops_hardened.py /mnt/data/xsmb_reference_runner_R4_ops_hardened.py
          cp xsmb_runtime/xsmb_R3_test_harness_py312.py /mnt/data/xsmb_R3_test_harness_py312.py
          cp xsmb_runtime/xsmb_R4_test_harness_py312.py /mnt/data/xsmb_R4_test_harness_py312.py
          cp xsmb_runtime/xsmb_OPS_test_harness_py312.py /mnt/data/xsmb_OPS_test_harness_py312.py
          cp xsmb_runtime/fixtures/XSMB_RECONCILIATION_R5_1200_v2_1_PRODUCTION_PREP.xlsx /mnt/data/XSMB_RECONCILIATION_R5_1200_v2_1_R3_HARDENED.xlsx
          cp xsmb_runtime/fixtures/settlement_evidence_20260920_4source.json /mnt/data/settlement_evidence_20260920_4source.json

      - name: Runtime gate
        run: python xsmb_runtime/runtime_gate.py

      - name: Repository hygiene audit 10 gates
        run: python xsmb_runtime/repository_hygiene_audit.py

      - name: R3 calendar-independent 34 tests
        run: python /mnt/data/xsmb_R3_test_harness_py312.py

      - name: R4 calendar-independent 34 tests
        run: python /mnt/data/xsmb_R4_test_harness_py312.py

      - name: Enforce exact-runtime suites
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for label,root,result_name in [
              ("R3",Path("/mnt/data/xsmb_R3_test_output"),"R3_34_TEST_RESULTS.json"),
              ("R4",Path("/mnt/data/xsmb_R4_test_output"),"R4_34_TEST_RESULTS.json"),
          ]:
              result=json.loads((root/result_name).read_text())
              evidence=json.loads((root/"TEST_EVIDENCE_MANIFEST_V1.json").read_text())
              assert result["passed"]==34 and result["failed"]==0,(label,result)
              p=evidence["payload"]
              assert p["passed"]==34 and p["failed"]==0,(label,p)
              assert p["runtime_exact_production_match"] is True,(label,p["runtime_observed"])
              ids={x["id"]:x["status"] for x in result["tests"]}
              assert ids["C08"]=="PASS" and ids["C17"]=="PASS",(label,ids.get("C08"),ids.get("C17"))
          print("R3_R4_CALENDAR_INDEPENDENT_34_34=PASS")
          PY

      - name: Test live-state manifest generator
        run: |
          mkdir -p state-manifests
          cp xsmb_runtime/fixtures/XSMB_OBSERVED_NO_FORECAST_20260920.json state-manifests/
          python xsmb_runtime/xsmb_state_manifest.py             --runner xsmb_runtime/xsmb_reference_runner_R4_snapshot.py             --workbook xsmb_runtime/fixtures/XSMB_RECONCILIATION_R5_1200_v2_1_PRODUCTION_PREP.xlsx             --manifest-dir state-manifests             --output XSMB_CURRENT_SYSTEM_STATE_FIXTURE_V1.json --context FIXTURE_TEST
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("XSMB_CURRENT_SYSTEM_STATE_FIXTURE_V1.json").read_text())
          assert x["artifact_type"]=="XSMB_CURRENT_SYSTEM_STATE_V1"
          p=x["payload"]
          assert p["source_context"]=="FIXTURE_TEST"
          assert p["authority_note"].startswith("TEST FIXTURE ONLY")
          assert p["latest_verified_draw"]=="2026-09-20"
          assert p["locked_pre_draw_count"]==0
          print("LIVE_STATE_MANIFEST=PASS")
          PY

      - name: Test operational schema migration on fixture
        run: |
          mkdir -p schema-manifests
          cp xsmb_runtime/fixtures/XSMB_OBSERVED_NO_FORECAST_20260920.json schema-manifests/
          python xsmb_runtime/ops_schema_migration.py             --runner xsmb_runtime/xsmb_reference_runner_R4_snapshot.py             --input xsmb_runtime/fixtures/XSMB_RECONCILIATION_R5_1200_v2_1_PRODUCTION_PREP.xlsx             --output ops_hardened_fixture.xlsx             --manifest-dir schema-manifests             --report OPS_SCHEMA_MIGRATION_REPORT.json
          python - <<'PY'
          import json
          from openpyxl import load_workbook
          from pathlib import Path
          r=json.loads(Path("OPS_SCHEMA_MIGRATION_REPORT.json").read_text())
          assert r["status"]=="PASS"
          assert r["model_math_changed"] is False
          assert r["legacy_values_hash_before"]==r["legacy_values_hash_after"]
          wb=load_workbook("ops_hardened_fixture.xlsx",read_only=True,data_only=False)
          assert "MODEL_GOVERNANCE" in wb.sheetnames
          assert "OPERATIONAL_STATE" in wb.sheetnames
          assert "RUNNER_HISTORY" in wb.sheetnames
          wb.close()
          print("OPS_SCHEMA_MIGRATION=PASS")
          PY

      - name: OPS-HARDENED candidate exact-runtime 34 tests
        run: |
          cp ops_hardened_fixture.xlsx /mnt/data/XSMB_OPS_HARDENED_FIXTURE.xlsx
          python /mnt/data/xsmb_OPS_test_harness_py312.py
          python - <<'PY'
          import json
          from pathlib import Path
          results=json.loads(Path("/mnt/data/xsmb_OPS_test_output/OPS_34_TEST_RESULTS.json").read_text())
          evidence=json.loads(Path("/mnt/data/xsmb_OPS_test_output/TEST_EVIDENCE_MANIFEST_V1.json").read_text())
          p=evidence["payload"]
          assert results["passed"]==34 and results["failed"]==0, results
          assert p["passed"]==34 and p["failed"]==0, p
          assert p["runtime_exact_production_match"] is True, p["runtime_observed"]
          ids={x["id"]:x["status"] for x in results["tests"]}
          assert ids["C08"]=="PASS" and ids["C17"]=="PASS", ids
          print("OPS_HARDENED_EXACT_RUNTIME_34_34=PASS")
          PY

      - name: Certify hardened candidate preserves R4 model mathematics
        run: |
          PYTHONPATH=xsmb_runtime python - <<'PY'
          import importlib.util, json, shutil, sys
          from pathlib import Path
          from openpyxl import load_workbook

          def load(name,path):
              s=importlib.util.spec_from_file_location(name,path)
              m=importlib.util.module_from_spec(s)
              sys.modules[name]=m
              s.loader.exec_module(m)
              return m

          r4=load("ops_cert_r4","xsmb_runtime/xsmb_reference_runner_R4_snapshot.py")
          hc=load("ops_cert_hardened","xsmb_runtime/xsmb_reference_runner_R4_ops_hardened.py")
          mdir=Path("schema-manifests")
          old=r4.load_workbook_state("xsmb_runtime/fixtures/XSMB_RECONCILIATION_R5_1200_v2_1_PRODUCTION_PREP.xlsx",mdir)
          new=hc.load_workbook_state("ops_hardened_fixture.xlsx",mdir)
          assert old.draws.dates==new.draws.dates
          assert old.draws.lotto==new.draws.lotto
          target=len(old.draws.dates)+1
          a=r4.fit_predict(old.draws,target)
          b=hc.fit_predict(new.draws,target)
          assert a["probabilities"]==b["probabilities"]
          assert a["probability_sha256"]==b["probability_sha256"]
          assert a["top5"]==b["top5"]
          assert a["data_hash"]==b["data_hash"]

          # Legacy MODEL_ACTIVATION is no longer an authority for the hardened candidate.
          shutil.copy2("ops_hardened_fixture.xlsx","legacy_tamper.xlsx")
          wb=load_workbook("legacy_tamper.xlsx")
          sh=wb["MODEL_ACTIVATION"]
          for rr in range(2,sh.max_row+1):
              if str(sh.cell(rr,1).value or "")=="reference_runner_sha256":
                  sh.cell(rr,2).value="LEGACY_TAMPER_SHOULD_BE_IGNORED"
              if str(sh.cell(rr,1).value or "")=="research_state":
                  sh.cell(rr,2).value="LEGACY_TAMPER_SHOULD_BE_IGNORED"
          wb.save("legacy_tamper.xlsx"); wb.close()
          legacy=hc.load_workbook_state("legacy_tamper.xlsx",mdir)
          assert legacy.draws.dates==new.draws.dates
          assert legacy.activation["reference_runner_sha256"]==new.activation["reference_runner_sha256"]
          assert legacy.activation["research_state"]==new.activation["research_state"]

          # OPERATIONAL_STATE tampering must fail closed.
          shutil.copy2("ops_hardened_fixture.xlsx","ops_tamper.xlsx")
          wb=load_workbook("ops_tamper.xlsx")
          sh=wb["OPERATIONAL_STATE"]
          for rr in range(2,sh.max_row+1):
              if str(sh.cell(rr,1).value or "")=="operational_state_schema_version":
                  sh.cell(rr,2).value="BROKEN"
          wb.save("ops_tamper.xlsx"); wb.close()
          try:
              hc.load_workbook_state("ops_tamper.xlsx",mdir)
              raise AssertionError("OPERATIONAL_STATE tamper was accepted")
          except hc.RunnerError:
              pass

          cert={
              "status":"PASS",
              "candidate_runner_sha256":hc.runner_sha256(),
              "predecessor_runner_sha256":r4.runner_sha256(),
              "model_spec":hc.SPEC_CORE["spec_version"],
              "spec_hash":hc.SPEC_HASH,
              "master_content_sha256":hc.FROZEN_MASTER_1200_SHA256,
              "probability_sha256":b["probability_sha256"],
              "top5":b["top5"],
              "model_math_changed":False,
              "checks":{
                  "draw_identity":True,
                  "probability_identity":True,
                  "top5_identity":True,
                  "data_hash_identity":True,
                  "legacy_model_activation_not_authoritative":True,
                  "operational_state_tamper_fail_closed":True
              }
          }
          Path("OPS_HARDENED_RUNNER_CANDIDATE_CERT.json").write_text(json.dumps(cert,indent=2))
          print(json.dumps(cert,indent=2))
          PY

      - name: Test Drive CAS write gate V2
        run: |
          cat > drive_cert_pass.json <<'JSON'
          {
            "schema_version":"XSMB_DRIVE_WRITE_CERTIFICATION_V2",
            "status":"PASS",
            "cas_lock_authority_certified":true,
            "stale_lock_revision_rejected":true,
            "single_writer_acl_verified":true,
            "github_concurrency_verified":true,
            "durable_rollback_anchor_verified":true,
            "post_write_readback_verified":true,
            "revision_count_guard_verified":true,
            "canonical_file_id":"TEST_ONLY",
            "cas_lock_document_id":"LOCK_TEST",
            "rollback_anchor_file_id":"ROLLBACK_TEST",
            "certification_evidence_sha256":"TEST_CERT"
          }
          JSON
          cat > expected.json <<'JSON'
          {"file_id":"TEST_ONLY","revision_id":"R1","revision_count":5,"content_sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","size_bytes":4}
          JSON
          cp expected.json observed.json
          cat > lock.json <<'JSON'
          {"document_id":"LOCK_TEST","state":"HELD","epoch":3,"transaction_id":"TX-1","canonical_file_id":"TEST_ONLY","canonical_workbook_sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","canonical_drive_revision_id":"R1"}
          JSON
          printf 'DATA' > expected_output.bin
          cat > after.json <<'JSON'
          {"file_id":"TEST_ONLY","revision_id":"R2","revision_count":6,"content_sha256":"c97c29c7a71b392b437ee03fd17f09bb10b75e879466fc0eb757b2c4a78ac938","size_bytes":4}
          JSON
          python xsmb_runtime/drive_write_gate.py \
            --certification drive_cert_pass.json \
            --expected-before expected.json \
            --observed-before observed.json \
            --lock-state lock.json \
            --observed-after after.json \
            --expected-output expected_output.bin

          # Stale pre-write fingerprint must fail.
          python - <<'PY'
          import json
          p=json.load(open("observed.json"))
          p["revision_id"]="STALE"
          json.dump(p,open("observed_stale.json","w"))
          PY
          if python xsmb_runtime/drive_write_gate.py \
            --certification drive_cert_pass.json \
            --expected-before expected.json \
            --observed-before observed_stale.json \
            --lock-state lock.json; then
            echo "FAIL: stale Drive fingerprint was accepted"
            exit 1
          fi

          # Unexpected extra revision must fail post-write.
          python - <<'PY'
          import json
          p=json.load(open("after.json"))
          p["revision_count"]=7
          json.dump(p,open("after_conflict.json","w"))
          PY
          if python xsmb_runtime/drive_write_gate.py \
            --certification drive_cert_pass.json \
            --expected-before expected.json \
            --observed-before observed.json \
            --lock-state lock.json \
            --observed-after after_conflict.json \
            --expected-output expected_output.bin; then
            echo "FAIL: concurrent revision delta was accepted"
            exit 1
          fi
          echo "DRIVE_CAS_WRITE_GATE_V2=PASS"

      - name: Prove production promotion remains fail-closed before 22 Sep settlement
        run: |
          mkdir -p promotion-manifests
          cp xsmb_runtime/fixtures/XSMB_OBSERVED_NO_FORECAST_20260920.json promotion-manifests/
          if python xsmb_runtime/ops_hardening_promotion_gate.py \
            --runner xsmb_runtime/xsmb_reference_runner_R4_snapshot.py \
            --workbook xsmb_runtime/fixtures/XSMB_RECONCILIATION_R5_1200_v2_1_PRODUCTION_PREP.xlsx \
            --manifest-dir promotion-manifests \
            --required-settled-date 2026-09-22; then
            echo "FAIL: promotion gate accepted an unsettled fixture"
            exit 1
          fi
          echo "PREMATURE_PROMOTION_REJECTION=PASS"

      - name: Assert static handoff contains no live snapshot section
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("XSMB_SYSTEM_HANDOFF.md").read_text()
          assert "Live operational state — never copy into this static handoff" in s
          assert "CURRENT FORECAST 2026-09-21 REMAINS R3-LOCKED" not in s
          assert "Latest verified draw currently in production data:" not in s
          print("STATIC_HANDOFF=PASS")
          PY

      - name: Emit OPS_HARDENING pre-certification
        run: |
          python - <<'PY'
          import hashlib,json,platform
          from pathlib import Path
          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          report={
            "schema_version":"XSMB_OPS_HARDENING_CERTIFICATION_V1",
            "status":"PASS_PENDING_POST_SETTLEMENT_PROMOTION",
            "production_promotion_eligible":False,
            "promotion_blockers":[
              "FORECAST_2026_09_22_NOT_YET_SETTLED"
            ],
            "operational_limitations":[
              "CURRENT_DRIVE_CONNECTOR_DOES_NOT_EXPOSE_KEEP_REVISION_FOREVER; DURABLE_BYTE_VERIFIED_ROLLBACK_ANCHOR_IS_USED"
            ],
            "model_spec_changed":False,
            "model_math_changed":False,
            "r3_runner_sha256":sha("xsmb_runtime/xsmb_reference_runner_R3_final.py"),
            "r4_runner_sha256":sha("xsmb_runtime/xsmb_reference_runner_R4_snapshot.py"),
            "r3_harness_sha256":sha("xsmb_runtime/xsmb_R3_test_harness_py312.py"),
            "r4_harness_sha256":sha("xsmb_runtime/xsmb_R4_test_harness_py312.py"),
            "state_manifest_generator_sha256":sha("xsmb_runtime/xsmb_state_manifest.py"),
            "schema_migration_sha256":sha("xsmb_runtime/ops_schema_migration.py"),
            "candidate_runner_sha256":sha("xsmb_runtime/xsmb_reference_runner_R4_ops_hardened.py"),
            "candidate_test_harness_sha256":sha("xsmb_runtime/xsmb_OPS_test_harness_py312.py"),
            "candidate_test_evidence_file_sha256":sha("/mnt/data/xsmb_OPS_test_output/TEST_EVIDENCE_MANIFEST_V1.json"),
            "drive_write_gate_sha256":sha("xsmb_runtime/drive_write_gate.py"),
            "promotion_gate_sha256":sha("xsmb_runtime/ops_hardening_promotion_gate.py"),
            "drive_cas_writer_cert_sha256":sha("xsmb_runtime/certification/DRIVE_CAS_WRITER_CERTIFICATION_V1.json"),
            "drive_cas_protocol_sha256":sha("xsmb_runtime/DRIVE_CAS_WRITE_PROTOCOL.md"),
            "rollback_anchor_cert_sha256":sha("xsmb_runtime/certification/ROLLBACK_ANCHOR_CERTIFICATION_V1.json"),
            "handoff_sha256":sha("XSMB_SYSTEM_HANDOFF.md"),
            "checks":{
              "r3_calendar_independent_34_34":True,
              "r4_calendar_independent_34_34":True,
              "live_state_manifest":True,
              "schema_migration_fixture":True,
              "hardened_runner_exact_runtime_34_34":True,
              "hardened_runner_model_identity":True,
              "drive_cas_gate_v2":True,
              "external_cas_lock_stale_revision_rejection":True,
              "external_blob_revision_delta_and_readback":True,
              "durable_rollback_anchor_byte_identity":True,
              "premature_promotion_rejected":True,
              "static_handoff":True,
              "production_runners_unchanged":True,
              "repository_hygiene_10_of_10":True
            },
            "runtime":{"python":platform.python_version()}
          }
          Path("OPS_HARDENING_PRECERTIFICATION.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
          sha256sum \
            OPS_HARDENING_PRECERTIFICATION.json \
            REPOSITORY_HYGIENE_AUDIT_V1.json \
            XSMB_CURRENT_SYSTEM_STATE_FIXTURE_V1.json \
            OPS_SCHEMA_MIGRATION_REPORT.json \
            ops_hardened_fixture.xlsx \
            xsmb_runtime/certification/DRIVE_CAS_WRITER_CERTIFICATION_V1.json \
            xsmb_runtime/certification/ROLLBACK_ANCHOR_CERTIFICATION_V1.json \
            xsmb_runtime/DRIVE_CAS_WRITE_PROTOCOL.md \
            /mnt/data/xsmb_R3_test_output/R3_34_TEST_RESULTS.json \
            /mnt/data/xsmb_R3_test_output/TEST_EVIDENCE_MANIFEST_V1.json \
            /mnt/data/xsmb_R4_test_output/R4_34_TEST_RESULTS.json \
            /mnt/data/xsmb_R4_test_output/TEST_EVIDENCE_MANIFEST_V1.json \
            /mnt/data/xsmb_OPS_test_output/OPS_34_TEST_RESULTS.json \
            /mnt/data/xsmb_OPS_test_output/TEST_EVIDENCE_MANIFEST_V1.json \
            > OPS_HARDENING_SHA256SUMS.txt

      - name: Upload OPS_HARDENING evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xsmb-ops-hardening-v1-precertification
          path: |
            OPS_HARDENING_PRECERTIFICATION.json
            REPOSITORY_HYGIENE_AUDIT_V1.json
            OPS_HARDENING_SHA256SUMS.txt
            XSMB_CURRENT_SYSTEM_STATE_FIXTURE_V1.json
            OPS_SCHEMA_MIGRATION_REPORT.json
            OPS_SCHEMA_MIGRATION_DIFF.json
            OPS_HARDENED_RUNNER_CANDIDATE_CERT.json
            ops_hardened_fixture.xlsx
            /mnt/data/xsmb_R3_test_output/R3_34_TEST_RESULTS.json
            /mnt/data/xsmb_R3_test_output/TEST_EVIDENCE_MANIFEST_V1.json
            /mnt/data/xsmb_R4_test_output/R4_34_TEST_RESULTS.json
            /mnt/data/xsmb_R4_test_output/TEST_EVIDENCE_MANIFEST_V1.json
            /mnt/data/xsmb_OPS_test_output/OPS_34_TEST_RESULTS.json
            /mnt/data/xsmb_OPS_test_output/TEST_EVIDENCE_MANIFEST_V1.json
          if-no-files-found: error
          retention-days: 90
