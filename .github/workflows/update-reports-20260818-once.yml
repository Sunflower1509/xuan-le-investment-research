name: Update 18 Aug 2026 valuation reports once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-reports-20260818-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and checksum seven source PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          download() {
            curl -fL --retry 3 --retry-delay 2 "$1" -o "$2"
            test "$(sha256sum "$2" | awk '{print $1}')" = "$3"
            test "$(head -c 5 "$2")" = "%PDF-"
          }
          download 'https://at.adobe.com/rILhrnYSvcTWMtEW' 'reports/SHB_2026-08-18.pdf' '4c537903ca9dc226392d00c8d2e05e0c98becf3efd76e8c85f20daa5816ce737'
          download 'https://at.adobe.com/YfWzNtqMzDCBbmgM' 'reports/DCM_2026-08-18.pdf' '6b585d3c8f343bf65db52a9e2f0cae8c49394c7b49af6670fbe83dfb7d982789'
          download 'https://at.adobe.com/gLOZIlz0VqZ3U9gN' 'reports/PLX_2026-08-18.pdf' '1d94d0f7496a0aa103c98a71f79f041bdf5275826b2b068b3e6590938b86f937'
          download 'https://at.adobe.com/4U0RGyQ8bDLQdQ3W' 'reports/HDB_2026-08-18.pdf' '53ef7ac9399a866034db91aa7a92727933bb85843052dc41e402bda5af0e4f90'
          download 'https://at.adobe.com/5RFIMcxtWmlPju2y' 'reports/VPB_2026-08-18.pdf' '44e45f3fdccdd81186e58936715060c3095a98ab9701e4b498bdc56746111be9'
          download 'https://at.adobe.com/dIyc1ROQb3DxaqB6' 'reports/PVT_2026-08-18.pdf' '9846109708d529928dfc363d3c14516a09eff2f1c17de9773eda9d83269af62f'
          download 'https://at.adobe.com/8Pb12yK2WZmN5bgK' 'reports/MBB_2026-08-18.pdf' 'c04c48c5868b1c531b76bbe944fd07f058f66354bb310ba80001485fed8bd5aa'

      - name: Replace only same-ticker report editions and seed verified 17 Aug EOD coverage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const DATA = 'src/data/research-data.js';
          const oldCode = fs.readFileSync(DATA, 'utf8');
          const box = { window: {} };
          vm.runInNewContext(oldCode, box, { filename: DATA });
          const data = box.window.RESEARCH_DATA;
          if (!data || !Array.isArray(data.reports) || !Array.isArray(data.coverage)) throw new Error('Invalid RESEARCH_DATA');

          const visual = {
            kind: 'illustration',
            src: 'assets/images/advisor-banner-3d-v2.webp?v=20260818-reports2',
            alt: 'Nhận diện báo cáo định giá Xuân Lê TVS',
            caption: 'Báo cáo định giá cổ phiếu',
            sourceLabel: 'Xuân Lê TVS',
            sourceUrl: 'https://sunflower1509.github.io/xuan-le-investment-research/'
          };

          const reports = [
            { id:'SHB-20260818',ticker:'SHB',company:'Ngân hàng TMCP Sài Gòn - Hà Nội',sector:'Ngân hàng',exchange:'HOSE',date:'2026-08-18',recommendation:'MUA - ĐỦ MOS >=30%',status:'wait',marketPrice:11550,marketPriceDate:'2026-08-18',baseValue:20500,valueLabel:'Giá trị kỳ vọng',rangeLow:16600,rangeHigh:24900,gapLabel:'MOS 30,3% so với cận dưới; ngưỡng đủ MOS >=30% là <=11.600 đồng/cp',method:'P/B gắn ROE + Residual Income (RI)',summary:'Vùng giá trị hợp lý 16.600–24.900 đồng/cp, giá trị kỳ vọng 20.500 đồng/cp. Snapshot 18/08/2026 là 11.550 đồng/cp; tín hiệu định giá MUA vì MOS so với cận dưới đạt 30,3%. Đây là tín hiệu định giá, không tự động đồng nghĩa điểm mua kỹ thuật tối ưu 1–3 tuần.',action:{zoneLow:null,zoneHigh:11600,baseValue:20500,stop:10950,targets:[12400,16600],basisDate:'2026-08-18',recommendation:'MUA / QUẢN TRỊ THỦ CÔNG',eligibility:'manual',condition:'Điều kiện báo cáo là một phía: <=11.600 đồng/cp đạt MOS >=30%; 11.600–12.400 là mua thăm dò/chờ xác nhận. Không tạo cận dưới giả cho automation. Nếu vào quanh 11,5–11,6k, stop tham chiếu ~10.950; T1 12.400; T2 16.600.'},visual,file:'reports/SHB_2026-08-18.pdf',edition:'Bản định giá 18.08.2026'},
            { id:'DCM-20260818',ticker:'DCM',company:'Công ty Cổ phần - Tổng Công ty Phân bón Dầu khí Cà Mau',sector:'Nông nghiệp',exchange:'HOSE',date:'2026-08-18',recommendation:'THEO DÕI / CHỜ',status:'wait',marketPrice:30850,marketPriceDate:'2026-08-18',baseValue:33100,valueLabel:'Giá trị kỳ vọng',rangeLow:24700,rangeHigh:40700,gapLabel:'MOS hiện tại khoảng 6,7% so với expected; vùng mua MOS 25–30% là 17.300–18.500 đồng/cp',method:'Lợi nhuận chuẩn hóa 6 năm + P/B + EV/EBITDA chuẩn hóa',summary:'DCM là doanh nghiệp chu kỳ. Vùng giá trị hợp lý 24.700–40.700 đồng/cp, giá trị kỳ vọng 33.100 đồng/cp. Snapshot 18/08/2026 là 30.850 đồng/cp; trạng thái THEO DÕI / CHỜ vì MOS chưa đạt 25–30%.',action:{zoneLow:17300,zoneHigh:18500,baseValue:33100,stop:null,targets:[24700,33100],basisDate:'2026-08-18',recommendation:'CÓ MUA KHI VÀO VÙNG MOS',eligibility:'active',condition:'Chỉ xem xét 17.300–18.500 đồng/cp nếu luận điểm Urê/khí không xấu đi; stoploss 5% từ giá khớp; T1 24.700; T2 33.100. 18.500–40.700: chờ/theo dõi; trên 40.700: loại/tránh mua mới.'},visual,file:'reports/DCM_2026-08-18.pdf',edition:'Bản định giá 18.08.2026'},
            { id:'PLX-20260818',ticker:'PLX',company:'Tập đoàn Xăng dầu Việt Nam',sector:'Năng lượng',exchange:'HOSE',date:'2026-08-18',recommendation:'TRÁNH / LOẠI',status:'reject',marketPrice:37950,marketPriceDate:'2026-08-18',baseValue:30754,valueLabel:'Giá trị kỳ vọng',rangeLow:28158,rangeHigh:36000,gapLabel:'Giá 37.950 đồng/cp cao hơn cận trên 36.000; vùng mua MOS 25–30% là 19.710–21.118 đồng/cp',method:'DCF theo FCFF; kiểm chứng P/E, P/B, EV/EBITDA',summary:'Vùng giá trị cốt lõi 28.158–36.000 đồng/cp, giá trị kỳ vọng 30.754 đồng/cp. Snapshot 18/08/2026 là 37.950 đồng/cp, cao hơn cận trên nên tín hiệu cơ học TRÁNH / LOẠI.',action:{zoneLow:19710,zoneHigh:21118,baseValue:30754,stop:null,targets:[28158,30754,36000],basisDate:'2026-08-18',recommendation:'TRÁNH / LOẠI TẠI GIÁ HIỆN TẠI',eligibility:'veto',condition:'19.710–21.118 đồng/cp chỉ có thể xem xét nếu luận điểm không xấu đi và có xác nhận dòng tiền/price action. Giá trên 36.000: loại/tránh mua mới. Stop 6% ở cận trên vùng mua chỉ là overlay quản trị.'},visual,file:'reports/PLX_2026-08-18.pdf',edition:'Bản định giá 18.08.2026'},
            { id:'HDB-20260818',ticker:'HDB',company:'Ngân hàng TMCP Phát triển Thành phố Hồ Chí Minh',sector:'Ngân hàng',exchange:'HOSE',date:'2026-08-18',recommendation:'THEO DÕI / CHỜ',status:'wait',marketPrice:26850,marketPriceDate:'2026-08-17',baseValue:30216,valueLabel:'Giá trị kỳ vọng',rangeLow:24632,rangeHigh:35519,gapLabel:'MOS so với expected value 11,1%; vùng theo dõi kích hoạt 21.151–22.662 đồng/cp',method:'P/B gắn ROE + Residual Income',summary:'Khoảng giá trị trọng tâm 24.632–35.519 đồng/cp; dải stress beta 21.787–42.974 đồng/cp; expected value 30.216 đồng/cp. Giá đóng cửa 17/08/2026 là 26.850 đồng/cp; trạng thái THEO DÕI / CHỜ.',action:{zoneLow:21151,zoneHigh:22662,baseValue:30216,stop:null,targets:[24632,30216],basisDate:'2026-08-18',recommendation:'THEO DÕI / CHỜ',eligibility:'active',condition:'Chỉ xem xét 21.151–22.662 đồng/cp khi nền tảng không xấu thêm và có xác nhận giá/khối lượng; stop 5% dưới giá mua thực tế; T1 24.632; T2 30.216. Trên 35.519 nếu không nâng forecast/ROE thì tránh mua đuổi.'},visual,file:'reports/HDB_2026-08-18.pdf',edition:'Bản định giá 18.08.2026'},
            { id:'VPB-20260818',ticker:'VPB',company:'Ngân hàng TMCP Việt Nam Thịnh Vượng',sector:'Ngân hàng',exchange:'HOSE',date:'2026-08-18',recommendation:'THEO DÕI / CHỜ',status:'wait',marketPrice:24750,marketPriceDate:'2026-08-17',baseValue:38241,valueLabel:'Giá trị kỳ vọng',rangeLow:29514,rangeHigh:47514,gapLabel:'MOS bảo thủ 16,1% so với cận thấp; vùng mua MOS 25–30% là 20.660–22.136 đồng/cp',method:'P/B gắn ROE + Residual Income (RI)',summary:'Vùng giá trị hợp lý 29.514–47.514 đồng/cp theo quyền hiện tại, giá trị kỳ vọng 38.241 đồng/cp. Giá đóng cửa 17/08/2026 là 24.750 đồng/cp; MOS bảo thủ mới 16,1% nên trạng thái THEO DÕI / CHỜ.',action:{zoneLow:20660,zoneHigh:22136,baseValue:38241,stop:null,targets:[29514,38241],basisDate:'2026-08-18',recommendation:'THEO DÕI / CHỜ',eligibility:'active',condition:'20.660–22.136 đồng/cp và thesis không xấu đi: có thể xem xét giải ngân theo kỷ luật vị thế. T1 29.514; T2 38.241. Stop 3–7% chỉ xác định theo lệnh thực tế. Trên 47.514: loại/tránh.'},visual,file:'reports/VPB_2026-08-18.pdf',edition:'Bản định giá 18.08.2026'},
            { id:'PVT-20260818',ticker:'PVT',company:'Tổng Công ty Cổ phần Vận tải Dầu khí',sector:'Năng lượng',exchange:'HOSE',date:'2026-08-18',recommendation:'THEO DÕI / CHỜ MUA',status:'wait',marketPrice:20700,marketPriceDate:'2026-08-18',baseValue:22057,valueLabel:'Giá trị kỳ vọng',rangeLow:16404,rangeHigh:26313,gapLabel:'MOS hiện tại 6,2%; vùng mua MOS 25–30% là 15.440–16.543 đồng/cp',method:'Lợi nhuận/biên chuẩn hóa 5–7 năm + P/B + EV/EBITDA chuẩn hóa',summary:'PVT là doanh nghiệp chu kỳ vận tải biển. Vùng giá trị hợp lý 16.404–26.313 đồng/cp, giá trị kỳ vọng 22.057 đồng/cp. Snapshot 18/08/2026 là 20.700 đồng/cp; trạng thái THEO DÕI / CHỜ do MOS chỉ khoảng 6,2%.',action:{zoneLow:15440,zoneHigh:16543,baseValue:22057,stop:null,targets:[20700,22057],basisDate:'2026-08-18',recommendation:'THEO DÕI / CHỜ MUA',eligibility:'active',condition:'Nếu giá vào 15.440–16.543 đồng/cp thì có thể kích hoạt theo valuation; stoploss 5% dưới giá khớp thực tế, không bình quân giá xuống nếu thủng stop. T1 20.700; T2 22.057; trên 26.313: loại/tránh.'},visual,file:'reports/PVT_2026-08-18.pdf',edition:'Bản định giá 18.08.2026'},
            { id:'MBB-20260818',ticker:'MBB',company:'Ngân hàng TMCP Quân Đội',sector:'Ngân hàng',exchange:'HOSE',date:'2026-08-18',recommendation:'THEO DÕI / CHỜ',status:'wait',marketPrice:19900,marketPriceDate:'2026-08-17',baseValue:26777,valueLabel:'Giá trị kỳ vọng',rangeLow:20959,rangeHigh:32276,gapLabel:'Giá thấp hơn cận dưới khoảng 5,1%; vùng mua MOS 25–30% là 14.671–15.719 đồng/cp',method:'P/B gắn ROE + Residual Income (RI)',summary:'Vùng giá trị hợp lý 20.959–32.276 đồng/cp, giá trị kỳ vọng 26.777 đồng/cp. Giá đóng cửa 17/08/2026 là 19.900 đồng/cp; thấp hơn expected 25,7% nhưng chỉ thấp hơn cận dưới khoảng 5,1%, nên trạng thái THEO DÕI / CHỜ.',action:{zoneLow:14671,zoneHigh:15719,baseValue:26777,stop:null,targets:[20959,26777],basisDate:'2026-08-18',recommendation:'THEO DÕI / CHỜ',eligibility:'active',condition:'Chỉ xem xét 14.671–15.719 đồng/cp khi NIM/NPL/LLR không xấu hơn luận điểm; stop 5% dưới giá vốn; T1 20.959; T2 26.777. Trên 32.276 nếu không nâng lợi nhuận/ROE thì loại/tránh mua mới.'},visual,file:'reports/MBB_2026-08-18.pdf',edition:'Bản định giá 18.08.2026'}
          ];

          const tickers = new Set(reports.map(r => r.ticker));
          const oldFiles = new Set(data.reports.filter(r => tickers.has(r.ticker)).map(r => r.file).filter(Boolean));
          data.reports = [...reports, ...data.reports.filter(r => !tickers.has(r.ticker))];

          const DATE='2026-08-17', FROM=1786899600, TO=1786960800;
          const num=v=>{const n=Number(v);return Number.isFinite(n)?n:null};
          const px=v=>{const n=num(v);return n>0?(n<1000?Math.round(n*1000):Math.round(n)):null};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function json(url){let e;for(let i=0;i<4;i++){try{const r=await fetch(url,{headers:{accept:'application/json, text/plain, */*','user-agent':'Mozilla/5.0 (compatible; Xuân Lê TVS verifier/1.0)','origin':'https://www.dnse.com.vn','referer':'https://www.dnse.com.vn/'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.json()}catch(x){e=x;if(i<3)await sleep(700*(i+1))}}throw e}
          async function verify(t){
            const a=`https://api-finfo.vndirect.com.vn/v4/stock_prices?sort=date&q=code:${t}~date:${DATE}&size=10`;
            const b=`https://services.entrade.com.vn/chart-api/v2/ohlcs/stock?from=${FROM}&to=${TO}&symbol=${t}&resolution=1D`;
            const [v,d]=await Promise.all([json(a),json(b)]);
            const rows=Array.isArray(v?.data)?v.data:[];
            const r=rows.find(x=>String(x.code||'').toUpperCase()===t&&String(x.date||'')===DATE)||rows.find(x=>String(x.date||'')===DATE)||rows[0];
            if(!r)throw new Error(`${t}: VNDIRECT no row`);
            const close=px(r.close),vol=num(r.nmVolume??r.totalVolume??r.volume),pct=num(r.pctChange??r.changePct),dclose=px(Array.isArray(d?.c)&&d.c.length?d.c[d.c.length-1]:null);
            if(!(close>0)||!(vol>=0)||pct===null||close!==dclose)throw new Error(`${t}: EOD mismatch VNDIRECT=${close}, DNSE=${dclose}`);
            return {close,priceDate:DATE,changePct:Math.round(pct*10000)/10000,volume:Math.round(vol),priceSource:a,priceSourceSecondary:b};
          }

          (async()=>{
            const byTicker=new Map(data.coverage.map(x=>[x.ticker,x]));
            const originalOrder=data.coverage.map(x=>x.ticker);
            for(const r of reports){
              const q=await verify(r.ticker);
              const c=byTicker.get(r.ticker)||{ticker:r.ticker};
              Object.assign(c,{company:r.company,sector:r.sector,exchange:r.exchange,reportId:r.id,...q,action:JSON.parse(JSON.stringify(r.action))});
              byTicker.set(r.ticker,c);
              console.log(`${r.ticker}: prior-EOD seed ${q.close}`);
            }
            const newcomers=reports.map(r=>r.ticker).filter(t=>!originalOrder.includes(t));
            data.coverage=[...newcomers.map(t=>byTicker.get(t)),...originalOrder.map(t=>byTicker.get(t))];
            data.meta.release='2026-08-18';
            data.meta.note=`${data.meta.note} Bổ sung 7 báo cáo định giá ngày 18/08/2026 (SHB, DCM, PLX, HDB, VPB, PVT, MBB). Bảng coverage của các mã mới vẫn khóa theo EOD 17/08/2026 cho tới khi phiên 18/08 thực sự kết thúc; không dùng snapshot trong phiên làm giá đóng cửa.`;
            fs.writeFileSync(DATA,`window.RESEARCH_DATA = ${JSON.stringify(data,null,2)};\n`,'utf8');
            const newFiles=new Set(reports.map(r=>r.file));
            for(const f of oldFiles){if(f.startsWith('reports/')&&!newFiles.has(f)&&fs.existsSync(f)){fs.rmSync(f);console.log('Removed superseded PDF',f)}}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Remove only orphan report images, rebuild, test and audit
        shell: bash
        run: |
          set -euo pipefail
          node --check src/data/research-data.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),path=require('path');
          const c={window:{}};vm.runInNewContext(fs.readFileSync('src/data/research-data.js','utf8'),c);
          const used=new Set(c.window.RESEARCH_DATA.reports.map(r=>String(r.visual?.src||'').split(/[?#]/)[0]).filter(x=>x.startsWith('assets/images/reports/')));
          if(fs.existsSync('assets/images/reports'))for(const f of fs.readdirSync('assets/images/reports')){const p=path.posix.join('assets/images/reports',f);if(f.endsWith('.webp')&&!used.has(p)){fs.rmSync(p);console.log('Removed orphan image',p)}}
          NODE
          ./scripts/build-assets.sh
          node --test tests/trade-ledger.test.mjs
          node scripts/audit-site.mjs

      - name: Remove one-time workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-reports-20260818-once.yml
          git config user.name 'Sunflower1509'
          git config user.email '72440024+Sunflower1509@users.noreply.github.com'
          git add -A
          git commit -m 'Publish 18 Aug 2026 valuation reports'
          git push origin HEAD:main
