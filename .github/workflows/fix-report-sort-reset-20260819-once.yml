name: Fix report sort reset 20260819 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add one-time report sort reset fix'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align reset dropdown with per-tab default
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/scripts/app.js')
          s=p.read_text()
          old='''    refs.search.value = "";\n    refs.sort.value = "priority";\n    renderFilters();'''
          new='''    refs.search.value = "";\n    refs.sort.value = state.sort;\n    renderFilters();'''
          if old not in s:
              raise SystemExit('reset dropdown target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Regression build audit and invariants
        run: |
          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app=fs.readFileSync('src/scripts/app.js','utf8');
          if(!app.includes('sort: "newest"')) throw new Error('Initial report sort is not newest');
          if(!app.includes('defaultSortForTab = (tab) => tab === "reports" ? "newest" : "priority"')) throw new Error('Per-tab default missing');
          if(app.includes('refs.sort.value = "priority";')) throw new Error('Hard-coded reset priority remains');
          const html=fs.readFileSync('index.html','utf8');
          const order=[...html.matchAll(/<section\b[^>]*\bid=(['"])([^'"]+)\1[^>]*>/g)].map(m=>m[2]);
          const expected=['overview','daily-market','position-ledger','action-radar','research'];
          if(order.join(',')!==expected.join(',')) throw new Error('Section order changed');
          if(!html.includes('<option value="newest" selected>Mới nhất</option>')) throw new Error('Fallback select not newest');
          NODE
          git diff --quiet -- src/index.css src/styles assets/css/site.min.css
      - name: Commit and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-report-sort-reset-20260819-once.yml
          git add src/scripts/app.js assets/js/site.min.js
          git commit -m 'Align report sort reset with newest default'
          git push origin HEAD:main
