          }
          if (entry.confluence.factors.reduce((sum, item) => sum + item.score, 0) !== entry.confluence.score) throw new Error('Confluence score mismatch');
          if (entry.scenarios.reduce((sum, item) => sum + item.probability, 0) !== 100) throw new Error('Scenario probabilities must sum to 100');
          if (entry.playbook.map(x => x.state).join('|') !== 'positive|neutral|risk_off') throw new Error('Playbook state order invalid');
          const words = entry.zaloPost.trim().split(/\s+/).length;
          if (words < 250 || words > 400) throw new Error(`Zalo post word count invalid: ${words}`);
          const marker = '  const entries = [\n';
          if (!code.includes(marker)) throw new Error('Automated archive marker missing');
          const serialized = JSON.stringify(entry, null, 2).split('\n').map(line => '    ' + line).join('\n');
          code = code.replace(marker, marker + serialized + ',\n');
          fs.writeFileSync(path, code);
          console.log('PUBLISHED_ENTRY', entry.id, entry.date, entry.confluence.score, entry.sentimentLabel, 'ZALO_WORDS', words);
          NODE
      - name: Validate archive and policy
        run: |
          node --check src/data/daily-insights-auto.js
          node --test tests/*.test.mjs
      - name: Commit verified insight
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/daily-insights-auto.js
          git diff --cached --exit-code && { echo 'No insight changes to commit'; exit 1; } || true
          git commit -m "Publish verified VNINDEX view 2026-09-17"
          git push origin HEAD:main
