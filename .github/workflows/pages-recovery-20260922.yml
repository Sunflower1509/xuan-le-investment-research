name: One-time Pages recovery 2026-09-22

on:
  push:
    paths:
      - ".github/workflows/pages-recovery-20260922.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Pages on latest main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
          echo "Dispatched Pages on latest main"
