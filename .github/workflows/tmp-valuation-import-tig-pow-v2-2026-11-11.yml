name: Temporary valuation import TIG POW v2 2026-11-11

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-valuation-import-tig-pow-v2-2026-11-11.yml"

permissions:
  contents: write

concurrency:
  group: tmp-valuation-import-tig-pow-v2-2026-11-11
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact triggering main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download and byte-verify TIG and POW PDFs; verify FPT already identical
        shell: bash
        env:
          FIRE_API: "https://api.firestorage.ai/dev/file"
          SHARE_ID: "bBdttxZHduTR"
        run: |
          set -euo pipefail
          listing="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL "${FIRE_API}/shares/${SHARE_ID}/files?maxResults=1000")"
          download_one() {
            local wanted="$1" output="$2" expected_sha="$3" expected_size="$4" expected_pages="$5"
            local file_id payload url
            file_id="$(printf '%s' "$listing" | python3 -c 'import json,sys; w=sys.argv[1]; d=json.load(sys.stdin); m=[f for f in d.get("files",[]) if f.get("fileName")==w or f.get("name")==w]; assert len(m)==1,(w,len(m)); print(m[0].get("fileId") or m[0].get("id"))' "$wanted")"
            payload="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL -X POST "${FIRE_API}/shares/${SHARE_ID}/files/$file_id/download")"
            url="$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')"
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSL "$url" -o "$output"
            test "$(wc -c < "$output" | tr -d ' ')" = "$expected_size"
            echo "$expected_sha  $output" | sha256sum -c -
            test "$(head -c 5 "$output")" = "%PDF-"
            command -v pdfinfo >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null; }
            test "$(pdfinfo "$output" | awk '/^Pages:/ {print $2}')" = "$expected_pages"
          }
          download_one "TIG_2026-11-11.pdf" "reports/TIG_2026-11-11.pdf" "a2e44c32f2709b31203114414a40fbc3589ce7f93d85b43cf1fcc9b6eb50a5c5" "474636" "24"
          download_one "POW_2026-11-02.pdf" "reports/POW_2026-11-02.pdf" "57957c9e0b8560f16388519b61fc34b8f7aee21832f5402fee0321aa1e78709f" "580832" "29"
          test "$(git hash-object reports/FPT_2026-11-02.pdf)" = "cf6383f454af6d1ee1ba10546022d7618f14e5d4"
          echo "5a360b829d9b57e41e9536c1ea920cda7989f3f03bc1a6e2aaee9285917fe635  reports/FPT_2026-11-02.pdf" | sha256sum -c -
          rm -f reports/POW_2026-08-22.pdf

      - name: Verify TIG EOD 10 Nov directly against VNDIRECT and CafeF
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { parseVndirect, parseCafeF } = await import("./scripts/update-eod-market-data.mjs");
          const date="2026-11-10", ticker="TIG";
          const priceSource="https://api-finfo.vndirect.com.vn/v4/stock_prices?sort=date&q=code:"+ticker+"~date:"+date+"&size=10";
          const cafeFSource="https://cafef.vn/du-lieu/DuLieu.aspx?cat_id=1009&symbol="+ticker;
          const headers={accept:"text/html,application/json,text/plain,*/*","user-agent":"Mozilla/5.0 XuanLeTVS-Report-Import/2.0"};
          const [p,h]=await Promise.all([
            fetch(priceSource,{headers}).then(r=>{if(!r.ok) throw new Error("VNDIRECT HTTP "+r.status); return r.json();}),
            fetch(cafeFSource,{headers}).then(r=>{if(!r.ok) throw new Error("CafeF HTTP "+r.status); return r.text();})
          ]);
          const primary=parseVndirect(p,ticker,date);
          const secondary=parseCafeF(h,date);
          if(primary.close!==3600||secondary.close!==3600) throw new Error("TIG close mismatch "+JSON.stringify({primary,secondary}));
          if(Math.abs(primary.changePct+10)>0.001||Math.abs(secondary.changePct+10)>0.001) throw new Error("TIG change mismatch "+JSON.stringify({primary,secondary}));
          if(secondary.volume!==297300) throw new Error("TIG CafeF volume mismatch "+JSON.stringify(secondary));
          const fs=await import("node:fs");
          fs.writeFileSync("/tmp/tig-eod.json",JSON.stringify({primary,secondary,priceSource,cafeFSource},null,2));
          console.log(JSON.stringify({ok:true,primary,secondary},null,2));
          NODE

      - name: Update valuation registry latest-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("node:fs"),vm=require("node:vm");
          const p="src/data/research-data.js";
          const s={window:{}}; vm.runInNewContext(fs.readFileSync(p,"utf8"),s,{filename:p});
          const d=s.window.RESEARCH_DATA;
          const vals0=d.reports.filter(r=>r.reportType!=="trading");
          if(vals0.length!==133||d.coverage.length!==133) throw new Error("Expected 133/133 baseline");
          if(vals0.some(r=>r.ticker==="TIG")||d.coverage.some(c=>c.ticker==="TIG")) throw new Error("TIG already exists");
          const powOld=vals0.find(r=>r.ticker==="POW"), fpt=vals0.find(r=>r.ticker==="FPT");
          if(!powOld||powOld.id!=="POW-20260822"||powOld.file!=="reports/POW_2026-08-22.pdf") throw new Error("POW baseline drift");
          if(!fpt||fpt.id!=="FPT-20261102"||fpt.file!=="reports/FPT_2026-11-02.pdf") throw new Error("FPT baseline drift");
          const powCoverage=d.coverage.find(c=>c.ticker==="POW");
          if(!powCoverage||powCoverage.reportId!=="POW-20260822") throw new Error("POW coverage baseline drift");
          const tigEod=JSON.parse(fs.readFileSync("/tmp/tig-eod.json","utf8"));
          const visual=(ticker,date,file)=>({src:"assets/images/reports/"+ticker.toLowerCase()+".webp?v="+date.replaceAll("-","")+"-cover1",alt:"Trang bìa báo cáo định giá "+ticker+" ngày "+date.split("-").reverse().join("/"),caption:"Bìa báo cáo định giá "+ticker,sourceLabel:"Xuân Lê TVS Equity Research",sourceUrl:file,kind:"report-cover"});

          const pow={id:"POW-20261102",ticker:"POW",company:powOld.company,sector:powOld.sector,exchange:powOld.exchange,date:"2026-11-02",recommendation:"THEO DÕI / CHỜ",status:"wait",marketPrice:12200,marketPriceDate:"2026-10-30",baseValue:16146,valueLabel:"Giá trị kỳ vọng có điều kiện",rangeLow:10207,rangeHigh:23267,gapLabel:"P0 12.200 đồng/cp thấp hơn GTKV có điều kiện 16.146 đồng/cp khoảng 24,4%; tín hiệu định giá THEO DÕI nhưng giao dịch 1-3 tuần vẫn CHỜ vì kỹ thuật chưa kích hoạt và cổng dữ liệu chưa đạt.",method:"PP-01 FCFF hợp nhất 60% + PP-16 P/B cùng ngành 40%; PP-18 kiểm chứng ngược trọng số 0, PP-12 dự án trọng số 0",summary:"POW có khoảng giá trị có điều kiện 10.207-23.267 đồng/cp và GTKV 16.146 đồng/cp. Dữ liệu quý III và một số giả định dòng tiền chưa khóa; tại ngày định giá P0 dưới MA20 và khối lượng chỉ 0,79 lần bình quân 20 phiên, nên trạng thái thực chiến 1-3 tuần là CHỜ, chưa thiết lập vùng mua, stop hay mục tiêu.",action:{zoneLow:null,zoneHigh:null,baseValue:16146,stop:null,targets:[],basisDate:"2026-11-02",recommendation:"CHỜ - CHƯA KÍCH HOẠT ĐIỂM MUA",eligibility:"inactive",condition:"Không phát lệnh chỉ vì giá dưới GTKV. Chỉ xem xét điểm mua khi giá vượt nền với khối lượng >=1,5x TB20, đồng thời xác nhận MA20/MA50 và sức mạnh tương đối; lệnh tương lai phải có stop 3-7% và R/R tối thiểu 2. Khi chưa đủ, tiếp tục CHỜ."},file:"reports/POW_2026-11-02.pdf",edition:"Bản định giá 02.11.2026"};
          pow.visual=visual(pow.ticker,pow.date,pow.file);

          const tig={id:"TIG-20261111",ticker:"TIG",company:"CTCP Tập đoàn Đầu tư Thăng Long",sector:"Bất động sản",exchange:"HNX",date:"2026-11-11",recommendation:"THEO DÕI / LOẠI",status:"reject",marketPrice:3600,marketPriceDate:"2026-11-10",baseValue:5262,valueLabel:"Giá trị kỳ vọng có điều kiện",rangeLow:3704,rangeHigh:6381,gapLabel:"P0 3.600 đồng/cp thấp hơn GTKV có điều kiện 5.262 đồng/cp khoảng 31,6%, nhưng trạng thái giao dịch 1-3 tuần là LOẠI do rủi ro tài chính mức CAO và kỹ thuật chưa đạt.",method:"PP-15 tài sản thuần điều chỉnh 55,6% + PP-16 P/B 44,4%; PP-09 RNAV/PP-14 từng mảng/PP-18 chưa khóa",summary:"TIG có khoảng giá trị có điều kiện 3.704-6.381 đồng/cp và GTKV 5.262 đồng/cp, nhưng độ tin cậy THẤP và Cổng dữ liệu 1.5 không đạt. EBIT/chi phí lãi vay 9T2026 rất thấp, giá giảm mạnh và dòng tiền xác nhận yếu; trạng thái giao dịch 1-3 tuần là LOẠI, không có điểm mua hợp lệ.",action:{zoneLow:null,zoneHigh:null,baseValue:5262,stop:null,targets:[],basisDate:"2026-11-11",recommendation:"LOẠI - KHÔNG CÓ ĐIỂM MUA HỢP LỆ",eligibility:"veto",condition:"Không thiết lập vùng mua, stoploss, mục tiêu hay R/R khi trạng thái còn LOẠI. Chỉ đánh giá lại bằng dữ liệu mới nếu MA20 và MA50 tăng, có phiên vượt nền với khối lượng >=1,5x Vol20, sức mạnh tương đối so VN-Index được xác minh, stop 3-7%, R/R >=2 và rủi ro tài chính mức CAO đã được giải quyết."},file:"reports/TIG_2026-11-11.pdf",edition:"Bản định giá 11.11.2026"};
          tig.visual=visual(tig.ticker,tig.date,tig.file);

          d.reports=d.reports.filter(r=>!(r.reportType!=="trading"&&r.ticker==="POW")).concat([pow,tig]);
          d.reports.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||String(a.ticker||"").localeCompare(String(b.ticker||""))||String(a.reportType||"valuation").localeCompare(String(b.reportType||"valuation")));
          powCoverage.reportId=pow.id; powCoverage.action=structuredClone(pow.action);
          d.coverage.push({ticker:"TIG",company:"CTCP Tập đoàn Đầu tư Thăng Long",sector:"Bất động sản",exchange:"HNX",reportId:tig.id,close:tigEod.primary.close,priceDate:d.meta.updated,changePct:tigEod.primary.changePct,volume:tigEod.primary.volume,priceSource:tigEod.priceSource,priceSourceSecondary:tigEod.cafeFSource,action:structuredClone(tig.action)});
          d.coverage.sort((a,b)=>String(a.ticker).localeCompare(String(b.ticker)));

          const vals=d.reports.filter(r=>r.reportType!=="trading");
          if(vals.length!==134||d.coverage.length!==134||new Set(vals.map(r=>r.ticker)).size!==134||new Set(d.coverage.map(c=>c.ticker)).size!==134) throw new Error("134/134 invariant failed");
          for(const r of [pow,tig]){const c=d.coverage.find(x=>x.ticker===r.ticker); if(!c||c.reportId!==r.id||c.action?.basisDate!==r.date||c.action?.eligibility!==r.action.eligibility) throw new Error(r.ticker+" sync failed");}
          if(JSON.stringify(vals.find(r=>r.ticker==="FPT"))!==JSON.stringify(fpt)) throw new Error("FPT changed unexpectedly");

          let note=String(d.meta.note||"");
          note=note.replace("của 133/133 mã được khóa","của 133 mã nền được khóa").replace("Giá đóng cửa khớp trực tiếp CafeF 133/133 mã","Trong bộ 133 mã nền, giá đóng cửa khớp trực tiếp CafeF 133/133 mã").replace("0/133 ngoại lệ CafeF","0/133 ngoại lệ CafeF trong bộ nền").replace("Khối lượng khớp trực tiếp VNDIRECT-nguồn đối chiếu 110/133 mã","Trong bộ nền, khối lượng khớp trực tiếp VNDIRECT-nguồn đối chiếu 110/133 mã");
          if(!note.includes("TIG được bổ sung vào Coverage")) note+=" TIG được bổ sung vào Coverage ngày 11/11/2026 bằng EOD 10/11/2026: VNDIRECT Finfo và CafeF cùng xác nhận giá đóng cửa 3.600 đồng; tổng Báo cáo định giá/Coverage hiện 134/134 mã.";
          d.meta.note=note;
          fs.writeFileSync(p,"window.RESEARCH_DATA = "+JSON.stringify(d,null,2)+";\n");
          console.log(JSON.stringify({powOld:powOld.id,powNew:pow.id,tig:tig.id,fpt:fpt.id,valuations:vals.length,coverage:d.coverage.length},null,2));
          NODE

      - name: Expand CIVS universe metadata and add TIG official candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f"missing token in {path}: {old}")
              p.write_text(s.replace(old,new,1))

          rep("scripts/sync-company-visuals-core.mjs","const EXPECTED = 133;","const EXPECTED = 134;")
          rep("scripts/sync-company-visuals-core.mjs","const REGISTRY_EXPECTED = 124;","const REGISTRY_EXPECTED = 125;")
          rep("scripts/audit-company-visuals-core.mjs","const EXPECTED = 133;","const EXPECTED = 134;")
          rep("scripts/audit-company-visuals-core.mjs","const REGISTRY_EXPECTED = 124;","const REGISTRY_EXPECTED = 125;")
          rep("scripts/ensure-company-visual-candidates.mjs","const EXPECTED = 133;","const EXPECTED = 134;\nconst REGISTRY_EXPECTED = 125;")
          rep("scripts/ensure-company-visual-candidates.mjs","if (Number(registry?.meta?.candidateCount) !== 124 || !Array.isArray(registry?.candidates) || registry.candidates.length !== 124) {","if (Number(registry?.meta?.candidateCount) !== REGISTRY_EXPECTED || !Array.isArray(registry?.candidates) || registry.candidates.length !== REGISTRY_EXPECTED) {")
          rep("scripts/ensure-company-visual-candidates.mjs",'throw new Error(`Expected 124 pending candidates, got ${registry?.candidates?.length ?? "?"}.`);','throw new Error(`Expected ${REGISTRY_EXPECTED} pending candidates, got ${registry?.candidates?.length ?? "?"}.`);')

          p=Path("src/data/company-visual-candidates.json"); reg=json.loads(p.read_text())
          if any(x.get("ticker")=="TIG" for x in reg["candidates"]): raise SystemExit("TIG candidate unexpectedly exists")
          reg["meta"]["coverageTarget"]=134; reg["meta"]["candidateCount"]=125; reg["meta"]["updated"]="2026-11-11"
          reg["candidates"].append({"ticker":"TIG","sourceUrl":"https://tig.vn/vi/du-an.spp","officialDomain":"tig.vn","sourceTier":"A","identityType":"real-estate-projects","keywords":["TIG","dự án","bất động sản","Vườn Vua","TIG Tower","khu nhà ở"]})
          reg["candidates"].sort(key=lambda x:x["ticker"])
          if len(reg["candidates"])!=125: raise SystemExit("candidate count != 125")
          p.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+"\n")

          t=Path("tests/company-visuals.test.mjs"); s=t.read_text()
          changes=[
            ("complete 133-code coverage","complete 134-code coverage"),
            ("visuals.meta.coverageTarget, 133","visuals.meta.coverageTarget, 134"),
            ("research.coverage.length, 133","research.coverage.length, 134"),
            ("registry.meta.coverageTarget, 133","registry.meta.coverageTarget, 134"),
            ("registry.meta.candidateCount, 124","registry.meta.candidateCount, 125"),
            ("registry.candidates.length, 124","registry.candidates.length, 125"),
            ("registryTickers.size, 124","registryTickers.size, 125"),
            ('union.size, 133, "baseline visuals + candidate registry must cover exactly 133 unique tickers"','union.size, 134, "baseline visuals + candidate registry must cover exactly 134 unique tickers"'),
            ("133-aware","134-aware"),
            ("const EXPECTED = 133","const EXPECTED = 134"),
            ("const REGISTRY_EXPECTED = 124","const REGISTRY_EXPECTED = 125"),
            ("standard, /133\\/133/","standard, /134\\/134/")
          ]
          for old,new in changes:
              if old not in s: raise SystemExit(f"missing test token {old}")
              s=s.replace(old,new)
          s=s.replace('  assert.doesNotMatch(sync, /\\b125\\b/);\n','').replace('  assert.doesNotMatch(syncWrapper, /\\b125\\b/);\n','')
          t.write_text(s)

          p=Path("docs/company-identity-visual-standard.md"); s=p.read_text()
          for old,new in [
            ("Coverage Universe 133","Coverage Universe 134"),
            ("133/133 mã trong Coverage Universe","134/134 mã trong Coverage Universe"),
            ("Quy tắc rollout 133 mã","Quy tắc rollout 134 mã"),
            ("`coverageTarget = 133`","`coverageTarget = 134`"),
            ("**124 mã bổ sung** cộng với **9 visual baseline đã xác minh**, tạo đúng **133 mã**; không cho phép runtime quay về universe 125.","**125 mã bổ sung** cộng với **9 visual baseline đã xác minh**, tạo đúng **134 mã**; không cho phép runtime quay về universe 133.")
          ]:
              if old not in s: raise SystemExit(f"missing doc token {old}")
              s=s.replace(old,new)
          p.write_text(s)
          PY

          node scripts/sync-company-logos.mjs
          node scripts/ensure-company-visual-candidates.mjs

      - name: Rebuild POW and TIG report covers
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/images/reports/{pow,tig}.webp
          node scripts/sync-report-covers.mjs

      - name: Run full regression and integrity audits before commit
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/report-coverage-sync.test.mjs
          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          node scripts/audit-report-covers.mjs
          node scripts/audit-company-logos.mjs
          node scripts/audit-company-visuals.mjs
          git diff --exit-code -- index.html src/index.css src/styles

      - name: Guard mutation scope, delete both temporary workflows, commit and push atomically
        shell: bash
        run: |
          set -euo pipefail
          trigger_sha="${GITHUB_SHA}"
          rm -f ".github/workflows/tmp-valuation-import-tig-pow-2026-11-11.yml"
          rm -f ".github/workflows/tmp-valuation-import-tig-pow-v2-2026-11-11.yml"
          allowed='^(\.github/workflows/tmp-valuation-import-tig-pow(-v2)?-2026-11-11\.yml|src/data/(research-data\.js|company-logos\.js|company-visuals\.js|company-visual-candidates\.json)|scripts/(ensure-company-visual-candidates|sync-company-visuals-core|audit-company-visuals-core)\.mjs|tests/company-visuals\.test\.mjs|docs/company-identity-visual-standard\.md|reports/(TIG_2026-11-11|POW_2026-11-02|POW_2026-08-22)\.pdf|assets/images/reports/(tig|pow)\.webp|assets/images/logos/tig\.svg)$'
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //')"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then echo "Unexpected changed paths:" >&2; echo "$unexpected" >&2; exit 2; fi
          test -s reports/TIG_2026-11-11.pdf
          test -s reports/POW_2026-11-02.pdf
          test ! -e reports/POW_2026-08-22.pdf
          test -s assets/images/logos/tig.svg
          test "$(git hash-object reports/FPT_2026-11-02.pdf)" = "cf6383f454af6d1ee1ba10546022d7618f14e5d4"

          git fetch origin main --quiet
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$trigger_sha" ]]; then echo "main advanced; refusing stale write" >&2; exit 3; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update POW and add TIG valuation with synchronized 134-code universe"
          git push origin HEAD:main
