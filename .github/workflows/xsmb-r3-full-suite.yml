name: XSMB R3 Full Suite Python 3.12

on:
  push:
    branches: ["xsmb-v2.1-python312-runtime"]
    paths:
      - ".github/workflows/xsmb-r3-full-suite.yml"
      - "xsmb_runtime/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r3-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.12"

      - name: Install exact frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r xsmb_runtime/requirements-runtime.txt

      - name: Materialize test fixture paths
        run: |
          sudo mkdir -p /mnt/data/xsmb_R3_test_output
          sudo chown -R "$USER":"$USER" /mnt/data
          cp xsmb_runtime/xsmb_reference_runner_R3_final.py /mnt/data/xsmb_reference_runner_R3_final.py
          cp xsmb_runtime/xsmb_R3_test_harness_py312.py /mnt/data/xsmb_R3_test_harness_py312.py
          cp xsmb_runtime/fixtures/XSMB_RECONCILIATION_R5_1200_v2_1_PRODUCTION_PREP.xlsx /mnt/data/XSMB_RECONCILIATION_R5_1200_v2_1_R3_HARDENED.xlsx
          cp xsmb_runtime/fixtures/settlement_evidence_20260920_4source.json /mnt/data/settlement_evidence_20260920_4source.json

      - name: Verify frozen runtime
        run: python xsmb_runtime/runtime_gate.py

      - name: Run R1-R15 and C01-C19
        run: python /mnt/data/xsmb_R3_test_harness_py312.py

      - name: Enforce 34 of 34 and exact runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results=json.loads(Path("/mnt/data/xsmb_R3_test_output/R3_34_TEST_RESULTS.json").read_text())
          evidence=json.loads(Path("/mnt/data/xsmb_R3_test_output/TEST_EVIDENCE_MANIFEST_V1.json").read_text())
          p=evidence["payload"]
          assert results["passed"] == 34 and results["failed"] == 0, results
          assert p["passed"] == 34 and p["failed"] == 0, p
          assert p["runtime_exact_production_match"] is True, p["runtime_observed"]
          print("EXACT_RUNTIME_34_34_PASS")
          PY

      - name: Upload test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xsmb-r3-python312-34-tests
          path: |
            /mnt/data/xsmb_R3_test_output/R3_34_TEST_RESULTS.json
            /mnt/data/xsmb_R3_test_output/TEST_EVIDENCE_MANIFEST_V1.json
          if-no-files-found: error
