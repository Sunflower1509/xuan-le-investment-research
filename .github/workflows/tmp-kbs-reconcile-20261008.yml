name: Temporary KBS reconcile 2026-10-08

on:
  push:
    paths:
      - ".github/workflows/tmp-kbs-reconcile-20261008.yml"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch KBS exact-date OHLC
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const tickers=["DRI","G36","MSR","PHP","QNS"];
          const date="2026-10-08";
          const kbsDate="08-10-2026";
          const norm=(v)=>{
            const n=Number(v);
            if(!Number.isFinite(n)) return null;
            return n < 1000 ? Math.round(n*1000) : Math.round(n);
          };
          for (const ticker of tickers) {
            const url=`https://kbbuddywts.kbsec.com.vn/iis-server/investment/stocks/${ticker}/data_day?sdate=${kbsDate}&edate=${kbsDate}`;
            const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0 XuanLeTVS-Reconcile/1.0"}});
            if(!r.ok) throw new Error(`${ticker} HTTP ${r.status}`);
            const p=await r.json();
            const rows=Array.isArray(p?.data_day)?p.data_day:[];
            const row=rows.find(x=>{
              const raw=x?.t??x?.time;
              if(raw==null) return false;
              const s=String(raw);
              if(s===date||s.startsWith(date+"T")||s.startsWith(date+" ")) return true;
              const num=/^\d+$/.test(s)?Number(s):null;
              const d=num!==null?new Date(num<1e12?num*1000:num):new Date(s);
              return !Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===date;
            });
            if(!row) throw new Error(`${ticker} missing KBS row`);
            const out={
              ticker,url,
              open:norm(row.o??row.open),
              high:norm(row.h??row.high),
              low:norm(row.l??row.low),
              close:norm(row.c??row.close),
              volume:Number(row.v??row.volume)
            };
            console.log("KBS_RECONCILE",JSON.stringify(out));
          }
          NODE
