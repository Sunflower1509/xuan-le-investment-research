name: Refresh EOD prices 17 Aug 2026 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-eod-20260817-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-fetch and cross-check 40 EOD quotes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const DATA_PATH = 'src/data/research-data.js';
          const DATE = '2026-08-17';
          const text0 = fs.readFileSync(DATA_PATH, 'utf8');
          const context = { window: {} };
          vm.runInNewContext(text0, context, { filename: DATA_PATH });
          const research = context.window.RESEARCH_DATA;
          if (!research || !Array.isArray(research.coverage)) throw new Error('RESEARCH_DATA.coverage unavailable');
          if (research.coverage.length !== 40) throw new Error(`Expected 40 coverage tickers, found ${research.coverage.length}`);

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function fetchJson(url, label) {
            let lastErr;
            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const res = await fetch(url, {
                  headers: {
                    'accept': 'application/json, text/plain, */*',
                    'user-agent': 'Mozilla/5.0 (compatible; Xuân Lê TVS EOD verifier/1.0)',
                    'origin': 'https://www.dnse.com.vn',
                    'referer': 'https://www.dnse.com.vn/'
                  }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
              } catch (err) {
                lastErr = err;
                if (attempt < 4) await sleep(800 * attempt);
              }
            }
            throw new Error(`${label}: ${lastErr?.message || lastErr}`);
          }

          const num = (v) => {
            const n = Number(v);
            return Number.isFinite(n) ? n : null;
          };
          const round4 = (n) => Math.round(n * 10000) / 10000;
          const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

          function vndirectRow(json, ticker) {
            const rows = Array.isArray(json?.data) ? json.data : Array.isArray(json) ? json : [];
            const row = rows.find((r) => String(r?.code || '').toUpperCase() === ticker && String(r?.date || '') === DATE)
              || rows.find((r) => String(r?.date || '') === DATE)
              || rows[0];
            if (!row) throw new Error(`${ticker}: VNDIRECT returned no row`);
            const close = num(row.close);
            const volume = num(row.nmVolume ?? row.totalVolume ?? row.volume);
            let changePct = num(row.pctChange ?? row.changePct);
            if (changePct === null) {
              const ref = num(row.basicPrice ?? row.referencePrice ?? row.reference ?? row.refPrice);
              if (close !== null && ref && ref !== 0) changePct = ((close / ref) - 1) * 100;
            }
            if (!(close > 0) || !(volume >= 0) || changePct === null) {
              throw new Error(`${ticker}: incomplete VNDIRECT row keys=${Object.keys(row).join(',')}`);
            }
            return { close, volume: Math.round(volume), changePct: round4(changePct), raw: row };
          }

          function dnseQuote(json, ticker) {
            const c = Array.isArray(json?.c) ? json.c : [];
            const v = Array.isArray(json?.v) ? json.v : [];
            if (!c.length) throw new Error(`${ticker}: DNSE returned no closing series; keys=${Object.keys(json || {}).join(',')}`);
            const lastClose = num(c[c.length - 1]);
            if (!(lastClose > 0)) throw new Error(`${ticker}: invalid DNSE close`);
            // DNSE chart series is quoted in thousand VND; normalize to VND/cp.
            const close = lastClose < 1000 ? Math.round(lastClose * 1000) : Math.round(lastClose);
            const volume = v.length ? num(v[v.length - 1]) : null;
            return { close, volume: volume === null ? null : Math.round(volume) };
          }

          (async () => {
            const verified = [];
            const volumeMismatches = [];
            for (const item of research.coverage) {
              const ticker = String(item.ticker).toUpperCase();
              if (!item.priceSource || !item.priceSourceSecondary) throw new Error(`${ticker}: missing source URLs`);
              const [vj, dj] = await Promise.all([
                fetchJson(item.priceSource, `${ticker} VNDIRECT`),
                fetchJson(item.priceSourceSecondary, `${ticker} DNSE`)
              ]);
              const vn = vndirectRow(vj, ticker);
              const dn = dnseQuote(dj, ticker);
              if (vn.close !== dn.close) {
                throw new Error(`${ticker}: close mismatch VNDIRECT=${vn.close}, DNSE=${dn.close}`);
              }
              if (dn.volume !== null && vn.volume !== dn.volume) {
                volumeMismatches.push({ ticker, vndirect: vn.volume, dnse: dn.volume, diff: vn.volume - dn.volume });
              }
              verified.push({ ticker, ...vn, dnseVolume: dn.volume });
              console.log(`${ticker}: close=${vn.close}; changePct=${vn.changePct}; volume=${vn.volume}; DNSE=${dn.close}${dn.volume === null ? '' : `; dnseVolume=${dn.volume}`}`);
              await sleep(120);
            }

            let text = text0;
            const coverageMarker = '  coverage: [\n';
            const coverageIndex = text.indexOf(coverageMarker);
            if (coverageIndex < 0) throw new Error('coverage marker not found');
            const head = text.slice(0, coverageIndex);
            let coverage = text.slice(coverageIndex);

            for (const quote of verified) {
              const re = new RegExp(`(\\n    \\{\\n      ticker: "${escapeRe(quote.ticker)}"[\\s\\S]*?\\n    \\})(?=,?\\n)`);
              const match = coverage.match(re);
              if (!match) throw new Error(`${quote.ticker}: coverage block not found`);
              let block = match[1];
              block = block.replace(/close:\s*-?[0-9.]+/, `close: ${quote.close}`);
              block = block.replace(/priceDate:\s*"[^"]+"/, `priceDate: "${DATE}"`);
              block = block.replace(/changePct:\s*-?[0-9.]+/, `changePct: ${quote.changePct}`);
              block = block.replace(/volume:\s*[0-9.]+/, `volume: ${quote.volume}`);
              coverage = coverage.replace(match[1], block);
            }

            const mismatchText = volumeMismatches.length
              ? volumeMismatches.map((m) => `${m.ticker}: VNDIRECT ${m.vndirect.toLocaleString('vi-VN')} vs DNSE ${m.dnse.toLocaleString('vi-VN')} (chênh ${Math.abs(m.diff).toLocaleString('vi-VN')})`).join('; ')
              : 'không có chênh lệch';
            const matchedVolumes = 40 - volumeMismatches.length;
            const newNote = `Giá đóng cửa, biến động và khối lượng khớp lệnh của 40/40 mã được tái đối chiếu sau khi kết thúc phiên 17/08/2026. Giá đóng cửa 40/40 mã khớp trực tiếp giữa VNDIRECT Finfo và DNSE EnTrade. Khối lượng khớp ${matchedVolumes}/40 mã giữa hai nguồn; ${mismatchText}. Website dùng nmVolume từ VNDIRECT Finfo theo quy ước nguồn chính và không suy diễn nguyên nhân sai khác. Không dùng chuỗi giá lịch sử đã điều chỉnh; phần trăm biến động lấy từ dữ liệu phiên VNDIRECT. Vùng mua, mốc giá trị tham chiếu, khuyến nghị và điều kiện hành động giữ nguyên theo hồ sơ định giá đang công bố.`;
            let merged = head + coverage;
            merged = merged.replace(/(\n    note:\s*)"(?:[^"\\]|\\.)*"/, `$1${JSON.stringify(newNote)}`);
            if (merged === text0) throw new Error('No data change detected after verification; note update failed');
            fs.writeFileSync(DATA_PATH, merged, 'utf8');
            console.log(`Verified ${verified.length}/40 closes. Volume mismatches: ${volumeMismatches.length}.`);
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE

      - name: Refresh production bundle without changing layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          import re
          text, n = re.subn(r'assets/js/site\.min\.js\?v=[^"\']+', 'assets/js/site.min.js?v=20260817-eod3', text, count=1)
          if n != 1:
              raise SystemExit('site.min.js cache-busting reference not found exactly once')
          p.write_text(text, encoding='utf-8')
          PY
          node --check src/data/research-data.js
          ./scripts/build-assets.sh

      - name: Validate site integrity and unchanged section order
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/trade-ledger.test.mjs
          node scripts/audit-site.mjs

      - name: Commit verified EOD refresh and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-eod-20260817-once.yml
          git config user.name 'Sunflower1509'
          git config user.email '72440024+Sunflower1509@users.noreply.github.com'
          git add -A
          git commit -m 'Reverify 40 EOD prices for 17 Aug 2026'
          git push origin HEAD:main
