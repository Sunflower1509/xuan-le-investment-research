name: One-time valuation report publisher 2026-09-16

on:
  push:
    paths:
      - '.github/workflows/publish-valuations-20260916.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve firestorage API base
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/app.js 'https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js'
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/app.js').read_text()
          for needle in ['/api','api.','shares/${','let f=','const f=','f="','f=']:
              print('\n###',needle)
              start=0; n=0
              while n<12:
                  i=s.find(needle,start)
                  if i<0: break
                  print(s[max(0,i-350):i+700])
                  print('\n---')
                  start=i+len(needle); n+=1
          PY
