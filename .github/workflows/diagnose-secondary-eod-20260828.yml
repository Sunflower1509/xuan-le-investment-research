name: Diagnose independent EOD secondary sources 28 Aug 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/diagnose-secondary-eod-20260828.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test FireAnt and SSI public historical OHLC endpoints
        run: |
          node --input-type=module <<'NODE'
          const tickers=['ACB','PET','VGC','FTS'];
          for(const ticker of tickers){
            const urls=[
              `https://restv2.fireant.vn/symbols/${ticker}/historical-quotes?startDate=2026-08-28T00:00:00%2B07:00&endDate=2026-08-28T23:59:59%2B07:00&offset=0&limit=20`,
              `https://fc-data.ssi.com.vn/api/v2/Market/DailyOhlc?Symbol=${ticker}&FromDate=28/08/2026&ToDate=28/08/2026&PageIndex=1&PageSize=10&Ascending=true`
            ];
            for(const url of urls){
              try{
                const r=await fetch(url,{headers:{accept:'application/json','user-agent':'XuanLeTVS-EOD-Secondary-Diagnostic/1.0'},signal:AbortSignal.timeout(15000)});
                const text=await r.text();
                console.log('SOURCE',ticker,r.status,url, text.slice(0,4000));
              }catch(e){console.log('ERROR',ticker,url,String(e));}
            }
          }
          NODE
