name: One-off EOD diagnostic 20260911

on:
  push:
    paths:
      - ".github/workflows/eod-diagnostic-20260911.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Query KBS date-specific OHLC for mismatch tickers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const tickers = ['DRI','OIL','PHP','VGI'];
          const date = '2026-09-11';
          const [y,m,d] = date.split('-');
          const sdate = `${d}-${m}-${y}`;
          const norm = (v) => {
            const n = Number(v);
            if (!Number.isFinite(n)) return null;
            return n < 1000 ? Math.round(n * 1000) : Math.round(n);
          };
          for (const ticker of tickers) {
            const url = `https://kbbuddywts.kbsec.com.vn/iis-server/investment/stocks/${ticker}/data_day?sdate=${sdate}&edate=${sdate}`;
            const res = await fetch(url, {headers:{accept:'application/json','user-agent':'XuanLeTVS-EOD-Diagnostic/1.0'}, signal:AbortSignal.timeout(20000)});
            if (!res.ok) throw new Error(`${ticker} KBS HTTP ${res.status}`);
            const payload = await res.json();
            const rows = Array.isArray(payload?.data_day) ? payload.data_day : [];
            const row = rows[0];
            if (!row) throw new Error(`${ticker} KBS missing row`);
            const out = {
              ticker,
              date,
              open:norm(row.o ?? row.open),
              high:norm(row.h ?? row.high),
              low:norm(row.l ?? row.low),
              close:norm(row.c ?? row.close),
              volume:Number(row.v ?? row.volume)
            };
            console.log('KBS_EOD', JSON.stringify(out));
          }
          NODE