name: Temporary NT2 valuation import 2026-11-18

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-import-nt2-2026-11-18.yml"
      - ".github/workflows/tmp-import-nt2-2026-11-18.mjs"

permissions:
  contents: write

concurrency:
  group: tmp-import-nt2-2026-11-18
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact triggering main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download and verify NT2 PDF
        shell: bash
        env:
          FIRE_API: "https://api.firestorage.ai/dev/file"
        run: |
          set -euo pipefail
          share_id="euQkfoi_Ccmx"
          wanted="NT2_2026-11-18.pdf"
          output="reports/NT2_2026-11-18.pdf"
          listing="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL "${FIRE_API}/shares/${share_id}/files?maxResults=1000")"
          file_id="$(printf '%s' "$listing" | python3 -c 'import json,sys; w=sys.argv[1]; d=json.load(sys.stdin); m=[f for f in d.get("files",[]) if f.get("fileName")==w or f.get("name")==w]; assert len(m)==1,(w,len(m)); print(m[0].get("fileId") or m[0].get("id"))' "$wanted")"
          payload="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL -X POST "${FIRE_API}/shares/${share_id}/files/$file_id/download")"
          url="$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')"
          curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSL "$url" -o "$output"
          test "$(wc -c < "$output" | tr -d ' ')" = "820223"
          echo "1ec7a5a4dcc66dcba898afbb155710aae9f49e8f02e1a1d78afe31d2ef333571  $output" | sha256sum -c -
          command -v pdfinfo >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null; }
          test "$(pdfinfo "$output" | awk '/^Pages:/ {print $2}')" = "27"

      - name: Apply guarded NT2 data changes
        run: node .github/workflows/tmp-import-nt2-2026-11-18.mjs

      - name: Synchronize report cover, logo and CIVS scaffold
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/images/reports/nt2.webp
          node scripts/sync-report-covers.mjs
          node scripts/sync-company-logos.mjs
          node scripts/ensure-company-visual-candidates.mjs

      - name: Run full tests and audits
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          node scripts/audit-report-covers.mjs
          node scripts/audit-company-logos.mjs
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends imagemagick >/dev/null
          fi
          node scripts/audit-company-visuals.mjs
          git diff --exit-code -- src/index.css src/styles
          node <<'NODE'
          const fs=require("node:fs");
          const before=fs.readFileSync("/tmp/index-before.html","utf8");
          const after=fs.readFileSync("index.html","utf8");
          const restored=after
            .replace('data-role="report-tab-count">136</span>','data-role="report-tab-count">135</span>')
            .replace('data-role="coverage-tab-count">136</span>','data-role="coverage-tab-count">135</span>');
          if(restored!==before) throw new Error("HTML changed beyond two numeric counters");
          NODE

      - name: Guard scope, remove temporary files and commit atomically
        shell: bash
        run: |
          set -euo pipefail
          trigger_sha="${GITHUB_SHA}"
          rm -f .github/workflows/tmp-import-nt2-2026-11-18.yml
          rm -f .github/workflows/tmp-import-nt2-2026-11-18.mjs

          allowed='^(\.github/workflows/tmp-import-nt2-2026-11-18\.(yml|mjs)|index\.html|src/data/(research-data|company-logos|company-visuals)\.js|src/data/company-visual-candidates\.json|scripts/(sync-company-visuals|sync-company-visuals-core|audit-company-visuals-core|ensure-company-visual-candidates)\.mjs|tests/(company-visuals|civs-fetch-fallback)\.test\.mjs|docs/company-identity-visual-standard\.md|reports/NT2_2026-11-18\.pdf|assets/images/reports/nt2\.webp|assets/images/logos/nt2\.svg)$'
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //')"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed paths; refusing commit:" >&2
            echo "$unexpected" >&2
            exit 2
          fi

          test -s reports/NT2_2026-11-18.pdf
          test -s assets/images/reports/nt2.webp
          test -s assets/images/logos/nt2.svg
          echo "1ec7a5a4dcc66dcba898afbb155710aae9f49e8f02e1a1d78afe31d2ef333571  reports/NT2_2026-11-18.pdf" | sha256sum -c -

          git fetch origin main --quiet
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$trigger_sha" ]]; then
            echo "main advanced during guarded NT2 import; refusing stale write: trigger=$trigger_sha remote=$remote_sha" >&2
            exit 3
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add NT2 18 Nov 2026 valuation and expand coverage universe to 136"
          git push origin HEAD:main
