name: Temporary valuation import FPT DPG VSC SZC 2026-11-02

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-valuation-import-fpt-dpg-vsc-szc-2026-11-02.yml"

permissions:
  contents: write

concurrency:
  group: tmp-valuation-import-fpt-dpg-vsc-szc-2026-11-02
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact triggering main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download and byte-verify four uploaded valuation PDFs
        shell: bash
        env:
          FIRE_API: "https://api.firestorage.ai/dev/file"
          SHARE_ID: "S7oxjTvkniob"
        run: |
          set -euo pipefail
          listing="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL "${FIRE_API}/shares/${SHARE_ID}/files?maxResults=1000")"

          download_one() {
            local wanted="$1" output="$2" expected_sha="$3" expected_size="$4" expected_pages="$5"
            local file_id payload url
            file_id="$(printf '%s' "$listing" | python3 -c 'import json,sys; w=sys.argv[1]; d=json.load(sys.stdin); m=[f for f in d.get("files",[]) if f.get("fileName")==w or f.get("name")==w]; assert len(m)==1, (w,len(m)); print(m[0].get("fileId") or m[0].get("id"))' "$wanted")"
            payload="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL -X POST "${FIRE_API}/shares/${SHARE_ID}/files/$file_id/download")"
            url="$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')"
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSL "$url" -o "$output"
            test "$(wc -c < "$output" | tr -d ' ')" = "$expected_size"
            echo "$expected_sha  $output" | sha256sum -c -
            test "$(head -c 5 "$output")" = "%PDF-"
            command -v pdfinfo >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null; }
            test "$(pdfinfo "$output" | awk '/^Pages:/ {print $2}')" = "$expected_pages"
          }

          download_one "FPT_2026-11-02.pdf" "reports/FPT_2026-11-02.pdf" "5a360b829d9b57e41e9536c1ea920cda7989f3f03bc1a6e2aaee9285917fe635" "576333" "24"
          download_one "DPG_2026-10-27.pdf" "reports/DPG_2026-10-27.pdf" "87d34894af929a295eaee551e07f4a223c0a702cbfc7342aada31e008dd97057" "381605" "16"
          download_one "VSC_2026-10-27.pdf" "reports/VSC_2026-10-27.pdf" "014a066e8a5fac91edcbe4b9193f2731a2a2469cbd253aec73f7dc3ac7f2157f" "1043681" "28"
          download_one "SZC_2026-10-27.pdf" "reports/SZC_2026-10-27.pdf" "a6e2cd0e7368aee3b95f827be3d3f9b4c94af270efb16508ab94dea4fe991ba3" "517926" "25"

          rm -f \
            reports/FPT_2026-08-17.pdf \
            reports/DPG_2026-08-28.pdf \
            reports/VSC_Equity_Research_2026-08-07.pdf \
            reports/SZC_2026-08-28.pdf

      - name: Replace valuation registry latest-only without changing universe or layout
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("node:fs"),vm=require("node:vm");
          const p="src/data/research-data.js";
          const s={window:{}};
          vm.runInNewContext(fs.readFileSync(p,"utf8"),s,{filename:p});
          const d=s.window.RESEARCH_DATA;
          if(!d||!Array.isArray(d.reports)||!Array.isArray(d.coverage)) throw new Error("RESEARCH_DATA invalid");
          if(d.reports.filter(r=>r.reportType!=="trading").length!==133||d.coverage.length!==133) throw new Error("Universe must remain 133");

          const targetSet=new Set(["FPT","DPG","VSC","SZC"]);
          const current=d.reports.filter(r=>r.reportType!=="trading"&&targetSet.has(String(r.ticker||"").toUpperCase()));
          if(current.length!==4) throw new Error("Expected exactly four existing target valuation reports");
          const old=Object.fromEntries(current.map(r=>[String(r.ticker).toUpperCase(),r]));
          const expectedOld={
            FPT:{id:"FPT-20260817",date:"2026-08-17",file:"reports/FPT_2026-08-17.pdf"},
            DPG:{id:"DPG-20260828",date:"2026-08-28",file:"reports/DPG_2026-08-28.pdf"},
            VSC:{id:"VSC-20260807",date:"2026-08-07",file:"reports/VSC_Equity_Research_2026-08-07.pdf"},
            SZC:{id:"SZC-20260828",date:"2026-08-28",file:"reports/SZC_2026-08-28.pdf"}
          };
          for(const [t,e] of Object.entries(expectedOld)){
            const r=old[t];
            if(!r||r.id!==e.id||r.date!==e.date||r.file!==e.file) throw new Error(t+": baseline drift; refusing replacement");
          }

          const mkVisual=(ticker,date,file)=>({
            src:"assets/images/reports/"+ticker.toLowerCase()+".webp?v="+date.replaceAll("-","")+"-cover1",
            alt:"Trang bìa báo cáo định giá "+ticker+" ngày "+date.split("-").reverse().join("/"),
            caption:"Bìa báo cáo định giá "+ticker,
            sourceLabel:"Xuân Lê TVS Equity Research",
            sourceUrl:file,
            kind:"report-cover"
          });
          const identity=(ticker)=>({
            company:old[ticker].company,
            sector:old[ticker].sector,
            exchange:old[ticker].exchange
          });

          const replacements=[
            {
              id:"FPT-20261102",ticker:"FPT",...identity("FPT"),date:"2026-11-02",
              recommendation:"THEO DÕI / CHỜ",status:"wait",
              marketPrice:52700,marketPriceDate:"2026-10-30",
              baseValue:68000,valueLabel:"Giá trị kỳ vọng thăm dò",rangeLow:50100,rangeHigh:85900,
              gapLabel:"P0 52.700 đồng/cp thấp hơn GTKV thăm dò 68.000 đồng/cp khoảng 22,5%; tín hiệu định giá mô phỏng THEO DÕI nhưng giao dịch 1-3 tuần vẫn CHỜ vì cổng dữ liệu chưa đạt và giá dưới MA20.",
              method:"PP-01 DCF và PP-16 P/E, minh họa trọng số cơ học 50/50; PP-14 chưa đủ dữ liệu độc lập, PP-18 kiểm chứng trọng số 0",
              summary:"FPT có dải mô phỏng 50.100-85.900 đồng/cp và GTKV thăm dò 68.000 đồng/cp. Báo cáo tự đánh dấu độ tin cậy THẤP, cổng dữ liệu chưa đạt và kỹ thuật ngắn hạn dưới MA20; vì vậy trạng thái thực chiến 1-3 tuần là CHỜ, chưa xác lập vùng mua, stop hay mục tiêu.",
              action:{zoneLow:null,zoneHigh:null,baseValue:68000,stop:null,targets:[],basisDate:"2026-11-02",recommendation:"CHỜ - CHƯA XÁC LẬP VÙNG MUA",eligibility:"inactive",condition:"Chỉ xem xét nâng trạng thái khi giá vượt và giữ trên MA20/MA50, MA20 dốc lên, khối lượng xác nhận >=1,5x TB20, sức mạnh tương đối 20 phiên vượt VN-Index, nền giá rõ ràng, stop 3-7% và R/R mục tiêu 1 >=2. Hiện vùng mua, stop và mục tiêu chưa được xác lập."},
              file:"reports/FPT_2026-11-02.pdf",edition:"Bản định giá 02.11.2026"
            },
            {
              id:"DPG-20261027",ticker:"DPG",...identity("DPG"),date:"2026-10-27",
              recommendation:"CHỜ",status:"wait",
              marketPrice:30050,marketPriceDate:"2026-10-26",
              baseValue:32808,valueLabel:"Giá trị kỳ vọng tham khảo P/E",rangeLow:24572,rangeHigh:41257,
              gapLabel:"P0 30.050 đồng/cp thấp hơn GTKV tham khảo PP-16 32.808 đồng/cp khoảng 8,4%; cổng dữ liệu KHÔNG ĐẠT nên đây không phải L-GTKV-U chính thức.",
              method:"PP-16 P/E chỉ dùng tham khảo; PP-14 từng mảng, PP-12 thủy điện và PP-09 BĐS chưa đủ dữ liệu để chốt; PP-18 chưa tính",
              summary:"DPG là doanh nghiệp đa ngành và báo cáo mới chỉ có phép tham khảo P/E 24.572-41.257 đồng/cp, GTKV* 32.808 đồng/cp. Cổng dữ liệu chưa đạt, dòng tiền hoạt động 2025 âm và kỹ thuật chưa có xác nhận khối lượng; trạng thái 1-3 tuần là CHỜ.",
              action:{zoneLow:null,zoneHigh:null,baseValue:32808,stop:null,targets:[],basisDate:"2026-10-27",recommendation:"CHỜ - CHƯA PHÁT SINH LỆNH MUA",eligibility:"inactive",condition:"Không mua đuổi. Chỉ đánh giá lại khi giá vượt 31.250 đồng/cp với khối lượng >=1,5x VMA20, AmiBroker xác nhận MA20/MA50, sức mạnh tương đối và cấu trúc nền; nếu R/R <2 thì vẫn CHỜ. Ví dụ 31.250/29.500/33.000 trong báo cáo chỉ là kiểm tra bất lợi, không phải lệnh thực tế."},
              file:"reports/DPG_2026-10-27.pdf",edition:"Bản định giá 27.10.2026"
            },
            {
              id:"VSC-20261027",ticker:"VSC",...identity("VSC"),date:"2026-10-27",
              recommendation:"THẬN TRỌNG / CHỜ",status:"wait",
              marketPrice:14500,marketPriceDate:"2026-10-26",
              baseValue:13349,valueLabel:"Giá trị kỳ vọng",rangeLow:5591,rangeHigh:21264,
              gapLabel:"P0 14.500 đồng/cp cao hơn GTKV 13.349 đồng/cp khoảng 8,6%; tín hiệu định giá THẬN TRỌNG và giao dịch 1-3 tuần CHỜ.",
              method:"PP-14/PP-01 DCF theo mảng là mô hình chính; PP-16 EV/EBITDA dùng kiểm chứng; PP-18 kiểm chứng ngược trọng số 0",
              summary:"VSC có khoảng giá trị 5.591-21.264 đồng/cp và GTKV 13.349 đồng/cp, nhưng độ tin cậy THẤP. Đòn bẩy và CapEx tăng, phát hành thêm còn là biến trọng yếu; kỹ thuật chưa đủ MA50/RS20 và phiên 26/10 chỉ đạt 1,49x KLGD20, nên trạng thái là THẬN TRỌNG / CHỜ.",
              action:{zoneLow:null,zoneHigh:null,baseValue:13349,stop:null,targets:[],basisDate:"2026-10-27",recommendation:"CHỜ - CHƯA XÁC LẬP VÙNG MUA",eligibility:"inactive",condition:"Chưa xác lập vùng mua, stop hay mục tiêu. Chỉ xem xét nâng trạng thái khi đóng cửa vượt nền, trên MA20/MA50, MA20 đi lên, khối lượng >=1,5x TB20, hiệu suất vượt VN-Index 20 phiên và R/R >=2 với stop 3-7%. Nếu một điều kiện không đạt, tiếp tục CHỜ."},
              file:"reports/VSC_2026-10-27.pdf",edition:"Bản định giá 27.10.2026"
            },
            {
              id:"SZC-20261027",ticker:"SZC",...identity("SZC"),date:"2026-10-27",
              recommendation:"THEO DÕI / CHỜ",status:"wait",
              marketPrice:19800,marketPriceDate:"2026-10-26",
              baseValue:26000,valueLabel:"Giá trị kỳ vọng",rangeLow:14000,rangeHigh:36700,
              gapLabel:"P0 19.800 đồng/cp thấp hơn GTKV có điều kiện 26.000 đồng/cp khoảng 23,9%; tín hiệu định giá THEO DÕI nhưng giao dịch 1-3 tuần CHỜ vì cổng dữ liệu chưa đạt.",
              method:"PP-09 RNAV chính + PP-16 P/B kiểm chứng; trọng số tổng hợp RNAV 54,5% và P/B 45,5%; PP-18 trọng số 0",
              summary:"SZC có khoảng giá trị có điều kiện 14.000-36.700 đồng/cp và GTKV 26.000 đồng/cp. Quỹ đất, giá thuê và chi phí còn lại chưa được khóa đầy đủ; dù khối lượng 26/10 đạt 1,98x TB20, MA50 và sức mạnh tương đối chưa xác minh nên trạng thái 1-3 tuần vẫn CHỜ.",
              action:{zoneLow:null,zoneHigh:null,baseValue:26000,stop:null,targets:[],basisDate:"2026-10-27",recommendation:"CHỜ - CHƯA XÁC LẬP VÙNG MUA",eligibility:"inactive",condition:"Không ấn định vùng mua, stop hay mục tiêu khi chưa đủ xác nhận. Trên AmiBroker chỉ chuyển CÓ MUA khi giá trên MA20/MA50, MA20 dốc lên, khối lượng xác nhận >=1,5x TB20, sức mạnh tương đối vượt VN-Index 20 phiên, có nền/hỗ trợ rõ, stop 3-7% và R/R >=2. Mốc <=14.000 đồng/cp chỉ mở điều kiện theo dõi tích lũy có kiểm chứng, không tự động là lệnh mua."},
              file:"reports/SZC_2026-10-27.pdf",edition:"Bản định giá 27.10.2026"
            }
          ];
          for(const r of replacements) r.visual=mkVisual(r.ticker,r.date,r.file);

          d.reports=d.reports.filter(r=>!(r.reportType!=="trading"&&targetSet.has(String(r.ticker||"").toUpperCase()))).concat(replacements);
          d.reports.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||String(a.ticker||"").localeCompare(String(b.ticker||""))||String(a.reportType||"valuation").localeCompare(String(b.reportType||"valuation")));

          const byCoverage=new Map(d.coverage.map(c=>[String(c.ticker).toUpperCase(),c]));
          for(const r of replacements){
            const c=byCoverage.get(r.ticker);
            if(!c) throw new Error(r.ticker+": missing coverage row");
            c.reportId=r.id;
            c.action=structuredClone(r.action);
          }

          const vals=d.reports.filter(r=>r.reportType!=="trading");
          if(vals.length!==133||d.coverage.length!==133) throw new Error("Universe count changed");
          if(new Set(vals.map(r=>r.ticker)).size!==133||new Set(d.coverage.map(c=>c.ticker)).size!==133) throw new Error("Duplicate ticker invariant failed");
          for(const r of replacements){
            const rows=vals.filter(x=>x.ticker===r.ticker);
            const c=d.coverage.find(x=>x.ticker===r.ticker);
            if(rows.length!==1) throw new Error(r.ticker+": latest-only invariant failed");
            if(c.reportId!==r.id) throw new Error(r.ticker+": coverage reportId mismatch");
            if(c.action?.basisDate!==r.date||c.action?.eligibility!=="inactive") throw new Error(r.ticker+": action sync failed");
          }

          fs.writeFileSync(p,"window.RESEARCH_DATA = "+JSON.stringify(d,null,2)+";\n");
          console.log(JSON.stringify({
            replaced:Object.values(old).map(r=>({ticker:r.ticker,id:r.id,date:r.date,file:r.file})),
            current:replacements.map(r=>({ticker:r.ticker,id:r.id,date:r.date,file:r.file})),
            valuations:vals.length,coverage:d.coverage.length,metaUpdated:d.meta?.updated
          },null,2));
          NODE

      - name: Rebuild exactly four report covers from the new PDFs
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/images/reports/{fpt,dpg,vsc,szc}.webp
          node scripts/sync-report-covers.mjs

      - name: Run latest-only, site and full regression audits before any runtime commit
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/report-coverage-sync.test.mjs
          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          node scripts/audit-report-covers.mjs
          git diff --exit-code -- index.html src/index.css src/styles

      - name: Guard mutation scope, remove temporary workflow, commit and push atomically
        shell: bash
        run: |
          set -euo pipefail
          trigger_sha="${GITHUB_SHA}"
          rm -f ".github/workflows/tmp-valuation-import-fpt-dpg-vsc-szc-2026-11-02.yml"

          allowed='^(\.github/workflows/tmp-valuation-import-fpt-dpg-vsc-szc-2026-11-02\.yml|src/data/research-data\.js|reports/(FPT_2026-11-02|DPG_2026-10-27|VSC_2026-10-27|SZC_2026-10-27|FPT_2026-08-17|DPG_2026-08-28|VSC_Equity_Research_2026-08-07|SZC_2026-08-28)\.pdf|assets/images/reports/(fpt|dpg|vsc|szc)\.webp)$'
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //')"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed paths; refusing commit:" >&2
            echo "$unexpected" >&2
            exit 2
          fi

          for f in FPT_2026-11-02 DPG_2026-10-27 VSC_2026-10-27 SZC_2026-10-27; do
            test -s "reports/$f.pdf"
          done
          test ! -e reports/FPT_2026-08-17.pdf
          test ! -e reports/DPG_2026-08-28.pdf
          test ! -e reports/VSC_Equity_Research_2026-08-07.pdf
          test ! -e reports/SZC_2026-08-28.pdf

          git fetch origin main --quiet
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$trigger_sha" ]]; then
            echo "main advanced during guarded import; refusing stale write: trigger=$trigger_sha remote=$remote_sha" >&2
            exit 3
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update FPT DPG VSC SZC valuation reports latest-only"
          git push origin HEAD:main
