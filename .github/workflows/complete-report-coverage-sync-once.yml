name: Complete report coverage sync once

on:
  push:
    branches: [feature/report-coverage-sync-20260819]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Stage VNM payload 47/47'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/report-coverage-sync-20260819
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and verify VNM PDF
        run: |
          cat .tmp/vnm-final.b64.* | base64 -d | xz -d > reports/VNM_2026-08-19.pdf
          test "$(head -c 5 reports/VNM_2026-08-19.pdf)" = '%PDF-'
          test "$(pdfinfo reports/VNM_2026-08-19.pdf | awk '/^Pages:/ {print $2}')" = '14'
          echo '40bd8a2a6393ec9dca036dc4986d8b67bf3378a5a805cecab9111623de0457ae  reports/VNM_2026-08-19.pdf' | sha256sum -c -

      - name: Synchronize reports coverage and action metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const p='src/data/research-data.js';
          const code=fs.readFileSync(p,'utf8');
          const sandbox={window:{}};
          vm.runInNewContext(code,sandbox,{filename:p});
          const d=sandbox.window.RESEARCH_DATA;
          if(d?.meta?.updated!=='2026-08-19') throw new Error(`Expected meta.updated 2026-08-19, got ${d?.meta?.updated}`);
          const reports=d.reports||[];
          const coverage=d.coverage||[];
          const reportByTicker=new Map(reports.filter(r=>r.reportType!=='trading').map(r=>[r.ticker,r]));
          for(const ticker of ['BSI','MSB','PNJ','TCB','VIB']){
            const r=reportByTicker.get(ticker);
            if(!r || r.date!=='2026-08-19' || !r.action) throw new Error(`Missing locked 19/08 report/action for ${ticker}`);
          }
          if(reportByTicker.has('VNM')) throw new Error('VNM valuation report already exists; refusing duplicate');

          const visual={
            kind:'illustration',
            src:'assets/images/advisor-banner-3d-v2.webp?v=20260819-reports1',
            alt:'Nhận diện báo cáo định giá Xuân Lê TVS',
            caption:'Báo cáo định giá cổ phiếu',
            sourceLabel:'Xuân Lê TVS',
            sourceUrl:'https://sunflower1509.github.io/xuan-le-investment-research/'
          };
          const vnmAction={
            zoneLow:47600,
            zoneHigh:51000,
            baseValue:74264,
            stop:47500,
            targets:[68000,76500],
            basisDate:'2026-08-19',
            recommendation:'CÓ THỂ MUA KHI VÀO VÙNG MOS',
            eligibility:'active',
            condition:'IF giá 47.600–51.000 và thesis không xấu đi THEN có thể mua theo valuation, ưu tiên giải ngân từng phần. Nếu entry quanh 50.500, stoploss 47.500; target 68.000 và 76.500. Giá 63.100: CHỜ; 68.000–85.000 không có nâng EPS/FCFF: không mua mới; trên 85.000 không có nâng dự phóng: LOẠI/né mua mới.'
          };
          const vnmReport={
            id:'VNM-20260819', ticker:'VNM', company:'Công ty Cổ phần Sữa Việt Nam', sector:'Thực phẩm - đồ uống / Sữa', exchange:'HOSE', date:'2026-08-19',
            recommendation:'THEO DÕI / CHỜ', status:'wait', marketPrice:63100, marketPriceDate:'2026-08-19',
            baseValue:74264, valueLabel:'Giá trị kỳ vọng DCF', rangeLow:68000, rangeHigh:85000,
            gapLabel:'MOS 7,2% so với cận dưới; 17,5% so với midpoint; vùng mua MOS 25–30% là 47.600–51.000 đồng/cp',
            method:'DCF theo FCFF; P/E, EV/EBITDA và P/B dùng kiểm chứng',
            summary:'VNM có vùng giá trị hợp lý 68.000–85.000 đồng/cp, midpoint 76.500 đồng/cp và DCF strict-cash expected value 74.264 đồng/cp. Giá đóng cửa 19/08/2026 là 63.100 đồng/cp; trạng thái THEO DÕI / CHỜ vì MOS so với cận dưới mới 7,2%.',
            action:vnmAction, visual, file:'reports/VNM_2026-08-19.pdf', edition:'Bản định giá 19.08.2026'
          };
          reports.unshift(vnmReport);

          const quotes={
            BSI:{close:27650,changePct:-0.1805,volume:173800},
            MSB:{close:15550,changePct:-1.2698,volume:5179000},
            TCB:{close:31000,changePct:0.4862,volume:8372700},
            VIB:{close:14350,changePct:-0.3472,volume:2414700},
            VNM:{close:63100,changePct:1.6103,volume:4664900}
          };
          const reportNow=new Map(reports.filter(r=>r.reportType!=='trading').map(r=>[r.ticker,r]));
          const makeCoverage=(ticker)=>{
            const r=reportNow.get(ticker); const q=quotes[ticker];
            if(!r||!r.action||!q) throw new Error(`Cannot build coverage ${ticker}`);
            const from=1787072400,to=1787158799;
            return {
              ticker,
              company:r.company,
              sector:r.sector,
              exchange:r.exchange,
              reportId:r.id,
              close:q.close,
              priceDate:'2026-08-19',
              changePct:q.changePct,
              volume:q.volume,
              priceSource:`https://api-finfo.vndirect.com.vn/v4/stock_prices?sort=date&q=code:${ticker}~date:2026-08-19&size=10`,
              priceSourceSecondary:`https://services.entrade.com.vn/chart-api/v2/ohlcs/stock?from=${from}&to=${to}&symbol=${ticker}&resolution=1D`,
              action:JSON.parse(JSON.stringify(r.action))
            };
          };
          const addTickers=['BSI','MSB','TCB','VIB','VNM'];
          const kept=coverage.filter(x=>!addTickers.includes(x.ticker));
          d.coverage=[...addTickers.map(makeCoverage),...kept];
          if(d.coverage.length!==52) throw new Error(`Expected 52 coverage rows, got ${d.coverage.length}`);
          if(new Set(d.coverage.map(x=>x.ticker)).size!==52) throw new Error('Duplicate coverage ticker after sync');
          if(reports.filter(r=>r.reportType!=='trading').length!==52 || new Set(reports.filter(r=>r.reportType!=='trading').map(r=>r.ticker)).size!==52) throw new Error('Valuation report set is not 52 unique tickers');
          d.meta.note='Giá đóng cửa, biến động và khối lượng khớp lệnh của 52/52 mã được khóa tại phiên 19/08/2026. Giá đóng cửa 52/52 mã khớp trực tiếp giữa VNDIRECT Finfo và DNSE EnTrade. Khối lượng khớp 51/52 mã giữa hai nguồn; SHS: VNDIRECT 6.248.600 vs DNSE 6.235.700 (chênh 12.900). Website dùng nmVolume từ VNDIRECT Finfo theo quy ước nguồn chính và không suy diễn nguyên nhân sai khác. Không dùng chuỗi giá lịch sử đã điều chỉnh; phần trăm biến động lấy từ dữ liệu phiên VNDIRECT. Vùng mua, fair value, target, stop, recommendation và điều kiện hành động được đồng bộ theo báo cáo định giá mới nhất.';
          fs.writeFileSync(p,`window.RESEARCH_DATA = ${JSON.stringify(d,null,2)};\n`);
          NODE

      - name: Initialize ledger baselines for newly covered tickers
        run: |
          node scripts/process-trade-ledger.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const l=JSON.parse(fs.readFileSync('src/data/trade-ledger.json','utf8'));
          for(const t of ['BSI','MSB','TCB','VIB','VNM']){
            const s=l.meta?.automation?.lastEvaluatedQuotes?.[t];
            if(!s || s.date!=='2026-08-19' || s.relation!=='above') throw new Error(`Bad initialized baseline ${t}: ${JSON.stringify(s)}`);
          }
          const newEvents=(l.events||[]).filter(e=>['BSI','MSB','TCB','VIB','VNM'].includes(e.ticker)&&e.date==='2026-08-19');
          if(newEvents.length) throw new Error(`New coverage must not create retroactive events: ${JSON.stringify(newEvents)}`);
          NODE

      - name: Add persistent report coverage synchronization test
        run: |
          cat > tests/report-coverage-sync.test.mjs <<'TEST'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';
          import { snapshotTriggerState } from '../src/scripts/action-trigger.mjs';

          const code=fs.readFileSync(new URL('../src/data/research-data.js',import.meta.url),'utf8');
          const sandbox={window:{}};
          vm.runInNewContext(code,sandbox);
          const data=sandbox.window.RESEARCH_DATA;
          const valuations=(data.reports||[]).filter(r=>r.reportType!=='trading');
          const coverage=data.coverage||[];
          const byTicker=new Map(coverage.map(x=>[x.ticker,x]));

          test('mỗi mã chỉ giữ một báo cáo định giá và phải có coverage tương ứng',()=>{
            assert.equal(new Set(valuations.map(r=>r.ticker)).size,valuations.length,'trùng mã định giá: phải giữ bản mới nhất duy nhất');
            assert.equal(new Set(coverage.map(c=>c.ticker)).size,coverage.length,'trùng mã coverage');
            assert.equal(coverage.length,valuations.length,'số mã coverage phải bằng số báo cáo định giá');
            for(const r of valuations){
              const c=byTicker.get(r.ticker);
              assert.ok(c,`${r.ticker} có báo cáo nhưng thiếu coverage`);
              assert.equal(c.reportId,r.id,`${r.ticker} reportId coverage không phải bản định giá đang công bố`);
              assert.equal(c.action?.basisDate,r.date,`${r.ticker} basisDate vùng hành động không trùng ngày báo cáo`);
              if(r.action){
                assert.deepEqual(snapshotTriggerState(c.action),snapshotTriggerState(r.action),`${r.ticker} vùng/ngưỡng hành động coverage lệch báo cáo`);
                if(Number.isFinite(r.action.baseValue)) assert.equal(c.action?.baseValue,r.action.baseValue,`${r.ticker} baseValue coverage lệch báo cáo`);
              }
            }
          });

          test('coverage không được tham chiếu báo cáo định giá đã bị thay thế hoặc không tồn tại',()=>{
            const ids=new Set(valuations.map(r=>r.id));
            for(const c of coverage) assert.ok(ids.has(c.reportId),`${c.ticker} tham chiếu reportId không tồn tại: ${c.reportId}`);
          });
          TEST

      - name: Regression tests build audit and priority verification
        run: |
          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm';
          import { evaluatePriorityCandidate, latestReportDates } from './src/scripts/priority-engine.mjs';
          const code=fs.readFileSync('src/data/research-data.js','utf8'); const s={window:{}}; vm.runInNewContext(code,s); const d=s.window.RESEARCH_DATA;
          const dates=latestReportDates(d.reports); const by=new Map(d.coverage.map(x=>[x.ticker,x]));
          for(const t of ['BSI','MSB','TCB','VIB','VNM']){
            const state=evaluatePriorityCandidate(by.get(t),{openTickers:new Set(['SHB']),reportDates:dates,asOfDate:d.meta.updated});
            if(!state.eligible) throw new Error(`${t} must be eligible in entry priority: ${state.reason}`);
          }
          const pnj=evaluatePriorityCandidate(by.get('PNJ'),{openTickers:new Set(['SHB']),reportDates:dates,asOfDate:d.meta.updated});
          if(pnj.eligible || pnj.reason!=='not-active') throw new Error('PNJ must remain manual/fail-closed, not automatic priority');
          NODE
          git diff --exit-code HEAD^ -- index.html src/index.css src/styles assets/css/site.min.css || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=fs.readFileSync('index.html','utf8');
          const order=[...h.matchAll(/<section\b[^>]*\bid=(['"])([^'"]+)\1[^>]*>/g)].map(m=>m[2]);
          const exp=['overview','daily-market','position-ledger','action-radar','research'];
          if(order.join(',')!==exp.join(',')) throw new Error(`section order changed: ${order}`);
          NODE

      - name: Clean staging artifacts and commit validated sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .tmp
          git rm .github/workflows/complete-report-coverage-sync-once.yml
          git add reports/VNM_2026-08-19.pdf src/data/research-data.js src/data/trade-ledger.json tests/report-coverage-sync.test.mjs assets/js/site.min.js
          git add -u .tmp || true
          git diff --cached --name-status
          git commit -m 'Synchronize latest valuations with priority coverage [skip ci]'
          git push origin HEAD:feature/report-coverage-sync-20260819
