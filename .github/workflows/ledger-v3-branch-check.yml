name: Ledger v3 branch verification

on:
  push:
    branches:
      - fix/ledger-buy-ceiling-v3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run all trigger and ledger tests
        run: node --test tests/*.test.mjs
      - name: Verify TCH migration evidence without writing
        run: node scripts/migrate-ledger-buy-ceiling-v3.mjs
      - name: Apply verified TCH migration idempotently
        run: node scripts/migrate-ledger-buy-ceiling-v3.mjs --apply
      - name: Validate migrated ledger without further mutation
        run: node scripts/process-trade-ledger.mjs --dry-run
      - name: Replay historical trigger audit after migration
        run: |
          node scripts/audit-ledger-trigger-history.mjs --report "${RUNNER_TEMP}/ledger-v3-history-audit.json"
          node -e 'const r=require(process.argv[1]); const summary={snapshotDates:r.snapshotDates,candidateCount:r.candidateCount,matched:r.matched,missing:r.missing,late:r.late,actualEarlier:r.actualEarlier,noCandidateForActual:r.noCandidateForActual,parseErrors:r.parseErrors}; console.log(JSON.stringify(summary,null,2)); if(r.parseErrors.length||r.missing.length||r.late.length||r.actualEarlier.length) process.exit(2);' "${RUNNER_TEMP}/ledger-v3-history-audit.json"
      - name: Upload historical audit
        uses: actions/upload-artifact@v4
        with:
          name: ledger-v3-history-audit
          path: ${{ runner.temp }}/ledger-v3-history-audit.json
      - name: Build production assets
        run: bash scripts/build/build-assets.sh
      - name: Audit site integrity
        run: node scripts/audit-site.mjs
      - name: Audit company-logo integrity
        run: node scripts/audit-company-logos.mjs
      - name: Assert public section structure unchanged
        shell: bash
        run: |
          set -euo pipefail
          actual="$(grep -oE '<section[^>]+id="[^"]+"' index.html | sed -E 's/.*id="([^"]+)"/\1/' | paste -sd, -)"
          expected="overview,daily-market,position-ledger,action-radar,research"
          test "$actual" = "$expected" || { echo "Section order changed: $actual" >&2; exit 2; }
      - name: Commit verified ledger migration to branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/trade-ledger.json; then
            echo "Ledger migration already committed; no write needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trade-ledger.json
          git commit -m "Backfill verified TCH buy-ceiling activation"
          git push origin HEAD:fix/ledger-buy-ceiling-v3
