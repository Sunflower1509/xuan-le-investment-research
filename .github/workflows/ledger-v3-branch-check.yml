name: Ledger v3 branch verification

on:
  push:
    branches:
      - fix/ledger-buy-ceiling-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run all trigger and ledger tests
        run: node --test tests/*.test.mjs
      - name: Validate current ledger without mutation
        run: node scripts/process-trade-ledger.mjs --dry-run
      - name: Replay historical trigger audit
        run: |
          node scripts/audit-ledger-trigger-history.mjs --report "${RUNNER_TEMP}/ledger-v3-history-audit.json"
          node -e 'const r=require(process.argv[1]); console.log(JSON.stringify({snapshotDates:r.snapshotDates,candidateCount:r.candidateCount,matched:r.matched,missing:r.missing,late:r.late,actualEarlier:r.actualEarlier,noCandidateForActual:r.noCandidateForActual,parseErrors:r.parseErrors},null,2))' "${RUNNER_TEMP}/ledger-v3-history-audit.json"
      - name: Inspect exact TCH backfill evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const code = fs.readFileSync('src/data/research-data.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(code, sandbox);
          const source = sandbox.window.RESEARCH_DATA;
          const item = source.coverage.find((row) => row.ticker === 'TCH');
          const report = source.reports
            .filter((row) => row.ticker === 'TCH')
            .sort((a, b) => b.date.localeCompare(a.date))[0] || null;
          console.log(JSON.stringify({ item, report: report ? { id: report.id, date: report.date, file: report.file, recommendation: report.recommendation } : null }, null, 2));
          NODE
      - name: Upload historical audit
        uses: actions/upload-artifact@v4
        with:
          name: ledger-v3-history-audit
          path: ${{ runner.temp }}/ledger-v3-history-audit.json
      - name: Build production assets
        run: bash scripts/build/build-assets.sh
      - name: Audit site integrity
        run: node scripts/audit-site.mjs
      - name: Audit company-logo integrity
        run: node scripts/audit-company-logos.mjs
      - name: Assert public section structure unchanged
        shell: bash
        run: |
          set -euo pipefail
          actual="$(grep -oE '<section[^>]+id="[^"]+"' index.html | sed -E 's/.*id="([^"]+)"/\1/' | paste -sd, -)"
          expected="overview,daily-market,position-ledger,action-radar,research"
          test "$actual" = "$expected" || { echo "Section order changed: $actual" >&2; exit 2; }
