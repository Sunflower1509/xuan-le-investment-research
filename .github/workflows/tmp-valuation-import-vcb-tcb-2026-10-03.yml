name: Temporary VCB TCB valuation import 2026-10-03

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-valuation-import-vcb-tcb-2026-10-03.yml"

permissions:
  contents: write

concurrency:
  group: tmp-valuation-import-vcb-tcb-2026-10-03
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download and verify valuation PDFs
        shell: bash
        env:
          FIRE_API: "https://api.firestorage.ai/dev/file"
          SHARE_ID: "ARHDl-e9Pq71"
        run: |
          set -euo pipefail
          listing="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL "${FIRE_API}/shares/${SHARE_ID}/files?maxResults=1000")"

          download_one() {
            local wanted="$1" output="$2" expected_sha="$3" expected_size="$4"
            local file_id payload url
            file_id="$(printf '%s' "$listing" | python3 -c 'import json,sys; w=sys.argv[1]; d=json.load(sys.stdin); m=[f for f in d.get("files",[]) if f.get("fileName")==w or f.get("name")==w]; assert len(m)==1, (w,len(m)); print(m[0].get("fileId") or m[0].get("id"))' "$wanted")"
            payload="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL -X POST "${FIRE_API}/shares/${SHARE_ID}/files/$file_id/download")"
            url="$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')"
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSL "$url" -o "$output"
            test "$(wc -c < "$output" | tr -d ' ')" = "$expected_size"
            echo "$expected_sha  $output" | sha256sum -c -
            test "$(head -c 5 "$output")" = "%PDF-"
          }

          download_one "VCB_2026-10-03.pdf" "reports/VCB_2026-10-03.pdf" "e20c76e79b4c965b749711b90b1fbee6da6b6307330eb60422cdec3595e74b5b" "421180"
          download_one "TCB_2026-10-03.pdf" "reports/TCB_2026-10-03.pdf" "5798f8e5816ee93fdf04965b398ebc7ff5e313a7529b7904f58a86ba9daeaec9" "531946"

          rm -f reports/TCB_2026-08-19.pdf reports/VCB_Bao_cao_dinh_gia_Xuan_Le_TVS.pdf

      - name: Replace VCB and TCB valuation registry latest-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("node:fs"),vm=require("node:vm");
          const dataPath="src/data/research-data.js";
          const s={window:{}};
          vm.runInNewContext(fs.readFileSync(dataPath,"utf8"),s,{filename:dataPath});
          const data=s.window.RESEARCH_DATA;
          const targetSet=new Set(["VCB","TCB"]);
          const expectedDates={VCB:"2026-10-03",TCB:"2026-10-03"};
          const old=(data.reports||[]).filter(r=>r.reportType!=="trading"&&targetSet.has(String(r.ticker||"").toUpperCase()));
          if(old.length!==2) throw new Error("Expected exactly two current VCB/TCB valuation reports, got "+old.length);
          for(const r of old){
            if(String(r.date||"")>expectedDates[r.ticker]) throw new Error(r.ticker+": newer report already exists: "+r.date);
          }
          if(data.meta?.updated!=="2026-10-02") throw new Error("EOD snapshot drifted; expected 2026-10-02, got "+data.meta?.updated);

          const mkVisual=(ticker,date,file)=>({
            src:"assets/images/reports/"+ticker.toLowerCase()+".webp?v="+date.replaceAll("-","")+"-cover1",
            alt:"Trang bìa báo cáo định giá "+ticker+" ngày "+date.split("-").reverse().join("/"),
            caption:"Bìa báo cáo định giá "+ticker,
            sourceLabel:"Xuân Lê TVS Equity Research",
            sourceUrl:file,
            kind:"report-cover"
          });

          const reports=[
            {
              id:"VCB-20261003",
              ticker:"VCB",
              company:"Ngân hàng TMCP Ngoại thương Việt Nam",
              sector:"Ngân hàng",
              exchange:"HOSE",
              date:"2026-10-03",
              recommendation:"THEO DÕI / CHỜ",
              status:"wait",
              marketPrice:57100,
              marketPriceDate:"2026-10-02",
              baseValue:63834,
              valueLabel:"Giá trị kỳ vọng",
              rangeLow:46441,
              rangeHigh:80503,
              gapLabel:"P0 57.100 đồng/cp thấp hơn GTKV 63.834 đồng/cp khoảng 10,5% nhưng chưa đạt ngưỡng mua M 46.441 đồng/cp; tín hiệu định giá là THEO DÕI.",
              method:"PP-06 Thu nhập thặng dư 33% + PP-07 P/B hợp lý theo ROE 39% + PP-16 P/B tương đối 28%; PP-18 trọng số 0",
              summary:"VCB có vùng giá trị 46.441-80.503 đồng/cp và GTKV 63.834 đồng/cp. Chất lượng tài sản duy trì tốt nhưng P0 mới có biên an toàn 10,5%; giá dưới MA20/MA50 và chưa có xác nhận khối lượng, vì vậy trạng thái giao dịch 1-3 tuần là CHỜ.",
              action:{
                zoneLow:null,zoneHigh:null,baseValue:63834,stop:null,targets:[],
                basisDate:"2026-10-03",
                recommendation:"CHỜ - CHƯA CÓ ĐIỂM MUA HỢP LỆ",
                eligibility:"inactive",
                condition:"Chỉ IF giá vượt và giữ trên khoảng 58.800 đồng/cp với khối lượng >=1,5x TB20, sức mạnh tương đối 20 phiên tốt hơn VN-Index và sau đó hình thành điểm mua có stop 3-7% với R/R >=2 THEN mới chuyển sang đánh giá CÓ MUA. Nếu không thỏa đồng thời các điều kiện này thì tiếp tục CHỜ; không đặt stop/target giả tạo khi chưa có điểm mua hợp lệ."
              },
              file:"reports/VCB_2026-10-03.pdf",
              edition:"Bản định giá 03.10.2026"
            },
            {
              id:"TCB-20261003",
              ticker:"TCB",
              company:"Ngân hàng TMCP Kỹ Thương Việt Nam",
              sector:"Ngân hàng",
              exchange:"HOSE",
              date:"2026-10-03",
              recommendation:"THEO DÕI / CHỜ",
              status:"wait",
              marketPrice:32250,
              marketPriceDate:"2026-10-02",
              baseValue:35187,
              valueLabel:"Giá trị kỳ vọng",
              rangeLow:30253,
              rangeHigh:42788,
              gapLabel:"P0 32.250 đồng/cp thấp hơn GTKV 35.187 đồng/cp khoảng 8,3% nhưng chưa đạt ngưỡng mua M 26.390 đồng/cp; tín hiệu định giá là THEO DÕI.",
              method:"PP-06 Thu nhập thặng dư 28,57% + PP-14 theo từng mảng 25% + PP-07 P/B hợp lý theo ROE 25% + PP-16 P/B tương đối 21,43%; PP-18 trọng số 0",
              summary:"TCB có vùng giá trị 30.253-42.788 đồng/cp và GTKV 35.187 đồng/cp. Nền tảng tài chính tốt nhưng NIM còn cần theo dõi; giá dưới MA20/MA50 và khối lượng chỉ khoảng 0,94x TB20, nên trạng thái giao dịch 1-3 tuần là CHỜ.",
              action:{
                zoneLow:31900,zoneHigh:32100,baseValue:35187,stop:30845,targets:[32408,33450],
                basisDate:"2026-10-03",
                recommendation:"CHỜ - VÙNG GIẢ ĐỊNH CHƯA KÍCH HOẠT",
                eligibility:"inactive",
                condition:"Vùng 31.900-32.100 đồng/cp chỉ dùng để kiểm tra R/R, chưa phải điểm mua. Tại 32.100, stop 30.845 cách khoảng 3,9% nhưng R/R tới mục tiêu gần 32.408 chỉ khoảng 0,25 <2 nên tiếp tục CHỜ. Chỉ nâng lên CÓ MUA khi tín hiệu định giá vẫn MUA/THEO DÕI, giá đứng trên MA20 và MA50, khối lượng xác nhận >=1,5x TB20, stop 3-7% và R/R tới kháng cự gần nhất >=2."
              },
              file:"reports/TCB_2026-10-03.pdf",
              edition:"Bản định giá 03.10.2026"
            }
          ];
          for(const r of reports) r.visual=mkVisual(r.ticker,r.date,r.file);

          data.reports=(data.reports||[]).filter(r=>!(r.reportType!=="trading"&&targetSet.has(String(r.ticker||"").toUpperCase()))).concat(reports);
          data.reports.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||String(a.ticker||"").localeCompare(String(b.ticker||""))||String(a.reportType||"valuation").localeCompare(String(b.reportType||"valuation")));

          for(const r of reports){
            const c=data.coverage.find(x=>x.ticker===r.ticker);
            if(!c) throw new Error(r.ticker+": coverage missing");
            if(c.priceDate!=="2026-10-02") throw new Error(r.ticker+": priceDate drifted");
            if(Number(c.close)!==Number(r.marketPrice)) throw new Error(r.ticker+": EOD close mismatch report P0");
            c.company=r.company;
            c.sector=r.sector;
            c.exchange=r.exchange;
            c.reportId=r.id;
            c.action=structuredClone(r.action);
          }

          const vals=data.reports.filter(r=>r.reportType!=="trading");
          if(vals.length!==131||data.coverage.length!==131) throw new Error("Universe count must remain 131");
          if(new Set(vals.map(r=>r.ticker)).size!==131||new Set(data.coverage.map(c=>c.ticker)).size!==131) throw new Error("Duplicate ticker invariant failed");
          for(const r of reports){
            const rows=vals.filter(x=>x.ticker===r.ticker);
            const c=data.coverage.find(x=>x.ticker===r.ticker);
            if(rows.length!==1) throw new Error(r.ticker+": latest-only invariant failed");
            if(c.reportId!==r.id||c.action?.basisDate!==r.date||c.action?.eligibility!==r.action.eligibility) throw new Error(r.ticker+": report/coverage action sync failed");
          }
          if((data.coverage||[]).some(c=>c.priceDate!==data.meta.updated)) throw new Error("Coverage priceDate drift from meta.updated");

          const note=" Báo cáo định giá VCB và TCB đã được thay bằng bản 03/10/2026; bản định giá cũ tương ứng được loại theo quy tắc latest-only. Registry, action plan và ảnh bìa được đồng bộ theo báo cáo mới; dữ liệu EOD 02/10/2026 được giữ nguyên. Không thay đổi bố cục, cấu trúc section, HTML/CSS hay script giao diện.";
          data.meta=data.meta||{};
          if(typeof data.meta.note!=="string") data.meta.note="";
          if(!data.meta.note.includes("Báo cáo định giá VCB và TCB đã được thay bằng bản 03/10/2026")) data.meta.note=data.meta.note.trim()+note;

          fs.writeFileSync(dataPath,"window.RESEARCH_DATA = "+JSON.stringify(data,null,2)+";\n");
          console.log(JSON.stringify({old:old.map(r=>({ticker:r.ticker,id:r.id,date:r.date,file:r.file})),current:reports.map(r=>({ticker:r.ticker,id:r.id,date:r.date,file:r.file}))},null,2));
          NODE

      - name: Regenerate VCB TCB report covers and validate repository
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/images/reports/vcb.webp assets/images/reports/tcb.webp
          node scripts/sync-report-covers.mjs

          command -v pdfinfo >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null; }
          test "$(pdfinfo reports/VCB_2026-10-03.pdf | awk '/^Pages:/ {print $2}')" = "14"
          test "$(pdfinfo reports/TCB_2026-10-03.pdf | awk '/^Pages:/ {print $2}')" = "19"
          test ! -e reports/TCB_2026-08-19.pdf
          test ! -e reports/VCB_Bao_cao_dinh_gia_Xuan_Le_TVS.pdf

          node --test $(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'repository-governance.test.mjs' -print | sort)
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          node scripts/audit-report-covers.mjs
          node scripts/audit-company-logos.mjs

          layout_changes="$(git status --porcelain --untracked-files=all -- index.html src/index.css src/styles src/scripts)"
          test -z "$layout_changes"

          node <<'NODE'
          const fs=require("node:fs"),vm=require("node:vm");
          const s={window:{}}; vm.runInNewContext(fs.readFileSync("src/data/research-data.js","utf8"),s);
          const d=s.window.RESEARCH_DATA;
          const vals=d.reports.filter(r=>r.reportType!=="trading");
          const expected={VCB:"reports/VCB_2026-10-03.pdf",TCB:"reports/TCB_2026-10-03.pdf"};
          for(const t of Object.keys(expected)){
            const rows=vals.filter(r=>r.ticker===t);
            if(rows.length!==1||rows[0].file!==expected[t]) throw new Error(t+": latest-only registry mismatch");
            if(!fs.existsSync(expected[t])) throw new Error(t+": expected PDF missing");
            const c=d.coverage.find(x=>x.ticker===t);
            if(!c||c.reportId!==rows[0].id||c.action?.basisDate!==rows[0].date) throw new Error(t+": coverage registry mismatch");
          }
          const ledger=JSON.parse(fs.readFileSync("src/data/trade-ledger.json","utf8"));
          for(const e of ledger.events||[]){
            if(typeof e.reportFile==="string"&&e.reportFile&&!fs.existsSync(e.reportFile)) throw new Error("Broken historical reportFile: "+e.reportFile);
          }
          console.log(JSON.stringify({valuations:vals.length,coverage:d.coverage.length,latestOnly:true,brokenLedgerRefs:0},null,2));
          NODE

      - name: Commit VCB TCB update atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A --             reports/VCB_2026-10-03.pdf reports/VCB_Bao_cao_dinh_gia_Xuan_Le_TVS.pdf             reports/TCB_2026-10-03.pdf reports/TCB_2026-08-19.pdf             assets/images/reports/vcb.webp assets/images/reports/tcb.webp             src/data/research-data.js

          git diff --cached --quiet && { echo "No valuation changes to commit" >&2; exit 3; }
          if git diff --cached --name-only | grep -Eq '^(index\.html|src/index\.css|src/styles/|src/scripts/)'; then
            echo "Refusing to commit any public layout/structure change" >&2
            git diff --cached --name-only
            exit 2
          fi
          git diff --cached --name-status
          git commit -m "Publish VCB and TCB valuation reports for 03 Oct 2026"
          git push origin HEAD:main

      - name: Remove temporary workflow after successful import
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git reset --hard origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-valuation-import-vcb-tcb-2026-10-03.yml
          git commit -m "Remove temporary VCB TCB valuation import workflow [skip ci]"
          git push origin HEAD:main
