name: One-time EOD recovery 2026-09-16

on:
  push:
    paths:
      - ".github/workflows/eod-recovery-20260916.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Inject independently verified 16 Sep close overrides in runner only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'scripts/update-eod-market-data.mjs';
          let code = fs.readFileSync(path, 'utf8');
          if (!code.includes('"2026-09-16": Object.freeze')) {
            const needle = '\n  })\n});\n\nconst argValue';
            if (!code.includes(needle)) throw new Error('Could not locate override insertion point');
            const block = `\n  }),\n  "2026-09-16": Object.freeze({\n    MSR: Object.freeze({\n      close: 47100,\n      source: "https://kbbuddywts.kbsec.com.vn/iis-server/investment/stocks/MSR/data_day?sdate=16-09-2026&edate=16-09-2026",\n      reason: "CafeF 16/09 trả 47.000; KBS date-specific xác nhận OHLC 48.0/48.0/46.8/47.1, khối lượng 1.093.300, giá đóng cửa 47.100, trùng VNDIRECT."\n    }),\n    OIL: Object.freeze({\n      close: 15000,\n      source: "https://kbbuddywts.kbsec.com.vn/iis-server/investment/stocks/OIL/data_day?sdate=16-09-2026&edate=16-09-2026",\n      reason: "CafeF 16/09 trả 14.900; KBS date-specific xác nhận OHLC 14.8/15.5/14.6/15.0, khối lượng 5.316.100, giá đóng cửa 15.000, trùng VNDIRECT."\n    })\n  })\n});\n\nconst argValue`;
            code = code.replace(needle, block);
            fs.writeFileSync(path, code);
          }
          NODE

      - name: Cross-check and lock coverage EOD
        shell: bash
        run: node scripts/update-eod-market-data.mjs --date 2026-09-16 --max-attempts 1 --wait-ms 0

      - name: Lock VNINDEX VN30 HNX and HOSE breadth
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const date = '2026-09-16';
          const path = 'src/data/research-data.js';
          const code = fs.readFileSync(path, 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(code, sandbox, { filename: path });
          const data = sandbox.window.RESEARCH_DATA;
          if (data?.meta?.updated !== date) throw new Error(`Coverage date not locked: ${data?.meta?.updated}`);
          if (!Array.isArray(data.coverage) || !data.coverage.length || data.coverage.some((item) => item.priceDate !== date)) throw new Error('Coverage not fully current');
          const url = `https://api-finfo.vndirect.com.vn/v4/vnmarket_prices?sort=code&q=date:${date}&size=500`;
          const response = await fetch(url, { headers: { accept: 'application/json', 'user-agent': 'XuanLeTVS-EOD-Recovery/1.0' }, signal: AbortSignal.timeout(20000) });
          if (!response.ok) throw new Error(`VNDIRECT HTTP ${response.status}`);
          const payload = await response.json();
          const rows = Array.isArray(payload?.data) ? payload.data : [];
          const finite = (v) => Number.isFinite(Number(v)) ? Number(v) : null;
          const key = (row) => String(row?.code || row?.indexCode || row?.symbol || '').toUpperCase();
          const find = (aliases) => rows.find((row) => aliases.includes(key(row)));
          const parseIndex = (row, label) => {
            if (!row) throw new Error(`Missing ${label}`);
            const close = finite(row.close ?? row.index ?? row.value);
            const change = finite(row.change ?? row.changeValue);
            const changePct = finite(row.pctChange ?? row.changePct ?? row.percentChange);
            if (close === null || change === null || changePct === null) throw new Error(`Incomplete ${label}`);
            return { code: label, close, change, changePct };
          };
          const vn = find(['VNINDEX','VN-INDEX','HOSE']);
          const vn30 = find(['VN30','VN30-INDEX']);
          const hnx = find(['HNX','HNXINDEX','HNX-INDEX']);
          const advance = finite(vn?.nmAdvances ?? vn?.advances ?? vn?.advance ?? vn?.up);
          const unchanged = finite(vn?.nmNoChange ?? vn?.noChange ?? vn?.unchanged ?? vn?.reference);
          const decline = finite(vn?.nmDeclines ?? vn?.declines ?? vn?.decline ?? vn?.down);
          const floor = finite(vn?.nmFloors ?? vn?.floorStocks ?? vn?.floors ?? vn?.floor);
          if ([advance, unchanged, decline, floor].some((v) => v === null)) throw new Error('HOSE breadth unavailable');
          data.marketSession = {
            date,
            status: 'Đã khóa EOD — VNDIRECT Finfo + KBS cross-check',
            indices: [parseIndex(vn,'VN-INDEX'), parseIndex(vn30,'VN30'), parseIndex(hnx,'HNX-INDEX')],
            breadth: { advance, unchanged, decline, floor },
            sources: [
              { label: 'VNDIRECT Finfo — chỉ số & độ rộng EOD 16/09/2026', url },
              { label: 'KBS — MSR EOD 16/09/2026', url: 'https://kbbuddywts.kbsec.com.vn/iis-server/investment/stocks/MSR/data_day?sdate=16-09-2026&edate=16-09-2026' },
              { label: 'KBS — OIL EOD 16/09/2026', url: 'https://kbbuddywts.kbsec.com.vn/iis-server/investment/stocks/OIL/data_day?sdate=16-09-2026&edate=16-09-2026' }
            ]
          };
          fs.writeFileSync(path, `window.RESEARCH_DATA = ${JSON.stringify(data, null, 2)};\n`);
          console.log('RECOVERY_MARKET_SESSION', JSON.stringify(data.marketSession));
          NODE

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Commit verified recovered EOD data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/research-data.js
          git diff --cached --exit-code && { echo 'No EOD changes to commit'; exit 0; } || true
          git commit -m "Lock verified EOD market data 2026-09-16"
          git push origin HEAD:main
