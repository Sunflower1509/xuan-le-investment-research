name: XSMB Settlement Fetch 2026-09-21

on:
  push:
    branches: ["xsmb-v2.1-python312-runtime"]
    paths:
      - ".github/workflows/xsmb-settlement-fetch-20260921.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Fetch independent source pages
        run: |
          mkdir -p evidence-raw
          curl -fL --retry 3 -A "Mozilla/5.0"             "https://www.minhngoc.net/ket-qua-xo-so/mien-bac/21-09-2026.html"             -o evidence-raw/minhngoc.html
          curl -fL --retry 3 -A "Mozilla/5.0"             "https://www.xosodaiphat.net/xo-so-mien-bac-ngay-21-09-2026.html"             -o evidence-raw/xosodaiphat.html
          curl -fL --retry 3 -A "Mozilla/5.0"             "https://xskt.com.vn/xsmb/ngay-21-9"             -o evidence-raw/xskt.html
          sha256sum evidence-raw/* | tee evidence-raw/SHA256SUMS.txt

      - name: Upload raw settlement evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xsmb-settlement-raw-20260921
          path: evidence-raw/
          if-no-files-found: error
          retention-days: 90
