name: Temporary valuation import GMD POW 2026-11-16

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-valuation-import-gmd-pow-2026-11-16.yml"

permissions:
  contents: write

concurrency:
  group: tmp-valuation-import-gmd-pow-2026-11-16
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact triggering main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download and byte-verify GMD and POW PDFs
        shell: bash
        env:
          FIRE_API: "https://api.firestorage.ai/dev/file"
        run: |
          set -euo pipefail

          download_one() {
            local share_id="$1" wanted="$2" output="$3" expected_sha="$4" expected_size="$5" expected_pages="$6"
            local listing file_id payload url
            listing="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL "${FIRE_API}/shares/${share_id}/files?maxResults=1000")"
            file_id="$(printf '%s' "$listing" | python3 -c 'import json,sys; w=sys.argv[1]; d=json.load(sys.stdin); m=[f for f in d.get("files",[]) if f.get("fileName")==w or f.get("name")==w]; assert len(m)==1,(w,len(m)); print(m[0].get("fileId") or m[0].get("id"))' "$wanted")"
            payload="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL -X POST "${FIRE_API}/shares/${share_id}/files/$file_id/download")"
            url="$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')"
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSL "$url" -o "$output"
            test "$(wc -c < "$output" | tr -d ' ')" = "$expected_size"
            echo "$expected_sha  $output" | sha256sum -c -
            test "$(head -c 5 "$output")" = "%PDF-"
            command -v pdfinfo >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null; }
            test "$(pdfinfo "$output" | awk '/^Pages:/ {print $2}')" = "$expected_pages"
          }

          download_one "qGj2dMUlutOb" "GMD_2026-11-16.pdf" "reports/GMD_2026-11-16.pdf" "dc45a62660ed06a666666c2534cce67442f962de6b4947d3c65a59d7b19e7d61" "627921" "29"
          download_one "fi4GAd34w-1X" "POW_2026-11-16.pdf" "reports/POW_2026-11-16.pdf" "3fe6a0ab41873f6b8faced25c585e94462cb44992f3865b6f4197761ea6a791b" "553430" "27"

          rm -f reports/GMD_Equity_Valuation_Research_2026-08-10.pdf
          rm -f reports/POW_2026-11-02.pdf

      - name: Re-verify locked EOD 13 Nov against VNDIRECT and CafeF
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = await import("node:fs");
          const vm = await import("node:vm");
          const { parseVndirect, parseCafeF } = await import("./scripts/update-eod-market-data.mjs");

          const sandbox={window:{}};
          vm.runInNewContext(fs.readFileSync("src/data/research-data.js","utf8"),sandbox,{filename:"src/data/research-data.js"});
          const d=sandbox.window.RESEARCH_DATA;
          const expected={
            GMD:{close:55000,changePct:2.4209,volume:5213400,cafeVolume:5213400},
            POW:{close:13050,changePct:3.5714,volume:18532100,cafeVolume:18532100}
          };
          const date="2026-11-13";
          const headers={accept:"text/html,application/json,text/plain,*/*","user-agent":"Mozilla/5.0 XuanLeTVS-Report-Import/4.0"};
          const out={};

          for (const ticker of ["GMD","POW"]) {
            const coverage=d.coverage.find(x=>x.ticker===ticker);
            const exp=expected[ticker];
            if(!coverage) throw new Error("Missing coverage "+ticker);
            if(coverage.priceDate!==date || coverage.close!==exp.close || coverage.volume!==exp.volume || Math.abs(coverage.changePct-exp.changePct)>0.0001) {
              throw new Error(ticker+" locked EOD baseline drift "+JSON.stringify(coverage));
            }
            const priceSource="https://api-finfo.vndirect.com.vn/v4/stock_prices?sort=date&q=code:"+ticker+"~date:"+date+"&size=10";
            const cafeFSource="https://cafef.vn/du-lieu/DuLieu.aspx?cat_id=1009&symbol="+ticker;
            const [p,h]=await Promise.all([
              fetch(priceSource,{headers}).then(r=>{if(!r.ok) throw new Error(ticker+" VNDIRECT HTTP "+r.status); return r.json();}),
              fetch(cafeFSource,{headers}).then(r=>{if(!r.ok) throw new Error(ticker+" CafeF HTTP "+r.status); return r.text();})
            ]);
            const primary=parseVndirect(p,ticker,date);
            const secondary=parseCafeF(h,date);
            if(primary.close!==exp.close || primary.volume!==exp.volume || Math.abs(primary.changePct-exp.changePct)>0.0001) {
              throw new Error(ticker+" VNDIRECT mismatch "+JSON.stringify({primary,coverage}));
            }
            if(secondary.close!==exp.close || secondary.volume!==exp.cafeVolume || Math.abs(secondary.changePct-(ticker==="GMD"?2.42:3.57))>0.001) {
              throw new Error(ticker+" CafeF mismatch "+JSON.stringify(secondary));
            }
            out[ticker]={primary,secondary,priceSource,cafeFSource};
          }
          fs.writeFileSync("/tmp/eod-gmd-pow.json",JSON.stringify(out,null,2));
          console.log(JSON.stringify({ok:true,out},null,2));
          NODE

      - name: Replace GMD and POW valuations latest-only without changing layout
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("node:fs"),vm=require("node:vm");
          const p="src/data/research-data.js";
          const s={window:{}};
          vm.runInNewContext(fs.readFileSync(p,"utf8"),s,{filename:p});
          const d=s.window.RESEARCH_DATA;
          if(!d||!Array.isArray(d.reports)||!Array.isArray(d.coverage)) throw new Error("RESEARCH_DATA invalid");

          const vals0=d.reports.filter(r=>r.reportType!=="trading");
          if(vals0.length!==134||d.coverage.length!==134) throw new Error("Expected 134/134 baseline");

          const oldG=vals0.find(r=>r.ticker==="GMD");
          const oldP=vals0.find(r=>r.ticker==="POW");
          const covG=d.coverage.find(c=>c.ticker==="GMD");
          const covP=d.coverage.find(c=>c.ticker==="POW");
          if(!oldG||oldG.id!=="GMD-20260810"||oldG.file!=="reports/GMD_Equity_Valuation_Research_2026-08-10.pdf") throw new Error("GMD report baseline drift");
          if(!oldP||oldP.id!=="POW-20261102"||oldP.file!=="reports/POW_2026-11-02.pdf") throw new Error("POW report baseline drift");
          if(!covG||covG.reportId!=="GMD-20260810"||covG.priceDate!=="2026-11-13") throw new Error("GMD coverage baseline drift");
          if(!covP||covP.reportId!=="POW-20261102"||covP.priceDate!=="2026-11-13") throw new Error("POW coverage baseline drift");

          const visual=(ticker,date,file)=>({
            src:"assets/images/reports/"+ticker.toLowerCase()+".webp?v="+date.replaceAll("-","")+"-cover1",
            alt:"Trang bìa báo cáo định giá "+ticker+" ngày "+date.split("-").reverse().join("/"),
            caption:"Bìa báo cáo định giá "+ticker,
            sourceLabel:"Xuân Lê TVS Equity Research",
            sourceUrl:file,
            kind:"report-cover"
          });

          const gmd={
            id:"GMD-20261116",
            ticker:"GMD",
            company:oldG.company,
            sector:oldG.sector,
            exchange:oldG.exchange,
            date:"2026-11-16",
            recommendation:"THẬN TRỌNG / CHỜ",
            status:"wait",
            marketPrice:55000,
            marketPriceDate:"2026-11-13",
            baseValue:44437,
            valueLabel:"Giá trị kỳ vọng có điều kiện",
            rangeLow:27894,
            rangeHigh:59811,
            gapLabel:"P0 55.000 đồng/cp cao hơn GTKV 44.437 đồng/cp khoảng 23,8%; giá đang trong vùng THẬN TRỌNG theo định giá, độ tin cậy THẤP và giao dịch 1-3 tuần CHỜ.",
            method:"PP-14 theo từng mảng (có PP-01 DCF hoạt động) 55,6% + PP-16 P/B ngành 44,4%; PP-18 kiểm tra ngược trọng số 0%",
            summary:"GMD có khoảng giá trị điều kiện 27.894-59.811 đồng/cp và GTKV 44.437 đồng/cp. Giá 55.000 đồng đã cao hơn GTKV; lợi nhuận chuyển nhượng 2026 không được ngoại suy, giá trị liên doanh/NCI và giá trị cuối kỳ còn nhạy với giả định. Kỹ thuật có P0 trên MA20/MA50 và thanh khoản mạnh nhưng sức mạnh tương đối 20 phiên chưa vượt VN-Index, R/R thử chỉ 0,71; trạng thái 1-3 tuần là CHỜ.",
            action:{
              zoneLow:null,zoneHigh:null,baseValue:44437,stop:null,targets:[],
              basisDate:"2026-11-16",
              recommendation:"CHỜ - KHÔNG CÓ ĐIỂM MUA HỢP LỆ",
              eligibility:"inactive",
              condition:"Nếu giá <=27.894 đồng/cp thì chỉ xem lại vùng tích lũy dài hạn sau khi khóa dữ liệu, không tự động mua. Với giao dịch 1-3 tuần, chỉ kiểm tra CÓ MUA khi giá vượt nền với khối lượng >=1,5x TB20, MA20 đi lên, sức mạnh tương đối 20 phiên vượt VN-Index, stop 3-7% và R/R >=2. Hiện R/R không đạt nên tiếp tục CHỜ."
            },
            file:"reports/GMD_2026-11-16.pdf",
            edition:"Bản định giá 16.11.2026"
          };
          gmd.visual=visual(gmd.ticker,gmd.date,gmd.file);

          const pow={
            id:"POW-20261116",
            ticker:"POW",
            company:oldP.company,
            sector:oldP.sector,
            exchange:oldP.exchange,
            date:"2026-11-16",
            recommendation:"THEO DÕI / CHỜ",
            status:"wait",
            marketPrice:13050,
            marketPriceDate:"2026-11-13",
            baseValue:14200,
            valueLabel:"Giá trị kỳ vọng có điều kiện",
            rangeLow:7500,
            rangeHigh:23500,
            gapLabel:"P0 13.050 đồng/cp thấp hơn GTKV 14.200 đồng/cp khoảng 8,4%, nhưng chưa đạt biên an toàn và cổng dữ liệu chưa đạt; tín hiệu định giá THEO DÕI, giao dịch 1-3 tuần CHỜ.",
            method:"PP-01 DCF FCFF 45,5% + PP-16 P/B cùng ngành 54,5%; PP-18 kiểm tra ngược trọng số 0%, PP-12 dự án chỉ tham chiếu",
            summary:"POW có khoảng giá trị điều kiện 7.500-23.500 đồng/cp và GTKV 14.200 đồng/cp. Nhơn Trạch 3&4 cải thiện triển vọng nhưng CFO 9T chỉ bằng khoảng 39,7% LNST, phải thu và nợ vay tăng; DCF còn phụ thuộc giả định dài hạn và khác đáng kể P/B. Kỹ thuật 13/11 mạnh hơn nhưng nền giá, stop hợp lệ và R/R >=2 chưa được khóa; trạng thái 1-3 tuần là CHỜ.",
            action:{
              zoneLow:null,zoneHigh:null,baseValue:14200,stop:null,targets:[],
              basisDate:"2026-11-16",
              recommendation:"CHỜ - CHƯA KÍCH HOẠT ĐIỂM MUA",
              eligibility:"inactive",
              condition:"Nếu giá <=7.500 đồng/cp thì chỉ đánh giá lại vùng biên an toàn sau khi kiểm tra chất lượng dòng tiền. Với giao dịch 1-3 tuần, dù MA20/MA50, khối lượng và sức mạnh tương đối đã cải thiện, chỉ CÓ MUA khi khóa được nền/hỗ trợ, stop 3-7%, mục tiêu theo kháng cự và R/R >=2. Hiện chưa đủ nên tiếp tục CHỜ."
            },
            file:"reports/POW_2026-11-16.pdf",
            edition:"Bản định giá 16.11.2026"
          };
          pow.visual=visual(pow.ticker,pow.date,pow.file);

          d.reports=d.reports.filter(r=>!(r.reportType!=="trading"&&["GMD","POW"].includes(r.ticker))).concat([gmd,pow]);
          d.reports.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||String(a.ticker||"").localeCompare(String(b.ticker||""))||String(a.reportType||"valuation").localeCompare(String(b.reportType||"valuation")));

          covG.reportId=gmd.id;
          covG.action=structuredClone(gmd.action);
          covP.reportId=pow.id;
          covP.action=structuredClone(pow.action);

          const vals=d.reports.filter(r=>r.reportType!=="trading");
          if(vals.length!==134||d.coverage.length!==134) throw new Error("Count changed unexpectedly");
          if(new Set(vals.map(r=>r.ticker)).size!==134||new Set(d.coverage.map(c=>c.ticker)).size!==134) throw new Error("Ticker uniqueness invariant failed");
          for(const r of [gmd,pow]){
            const rows=vals.filter(x=>x.ticker===r.ticker);
            const c=d.coverage.find(x=>x.ticker===r.ticker);
            if(rows.length!==1||rows[0].id!==r.id) throw new Error(r.ticker+" latest-only invariant failed");
            if(!c||c.reportId!==r.id||c.action?.basisDate!==r.date||c.action?.eligibility!=="inactive") throw new Error(r.ticker+" coverage/action sync failed");
          }
          if(covG.close!==55000||covG.priceDate!=="2026-11-13"||covG.volume!==5213400) throw new Error("GMD EOD mutated unexpectedly");
          if(covP.close!==13050||covP.priceDate!=="2026-11-13"||covP.volume!==18532100) throw new Error("POW EOD mutated unexpectedly");

          fs.writeFileSync(p,"window.RESEARCH_DATA = "+JSON.stringify(d,null,2)+";\n");
          console.log(JSON.stringify({
            oldG:{id:oldG.id,date:oldG.date,file:oldG.file},
            oldP:{id:oldP.id,date:oldP.date,file:oldP.file},
            nextG:{id:gmd.id,date:gmd.date,file:gmd.file,recommendation:gmd.recommendation},
            nextP:{id:pow.id,date:pow.date,file:pow.file,recommendation:pow.recommendation},
            valuations:vals.length,coverage:d.coverage.length
          },null,2));
          NODE

      - name: Rebuild only GMD and POW report covers
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/images/reports/{gmd,pow}.webp
          node scripts/sync-report-covers.mjs

      - name: Run full tests and integrity audits before commit
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/report-coverage-sync.test.mjs
          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          node scripts/audit-report-covers.mjs
          node scripts/audit-company-logos.mjs
          node scripts/audit-company-visuals.mjs
          git diff --exit-code -- index.html src/index.css src/styles src/data/company-logos.js src/data/company-visuals.js src/data/company-visual-candidates.json

      - name: Guard mutation scope, delete temporary workflow, commit and push atomically
        shell: bash
        run: |
          set -euo pipefail
          trigger_sha="${GITHUB_SHA}"
          rm -f ".github/workflows/tmp-valuation-import-gmd-pow-2026-11-16.yml"

          allowed='^(\.github/workflows/tmp-valuation-import-gmd-pow-2026-11-16\.yml|src/data/research-data\.js|reports/(GMD_Equity_Valuation_Research_2026-08-10|GMD_2026-11-16|POW_2026-11-02|POW_2026-11-16)\.pdf|assets/images/reports/(gmd|pow)\.webp)$'
          changed="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //')"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed paths; refusing commit:" >&2
            echo "$unexpected" >&2
            exit 2
          fi

          test -s reports/GMD_2026-11-16.pdf
          test -s reports/POW_2026-11-16.pdf
          test ! -e reports/GMD_Equity_Valuation_Research_2026-08-10.pdf
          test ! -e reports/POW_2026-11-02.pdf
          test -s assets/images/reports/gmd.webp
          test -s assets/images/reports/pow.webp
          echo "dc45a62660ed06a666666c2534cce67442f962de6b4947d3c65a59d7b19e7d61  reports/GMD_2026-11-16.pdf" | sha256sum -c -
          echo "3fe6a0ab41873f6b8faced25c585e94462cb44992f3865b6f4197761ea6a791b  reports/POW_2026-11-16.pdf" | sha256sum -c -

          git fetch origin main --quiet
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "$trigger_sha" ]]; then
            echo "main advanced during guarded import; refusing stale write: trigger=$trigger_sha remote=$remote_sha" >&2
            exit 3
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update GMD and POW valuations to 16 Nov 2026 latest-only"
          git push origin HEAD:main
