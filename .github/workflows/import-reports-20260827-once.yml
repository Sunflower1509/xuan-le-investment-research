name: One-time publish 10 reports and EOD 27 Aug 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/import-reports-20260827.trigger'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preserve public structure baseline
        shell: bash
        run: |
          set -euo pipefail
          cp index.html "${RUNNER_TEMP}/index-before.html"
          cp assets/css/site.min.css "${RUNNER_TEMP}/site-before.css"
          git rev-parse HEAD > "${RUNNER_TEMP}/start-sha"

      - name: Install PDF cover tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils webp

      - name: Download exact uploaded PDFs and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports assets/images/reports
          fetch_pdf() {
            local url="$1" out="$2"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 "$url" -o "$out"
          }
          fetch_pdf 'https://at.adobe.com/o6QXQlyXpY02oyw7' 'reports/VGC_2026-08-27.pdf'
          fetch_pdf 'https://at.adobe.com/RKNtyZFp4W8Osue4' 'reports/GEL_2026-08-27.pdf'
          fetch_pdf 'https://at.adobe.com/ghAbJWqA6ACSRYft' 'reports/PDR_2026-08-27.pdf'
          fetch_pdf 'https://at.adobe.com/8GBMc72YFviBifWF' 'reports/EIB_2026-08-27.pdf'
          fetch_pdf 'https://at.adobe.com/ZXqdODLtjvbBh0J9' 'reports/NTC_2026-08-27.pdf'
          fetch_pdf 'https://at.adobe.com/jTvntYjQ6S0uZIVM' 'reports/D2D_2026-08-26.pdf'
          fetch_pdf 'https://at.adobe.com/MzLmWI6BX2kGnvIY' 'reports/DXG_2026-08-26.pdf'
          fetch_pdf 'https://at.adobe.com/w9ZGCPTOsQVaorCm' 'reports/HHS_2026-08-26.pdf'
          fetch_pdf 'https://at.adobe.com/cKUAzSdiNba21o0b' 'reports/TCH_2026-08-26.pdf'
          fetch_pdf 'https://at.adobe.com/1ogPhC9EwNZIcfg7' 'reports/GEX_2026-08-26.pdf'
          cat > "${RUNNER_TEMP}/pdf.sha256" <<'EOF'
          cbea41eb9b5567c2f31faabfb9e5bec69fcc9c5ae084d6f377ec52f591e05f99  reports/VGC_2026-08-27.pdf
          d4b7fc7926f873295149e34498e250e92e286abf73afa1c7aa001db80ba473d3  reports/GEL_2026-08-27.pdf
          1cbdcb9f7d9daf2aad1d23dd3bc2da1a8d074828170c509fc2996da1084b0a4f  reports/PDR_2026-08-27.pdf
          5384ccfe68a71cd3f4c7361f23dc7cd7cd7fbee4dc0ea00ebb690f4c15ba1463  reports/EIB_2026-08-27.pdf
          ea26e4e84051d91d075431e3fb5652a936ca3a28db1233c90f253141a5175e3b  reports/NTC_2026-08-27.pdf
          286c0ebfc40f53612da9f8e592610308f125ff3b6d4b602bd8d9ef4ab34704be  reports/D2D_2026-08-26.pdf
          00fb1900dc5e8706a5e57d8e90ed9cbe2445e6d7b1df32bd4b3e90a635076068  reports/DXG_2026-08-26.pdf
          67e47c987a79fef2453f589985f1f54363733502292f4ac0426bbdc70ccc90ab  reports/HHS_2026-08-26.pdf
          7ca64d6d519c0c6d58b403324aa9a23ff32b6a3d2ca2a02f354d2614d7faafe7  reports/TCH_2026-08-26.pdf
          7fa64b2e07298575ab21efe16ed3ec9f1b054e0ed698d72e669231dc54c3e330  reports/GEX_2026-08-26.pdf
          EOF
          sha256sum -c "${RUNNER_TEMP}/pdf.sha256"
          for pdf in reports/{VGC,GEL,PDR,EIB,NTC}_2026-08-27.pdf reports/{D2D,DXG,HHS,TCH,GEX}_2026-08-26.pdf; do
            [[ "$(head -c 5 "$pdf")" == '%PDF-' ]] || { echo "Invalid PDF: $pdf" >&2; exit 2; }
          done

      - name: Render report covers from exact PDFs
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            VGC:2026-08-27 GEL:2026-08-27 PDR:2026-08-27 EIB:2026-08-27 NTC:2026-08-27 \
            D2D:2026-08-26 DXG:2026-08-26 HHS:2026-08-26 TCH:2026-08-26 GEX:2026-08-26; do
            ticker="${spec%%:*}"; day="${spec##*:}"; lower="$(echo "$ticker" | tr '[:upper:]' '[:lower:]')"
            pdftoppm -f 1 -singlefile -jpeg -r 120 "reports/${ticker}_${day}.pdf" "${RUNNER_TEMP}/${lower}" >/dev/null 2>&1
            cwebp -quiet -q 82 "${RUNNER_TEMP}/${lower}.jpg" -o "assets/images/reports/${lower}.webp"
          done

      - name: Import latest report metadata and remove stale editions
        run: node scripts/import-reports-20260827.mjs

      - name: Verify 96 valuation reports and coverage rows before EOD
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm';
          const sandbox={window:{}}; vm.runInNewContext(fs.readFileSync('src/data/research-data.js','utf8'),sandbox);
          const d=sandbox.window.RESEARCH_DATA; const vals=d.reports.filter(r=>r.reportType!=='trading');
          if(vals.length!==96 || d.coverage.length!==96) throw new Error(`Expected 96/96, got ${vals.length}/${d.coverage.length}`);
          if(new Set(vals.map(r=>r.ticker)).size!==96 || new Set(d.coverage.map(c=>c.ticker)).size!==96) throw new Error('Duplicate ticker after import');
          console.log(`REPORT_COVERAGE_PRE_EOD ${vals.length}/${d.coverage.length}`);
          NODE

      - name: Cross-check and lock EOD 27 Aug for all coverage
        id: market
        run: node scripts/update-eod-market-data.mjs --date 2026-08-27 --max-attempts 10 --wait-ms 30000 --status-file "${RUNNER_TEMP}/eod-status.json"

      - name: Require verified EOD Data Gate
        env:
          STATUS: ${{ steps.market.outputs.status }}
        run: |
          cat "${RUNNER_TEMP}/eod-status.json"
          [[ "$STATUS" == 'verified' ]] || { echo "EOD 27/08 not fully verified: $STATUS" >&2; exit 2; }

      - name: Lock VN-Index VN30 HNX and HOSE breadth
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm';
          const date='2026-08-27'; const p='src/data/research-data.js';
          const s={window:{}}; vm.runInNewContext(fs.readFileSync(p,'utf8'),s); const d=s.window.RESEARCH_DATA;
          if(d.meta.updated!==date || d.coverage.some(x=>x.priceDate!==date)) throw new Error('Coverage EOD not fully locked');
          const url=`https://api-finfo.vndirect.com.vn/v4/vnmarket_prices?sort=code&q=date:${date}&size=500`;
          const finite=v=>Number.isFinite(Number(v))?Number(v):null; const key=r=>String(r?.code||r?.indexCode||r?.symbol||'').toUpperCase();
          let payload;
          for(let i=1;i<=10;i++){try{const r=await fetch(url,{headers:{accept:'application/json','user-agent':'XuanLeTVS-OneTime/1.0'},signal:AbortSignal.timeout(15000)});if(!r.ok)throw new Error(`HTTP ${r.status}`);payload=await r.json();break;}catch(e){if(i===10)throw e;await new Promise(x=>setTimeout(x,30000));}}
          const rows=Array.isArray(payload?.data)?payload.data:[]; const find=a=>rows.find(r=>a.includes(key(r)));
          const parse=(r,code)=>{if(!r)throw new Error(`Missing ${code}`);const close=finite(r.close??r.index??r.value),change=finite(r.change??r.changeValue),changePct=finite(r.pctChange??r.changePct??r.percentChange);if([close,change,changePct].some(v=>v===null))throw new Error(`Incomplete ${code}`);return{code,close,change,changePct};};
          const vn=find(['VNINDEX','VN-INDEX','HOSE']);
          const breadth={advance:finite(vn?.nmAdvances??vn?.advances??vn?.advance??vn?.up),unchanged:finite(vn?.nmNoChange??vn?.noChange??vn?.unchanged??vn?.reference),decline:finite(vn?.nmDeclines??vn?.declines??vn?.decline??vn?.down),floor:finite(vn?.nmFloors??vn?.floorStocks??vn?.floors??vn?.floor)};
          if(Object.values(breadth).some(v=>v===null))throw new Error('HOSE breadth unavailable');
          d.marketSession={date,status:'Đã khóa EOD — VNDIRECT Finfo',indices:[parse(vn,'VN-INDEX'),parse(find(['VN30','VN30-INDEX']),'VN30'),parse(find(['HNX','HNXINDEX','HNX-INDEX']),'HNX-INDEX')],breadth,sources:[{label:'VNDIRECT Finfo — chỉ số & độ rộng EOD 27/08/2026',url}]};
          fs.writeFileSync(p,`window.RESEARCH_DATA = ${JSON.stringify(d,null,2)};\n`);
          console.log('MARKET_SESSION_LOCKED',JSON.stringify(d.marketSession));
          NODE

      - name: Process and reconcile non-retrospective trade ledger
        run: |
          cp src/data/trade-ledger.json "${RUNNER_TEMP}/trade-ledger-before.json"
          node scripts/process-trade-ledger.mjs
          node scripts/reconcile-trade-ledger.mjs --before "${RUNNER_TEMP}/trade-ledger-before.json" --after src/data/trade-ledger.json --research src/data/research-data.js --report "${RUNNER_TEMP}/ledger-reconciliation.json"
          cat "${RUNNER_TEMP}/ledger-reconciliation.json"

      - name: Run full regression suite
        run: node --test tests/*.test.mjs

      - name: Build production assets and update cache date
        run: |
          bash scripts/build/build-assets.sh
          node scripts/update-cache-token.mjs --date 2026-08-27
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; const p='index.html'; let h=fs.readFileSync(p,'utf8');
          const re=/(<[^>]+data-role=["']ledger-asof["'][^>]*>)Giá theo dõi khóa EOD \d{2}\.\d{2}\.\d{4}(<\/[^>]+>)/g;
          if((h.match(re)||[]).length!==1)throw new Error('ledger-asof marker mismatch');
          fs.writeFileSync(p,h.replace(re,'$1Giá theo dõi khóa EOD 27.08.2026$2'));
          NODE

      - name: Audit all website artifacts and references
        run: node scripts/audit-site.mjs

      - name: Guard layout CSS and mutation scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- src/index.css src/styles || { echo 'CSS source changed unexpectedly' >&2; exit 2; }
          cmp -s assets/css/site.min.css "${RUNNER_TEMP}/site-before.css" || { echo 'Built CSS changed unexpectedly' >&2; exit 2; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before=fs.readFileSync(process.env.RUNNER_TEMP+'/index-before.html','utf8'); const after=fs.readFileSync('index.html','utf8');
          const normalize=h=>h
            .replace(/(<[^>]+data-role=["']report-tab-count["'][^>]*>)\d+(<\/[^>]+>)/g,'$1#COUNT#$2')
            .replace(/(<[^>]+data-role=["']coverage-tab-count["'][^>]*>)\d+(<\/[^>]+>)/g,'$1#COUNT#$2')
            .replace(/(<[^>]+data-role=["']ledger-asof["'][^>]*>)[^<]*(<\/[^>]+>)/g,'$1#DATE#$2')
            .replace(/(<[^>]+data-role=["']coverage-eod-label["'][^>]*>)[^<]*(<\/[^>]+>)/g,'$1#DATE#$2')
            .replace(/(<[^>]+data-role=["']coverage-lock-label["'][^>]*>)[^<]*(<\/[^>]+>)/g,'$1#DATE#$2')
            .replace(/assets\/js\/site\.min\.js\?v=[^"']+/g,'assets/js/site.min.js?v=#TOKEN#')
            .replace(/(giá đóng cửa )\d{2}\/\d{2}\/\d{4}/g,'$1#DATE#');
          if(normalize(before)!==normalize(after))throw new Error('index.html structural/content change outside approved counters/dates/cache token');
          const order=[...after.matchAll(/<section\b[^>]*\bid=(['"])([^'"]+)\1[^>]*>/g)].map(m=>m[2]);
          const expected=['overview','daily-market','position-ledger','action-radar','research'];
          if(order.join(',')!==expected.join(','))throw new Error(`Section order changed: ${order.join(' -> ')}`);
          NODE
          allowed='^(reports/[^/]+\.pdf|assets/images/reports/[^/]+\.webp|src/data/research-data\.js|src/data/trade-ledger\.json|assets/js/site\.min\.js|assets/css/site\.min\.css|index\.html)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          [[ -z "$unexpected" ]] || { echo "Unexpected mutations:" >&2; echo "$unexpected" >&2; exit 2; }

      - name: Prepare lean production artifact
        run: bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"

      - name: Remove one-time machinery and commit verified state
        shell: bash
        run: |
          set -euo pipefail
          git rm -f scripts/import-reports-20260827.mjs .github/workflows/import-reports-20260827-once.yml .github/import-reports-20260827.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish 10 valuation reports and lock EOD 27 Aug 2026 [skip ci]'
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy byte verification
        run: node scripts/verify-live-site.mjs --site-url "${{ steps.deployment.outputs.page_url }}" --artifact-root "${RUNNER_TEMP}/site"
