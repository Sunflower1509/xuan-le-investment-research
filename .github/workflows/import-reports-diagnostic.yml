          const oldValuations=(data.reports||[]).filter(r=>r.reportType!=='trading' && targetTickers.has(String(r.ticker||'').toUpperCase()));
          for (const old of oldValuations) {
            if (old.file && !reports.some(r=>r.file===old.file) && fs.existsSync(old.file)) fs.rmSync(old.file,{force:true});
            const oldImage=String(old.visual?.src||'').split(/[?#]/,1)[0];
            if (oldImage && !reports.some(r=>String(r.visual?.src||'').split(/[?#]/,1)[0]===oldImage) && fs.existsSync(oldImage)) fs.rmSync(oldImage,{force:true});
          }
          data.reports=(data.reports||[]).filter(r=>r.reportType==='trading' || !targetTickers.has(String(r.ticker||'').toUpperCase()));
          data.coverage=(data.coverage||[]).filter(c=>!targetTickers.has(String(c.ticker||'').toUpperCase()));
          reports.sort((a,b)=>a.ticker.localeCompare(b.ticker));
          data.reports=[...reports,...data.reports];
          for (const r of reports) {
            data.coverage.push({
              ticker:r.ticker, company:r.company, sector:r.sector, exchange:r.exchange, reportId:r.id,
              close:r.marketPrice, priceDate:'2026-09-07', changePct:0, volume:0,
