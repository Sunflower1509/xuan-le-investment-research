name: Import reports diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-reports-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-firestorage:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect transfer metadata API
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file/shares/sdkXggpXUJrE/files?maxResults=1000'
          curl -fsSL "$API" | python3 -m json.tool
