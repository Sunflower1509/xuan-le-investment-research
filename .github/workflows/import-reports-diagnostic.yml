      - name: Make logo integrity checks universe-dynamic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('scripts/audit-company-logos.mjs')
          s=p.read_text()
          s=s.replace('const expectedCount = 108;\n','')
          anchor='const coverage = research.coverage.map((item) => ({ ticker: normalizeTicker(item.ticker), exchange: normalizeTicker(item.exchange) }));\n'
          if anchor not in s: raise SystemExit('audit logo coverage anchor missing')
          s=s.replace(anchor,anchor+'const expectedCount = coverage.length;\n')
          s=s.replace('if (coverage.length !== expectedCount) fail("Coverage", `phải có ${expectedCount} mã, hiện có ${coverage.length}`);','if (!coverage.length) fail("Coverage", "coverage trống");')
          p.write_text(s)

          p=Path('scripts/sync-company-logos.mjs')
          s=p.read_text()
          old='  if (universe.length !== 108) throw new Error(`Cổng 108 mã không đạt: coverage=${universe.length}`);'
          if old not in s: raise SystemExit('sync logo 108 gate missing')
          s=s.replace(old,'  if (!universe.length) throw new Error("Coverage trống; không đồng bộ logo.");')
          p.write_text(s)

          p=Path('tests/ui-company-logos.test.mjs')
          s=p.read_text()
          s=s.replace('test("108 coverage ticker có đúng 108 logo local được khóa theo sàn và ISIN", () => {','test("mọi coverage ticker có đúng logo local được khóa theo sàn và ISIN", () => {')
          s=s.replace('  assert.equal(research.coverage.length, 108);\n  assert.equal(entries.length, 108);\n  assert.equal(mapping.meta.count, 108);',
                      '  const expectedCount = research.coverage.length;\n  assert.ok(expectedCount > 0);\n  assert.equal(entries.length, expectedCount);\n  assert.equal(mapping.meta.count, expectedCount);')
          p.write_text(s)
          PY
          if grep -n '108' scripts/audit-company-logos.mjs scripts/sync-company-logos.mjs tests/ui-company-logos.test.mjs; then
            echo 'Hard-coded 108 remains in logo synchronization controls' >&2
            exit 2
          fi

      - name: Add exact local logos only for the six new coverage tickers
        run: |
          node <<'NODE'
          const fs=require('fs'); const vm=require('vm'); const crypto=require('crypto'); const path=require('path');
          const researchBox={window:{}}; vm.runInNewContext(fs.readFileSync('src/data/research-data.js','utf8'),researchBox);
          const research=researchBox.window.RESEARCH_DATA;
          const mapBox={window:{}}; vm.runInNewContext(fs.readFileSync('src/data/company-logos.js','utf8'),mapBox);
          const mapping=mapBox.window.COMPANY_LOGOS;
          const wanted=new Set(['BAF','PAN','HUT','YEG','TNG','OCB']);
          const universe=research.coverage.filter(x=>wanted.has(x.ticker)).map(x=>({ticker:x.ticker.toUpperCase(),exchange:x.exchange.toUpperCase()}));
          const normalize=x=>String(x||'').replace(/<[^>]*>/g,'').trim().toUpperCase();
          const clean=x=>String(x||'').replace(/<[^>]*>/g,'').trim();
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          async function get(url){let last;for(let i=0;i<5;i++){try{const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0 (compatible; XuanLeTVSLogoIncremental/1.0)','origin':'https://www.tradingview.com','referer':'https://www.tradingview.com/'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r;}catch(e){last=e;await new Promise(r=>setTimeout(r,900*(i+1)));}}throw last;}
          fs.mkdirSync('assets/images/logos',{recursive:true});
          for(const item of universe){
            const u=new URL('https://symbol-search.tradingview.com/symbol_search/v3/');
            u.searchParams.set('text',item.ticker);u.searchParams.set('hl','1');u.searchParams.set('exchange',item.exchange);u.searchParams.set('lang','en');u.searchParams.set('domain','production');
            const payload=await (await get(u)).json();
            const exact=(payload.symbols||[]).filter(x=>normalize(x.symbol)===item.ticker && normalize(x.exchange||x.source_id)===item.exchange);
            if(exact.length!==1) throw new Error(`${item.ticker}/${item.exchange}: exact TradingView results=${exact.length}`);
            const x=exact[0]; const logoid=x.logo?.logoid||x.logoid; const isin=String(x.isin||'');
            if(!logoid || !/^VN[A-Z0-9]{10}$/.test(isin)) throw new Error(`${item.ticker}: invalid logo/ISIN`);
            const sourceUrl=`https://s3-symbol-logo.tradingview.com/${logoid}--big.svg`;
            const buf=Buffer.from(await (await get(sourceUrl)).arrayBuffer());
            const txt=buf.toString('utf8').trim();
            if(!/^(?:<!--[^]*?-->\s*)?<svg\b/i.test(txt)||!/<\/svg>\s*$/i.test(txt)||/<(?:script|foreignObject|iframe|object|embed)\b/i.test(txt)||/\son[a-z]+\s*=/i.test(txt)) throw new Error(`${item.ticker}: unsafe/invalid SVG`);
            const rel=`assets/images/logos/${item.ticker.toLowerCase()}.svg`; fs.writeFileSync(rel,buf);
            mapping.logos[item.ticker]={path:`${rel}?v=20260908-logo2`,alt:`Logo ${clean(x.description)} (${item.ticker})`,exchange:item.exchange,isin,company:clean(x.description),sourceUrl,queryUrl:u.href,sha256:hash(buf),bytes:buf.length};
            console.log('LOGO_LOCKED',item.ticker,item.exchange,isin,buf.length,hash(buf));
          }
          mapping.meta={...(mapping.meta||{}),count:research.coverage.length,synced:'2026-09-08'};
          if(Object.keys(mapping.logos).length!==research.coverage.length) throw new Error(`Logo map count mismatch ${Object.keys(mapping.logos).length}/${research.coverage.length}`);
          fs.writeFileSync('src/data/company-logos.js',`window.COMPANY_LOGOS = ${JSON.stringify(mapping,null,2)};\n`);
          NODE

      - name: Lock EOD 07/09/2026 prices for the expanded 114-ticker coverage
        run: |
          set -euo pipefail
          node scripts/update-eod-market-data.mjs --date 2026-09-07 --status-file "${RUNNER_TEMP}/eod-status.json"
          cat "${RUNNER_TEMP}/eod-status.json"
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');const b={window:{}};vm.runInNewContext(fs.readFileSync('src/data/research-data.js','utf8'),b);const d=b.window.RESEARCH_DATA;
          if(d.meta.updated!=='2026-09-07'||d.meta.release!=='2026-09-07') throw new Error('Meta EOD date changed unexpectedly');
          if(d.coverage.length!==114||d.coverage.some(x=>x.priceDate!=='2026-09-07'||!(x.close>0)||x.volume<0)) throw new Error('Expanded coverage EOD lock incomplete');
          console.log('EOD_114_OK');
          for(const t of ['BAF','PAN','HUT','YEG','TNG','OCB']) console.log(t,d.coverage.find(x=>x.ticker===t));
          NODE

      - name: Render deterministic report covers and update visual metadata
        run: node scripts/sync-report-covers.mjs

      - name: Build production assets and use a fresh non-structural cache token
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build/build-assets.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          import re
          s2,n=re.subn(r'assets/js/site\.min\.js\?v=[^"\']+', 'assets/js/site.min.js?v=20260907-reports-20260908-1', s)
          if n!=1: raise SystemExit(f'Expected one JS token, found {n}')
          p.write_text(s2)
          PY

      - name: Run full synchronization and integrity gates
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          node scripts/audit-site.mjs
          node scripts/audit-report-covers.mjs
          node scripts/audit-company-logos.mjs
          bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const rb={window:{}};vm.runInNewContext(fs.readFileSync('src/data/research-data.js','utf8'),rb);const d=rb.window.RESEARCH_DATA;
          const lb={window:{}};vm.runInNewContext(fs.readFileSync('src/data/company-logos.js','utf8'),lb);const l=lb.window.COMPANY_LOGOS;
          const vals=d.reports.filter(r=>r.reportType!=='trading');
          if(vals.length!==114||d.coverage.length!==114||Object.keys(l.logos).length!==114) throw new Error(`114 sync gate failed reports=${vals.length} coverage=${d.coverage.length} logos=${Object.keys(l.logos).length}`);
          const dirs={pdf:fs.readdirSync('reports').filter(f=>f.toLowerCase().endsWith('.pdf')).length,covers:fs.readdirSync('assets/images/reports').filter(f=>f.endsWith('.webp')).length,logos:fs.readdirSync('assets/images/logos').filter(f=>f.endsWith('.svg')).length};
          if(dirs.pdf<114||dirs.covers!==114||dirs.logos!==114) throw new Error(`Asset tree mismatch ${JSON.stringify(dirs)}`);
          const order=[...fs.readFileSync('index.html','utf8').matchAll(/<section\b[^>]*\bid=(["'])([^"']+)\1[^>]*>/g)].map(m=>m[2]);
          const expected=['overview','daily-market','position-ledger','action-radar','research'];
          if(order.join(',')!==expected.join(',')) throw new Error(`PAGE STRUCTURE CHANGED: ${order.join(' -> ')}`);
          console.log('FINAL_SYNC_GATE_OK',{valuations:vals.length,coverage:d.coverage.length,logos:Object.keys(l.logos).length,assets:dirs,sectionOrder:order});
          NODE

