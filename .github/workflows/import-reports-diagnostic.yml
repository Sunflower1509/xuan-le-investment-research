name: Import reports diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-reports-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-firestorage:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage client bundle
        run: |
          set -euo pipefail
          BASE='https://firestorage.ai'
          PAGE="$BASE/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js"
          curl -fsSL "$PAGE" -o /tmp/page.js
          echo '=== SIZE ==='
          wc -c /tmp/page.js
          echo '=== INTERESTING STRINGS ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/page.js').read_text(errors='replace')
          patterns=[r'.{0,180}/api/.{0,300}',r'.{0,180}fetch\(.{0,300}',r'.{0,180}download.{0,300}',r'.{0,180}shareId.{0,300}',r'.{0,180}publicId.{0,300}',r'.{0,180}fileId.{0,300}',r'.{0,180}share.{0,300}']
          seen=set()
          for p in patterns:
              for m in re.finditer(p,s,re.I|re.S):
                  x=' '.join(m.group(0).split())
                  if x not in seen:
                      seen.add(x); print(x[:1200])
          PY
