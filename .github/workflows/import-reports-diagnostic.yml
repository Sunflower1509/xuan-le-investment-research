name: Import valuation reports 2026-09-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-reports-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: report-import-20260907
  cancel-in-progress: false

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download six source PDFs and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file/objects/ISNf3souce2hOU1d/7dBjG9'
          mkdir -p reports
          download_one() {
            local id="$1" out="$2" expected_size="$3" expected_sha="$4"
            local json url size sha sig
            json="$(curl -fsSL -X POST "$BASE/files/$id/download")"
            url="$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.downloadUrl) process.exit(2); process.stdout.write(x.downloadUrl)' "$json")"
            curl -fsSL "$url" -o "$out"
            size="$(stat -c%s "$out")"
            sha="$(sha256sum "$out" | awk '{print $1}')"
            sig="$(head -c 5 "$out")"
            [[ "$size" == "$expected_size" ]] || { echo "$out size mismatch: $size != $expected_size" >&2; exit 2; }
            [[ "$sha" == "$expected_sha" ]] || { echo "$out sha mismatch: $sha != $expected_sha" >&2; exit 2; }
            [[ "$sig" == '%PDF-' ]] || { echo "$out is not a valid PDF" >&2; exit 2; }
            echo "VERIFIED $out bytes=$size sha256=$sha"
          }
          download_one 01a07e5d62cf73efa053942d3042330f reports/BAF_2026-09-07.pdf 641002 8accabfb556f54748f185257dd846817923520b9768814986d057315a5a1cfcb
