name: Import reports diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-reports-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-firestorage:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage share page
        env:
          SHARE_URL: https://firestorage.ai/ja/f/sdkXggpXUJrE
        run: |
          set -euo pipefail
          curl -fsSL "$SHARE_URL" -o /tmp/share.html
          echo '=== FULL HTML ==='
          cat /tmp/share.html
