name: Import reports diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-reports-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print current research schema examples
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const s={window:{}}; vm.runInNewContext(fs.readFileSync('src/data/research-data.js','utf8'),s);
          const d=s.window.RESEARCH_DATA;
          console.log('COUNTS', {reports:d.reports?.length,coverage:d.coverage?.length});
          console.log('COVERAGE_KEYS', Object.keys(d.coverage?.[0]||{}));
          console.log('COVERAGE_EXAMPLE', JSON.stringify(d.coverage?.[0]||{},null,2));
          console.log('REPORT_STATUSES', [...new Set((d.reports||[]).map(x=>x.status))]);
          for(const st of [...new Set((d.reports||[]).map(x=>x.status))]) { const r=(d.reports||[]).find(x=>x.status===st); console.log('REPORT_'+st, JSON.stringify(r,null,2)); }
          NODE
