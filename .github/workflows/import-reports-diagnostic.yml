name: Import reports diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-reports-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-firestorage:
    runs-on: ubuntu-latest
    steps:
      - name: Verify direct object download API
        run: |
          set -euo pipefail
          BASE='https://api.firestorage.ai/dev/file/objects/ISNf3souce2hOU1d/7dBjG9'
          echo '=== METADATA ==='
          curl -fsSL "$BASE/files?maxResults=1000" | python3 -m json.tool
          echo '=== DOWNLOAD TOKEN TEST ==='
          curl -fsSL -X POST "$BASE/files/01a07e5dcccf763c9a0e44b6f221203f/download" | python3 -m json.tool
