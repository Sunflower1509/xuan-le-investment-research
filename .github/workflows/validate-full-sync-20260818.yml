name: Validate full sync 20260818

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply strictly scoped 18 Aug content sync
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const researchPath='src/data/research-data.js';
          let research=fs.readFileSync(researchPath,'utf8');
          const marketSession=`  "marketSession": {
            "date": "2026-08-18",
            "status": "Đã khóa EOD — VNDIRECT Finfo",
            "indices": [
              {
                "code": "VN-INDEX",
                "close": 1732.02,
                "change": 4.56,
                "changePct": 0.263971379945116
              },
              {
                "code": "VN30",
                "close": 1876.14,
                "change": -1.54,
                "changePct": -0.082016104980609
              },
              {
                "code": "HNX-INDEX",
                "close": 282.32,
                "change": 3.68,
                "changePct": 1.3207
              }
            ],
            "breadth": {
              "advance": 124,
              "unchanged": 76,
              "decline": 163,
              "floor": 4
            },
            "sources": [
              {
                "label": "VNDIRECT Finfo — chỉ số & độ rộng EOD 18/08/2026",
                "url": "https://api-finfo.vndirect.com.vn/v4/vnmarket_prices?sort=code&q=date:2026-08-18&size=500"
              }
            ]
          },
          "rankingMethod":`;
          const marketRegex=/  "marketSession": \{[\s\S]*?\n  \},\n  "rankingMethod":/;
          if(!marketRegex.test(research)) throw new Error('marketSession target not found');
          research=research.replace(marketRegex,marketSession);
          fs.writeFileSync(researchPath,research);

          const dailyPath='src/data/daily-insights.js';
          let daily=fs.readFileSync(dailyPath,'utf8');
          daily=daily.replace('updated: "2026-08-12"','updated: "2026-08-18"');
          if(!daily.includes('id: "market-view-20260818"')) {
            const marker='  entries: [\n';
            if(!daily.includes(marker)) throw new Error('daily entries marker not found');
            const entry=`    {
              id: "market-view-20260818",
              date: "2026-08-18",
              publishedAt: "18/08/2026 • Sau phiên",
              edition: "Số 09",
              sentiment: "watch",
              sentimentLabel: "CHỜ XÁC NHẬN",
              dataStatus: "VNDIRECT Finfo • EOD 18.08.2026",
              title: "VN-Index tăng nhẹ, độ rộng vẫn nghiêng về bên giảm",
              thesis: "Kết phiên 18/08/2026, VN-Index tăng 4,56 điểm (+0,26%) lên 1.732,02 điểm. Chỉ số dao động 1.724,33–1.750,86 điểm nhưng đóng cửa thấp hơn đáng kể so với đỉnh phiên; độ rộng HOSE gồm 124 mã tăng, 163 mã giảm và 76 mã đứng giá. VN30 giảm 0,08% trong khi HNX-Index tăng 1,32%, cho thấy trạng thái phân hóa. Giá trị giao dịch HOSE đạt khoảng 14.872,43 tỷ đồng, trong đó khớp lệnh khoảng 11.484,33 tỷ đồng. Trạng thái tác nghiệp: CHỜ XÁC NHẬN, không mua đuổi.",
              author: "Xuân Lê TVS",
              role: "Môi giới và tư vấn đầu tư",
              readingTime: "3 phút đọc",
              metrics: [
                { label: "VN-INDEX", value: "1.732,02", change: "+4,56 • +0,26%", tone: "positive" },
                { label: "GTGD HOSE", value: "14.872,43 tỷ", change: "Khớp lệnh 11.484,33 tỷ", tone: "neutral" },
                { label: "ĐỘ RỘNG HOSE", value: "124 tăng / 163 giảm", change: "76 đứng giá • 5 trần • 4 sàn", tone: "warning" },
                { label: "VN30 / HNX", value: "−0,08% / +1,32%", change: "Phân hóa giữa nhóm vốn hóa lớn và HNX", tone: "warning" }
              ],
              backdrop: [
                "VN-Index mở cửa 1.727,62 điểm, cao nhất 1.750,86, thấp nhất 1.724,33 và đóng cửa 1.732,02; mức đóng cửa thấp hơn đỉnh phiên 18,84 điểm.",
                "Độ rộng HOSE nghiêng về phía giảm với 163 mã giảm so với 124 mã tăng; số mã trần/sàn theo snapshot chỉ số là 5/4. Vì vậy mức tăng 0,26% của chỉ số chưa đi kèm xác nhận độ rộng.",
                "VN30 giảm 1,54 điểm xuống 1.876,14 trong khi HNX-Index tăng 3,68 điểm lên 282,32; diễn biến này cho thấy dòng tiền và sức mạnh giá phân hóa giữa các nhóm thị trường."
              ],
              levels: [
                { label: "Biên dưới phiên 18/08", value: "1.724,33", note: "Đây là đáy thực tế của phiên 18/08, dùng làm mốc vô hiệu ngắn hạn cho kế hoạch tác nghiệp; không suy diễn thành hỗ trợ dài hạn." },
                { label: "Mốc đóng cửa", value: "1.732,02", note: "Giữ trên mức đóng cửa này cùng độ rộng cải thiện mới củng cố trạng thái; bản thân việc đứng trên 1.732,02 chưa đủ để nâng tín hiệu." },
                { label: "Biên trên phiên 18/08", value: "1.750,86", note: "Chỉ xem là xác nhận tốt hơn nếu chỉ số đóng vượt biên trên và độ rộng/thanh khoản đồng thuận; không mua đuổi chỉ vì chạm mốc trong phiên." }
              ],
              playbook: [
                { if: "VN-Index duy trì trên 1.732,02 và độ rộng chuyển sang số mã tăng lớn hơn số mã giảm", then: "TIẾP TỤC GIỮ các vị thế đã có tín hiệu hợp lệ; chỉ xem xét entry mới theo đúng vùng/ngưỡng riêng của từng mã, không mua đuổi." },
                { if: "VN-Index đóng cửa vượt 1.750,86 với độ rộng và thanh khoản cùng xác nhận", then: "NÂNG MỨC XÁC NHẬN nhưng vẫn giải ngân theo từng setup; không chuyển thành mua toàn thị trường." },
                { if: "VN-Index đóng cửa dưới 1.724,33", then: "GIẢM RỦI RO phần trading và đánh giá lại các setup ngắn hạn; không tự động bình quân giá xuống." }
              ],
              focus: "Mốc 1.724,33–1.750,86 • độ rộng HOSE • phân hóa VN30/HNX • ưu tiên setup riêng, không mua đuổi",
              inference: "Giá chỉ số, OHLC, giá trị giao dịch và độ rộng lấy trực tiếp từ snapshot VNDIRECT Finfo ngày 18/08/2026 lúc 15:08:07. Endpoint dự phòng VNDIRECT finfo-api không kết nối được trong lần kiểm chứng và nguồn vietstock.info bị Cloudflare chặn, vì vậy bản này không tự bổ sung số liệu khối ngoại, MA hay thanh khoản bình quân chưa tái lập được. Các mốc 1.724,33 và 1.750,86 chỉ là đáy/đỉnh thực tế của phiên 18/08 được dùng làm mốc IF–THEN ngắn hạn, không phải vùng hỗ trợ/kháng cự dài hạn suy đoán. Nội dung mang tính tham khảo, không phải khuyến nghị mua/bán; nhà đầu tư tự chịu trách nhiệm với quyết định của mình.",
              sources: [
                { label: "VNDIRECT Finfo — chỉ số & độ rộng EOD 18/08/2026", url: "https://api-finfo.vndirect.com.vn/v4/vnmarket_prices?sort=code&q=date:2026-08-18&size=500" },
                { label: "DNSE OpenAPI — tài liệu OHLC cho chỉ số thị trường", url: "https://developers.dnse.com.vn/docs/dnse/get-ohlc-history/" }
              ]
            },\n`;
            daily=daily.replace(marker,marker+entry);
          }
          fs.writeFileSync(dailyPath,daily);

          const htmlPath='index.html';
          let html=fs.readFileSync(htmlPath,'utf8');
          html=html.replace('giá đóng cửa 12/08/2026','giá đóng cửa 18/08/2026');
          html=html.replace('Giá theo dõi khóa EOD 12.08.2026','Giá theo dõi khóa EOD 18.08.2026');
          html=html.replace(/assets\/js\/site\.min\.js\?v=[^"']+/,'assets/js/site.min.js?v=20260818-full-sync1');
          fs.writeFileSync(htmlPath,html);
          if(fs.existsSync('full-sync-trigger.txt')) fs.rmSync('full-sync-trigger.txt');
          NODE
      - name: Run full regression suite
        run: node --test tests/*.test.mjs
      - name: Build production assets
        run: bash scripts/build/build-assets.sh
      - name: Audit site integrity
        run: node scripts/audit-site.mjs
      - name: Verify synchronization and immutability
        run: |
          git fetch origin main --depth=1
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm'; import { execFileSync } from 'node:child_process';
          const load=(text,key)=>{const c={window:{}};vm.runInNewContext(text,c);return c.window[key];};
          const currentResearch=load(fs.readFileSync('src/data/research-data.js','utf8'),'RESEARCH_DATA');
          const beforeResearch=load(execFileSync('git',['show','origin/main:src/data/research-data.js'],{encoding:'utf8'}),'RESEARCH_DATA');
          if(currentResearch.marketSession?.date!=='2026-08-18') throw new Error('marketSession date not synced');
          const indexMap=new Map(currentResearch.marketSession.indices.map(x=>[x.code,x]));
          if(indexMap.get('VN-INDEX')?.close!==1732.02 || indexMap.get('VN30')?.close!==1876.14 || indexMap.get('HNX-INDEX')?.close!==282.32) throw new Error('marketSession closes mismatch');
          if(JSON.stringify(currentResearch.coverage)!==JSON.stringify(beforeResearch.coverage)) throw new Error('coverage mutated');
          if(JSON.stringify(currentResearch.reports)!==JSON.stringify(beforeResearch.reports)) throw new Error('reports mutated');
          if(JSON.stringify(currentResearch.rankingMethod)!==JSON.stringify(beforeResearch.rankingMethod)) throw new Error('rankingMethod mutated');
          const daily=load(fs.readFileSync('src/data/daily-insights.js','utf8'),'DAILY_MARKET_INSIGHTS');
          if(daily.updated!=='2026-08-18' || daily.entries?.[0]?.date!=='2026-08-18') throw new Error('daily view not synced');
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('giá đóng cửa 18/08/2026')) throw new Error('meta description stale');
          if(!html.includes('Giá theo dõi khóa EOD 18.08.2026')) throw new Error('ledger asof fallback stale');
          if(!html.includes('data-role="ledger-baseline-at">12.08.2026</span>')) throw new Error('legitimate ledger baseline was changed');
          const order=[...html.matchAll(/<section\b[^>]*\bid=(['"])([^'"]+)\1[^>]*>/g)].map(m=>m[2]);
          const expected=['overview','daily-market','position-ledger','action-radar','research'];
          if(order.join(',')!==expected.join(',')) throw new Error('section order changed');
          const beforeCss=execFileSync('git',['show','origin/main:assets/css/site.min.css']);
          const afterCss=fs.readFileSync('assets/css/site.min.css');
          if(!beforeCss.equals(afterCss)) throw new Error('CSS changed');
          console.log(JSON.stringify({marketSession:currentResearch.marketSession,dailyLatest:daily.entries[0].id,sectionOrder:order},null,2));
          NODE
      - name: Persist validated candidate
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A src/data/research-data.js src/data/daily-insights.js index.html assets/js/site.min.js full-sync-trigger.txt 2>/dev/null || true
            git add src/data/research-data.js src/data/daily-insights.js index.html assets/js/site.min.js
            git commit -m 'Synchronize website content to EOD 18 Aug 2026'
            git push origin HEAD:${{ github.head_ref }}
          fi
