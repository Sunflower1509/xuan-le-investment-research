name: Verify live headings once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression suite
        run: node --test tests/*.test.mjs
      - name: Build and audit
        run: |
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"
      - name: Verify live artifact byte-for-byte
        run: |
          node scripts/verify-live-site.mjs \
            --site-url 'https://sunflower1509.github.io/xuan-le-investment-research/' \
            --artifact-root "${RUNNER_TEMP}/site"
      - name: Verify live heading strings
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://sunflower1509.github.io/xuan-le-investment-research/?heading-check=20260818' > /tmp/live.html
          grep -Fq 'Action Radar • EOD 18.08.2026' /tmp/live.html
          grep -Fq '<h2>XẾP HẠNG ƯU TIÊN</h2>' /tmp/live.html
          grep -Fq '<h3>VÙNG MUA THAM KHẢO</h3>' /tmp/live.html
          grep -Fq 'Giá khóa 18.08' /tmp/live.html
          grep -Fq '<h3>NHÓM KHÔNG ƯU TIÊN</h3>' /tmp/live.html
          grep -Fq '<h2>PHÂN LOẠI NHÓM NGÀNH.</h2>' /tmp/live.html
          grep -Fq 'data-role="report-tab-count">47</span>' /tmp/live.html
          grep -Fq 'data-role="coverage-tab-count">47</span>' /tmp/live.html
