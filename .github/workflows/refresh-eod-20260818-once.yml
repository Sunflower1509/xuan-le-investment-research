name: Apply verified EOD 18 Aug 2026 once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-eod-20260818-once.yml"
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  apply:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only verified market fields
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const DATA='src/data/research-data.js', VERIFIED='eod-20260818-verified.json', DATE='2026-08-18';
          const result=JSON.parse(fs.readFileSync(VERIFIED,'utf8'));
          if(result.date!==DATE||result.coverageCount!==47||result.verifiedCount!==47||!Array.isArray(result.quotes)||result.quotes.length!==47||result.errors?.length) throw new Error('Verified artifact gate failed');
          const code=fs.readFileSync(DATA,'utf8'),box={window:{}};vm.runInNewContext(code,box);const before=box.window.RESEARCH_DATA;
          const tickers=before.coverage.map(x=>String(x.ticker).toUpperCase()), qmap=new Map(result.quotes.map(x=>[x.ticker,x]));
          if(tickers.length!==47||new Set(tickers).size!==47||qmap.size!==47||tickers.some(t=>!qmap.has(t))) throw new Error('Coverage/quote set mismatch');
          const after=structuredClone(before);
          for(const item of after.coverage){const q=qmap.get(String(item.ticker).toUpperCase());for(const k of ['close','changePct','volume','priceDate','priceSource','priceSourceSecondary'])item[k]=q[k]}
          after.meta.updated=DATE;after.meta.release=DATE;
          const mm=Array.isArray(result.volumeMismatches)?result.volumeMismatches:[],matched=47-mm.length;
          const mmText=mm.length?mm.map(m=>`${m.ticker}: VNDIRECT ${Number(m.vndirect).toLocaleString('vi-VN')} vs DNSE ${Number(m.dnse).toLocaleString('vi-VN')} (chênh ${Math.abs(Number(m.diff)).toLocaleString('vi-VN')})`).join('; '):'không có chênh lệch';
          after.meta.note=`Giá đóng cửa, biến động và khối lượng khớp lệnh của 47/47 mã được khóa tại phiên 18/08/2026. Giá đóng cửa 47/47 mã khớp trực tiếp giữa VNDIRECT Finfo và DNSE EnTrade. Khối lượng khớp ${matched}/47 mã giữa hai nguồn; ${mmText}. Website dùng nmVolume từ VNDIRECT Finfo theo quy ước nguồn chính và không suy diễn nguyên nhân sai khác. Không dùng chuỗi giá lịch sử đã điều chỉnh; phần trăm biến động lấy từ dữ liệu phiên VNDIRECT. Vùng mua, fair value, target, stop, recommendation và điều kiện hành động giữ nguyên theo hồ sơ định giá đang công bố.`;
          function immutable(o){const x=structuredClone(o);delete x.meta.updated;delete x.meta.release;delete x.meta.note;for(const i of x.coverage)for(const k of ['close','changePct','volume','priceDate','priceSource','priceSourceSecondary'])delete i[k];return JSON.stringify(x)}
          if(immutable(before)!==immutable(after)) throw new Error('Prohibited field changed');
          fs.writeFileSync(DATA,`window.RESEARCH_DATA = ${JSON.stringify(after,null,2)};\n`);
          console.log(`Applied 47/47 verified quotes; volume mismatches=${mm.length}`);
          NODE
      - name: Tests build audit artifact
        shell: bash
        run: |
          set -euo pipefail
          node --check src/data/research-data.js
          node --test tests/trade-ledger.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"
      - name: Guard public structure
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- index.html reports favicon.svg robots.txt sitemap.xml .nojekyll src/data/daily-insights.js src/scripts src/styles tests scripts/audit-site.mjs scripts/process-trade-ledger.mjs
          grep -q 'id="overview"' index.html
          grep -q 'id="daily-market"' index.html
          grep -q 'id="position-ledger"' index.html
          grep -q 'id="action-radar"' index.html
          grep -q 'id="research"' index.html
      - name: Cleanup temporary files
        run: rm -f .github/workflows/refresh-eod-20260818-once.yml eod-20260818-verified.json
      - name: Commit verified EOD and cleanup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Lock verified EOD data for 18 Aug 2026 [skip ci]"
          file_pattern: "src/data/research-data.js assets/css/site.min.css assets/js/site.min.js .github/workflows/refresh-eod-20260818-once.yml eod-20260818-verified.json"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
