name: Confirm EOD 18 Aug 2026 deploy once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-eod-20260818-once.yml"
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  confirm:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify locked EOD data
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('src/data/research-data.js','utf8'),box={window:{}};vm.runInNewContext(code,box);const d=box.window.RESEARCH_DATA;
          if(d.meta?.updated!=='2026-08-18') throw new Error('meta.updated not locked');
          if(!Array.isArray(d.coverage)||d.coverage.length!==47) throw new Error('coverage count mismatch');
          for(const x of d.coverage){if(x.priceDate!=='2026-08-18'||!(x.close>0)||!(x.volume>=0)||!Number.isFinite(x.changePct)||!String(x.priceSource||'').includes('vndirect.com.vn')||!String(x.priceSourceSecondary||'').includes('entrade.com.vn')) throw new Error('invalid EOD coverage '+x.ticker)}
          console.log('Locked EOD verified for 47/47 coverage rows');
          NODE
      - name: Tests build audit artifact
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/trade-ledger.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"
      - name: Guard website structure
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- index.html reports favicon.svg robots.txt sitemap.xml .nojekyll src/data/daily-insights.js src/data/research-data.js src/scripts src/styles tests scripts/audit-site.mjs scripts/process-trade-ledger.mjs
          grep -q 'id="overview"' index.html
          grep -q 'id="daily-market"' index.html
          grep -q 'id="position-ledger"' index.html
          grep -q 'id="action-radar"' index.html
          grep -q 'id="research"' index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove one-time workflow after successful deploy
        run: rm -f .github/workflows/refresh-eod-20260818-once.yml
      - name: Commit deploy-confirmation cleanup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Confirm EOD 18 Aug 2026 deploy success [skip ci]"
          file_pattern: .github/workflows/refresh-eod-20260818-once.yml
