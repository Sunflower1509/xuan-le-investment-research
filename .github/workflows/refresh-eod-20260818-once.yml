name: Confirm EOD 18 Aug 2026 Pages deployment
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-eod-20260818-once.yml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  confirm:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify locked EOD and production integrity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');const box={window:{}};vm.runInNewContext(fs.readFileSync('src/data/research-data.js','utf8'),box);const d=box.window.RESEARCH_DATA;if(d.meta?.updated!=='2026-08-18'||!Array.isArray(d.coverage)||d.coverage.length!==47||d.coverage.some(x=>x.priceDate!=='2026-08-18'))throw new Error('EOD lock invalid');console.log('EOD lock valid: 47/47');
          NODE
          node --test tests/trade-ledger.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Cleanup workflow after successful deployment
        run: rm -f .github/workflows/refresh-eod-20260818-once.yml
      - name: Persist successful deployment cleanup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Confirm EOD 18 Aug 2026 Pages deployment [skip ci]"
          file_pattern: .github/workflows/refresh-eod-20260818-once.yml
