name: Temporary valuation report import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-firestorage-probe.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download and verify valuation PDFs
        shell: bash
        env:
          FIRE_API: "https://api.firestorage.ai/dev/file"
        run: |
          set -euo pipefail

          download_share() {
            local share="$1" output="$2" expected_sha="$3" expected_size="$4"
            local listing file_id payload download_url

            listing="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL "${FIRE_API}/shares/${share}/files?maxResults=1000")"
            file_id="$(printf '%s' "$listing" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["files"][0]["fileId"])')"
            [[ -n "$file_id" ]] || { echo "Missing fileId for share $share" >&2; exit 2; }

            payload="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL -X POST "${FIRE_API}/shares/${share}/files/${file_id}/download")"
            download_url="$(printf '%s' "$payload" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["downloadUrl"])')"
            [[ "$download_url" == https://* ]] || { echo "Invalid downloadUrl for share $share" >&2; exit 2; }

            mkdir -p "$(dirname "$output")"
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSL "$download_url" -o "$output"

            [[ "$(wc -c < "$output" | tr -d ' ')" == "$expected_size" ]] || { echo "Size mismatch: $output" >&2; exit 2; }
            printf '%s  %s\n' "$expected_sha" "$output" | sha256sum -c -
            [[ "$(head -c 5 "$output")" == "%PDF-" ]] || { echo "Invalid PDF signature: $output" >&2; exit 2; }
          }

          download_share "zZYSb3iJ0DCz" "reports/DCL_2026-09-18.pdf" "6292c04647218814a2bf96fdcb7f30e43c668cc49f235cf87832189cb8e705a5" "493987"
          download_share "PJPopoRJC2Is" "reports/KSV_2026-09-22.pdf" "196f914cc96b30f72342f2b4cfaee0a31cea726631660047f2b056f6e0bbfa0b" "244358"
          download_share "6j0S6XE-NSKM" "reports/VPB_2026-09-28.pdf" "3e4f8bfdf2903ebae057912ca311213bd681203809ed6f36649f8110e7212b11" "269758"
          download_share "Gb2l8zo67fvd" "reports/NKG_2026-09-28.pdf" "fb6f90ef9f4f351cf8f28d207199a40e6a08f73bd243f6afde3517d3699526be" "433211"

          rm -f reports/VPB_2026-08-18.pdf reports/NKG_2026-08-25.pdf

      - name: Migrate valuation registry without layout changes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const path = "src/data/research-data.js";
          const code = fs.readFileSync(path, "utf8");
          const context = { window: {} };
          vm.runInNewContext(code, context, { filename: path });
          const data = context.window.RESEARCH_DATA;
          if (!data || !Array.isArray(data.reports) || !Array.isArray(data.coverage)) {
            throw new Error("RESEARCH_DATA invalid");
          }

          const report = ({id,ticker,company,sector,exchange,date,recommendation,status,marketPrice,marketPriceDate,baseValue,valueLabel,rangeLow,rangeHigh,gapLabel,method,summary,action,file,edition}) => ({
            id,ticker,company,sector,exchange,date,recommendation,status,marketPrice,marketPriceDate,
            baseValue,valueLabel,rangeLow,rangeHigh,gapLabel,method,summary,action,file,edition,
            visual: {
              src: `assets/images/reports/${ticker.toLowerCase()}.webp?v=${date.replaceAll("-","")}-cover1`,
              alt: `Trang bìa báo cáo định giá ${ticker} ngày ${date.split("-").reverse().join("/")}`,
              caption: `Bìa báo cáo định giá ${ticker}`,
              sourceLabel: "Xuân Lê TVS Equity Research",
              sourceUrl: file,
              kind: "report-cover"
            }
          });

          const newReports = [
            report({
              id:"VPB-20260928", ticker:"VPB", company:"Ngân hàng TMCP Việt Nam Thịnh Vượng",
              sector:"Ngân hàng", exchange:"HOSE", date:"2026-09-28",
              recommendation:"THEO DÕI / CHỜ", status:"wait", marketPrice:23000, marketPriceDate:"2026-09-25",
              baseValue:21141, valueLabel:"Giá trị kỳ vọng", rangeLow:17405, rangeHigh:26008,
              gapLabel:"Giá 23.000 đồng/cp cao hơn giá trị kỳ vọng 21.141 đồng/cp khoảng 8,8%; chưa đạt ngưỡng mua có biên an toàn 15.856 đồng/cp.",
              method:"Thu nhập thặng dư (PP-06) + P/B-ROE (PP-07); P/B tương đối (PP-16) kiểm chứng",
              summary:"VPB có khoảng giá trị 17.405-26.008 đồng/cp và giá trị kỳ vọng 21.141 đồng/cp. Tại 23.000 đồng/cp ngày 25/09/2026, tín hiệu định giá là THEO DÕI và trạng thái giao dịch 1-3 tuần là CHỜ.",
              action:{
                zoneLow:null, zoneHigh:null, baseValue:21141, stop:null, targets:[],
                basisDate:"2026-09-28", recommendation:"THEO DÕI / CHỜ", eligibility:"inactive",
                condition:"Hiện CHƯA CÓ VÙNG MUA ngắn hạn hợp lệ. IF giá <=15.856 THEN mới đạt biên an toàn tối thiểu 25% cho tích lũy trung-dài hạn. IF 15.856 < giá <=21.141 THEN theo dõi/chờ. IF 21.141 < giá <=26.008 THEN không mua mới; IF giá >26.008 THEN tránh mua mới. Chỉ mở lại bài toán trading 1-3 tuần khi dữ liệu kỹ thuật cập nhật cho phép xác định stop 3-7%, target và R/R >=2."
              },
              file:"reports/VPB_2026-09-28.pdf", edition:"Bản định giá 28.09.2026"
            }),
            report({
              id:"NKG-20260928", ticker:"NKG", company:"Công ty Cổ phần Thép Nam Kim",
              sector:"Thép & sản phẩm thép", exchange:"HOSE", date:"2026-09-28",
              recommendation:"THEO DÕI / CHỜ", status:"wait", marketPrice:9700, marketPriceDate:"2026-09-25",
              baseValue:9714, valueLabel:"Giá trị kỳ vọng", rangeLow:3514, rangeHigh:18256,
              gapLabel:"Giá 9.700 đồng/cp gần như bằng giá trị kỳ vọng 9.714 đồng/cp; biên an toàn chỉ khoảng 0,1%, chưa phải vùng mua có MOS.",
              method:"Lợi nhuận chuẩn hóa chu kỳ (PP-13); DCF-FCFF và P/B tương đối dùng kiểm chứng",
              summary:"NKG có khoảng giá trị trước phát hành 3.514-18.256 đồng/cp và giá trị kỳ vọng 9.714 đồng/cp. Tín hiệu định giá THEO DÕI; giao dịch 1-3 tuần CHỜ do giá chưa có xác nhận MA20/MA50, dòng tiền và R/R tối thiểu 2.",
              action:{
                zoneLow:null, zoneHigh:null, baseValue:9714, stop:null, targets:[],
                basisDate:"2026-09-28", recommendation:"THEO DÕI / CHỜ", eligibility:"inactive",
                condition:"CHỜ giao dịch 1-3 tuần. Chỉ mở lại bài toán mua khi giá lấy lại MA20/MA50, có khối lượng xác nhận và R/R tối thiểu 2; trung-dài hạn chỉ chuyển sang vùng tích lũy khi giá về gần ngưỡng M 3.514 đồng/cp hoặc định giá được nâng đáng kể sau khi dự án Phú Mỹ chứng minh hiệu quả."
              },
              file:"reports/NKG_2026-09-28.pdf", edition:"Bản định giá 28.09.2026"
            }),
            report({
              id:"KSV-20260922", ticker:"KSV", company:"Tổng Công ty Khoáng sản TKV - CTCP",
              sector:"Khai khoáng & hàng hóa", exchange:"HNX", date:"2026-09-22",
              recommendation:"TRÁNH MUA MỚI", status:"reject", marketPrice:110200, marketPriceDate:"2026-09-21",
              baseValue:65071, valueLabel:"Giá trị kỳ vọng", rangeLow:37078, rangeHigh:96344,
              gapLabel:"Giá 110.200 đồng/cp cao hơn cận trên vùng giá trị 96.344 đồng/cp khoảng 14% và cao hơn giá trị kỳ vọng 65.071 đồng/cp khoảng 69%; không có biên an toàn cho mua mới.",
              method:"Resource NAV / DCF hàng hóa + EV/EBITDA; P/B dùng kiểm chứng",
              summary:"KSV có vùng giá trị hợp lý 37.078-96.344 đồng/cp, giá trị kỳ vọng 65.071 đồng/cp và vùng mua MOS 25-30% khoảng 45.550-48.804 đồng/cp. Báo cáo giữ tín hiệu TRÁNH MUA MỚI tại giá tham chiếu 110.200 đồng/cp; độ tin cậy dữ liệu TRUNG BÌNH.",
              action:{
                zoneLow:null, zoneHigh:null, baseValue:65071, stop:null, targets:[],
                basisDate:"2026-09-22", recommendation:"TRÁNH MUA MỚI", eligibility:"inactive",
                condition:"Không mở vị thế mới khi giá còn trên cận trên 96.344 đồng/cp. Vùng MOS 25-30% trong báo cáo là 45.550-48.804 đồng/cp; chỉ đánh giá lại khi giá/luận điểm thay đổi và dữ liệu trữ lượng 1P/2P, cash cost hoặc kết quả kinh doanh mới làm tăng độ tin cậy định giá."
              },
              file:"reports/KSV_2026-09-22.pdf", edition:"Bản định giá 22.09.2026"
            }),
            report({
              id:"DCL-20260918", ticker:"DCL", company:"Công ty Cổ phần Dược phẩm Cửu Long",
              sector:"Dược phẩm", exchange:"HOSE", date:"2026-09-18",
              recommendation:"TRÁNH / LOẠI MUA MỚI", status:"reject", marketPrice:42450, marketPriceDate:"2026-09-17",
              baseValue:24568, valueLabel:"Expected-value anchor", rangeLow:17300, rangeHigh:37500,
              gapLabel:"Giá 42.450 đồng/cp cao hơn cận trên 37.500 đồng/cp khoảng 13,2%; chưa có biên an toàn cho mua mới.",
              method:"DCF theo FCFF; kiểm chứng P/E, P/B và EV/EBITDA",
              summary:"DCL có khoảng giá trị hợp lý 17.300-37.500 đồng/cp và expected-value anchor 24.568 đồng/cp. Tại 42.450 đồng/cp ngày 17/09/2026, báo cáo xác định TRÁNH / LOẠI mua mới.",
              action:{
                zoneLow:17198, zoneHigh:18426, baseValue:24568, stop:17000, targets:[24600,31248],
                basisDate:"2026-09-18", recommendation:"TRÁNH / LOẠI MUA MỚI", eligibility:"active",
                condition:"IF giá >37.500 THEN LOẠI mua mới, không đuổi giá. IF giá 24.600-37.500 THEN CHỜ. IF giá 17.198-18.426 và nền tảng cơ bản không xấu thêm, thanh khoản xác nhận THEN CÓ THỂ MUA; entry tham chiếu 18.000, stop 17.000 (~-5,6%), target 24.600 rồi 31.248. IF EBIT margin/FCFF thấp hơn bear case hoặc nợ tăng mạnh THEN hủy luận điểm, không bình quân giá xuống."
              },
              file:"reports/DCL_2026-09-18.pdf", edition:"Bản định giá 18.09.2026"
            })
          ];

          const replaced = new Set(["VPB","NKG","KSV","DCL"]);
          data.reports = data.reports.filter((r) => !replaced.has(String(r.ticker || "").toUpperCase()));
          data.reports.push(...newReports);
          data.reports.sort((a,b) => b.date.localeCompare(a.date) || a.ticker.localeCompare(b.ticker));

          const reportMap = new Map(newReports.map((r) => [r.ticker, r]));
          const coverageMap = new Map(data.coverage.map((c) => [String(c.ticker || "").toUpperCase(), c]));
          for (const ticker of ["VPB","NKG"]) {
            const r = reportMap.get(ticker);
            const c = coverageMap.get(ticker);
            if (!c) throw new Error("Missing existing coverage " + ticker);
            c.company = r.company;
            c.sector = r.sector;
            c.exchange = r.exchange;
            c.reportId = r.id;
            c.action = structuredClone(r.action);
          }
          for (const ticker of ["DCL","KSV"]) {
            if (coverageMap.has(ticker)) throw new Error("Unexpected pre-existing coverage " + ticker);
            const r = reportMap.get(ticker);
            data.coverage.push({
              ticker, company:r.company, sector:r.sector, exchange:r.exchange, reportId:r.id,
              close:r.marketPrice, priceDate:"2026-09-27", changePct:0, volume:0,
              priceSource:"https://api-finfo.vndirect.com.vn/",
              priceSourceSecondary:"https://kbbuddywts.kbsec.com.vn/",
              action:structuredClone(r.action)
            });
          }
          data.coverage.sort((a,b) => a.ticker.localeCompare(b.ticker));

          const valuationReports = data.reports.filter((r) => r.reportType !== "trading");
          if (valuationReports.length !== 129 || data.coverage.length !== 129) {
            throw new Error(`Expected 129 valuation reports/coverage, got ${valuationReports.length}/${data.coverage.length}`);
          }
          const vt = valuationReports.map((r) => r.ticker);
          if (new Set(vt).size !== vt.length) throw new Error("Duplicate valuation ticker after migration");
          for (const ticker of replaced) {
            const arr = valuationReports.filter((r) => r.ticker === ticker);
            if (arr.length !== 1) throw new Error("Latest-only invariant failed for " + ticker);
          }

          fs.writeFileSync(path, `window.RESEARCH_DATA = ${JSON.stringify(data, null, 2)};\n`);
          NODE

      - name: Re-verify full 129-code EOD universe
        run: node scripts/update-eod-market-data.mjs --date 2026-09-28 --max-attempts 3 --wait-ms 5000

      - name: Generate synchronized report covers and logos
        run: |
          node scripts/sync-report-covers.mjs
          node scripts/sync-company-logos.mjs
          node scripts/ensure-company-visual-candidates.mjs

      - name: Preflight with temporary count-only first-paint patch
        shell: bash
        run: |
          set -euo pipefail
          cp index.html "${RUNNER_TEMP}/index.html.original"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          old1='data-role="report-tab-count">127</span>'
          old2='data-role="coverage-tab-count">127</span>'
          if s.count(old1)!=1 or s.count(old2)!=1:
              raise SystemExit("Expected exactly one 127 report/coverage count")
          s=s.replace(old1,'data-role="report-tab-count">129</span>')
          s=s.replace(old2,'data-role="coverage-tab-count">129</span>')
          p.write_text(s)
          PY

          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          node scripts/audit-report-covers.mjs
          node scripts/audit-company-logos.mjs

          cp "${RUNNER_TEMP}/index.html.original" index.html
          git checkout -- assets/js/site.min.js

      - name: Commit report synchronization atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             reports             src/data/research-data.js             src/data/company-logos.js             src/data/company-visual-candidates.json             assets/images/reports             assets/images/logos

          echo "== staged paths =="
          git diff --cached --name-status

          git diff --cached --quiet && { echo "No import changes to commit" >&2; exit 3; }
          git commit -m "Publish latest DCL KSV VPB NKG valuation reports"
          git push origin HEAD:main
