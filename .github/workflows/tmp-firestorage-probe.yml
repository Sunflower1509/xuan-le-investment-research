name: Temporary Firestorage Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-firestorage-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Firestorage client API
        shell: bash
        env:
          BASE: "https://firestorage.ai"
          SHARE_URL: "https://firestorage.ai/ja/f/zZYSb3iJ0DCz"
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error "$SHARE_URL" -o /tmp/page.html
          python3 - <<'PY' > /tmp/chunks.txt
          from pathlib import Path
          import re
          s=Path('/tmp/page.html').read_text(encoding='utf-8',errors='replace')
          for x in re.findall(r'<script[^>]+src="([^"]+)"',s,re.I):
              if x.startswith('/'):
                  print(x)
          PY
          echo "== script chunks =="
          cat /tmp/chunks.txt
          mkdir -p /tmp/js
          n=0
          while IFS= read -r p; do
            n=$((n+1))
            curl -L --fail --silent --show-error "$BASE$p" -o "/tmp/js/$n.js"
          done < /tmp/chunks.txt
          echo "== API/download strings =="
          grep -RaoE '.{0,180}(api/|download|shareId|share_id|publicId|public_id|signed|presign|token).{0,260}' /tmp/js | head -n 220 || true
          echo "== URL-like strings =="
          grep -RaoE 'https?://[^"'"'<> ]+' /tmp/js | head -n 120 || true
