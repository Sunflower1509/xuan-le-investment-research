name: Temporary Firestorage Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-firestorage-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Firestorage share
        shell: bash
        env:
          SHARE_URL: "https://firestorage.ai/ja/f/zZYSb3iJ0DCz"
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error -D /tmp/headers.txt "$SHARE_URL" -o /tmp/body
          echo "== headers =="
          sed -n '1,80p' /tmp/headers.txt
          echo "== file =="
          file /tmp/body
          wc -c /tmp/body
          echo "== signature =="
          head -c 16 /tmp/body | xxd
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/body')
          b=p.read_bytes()
          print("DIRECT_PDF=" + ("true" if b.startswith(b"%PDF-") else "false"))
          if not b.startswith(b"%PDF-"):
              s=b.decode("utf-8","replace")
              print("== hrefs ==")
              for x in re.findall(r'href=["\']([^"\']+)["\']',s,re.I)[:120]:
                  print(x)
              print("== urls ==")
              for x in re.findall(r'https?://[^"\'<>\s]+',s,re.I)[:120]:
                  print(x)
              print("== matching fragments ==")
              for m in re.finditer(r'(?i).{0,180}(download|file_id|fileId|public_id|publicId|DCL_18|493987).{0,300}',s):
                  print(m.group(0)[:600])
          PY
