name: Persist verified EOD exceptions 2026-09-17

on:
  push:
    paths:
      - ".github/workflows/eod-fix-20260917.yml"
      - "scripts/patch-eod-20260917.mjs"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply exact-date verified exceptions
        run: node scripts/patch-eod-20260917.mjs

      - name: Run regression tests
        run: node --test tests/*.test.mjs

      - name: Guard exact mutation scope and commit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/update-eod-market-data\.mjs|tests/eod-market-data\.test\.mjs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed paths:" >&2
            echo "$unexpected" >&2
            exit 2
          fi
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
          test "$count" -eq 2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update-eod-market-data.mjs tests/eod-market-data.test.mjs
          git commit -m "Verify 2026-09-17 EOD mismatch exceptions [skip ci]"
          git push origin HEAD:main

      - name: Dispatch verified EOD pipeline for 2026-09-17
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run eod-daily.yml --ref main -f date=2026-09-17
