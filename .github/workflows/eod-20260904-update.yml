name: EOD 04-09 market update

on:
  push:
    branches:
      - auto/eod-20260904
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v5
        with:
          ref: auto/eod-20260904
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Insert verified EOD market view
        run: python scripts/update-eod-20260904.py

      - name: Guard mutation scope
        run: |
          set -euo pipefail
          files="$(git diff --name-only)"
          test "$files" = "src/data/daily-insights.js"
          git diff --exit-code -- index.html

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Audit site integrity
        run: node scripts/audit-site.mjs

      - name: Audit report covers
        run: node scripts/audit-report-covers.mjs

      - name: Audit company logos
        run: node scripts/audit-company-logos.mjs

      - name: Commit verified market update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/daily-insights.js
          git commit -m "Update daily market view for 04-09-2026 [skip ci]"
          git push origin HEAD:auto/eod-20260904
