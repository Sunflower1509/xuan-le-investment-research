name: Deploy Online Presence Worker

on:
  workflow_dispatch:
    inputs:
      workers_subdomain:
        description: "Cloudflare workers.dev account subdomain (without .workers.dev)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: online-presence-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate deployment inputs
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_SUBDOMAIN: ${{ inputs.workers_subdomain }}
        run: |
          set -euo pipefail
          [[ -n "$CF_API_TOKEN" ]] || { echo "Missing CLOUDFLARE_API_TOKEN secret" >&2; exit 2; }
          [[ -n "$CF_ACCOUNT_ID" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret" >&2; exit 2; }
          [[ "$WORKERS_SUBDOMAIN" =~ ^[a-zA-Z0-9-]+$ ]] || { echo "Invalid workers.dev subdomain" >&2; exit 2; }

      - name: Install Worker tooling
        working-directory: workers/presence
        run: npm install --no-audit --no-fund

      - name: Deploy Worker and Durable Object
        working-directory: workers/presence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify Worker health
        shell: bash
        env:
          WORKERS_SUBDOMAIN: ${{ inputs.workers_subdomain }}
        run: |
          set -euo pipefail
          endpoint="https://xuan-le-online-presence.${WORKERS_SUBDOMAIN}.workers.dev/health"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$endpoint"
          echo

      - name: Rebase onto latest main before activation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git rebase origin/main

      - name: Activate frontend endpoint
        shell: bash
        env:
          WORKERS_SUBDOMAIN: ${{ inputs.workers_subdomain }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const subdomain = process.env.WORKERS_SUBDOMAIN;
          const config = {
            version: 1,
            enabled: true,
            websocketUrl: `wss://xuan-le-online-presence.${subdomain}.workers.dev/v1/presence`,
          };
          fs.writeFileSync('assets/js/presence-config.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Commit activation config
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/js/presence-config.json; then
            echo "Presence frontend already points to this endpoint."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/presence-config.json
          git commit -m "Activate Online Presence v1 endpoint"
          git push origin HEAD:main
