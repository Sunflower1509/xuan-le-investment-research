name: Verify EOD 20260819 live once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regression build audit
        run: |
          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"
      - name: Verify semantic EOD state
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm';
          const code=fs.readFileSync('src/data/research-data.js','utf8'); const s={window:{}}; vm.runInNewContext(code,s); const d=s.window.RESEARCH_DATA;
          if(d.meta.updated!=='2026-08-19') throw new Error(`meta.updated ${d.meta.updated}`);
          if(d.coverage.length!==47) throw new Error(`coverage ${d.coverage.length}`);
          const bad=d.coverage.filter(x=>x.priceDate!=='2026-08-19'||!Number.isFinite(x.close)); if(bad.length) throw new Error(`bad coverage ${bad.map(x=>x.ticker)}`);
          if(d.marketSession?.date!=='2026-08-19') throw new Error(`marketSession ${d.marketSession?.date}`);
          const expected={"VN-INDEX":[1726.69,-5.32999999999993,-0.307733167053492],"VN30":[1875.73,-0.410000000000082,-0.0218533798117426],"HNX-INDEX":[279.98,-2.33999999999997,-0.828846698781516]};
          for(const x of d.marketSession.indices){const e=expected[x.code]; if(!e||x.close!==e[0]||x.change!==e[1]||x.changePct!==e[2]) throw new Error(`index mismatch ${x.code}`);}
          const b=d.marketSession.breadth; if(b.advance!==95||b.decline!==214||b.unchanged!==52||b.floor!==6) throw new Error(`breadth ${JSON.stringify(b)}`);
          const html=fs.readFileSync('index.html','utf8'); const order=[...html.matchAll(/<section\b[^>]*\bid=(['"])([^'"]+)\1[^>]*>/g)].map(m=>m[2]); const exp=['overview','daily-market','position-ledger','action-radar','research']; if(order.join(',')!==exp.join(',')) throw new Error(`section order ${order}`);
          console.log('EOD_SEMANTICS_OK',JSON.stringify({coverage:47,marketSession:d.marketSession}));
          NODE
      - name: Verify live artifact byte-for-byte
        run: node scripts/verify-live-site.mjs --site-url 'https://sunflower1509.github.io/xuan-le-investment-research/' --artifact-root "${RUNNER_TEMP}/site" --attempts 18 --wait-ms 10000
