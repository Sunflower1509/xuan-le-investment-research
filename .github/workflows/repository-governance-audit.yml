name: Repository governance audit

on:
  pull_request:
    paths:
      - ".github/governance/**"
      - ".github/workflows/branch-hygiene.yml"
      - ".github/workflows/repository-governance-audit.yml"
      - "scripts/audit-repository-governance.mjs"
      - "tests/branch-hygiene.test.mjs"
      - "tests/repository-governance.test.mjs"
      - "docs/REPOSITORY_GOVERNANCE.md"
  push:
    branches:
      - main
    paths:
      - ".github/governance/**"
      - ".github/workflows/branch-hygiene.yml"
      - ".github/workflows/repository-governance-audit.yml"
      - "scripts/audit-repository-governance.mjs"
      - "tests/branch-hygiene.test.mjs"
      - "tests/repository-governance.test.mjs"
      - "docs/REPOSITORY_GOVERNANCE.md"
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-governance-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run repository governance audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-repository-governance.mjs
