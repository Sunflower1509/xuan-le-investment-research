name: Temporary 5-report valuation import 2026-10-02

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-governance-audit.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download and verify valuation PDFs
        shell: bash
        env:
          FIRE_API: "https://api.firestorage.ai/dev/file"
          SHARE_ID: "i5b6XRfiQYtG"
        run: |
          set -euo pipefail
          listing="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL "${FIRE_API}/shares/${SHARE_ID}/files?maxResults=1000")"

          download_one() {
            local wanted="$1" output="$2" expected_sha="$3" expected_size="$4"
            local file_id payload url
            file_id="$(printf '%s' "$listing" | python3 -c 'import json,sys; w=sys.argv[1]; d=json.load(sys.stdin); m=[f for f in d.get("files",[]) if f.get("fileName")==w or f.get("name")==w]; assert len(m)==1, (w,len(m)); print(m[0].get("fileId") or m[0].get("id"))' "$wanted")"
            payload="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL -X POST "${FIRE_API}/shares/${SHARE_ID}/files/$file_id/download")"
            url="$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')"
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSL "$url" -o "$output"
            test "$(wc -c < "$output" | tr -d ' ')" = "$expected_size"
            echo "$expected_sha  $output" | sha256sum -c -
            test "$(head -c 5 "$output")" = "%PDF-"
          }

          download_one "SHS_2026-10-02.pdf" "reports/SHS_2026-10-02.pdf" "eac64596c391d259444efb94430ac6aeea531f4220a9390476f17cb414fab38a" "469680"
          download_one "BVH_2026-10-02.pdf" "reports/BVH_2026-10-02.pdf" "f8f5f380b992ca182cbeef7150e963612c6705f3dcedf5a13af1b70a9ed47893" "393734"
          download_one "PNJ_2026-10-02.pdf" "reports/PNJ_2026-10-02.pdf" "ededa08cdb230fa08c24083ac7494c04743eca634079cb412990b93e1bd0d877" "501140"
          download_one "SSB_2026-10-02.pdf" "reports/SSB_2026-10-02.pdf" "90f99269ad9b052cda61979a33a147cd54f6129c44bd09bcdfe86c83ba08f33f" "530135"
          download_one "DHC_2026-10-02.pdf" "reports/DHC_2026-10-02.pdf" "335bd92e41ba9c533ba6250aa266c608916307e5bce4c7bddfccc072a467f6bd" "122138"

          rm -f reports/BVH_2026-08-31.pdf
          rm -f reports/DHC_2026-09-09.pdf
          rm -f reports/PNJ_2026-08-19.pdf
          rm -f reports/SHS_Equity_Valuation_Report_Xuan_Le_TVS_2026-08-12.pdf
          rm -f reports/SSB_2026-08-26.pdf

      - name: Replace valuation registry and preserve EOD snapshot
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("node:fs"), vm=require("node:vm");
          const path="src/data/research-data.js";
          const sandbox={window:{}};
          vm.runInNewContext(fs.readFileSync(path,"utf8"),sandbox,{filename:path});
          const data=sandbox.window.RESEARCH_DATA;
          const tickers=["SHS","BVH","PNJ","SSB","DHC"];
          const set=new Set(tickers);
          const old=data.reports.filter(r=>set.has(String(r.ticker||"").toUpperCase()));
          if(old.some(r=>String(r.date||"")>"2026-10-02")) throw new Error("Newer report already exists");

          const reports=[
            {
              id:"SHS-20261002",ticker:"SHS",company:"Công ty Cổ phần Chứng khoán Sài Gòn - Hà Nội",sector:"Chứng khoán",exchange:"HNX",
              date:"2026-10-02",recommendation:"THẬN TRỌNG / CHỜ",status:"wait",
              marketPrice:13300,marketPriceDate:"2026-10-01",baseValue:12977,valueLabel:"Giá trị kỳ vọng",
              rangeLow:9190,rangeHigh:16860,
              gapLabel:"P0 13.300 đồng/cp cao hơn GTKV 12.977 đồng/cp khoảng 2,5% nhưng vẫn dưới cận trên 16.860 đồng/cp; tín hiệu định giá là THẬN TRỌNG.",
              method:"PP-14 theo từng mảng 36,84% + PP-06 thu nhập thặng dư 26,32% + PP-16 P/B/P/E 36,84%; PP-18 trọng số 0",
              summary:"SHS có vùng giá trị 9.190-16.860 đồng/cp và GTKV 12.977 đồng/cp. P0 13.300 đồng/cp cao hơn GTKV khoảng 2,5%, trong khi giá dưới MA20/MA50, khối lượng xác nhận chưa đạt và sức mạnh tương đối 20 phiên yếu hơn VN-Index; trạng thái 1-3 tuần là CHỜ.",
              action:{zoneLow:null,zoneHigh:null,baseValue:12977,stop:null,targets:[],basisDate:"2026-10-02",recommendation:"CHỜ - CHƯA CÓ VÙNG MUA HỢP LỆ",eligibility:"inactive",condition:"Hiện tại CHỜ. Cấu hình 12.900-13.050 đồng/cp chỉ được xem xét lại nếu giữ hỗ trợ 12.700, có phiên xác nhận khối lượng >= khoảng 11,2 triệu cp, sức mạnh tương đối cải thiện và tín hiệu định giá đồng thời được nâng tối thiểu về THEO DÕI. Khi đó stop tham chiếu 12.500, T1 14.200 và R/R tại cận trên vùng kiểm tra khoảng 2,09; chưa kích hoạt mua tự động."},
              file:"reports/SHS_2026-10-02.pdf",edition:"Bản định giá 02.10.2026",
              visual:{src:"assets/images/reports/shs.webp?v=20261002-cover1",alt:"Trang bìa báo cáo định giá SHS ngày 02/10/2026",caption:"Bìa báo cáo định giá SHS",sourceLabel:"Xuân Lê TVS Equity Research",sourceUrl:"reports/SHS_2026-10-02.pdf",kind:"report-cover"}
            },
            {
              id:"BVH-20261002",ticker:"BVH",company:"Tập đoàn Bảo Việt",sector:"Bảo hiểm",exchange:"HOSE",
              date:"2026-10-02",recommendation:"THẬN TRỌNG / CHỜ",status:"wait",
              marketPrice:74500,marketPriceDate:"2026-10-01",baseValue:55004,valueLabel:"Giá trị kỳ vọng",
              rangeLow:34962,rangeHigh:79037,
              gapLabel:"P0 74.500 đồng/cp cao hơn GTKV 55.004 đồng/cp khoảng 35,4% nhưng chưa vượt cận trên 79.037 đồng/cp; tín hiệu định giá là THẬN TRỌNG.",
              method:"PP-06 thu nhập thặng dư 53,85% + PP-07 P/B hợp lý theo ROE 46,15%; PP-16 và PP-18 trọng số 0",
              summary:"BVH có vùng giá trị 34.962-79.037 đồng/cp và GTKV 55.004 đồng/cp. Kỹ thuật ngắn hạn mạnh nhưng định giá đang ở vùng THẬN TRỌNG; quy tắc ưu tiên chặn lệnh mua mới nên trạng thái 1-3 tuần là CHỜ.",
              action:{zoneLow:null,zoneHigh:null,baseValue:55004,stop:null,targets:[],basisDate:"2026-10-02",recommendation:"CHỜ - KHÔNG KÍCH HOẠT MUA MỚI",eligibility:"inactive",condition:"Không có vùng mua/stop/target/R/R hợp lệ ở mức giá hiện tại. Chỉ đánh giá lại khi tín hiệu định giá tối thiểu về THEO DÕI (P <= GTKV hoặc GTKV được nâng có căn cứ), đồng thời kỹ thuật vẫn xác nhận, stop nằm 3-7% dưới giá mua và R/R >=2."},
              file:"reports/BVH_2026-10-02.pdf",edition:"Bản định giá 02.10.2026",
              visual:{src:"assets/images/reports/bvh.webp?v=20261002-cover1",alt:"Trang bìa báo cáo định giá BVH ngày 02/10/2026",caption:"Bìa báo cáo định giá BVH",sourceLabel:"Xuân Lê TVS Equity Research",sourceUrl:"reports/BVH_2026-10-02.pdf",kind:"report-cover"}
            },
            {
              id:"PNJ-20261002",ticker:"PNJ",company:"Công ty Cổ phần Vàng bạc Đá quý Phú Nhuận",sector:"Tiêu dùng",exchange:"HOSE",
              date:"2026-10-02",recommendation:"THẬN TRỌNG / LOẠI",status:"reject",
              marketPrice:24750,marketPriceDate:"2026-10-01",baseValue:47698,valueLabel:"Giá trị kỳ vọng",
              rangeLow:21333,rangeHigh:81048,
              gapLabel:"P0 24.750 đồng/cp thấp hơn GTKV 47.698 đồng/cp khoảng 48,1%, nhưng cảnh báo mức CAO và độ tin cậy dữ liệu THẤP buộc tín hiệu cuối hạ xuống THẬN TRỌNG; giao dịch 1-3 tuần là LOẠI.",
              method:"PP-01 DCF-FCFF 60% + PP-16 P/E lịch sử 40%; PP-05 lợi nhuận kinh tế và PP-18 DCF ngược trọng số 0",
              summary:"PNJ có vùng giá trị 21.333-81.048 đồng/cp và GTKV 47.698 đồng/cp, nhưng báo cáo ghi nhận cú sốc dự phòng/nghĩa vụ thu đổi, phương án phát hành riêng lẻ lớn chưa khóa và kỹ thuật ngắn hạn suy yếu mạnh. Tín hiệu cuối là THẬN TRỌNG và trạng thái 1-3 tuần là LOẠI.",
              action:{zoneLow:null,zoneHigh:null,baseValue:47698,stop:null,targets:[],basisDate:"2026-10-02",recommendation:"LOẠI - KHÔNG MUA MỚI",eligibility:"veto",condition:"Không kích hoạt vùng mua, stoploss, target hay R/R cho lệnh mới. Chỉ sau khi ĐHĐCĐ bất thường/giả định dự phòng và phát hành được khóa, cổ phiếu hình thành nền mới, đóng cửa trở lại trên MA20 và MA50, MA20 dốc lên, khối lượng vượt nền >=1,5x TB20 và sức mạnh tương đối 20 phiên dương so với VN-Index mới chuyển sang bước xác định vùng mua - stop 3-7% - target - R/R >=2."},
              file:"reports/PNJ_2026-10-02.pdf",edition:"Bản định giá 02.10.2026",
              visual:{src:"assets/images/reports/pnj.webp?v=20261002-cover1",alt:"Trang bìa báo cáo định giá PNJ ngày 02/10/2026",caption:"Bìa báo cáo định giá PNJ",sourceLabel:"Xuân Lê TVS Equity Research",sourceUrl:"reports/PNJ_2026-10-02.pdf",kind:"report-cover"}
            },
            {
              id:"SSB-20261002",ticker:"SSB",company:"Ngân hàng TMCP Đông Nam Á",sector:"Ngân hàng",exchange:"HOSE",
              date:"2026-10-02",recommendation:"THẬN TRỌNG / CHỜ",status:"wait",
              marketPrice:17750,marketPriceDate:"2026-10-01",baseValue:14031,valueLabel:"Giá trị kỳ vọng",
              rangeLow:10744,rangeHigh:17979,
              gapLabel:"P0 17.750 đồng/cp cao hơn GTKV 14.031 đồng/cp khoảng 26,5% và chỉ thấp hơn cận trên 17.979 đồng/cp khoảng 1,3%; tín hiệu định giá là THẬN TRỌNG.",
              method:"PP-06 thu nhập thặng dư 33,33% + PP-07 P/B-ROE 38,10% + PP-16 P/B tương đối 28,57%; PP-18 trọng số 0",
              summary:"SSB có vùng giá trị 10.744-17.979 đồng/cp và GTKV 14.031 đồng/cp. Giá dưới MA20/MA50, khối lượng phiên 01/10 chỉ bằng khoảng 0,74 lần TB20 và nền giá chưa chặt; trạng thái 1-3 tuần là CHỜ, chưa có vùng mua hợp lệ.",
              action:{zoneLow:null,zoneHigh:null,baseValue:14031,stop:null,targets:[],basisDate:"2026-10-02",recommendation:"CHỜ - CHƯA CÓ VÙNG MUA HỢP LỆ",eligibility:"inactive",condition:"Không có vùng mua hợp lệ hiện tại. Giá đóng cửa >18.450 với khối lượng >= khoảng 5,46 triệu cp chỉ là xác nhận kỹ thuật sơ bộ, chưa mở vị thế nếu định giá chưa thay đổi. Nếu giá về 14.000-14.600 và tạo nền chặt trên MA20/MA50 thì chạy lại định giá + kỹ thuật. Nếu thủng 17.450 với khối lượng tăng thì không bắt đáy; tiếp tục CHỜ. Mọi lệnh mua tương lai phải có stop 3-7%, T1/T2 không vượt U và R/R >=2."},
              file:"reports/SSB_2026-10-02.pdf",edition:"Bản định giá 02.10.2026",
              visual:{src:"assets/images/reports/ssb.webp?v=20261002-cover1",alt:"Trang bìa báo cáo định giá SSB ngày 02/10/2026",caption:"Bìa báo cáo định giá SSB",sourceLabel:"Xuân Lê TVS Equity Research",sourceUrl:"reports/SSB_2026-10-02.pdf",kind:"report-cover"}
            },
            {
              id:"DHC-20261002",ticker:"DHC",company:"Công ty Cổ phần Đông Hải Bến Tre",sector:"Giấy & bao bì",exchange:"HOSE",
              date:"2026-10-02",recommendation:"THEO DÕI / CHỜ",status:"wait",
              marketPrice:39050,marketPriceDate:"2026-10-01",baseValue:44300,valueLabel:"Giá trị kỳ vọng",
              rangeLow:29300,rangeHigh:67900,
              gapLabel:"P0 39.050 đồng/cp thấp hơn GTKV 44.300 đồng/cp khoảng 11,9% nhưng chưa đạt ngưỡng mua M 29.300 đồng/cp; tín hiệu định giá là THEO DÕI.",
              method:"PP-13 lợi nhuận chuẩn hóa 60% + PP-01 DCF-FCFF chuẩn hóa 40%; PP-16 tham chiếu và PP-18 trọng số 0",
              summary:"DHC có vùng giá trị 29.300-67.900 đồng/cp và GTKV 44.300 đồng/cp. Dù sức mạnh tương đối khá, phiên 01/10 chưa có xác nhận khối lượng và R/R tại điểm vượt nền gần 40.000 đồng chưa đạt 2; trạng thái 1-3 tuần là CHỜ.",
              action:{zoneLow:null,zoneHigh:null,baseValue:44300,stop:null,targets:[],basisDate:"2026-10-02",recommendation:"CHỜ - CHƯA CÓ SETUP R/R HỢP LỆ",eligibility:"inactive",condition:"Kháng cự gần 40.000-41.650 đồng, hỗ trợ 36.000-36.500 đồng. Chỉ đánh giá lại sau khi vượt 40.000-41.650 với khối lượng >= khoảng 1,5x TB20; khi đó stop phải nằm 3-7% dưới giá mua và dưới hỗ trợ gần nhất, đồng thời R/R phải >=2. Hiện R/R chưa đạt 2 nên chưa kích hoạt mua. Cần điều chỉnh dữ liệu kỹ thuật sau GDKHQ cổ tức 1.000 đồng/cp ngày 05/10/2026."},
              file:"reports/DHC_2026-10-02.pdf",edition:"Bản định giá 02.10.2026",
              visual:{src:"assets/images/reports/dhc.webp?v=20261002-cover1",alt:"Trang bìa báo cáo định giá DHC ngày 02/10/2026",caption:"Bìa báo cáo định giá DHC",sourceLabel:"Xuân Lê TVS Equity Research",sourceUrl:"reports/DHC_2026-10-02.pdf",kind:"report-cover"}
            }
          ];

          const replacements=new Map(reports.map(r=>[r.ticker,r]));
          data.reports=data.reports.filter(r=>!set.has(String(r.ticker||"").toUpperCase())).concat(reports);
          data.reports.sort((a,b)=>b.date.localeCompare(a.date)||a.ticker.localeCompare(b.ticker));

          for(const r of reports){
            const c=data.coverage.find(x=>x.ticker===r.ticker);
            if(!c) throw new Error(r.ticker+" coverage missing");
            if(c.priceDate!=="2026-10-01") throw new Error(r.ticker+" EOD snapshot is not locked at 2026-10-01");
            if(Number(c.close)!==r.marketPrice) throw new Error(r.ticker+" report P0 does not match locked 01/10 close");
            const snap={close:c.close,priceDate:c.priceDate,changePct:c.changePct,volume:c.volume,priceSource:c.priceSource,priceSourceSecondary:c.priceSourceSecondary};
            c.reportId=r.id;
            c.action=structuredClone(r.action);
            for(const [k,v] of Object.entries(snap)) if(c[k]!==v) throw new Error(r.ticker+" EOD field mutated: "+k);
          }

          const vals=data.reports.filter(r=>r.reportType!=="trading");
          if(vals.length!==130||data.coverage.length!==130) throw new Error("Expected 130 valuation reports and coverage");
          if(new Set(vals.map(r=>r.ticker)).size!==130||new Set(data.coverage.map(c=>c.ticker)).size!==130) throw new Error("Duplicate ticker invariant failed");
          for(const t of tickers){
            const r=replacements.get(t), c=data.coverage.find(x=>x.ticker===t);
            if(vals.filter(x=>x.ticker===t).length!==1) throw new Error("Latest-only report invariant failed for "+t);
            if(c.reportId!==r.id||c.action?.basisDate!==r.date||c.action?.eligibility!==r.action.eligibility) throw new Error("Coverage sync failed for "+t);
          }
          if(typeof data.meta?.note==="string"){
            const msg=" Báo cáo định giá SHS, BVH, PNJ, SSB và DHC đã được thay bằng bản 02/10/2026; các bản cũ tương ứng được loại theo quy tắc latest-only. Registry, action plan và ảnh bìa đồng bộ theo báo cáo mới; dữ liệu EOD 01/10/2026 được giữ nguyên.";
            if(!data.meta.note.includes("Báo cáo định giá SHS, BVH, PNJ, SSB và DHC đã được thay bằng bản 02/10/2026")) data.meta.note=data.meta.note.trim()+msg;
          }
          fs.writeFileSync(path,"window.RESEARCH_DATA = "+JSON.stringify(data,null,2)+";\n");

          const ledgerPath="src/data/trade-ledger.json";
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,"utf8"));
          let adjusted=0;
          for(const event of ledger.events||[]){
            if(typeof event.reportFile==="string"&&event.reportFile&&!fs.existsSync(event.reportFile)){
              const removed=event.reportFile;
              event.reportFile=null;
              const extra=" PDF nguồn lịch sử "+String(event.reportId||removed)+" đã được loại khỏi kho public theo quy tắc latest-only; reportId và toàn bộ thông số kích hoạt lịch sử được giữ nguyên.";
              if(!String(event.note||"").includes("đã được loại khỏi kho public theo quy tắc latest-only")) event.note=String(event.note||"").trim()+extra;
              adjusted++;
            }
          }
          if(adjusted<2) throw new Error("Expected at least the existing VPB stale link and superseded PNJ link to be neutralized, got "+adjusted);
          fs.writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+"\n");
          console.log(JSON.stringify({replaced:old.map(r=>({ticker:r.ticker,id:r.id,date:r.date,file:r.file})),newReports:reports.map(r=>({ticker:r.ticker,id:r.id,file:r.file})),historicalLedgerRefsAdjusted:adjusted},null,2));
          NODE

      - name: Regenerate report covers and run integrity checks
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/images/reports/shs.webp assets/images/reports/bvh.webp assets/images/reports/pnj.webp assets/images/reports/ssb.webp assets/images/reports/dhc.webp
          node scripts/sync-report-covers.mjs

          command -v pdfinfo >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null; }
          test "$(pdfinfo reports/SHS_2026-10-02.pdf | awk '/^Pages:/ {print $2}')" = "24"
          test "$(pdfinfo reports/BVH_2026-10-02.pdf | awk '/^Pages:/ {print $2}')" = "15"
          test "$(pdfinfo reports/PNJ_2026-10-02.pdf | awk '/^Pages:/ {print $2}')" = "18"
          test "$(pdfinfo reports/SSB_2026-10-02.pdf | awk '/^Pages:/ {print $2}')" = "19"
          test "$(pdfinfo reports/DHC_2026-10-02.pdf | awk '/^Pages:/ {print $2}')" = "8"

          node --test $(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'repository-governance.test.mjs' -print | sort)
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          node scripts/audit-report-covers.mjs
          node scripts/audit-company-logos.mjs
          node scripts/audit-company-visuals.mjs

          layout_changes="$(git status --porcelain --untracked-files=all -- index.html src/index.css src/styles src/scripts)"
          test -z "$layout_changes"

          for t in SHS BVH PNJ SSB DHC; do
            count="$(find reports -maxdepth 1 -type f -iname "${t}*.pdf" | wc -l | tr -d ' ')"
            test "$count" = "1"
          done

          node <<'NODE'
          const fs=require("node:fs"),vm=require("node:vm");
          const s={window:{}}; vm.runInNewContext(fs.readFileSync("src/data/research-data.js","utf8"),s);
          const d=s.window.RESEARCH_DATA;
          const fsPaths=new Set(fs.readdirSync("reports").filter(x=>x.toLowerCase().endsWith(".pdf")).map(x=>"reports/"+x));
          for(const r of d.reports.filter(x=>x.reportType!=="trading")){
            const p=String(r.file||"").split("?")[0];
            if(!fsPaths.has(p)) throw new Error("Missing referenced report PDF: "+p);
          }
          const ledger=JSON.parse(fs.readFileSync("src/data/trade-ledger.json","utf8"));
          for(const e of ledger.events||[]){
