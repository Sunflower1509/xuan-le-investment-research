name: XSMB DAILY Settle 2026-09-22

on:
  push:
    branches: ["xsmb-ops-hardening-v1"]
    paths:
      - ".github/workflows/xsmb-daily-settle-20260922.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: xsmb-production-writer
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.12"

      - name: Install exact frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r xsmb_runtime/requirements-runtime.txt

      - name: Download immutable locked 22 Sep production artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xsmb-run-next-20260922-locked
          path: locked
          github-token: ${{ github.token }}
          run-id: 35604071047

      - name: Materialize and verify canonical pre-settlement state
        run: |
          cp locked/production.xlsx settlement.xlsx
          mkdir -p manifests
          cp locked/manifests/*.json manifests/
          test "$(sha256sum settlement.xlsx | awk '{print $1}')" = "5041ffa925154a1100b4ed21aff766ef0e79ac492703af5685e153ccea65953f"
          test "$(sha256sum xsmb_runtime/xsmb_reference_runner_R4_snapshot.py | awk '{print $1}')" = "71703fdc5fb26d83e19a65e974074a3d8c684aa921fabc359d55d80af306f9ea"
          echo "INPUT_WORKBOOK_SHA256=5041ffa925154a1100b4ed21aff766ef0e79ac492703af5685e153ccea65953f" > INPUT_PINS.txt
          echo "INPUT_DRIVE_REVISION=0B13hhnXzcUPeNTk5cXV2VVV6RzF2MlJPUjJOZEhsVjZ2bHhJPQ" >> INPUT_PINS.txt
          echo "SOURCE_ARTIFACT_RUN_ID=35604071047" >> INPUT_PINS.txt
          echo "SOURCE_ARTIFACT_ID=10640851736" >> INPUT_PINS.txt
          echo "SOURCE_ARTIFACT_DIGEST=sha256:2e18458ca18e35d5fd987c909619fc530b5f253c459eb21b232f8192a004d2b9" >> INPUT_PINS.txt

      - name: Build 3-source evidence from preserved raw screenshots
        run: |
          cat > settlement_evidence_20260922_3source.json <<'JSON'
          {
            "actual_date": "2026-09-22",
            "sources": [
              {
                "source_type": "FULL_27",
                "reference": "drive:1uYfkQJFH4LA01VUpXkpLAcMkwjG_113w | https://ketqua16.net/",
                "source_family": "ketqua16.net",
                "canonical_order": true,
                "retrieved_at": "2026-09-22T18:34:02+07:00",
                "raw_evidence_sha256": "9f7cec37a73912649748d42ddcc469c9f7a3284b421c99da4de64f482ffd5dc8",
                "extract_sha256": "caa92caa43871bef8b2a37a9392dc8dbacd14eae66e634e6ef9a584340297c9f",
                "prizes_27": ["31922","68392","42192","98961","18400","72209","72261","68433","35051","86944","3748","6738","0334","1736","6318","9384","1206","7167","8446","7367","651","911","839","92","07","35","44"],
                "lotto_27": ["22","92","92","61","00","09","61","33","51","44","48","38","34","36","18","84","06","67","46","67","51","11","39","92","07","35","44"]
              },
              {
                "source_type": "FULL_27",
                "reference": "drive:1h7xW71xS6BHecgVhOZ_5DzO6pYfShOHI | https://xsmb.mobi/",
                "source_family": "xsmb.mobi",
                "canonical_order": true,
                "retrieved_at": "2026-09-22T18:34:02+07:00",
                "raw_evidence_sha256": "8a3ffc009e97dd7ae52dff5d20d38e3f58a07bf3f098267a4867a169b3ca8252",
                "extract_sha256": "caa92caa43871bef8b2a37a9392dc8dbacd14eae66e634e6ef9a584340297c9f",
                "prizes_27": ["31922","68392","42192","98961","18400","72209","72261","68433","35051","86944","3748","6738","0334","1736","6318","9384","1206","7167","8446","7367","651","911","839","92","07","35","44"],
                "lotto_27": ["22","92","92","61","00","09","61","33","51","44","48","38","34","36","18","84","06","67","46","67","51","11","39","92","07","35","44"]
              },
              {
                "source_type": "THIRD_SOURCE_FULL_27",
                "reference": "drive:12HKnEf1_hRnPlqA-xPx3YMNKdzhUECXf | https://xoso.com.vn/",
                "source_family": "xoso.com.vn",
                "canonical_order": true,
                "retrieved_at": "2026-09-22T18:34:02+07:00",
                "raw_evidence_sha256": "2953bccaa4750b55377c5c3c130833f0b060edd902aa8eb712db345087ac8dc8",
                "extract_sha256": "caa92caa43871bef8b2a37a9392dc8dbacd14eae66e634e6ef9a584340297c9f",
                "prizes_27": ["31922","68392","42192","98961","18400","72209","72261","68433","35051","86944","3748","6738","0334","1736","6318","9384","1206","7167","8446","7367","651","911","839","92","07","35","44"],
                "lotto_27": ["22","92","92","61","00","09","61","33","51","44","48","38","34","36","18","84","06","67","46","67","51","11","39","92","07","35","44"]
              }
            ]
          }
          JSON
          test "$(sha256sum settlement_evidence_20260922_3source.json | awk '{print $1}')" = "146e0c686c34eb96e12220dd5efd304c7388c449dc8590142780a0e402dddcfb"

      - name: Execute UPDATE_RESULT 2026-09-22
        run: |
          PYTHONPATH=xsmb_runtime python xsmb_runtime/xsmb_ops.py update-result             --workbook settlement.xlsx             --manifest-dir manifests             --actual-date 2026-09-22             --evidence-json settlement_evidence_20260922_3source.json             > UPDATE_RESULT_20260922.json
          cat UPDATE_RESULT_20260922.json

      - name: Verify settlement and immutable forecast
        run: |
          PYTHONPATH=xsmb_runtime python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import xsmb_reference_runner_R4_snapshot as r

          op=json.loads(Path("UPDATE_RESULT_20260922.json").read_text())
          assert op["operation"]=="UPDATE_RESULT",op
          assert op["mode"]=="SETTLE_EXISTING_FORECAST",op
          x=op["result"]
          assert x["status"]=="SETTLED_VERIFIED",x
          assert x["forecast_id"]=="XSMB-20260922-v2.1-LIVE-001-4ca816dcec2e-9a830c5a5926",x
          assert x["actual_date"]=="2026-09-22",x
          assert int(x["hits_at_5"])==1,x

          s=r.load_workbook_state("settlement.xlsx","manifests")
          assert s.draws.dates[-1]=="2026-09-22",s.draws.dates[-1]
          rows=[z for z in s.ledger_records if z.get("forecast_date") and r.normalize_date(z["forecast_date"])=="2026-09-22"]
          assert len(rows)==1,rows
          row=rows[0]
          assert row["record_status"]=="SETTLED_VERIFIED",row
          assert json.loads(row["top5_ranked"])==["07","73","54","76","98"]
          probs=json.loads(row["p00_to_p99_json"])
          psha=r.probability_sha256([float(probs[f"{i:02d}"]) for i in range(100)])
          assert psha=="8d53e926d6a446858ffcf95e216cc5f8f026fa20da8755d8a9edb383379f870f",psha
          locked=[z for z in s.ledger_records if str(z.get("record_status") or "")=="LOCKED_PRE_DRAW"]
          assert len(locked)==0,locked

          report={
            "status":"PASS",
            "operation":"UPDATE_RESULT",
            "forecast_id":x["forecast_id"],
            "actual_date":x["actual_date"],
            "hits_at_5":x["hits_at_5"],
            "brier_m7":x["brier_m7"],
            "log_loss_m7":x["log_loss_m7"],
            "brier_m0":x["brier_m0"],
            "log_loss_m0":x["log_loss_m0"],
            "checkpoint":x["checkpoint"],
            "calibration_status":x["calibration_status"],
            "research_state":x["research_state"],
            "top5_preserved":json.loads(row["top5_ranked"]),
            "probability_sha256_preserved":psha,
            "output_workbook_sha256":r.sha256_file("settlement.xlsx"),
            "settlement_manifest":x["settlement_manifest"],
            "locked_pre_draw_count":0,
          }
          Path("SETTLEMENT_VERIFICATION_20260922.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Prove OPS_HARDENING post-settlement gate
        run: |
          PYTHONPATH=xsmb_runtime python xsmb_runtime/ops_hardening_promotion_gate.py             --workbook settlement.xlsx             --manifest-dir manifests             > OPS_HARDENING_POST_SETTLEMENT_GATE.json
          cat OPS_HARDENING_POST_SETTLEMENT_GATE.json

      - name: Freeze settlement evidence hashes
        run: |
          sha256sum settlement.xlsx UPDATE_RESULT_20260922.json SETTLEMENT_VERIFICATION_20260922.json             OPS_HARDENING_POST_SETTLEMENT_GATE.json settlement_evidence_20260922_3source.json manifests/*.json > SHA256SUMS.txt

      - name: Upload immutable 22 Sep settlement artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xsmb-update-result-20260922-settled
          path: |
            settlement.xlsx
            UPDATE_RESULT_20260922.json
            SETTLEMENT_VERIFICATION_20260922.json
            OPS_HARDENING_POST_SETTLEMENT_GATE.json
            settlement_evidence_20260922_3source.json
            INPUT_PINS.txt
            SHA256SUMS.txt
            manifests/*.json
          if-no-files-found: error
          retention-days: 90
