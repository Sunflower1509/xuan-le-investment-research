name: Inspect market session 20260819 once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch exact VNDIRECT market rows
        run: |
          node --input-type=module <<'NODE'
          const url='https://api-finfo.vndirect.com.vn/v4/vnmarket_prices?sort=code&q=date:2026-08-19&size=500';
          const r=await fetch(url,{headers:{accept:'application/json','user-agent':'XuanLeTVS-MarketInspect/1.0'},signal:AbortSignal.timeout(15000)});
          if(!r.ok) throw new Error(`HTTP ${r.status}`);
          const p=await r.json(); const rows=Array.isArray(p?.data)?p.data:[];
          const key=x=>String(x.code||x.indexCode||x.symbol||'').toUpperCase();
          console.log('CODES', [...new Set(rows.map(key))].join(','));
          for(const aliases of [['VNINDEX','VN-INDEX','HOSE'],['VN30','VN30-INDEX'],['HNX','HNXINDEX','HNX-INDEX']]){
            const row=rows.find(x=>aliases.includes(key(x)));
            console.log('ROW',aliases[0],JSON.stringify(row));
            if(!row) throw new Error(`missing ${aliases[0]}`);
          }
          NODE
