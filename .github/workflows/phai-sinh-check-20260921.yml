name: Kiem tra phai sinh 2026-09-21

on:
  push:
    paths:
      - ".github/workflows/phai-sinh-check-20260921.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Khoa thong so hop dong tuong lai VN30
        run: |
          node --input-type=module <<'NODE'
          const from=1789948800,to=1790035200;
          const url=`https://api.dnse.com.vn/chart-api/v2/ohlcs/derivative?symbol=VN30F1M&resolution=1&from=${from}&to=${to}`;
          const r=await fetch(url,{headers:{accept:'application/json','user-agent':'Mozilla/5.0 XuanLeTVS-Check/1.1'}});
          if(!r.ok) throw new Error('HTTP '+r.status);
          const p=await r.json();
          if(!p.c?.length) throw new Error('Khong co du lieu');
          const out={
            soNen:p.c.length,
            moCua:p.o[0],
            caoNhat:Math.max(...p.h),
            thapNhat:Math.min(...p.l),
            dongCua:p.c[p.c.length-1],
            khoiLuong:p.v.reduce((a,b)=>a+Number(b||0),0),
            thoiDiemCuoi:p.t[p.t.length-1]
          };
          console.log('PHAI_SINH_TOM_TAT',JSON.stringify(out));
          NODE
