name: Sync market session 20260819 once

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.head_commit.message == 'Final retry one-time 19 Aug market session sync'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify coverage already locked to 19 Aug
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm';
          const code=fs.readFileSync('src/data/research-data.js','utf8'); const s={window:{}}; vm.runInNewContext(code,s);
          const d=s.window.RESEARCH_DATA;
          if(d.meta.updated!=='2026-08-19') throw new Error(`meta.updated=${d.meta.updated}`);
          const bad=d.coverage.filter(x=>x.priceDate!=='2026-08-19'||!Number.isFinite(x.close));
          if(d.coverage.length!==47||bad.length) throw new Error(`Coverage gate failed: ${d.coverage.length}, bad=${bad.map(x=>x.ticker).join(',')}`);
          console.log('COVERAGE_EOD_20260819_OK=47/47');
          NODE
      - name: Fetch and lock 19 Aug market session from VNDIRECT
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm';
          const path='src/data/research-data.js'; const code=fs.readFileSync(path,'utf8'); const s={window:{}}; vm.runInNewContext(code,s); const d=s.window.RESEARCH_DATA;
          const url='https://api-finfo.vndirect.com.vn/v4/vnmarket_prices?sort=code&q=date:2026-08-19&size=500';
          const res=await fetch(url,{headers:{accept:'application/json','user-agent':'XuanLeTVS-MarketSession/1.2'},signal:AbortSignal.timeout(15000)});
          if(!res.ok) throw new Error(`VNDIRECT HTTP ${res.status}`);
          const payload=await res.json(); const rows=Array.isArray(payload?.data)?payload.data:[];
          if(!rows.length) throw new Error('No market rows');
          const key=(r)=>String(r.code||r.indexCode||r.symbol||'').toUpperCase();
          const find=(aliases)=>rows.find(r=>aliases.includes(key(r)));
          const vn=find(['VNINDEX','VN-INDEX','HOSE']); const vn30=find(['VN30','VN30-INDEX']); const hnx=find(['HNX','HNXINDEX','HNX-INDEX']);
          const num=(x)=>Number.isFinite(Number(x))?Number(x):null;
          const parse=(r,label)=>{ if(!r) throw new Error(`Missing ${label}`); const close=num(r.close??r.index??r.value); const change=num(r.change??r.changeValue); const pct=num(r.pctChange??r.changePct??r.percentChange); if(close===null||change===null||pct===null) throw new Error(`Incomplete ${label}: ${JSON.stringify(r)}`); return {code:label,close,change,changePct:pct}; };
          const indices=[parse(vn,'VN-INDEX'),parse(vn30,'VN30'),parse(hnx,'HNX-INDEX')];
          const adv=num(vn?.nmAdvances??vn?.advances??vn?.advance??vn?.up);
          const unch=num(vn?.nmNoChange??vn?.noChange??vn?.unchanged??vn?.reference);
          const dec=num(vn?.nmDeclines??vn?.declines??vn?.decline??vn?.down);
          const floor=num(vn?.nmFloors??vn?.floorStocks??vn?.floors??vn?.floor);
          if([adv,unch,dec,floor].some(v=>v===null)) throw new Error(`Breadth unavailable: ${JSON.stringify(vn)}`);
          d.marketSession={date:'2026-08-19',status:'Đã khóa EOD — VNDIRECT Finfo',indices,breadth:{advance:adv,unchanged:unch,decline:dec,floor},sources:[{label:'VNDIRECT Finfo — chỉ số & độ rộng EOD 19/08/2026',url}]};
          fs.writeFileSync(path,`window.RESEARCH_DATA = ${JSON.stringify(d,null,2)};\n`);
          console.log('MARKET_SESSION',JSON.stringify(d.marketSession));
          NODE
      - name: Build regression audit and immutability guards
        run: |
          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); import re
          s,n=re.subn(r'assets/js/site\.min\.js\?v=[^"\']+', 'assets/js/site.min.js?v=20260819-eod-final1', s, count=1)
          if n!=1: raise SystemExit(f'cache token replacements={n}')
          p.write_text(s)
          PY
          node scripts/audit-site.mjs
          git diff --quiet -- src/index.css src/styles assets/css/site.min.css
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm';
          const html=fs.readFileSync('index.html','utf8'); const order=[...html.matchAll(/<section\b[^>]*\bid=(['"])([^'"]+)\1[^>]*>/g)].map(m=>m[2]);
          const exp=['overview','daily-market','position-ledger','action-radar','research']; if(order.join(',')!==exp.join(',')) throw new Error(`section order changed: ${order}`);
          const code=fs.readFileSync('src/data/research-data.js','utf8'); const s={window:{}}; vm.runInNewContext(code,s); const d=s.window.RESEARCH_DATA;
          if(d.marketSession?.date!=='2026-08-19') throw new Error('marketSession not current');
          if(d.meta.updated!=='2026-08-19'||d.coverage.some(x=>x.priceDate!=='2026-08-19')) throw new Error('coverage date drift');
          NODE
      - name: Prepare lean artifact
        run: bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"
      - name: Commit verified data and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-market-session-20260819-once.yml
          git add src/data/research-data.js assets/js/site.min.js index.html
          git commit -m 'Synchronize 19 Aug EOD market session [skip ci]'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live byte-for-byte
        run: node scripts/verify-live-site.mjs --site-url "${{ steps.deployment.outputs.page_url }}" --artifact-root "${RUNNER_TEMP}/site" --attempts 18 --wait-ms 10000
