name: Fix SHB one-sided trigger once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-shb-one-sided-trigger-once.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  repair:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard exact pre-fix state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "14ab09be55012c4885bb359de641d1e5ebeca9a6"
          test "$(git hash-object src/scripts/app.js)" = "6b71991202f316b7957dfa3277a3f33962748210"
          test "$(git hash-object src/scripts/trade-ledger.mjs)" = "c35295db534f7cc7d3cf0112ba85ff6b041bb067"
          test "$(git hash-object scripts/process-trade-ledger.mjs)" = "68d0d5ff1b09a5a89e3bab8f9399872ecfc0c905"
          test "$(git hash-object tests/trade-ledger.test.mjs)" = "405184e6d1eb2ec4bb0a2789d7f12dd6bc5e959a"
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('src/data/research-data.js','utf8');
          const box={window:{}};vm.runInNewContext(code,box);
          const data=box.window.RESEARCH_DATA;
          const shb=data.coverage.find(x=>x.ticker==='SHB');
          if(!shb||shb.close!==11600||shb.priceDate!=='2026-08-18'||shb.action?.zoneLow!==null||shb.action?.zoneHigh!==11600||shb.action?.eligibility!=='manual') throw new Error('Unexpected SHB pre-fix coverage state');
          const ledger=JSON.parse(fs.readFileSync('src/data/trade-ledger.json','utf8'));
          const snap=ledger.meta?.automation?.lastEvaluatedQuotes?.SHB;
          if(!snap||snap.date!=='2026-08-18'||snap.close!==11600||snap.relation!=='unavailable'||snap.eligibility!=='manual') throw new Error('Unexpected SHB pre-fix ledger state');
          if(ledger.events.some(e=>e.ticker==='SHB'&&e.type==='activated')) throw new Error('SHB activation already exists');
          NODE

      - name: Patch one-sided trigger engine and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f'{path}: expected one match, got {s.count(old)}')
              p.write_text(s.replace(old,new,1))

          replace_once('scripts/process-trade-ledger.mjs', '''const TRIGGER = "eod-close-transitioned-into-locked-zone";
          const TICKER = /^[A-Z0-9]{2,8}$/;

          const finitePositive = (value) => Number.isFinite(value) && value > 0;
          const clone = (value) => JSON.parse(JSON.stringify(value));

          export const quoteRelation = (close, action = {}) => {
            if (!finitePositive(close) || !finitePositive(action.zoneLow) || !finitePositive(action.zoneHigh) || action.zoneLow > action.zoneHigh) return "unavailable";
            if (close < action.zoneLow) return "below";
            if (close > action.zoneHigh) return "above";
            return "inside";
          };
          ''', '''const TRIGGER_ZONE = "eod-close-transitioned-into-locked-zone";
          const TRIGGER_THRESHOLD = "eod-close-transitioned-into-locked-threshold";
          const TICKER = /^[A-Z0-9]{2,8}$/;
          const ONE_SIDED_TRIGGER_TYPES = new Set(["at-or-below", "at-or-above"]);

          const finitePositive = (value) => Number.isFinite(value) && value > 0;
          const clone = (value) => JSON.parse(JSON.stringify(value));
          const oneSidedTrigger = (action = {}) => ONE_SIDED_TRIGGER_TYPES.has(action.triggerType) && finitePositive(action.triggerPrice)
            ? { type: action.triggerType, price: action.triggerPrice }
            : null;

          export const quoteRelation = (close, action = {}) => {
            if (!finitePositive(close)) return "unavailable";
            const trigger = oneSidedTrigger(action);
            if (trigger?.type === "at-or-below") return close <= trigger.price ? "inside" : "above";
            if (trigger?.type === "at-or-above") return close >= trigger.price ? "inside" : "below";
            if (!finitePositive(action.zoneLow) || !finitePositive(action.zoneHigh) || action.zoneLow > action.zoneHigh) return "unavailable";
            if (close < action.zoneLow) return "below";
            if (close > action.zoneHigh) return "above";
            return "inside";
          };
          ''')

          replace_once('scripts/process-trade-ledger.mjs', '''const snapshotFor = (item) => ({
            date: item.priceDate,
            close: item.close,
            relation: quoteRelation(item.close, item.action),
            zoneLow: finitePositive(item.action?.zoneLow) ? item.action.zoneLow : null,
            zoneHigh: finitePositive(item.action?.zoneHigh) ? item.action.zoneHigh : null,
            zoneBasisDate: validIsoDate(item.action?.basisDate) ? item.action.basisDate : null,
            eligibility: typeof item.action?.eligibility === "string" ? item.action.eligibility : "unknown"
          });

          const sameLockedZone = (previous, current) => previous
            && previous.zoneLow === current.zoneLow
            && previous.zoneHigh === current.zoneHigh
            && previous.zoneBasisDate === current.zoneBasisDate
            && finitePositive(current.zoneLow)
            && finitePositive(current.zoneHigh)
            && validIsoDate(current.zoneBasisDate);
          ''', '''const snapshotFor = (item) => {
            const snapshot = {
              date: item.priceDate,
              close: item.close,
              relation: quoteRelation(item.close, item.action),
              zoneLow: finitePositive(item.action?.zoneLow) ? item.action.zoneLow : null,
              zoneHigh: finitePositive(item.action?.zoneHigh) ? item.action.zoneHigh : null,
              zoneBasisDate: validIsoDate(item.action?.basisDate) ? item.action.basisDate : null,
              eligibility: typeof item.action?.eligibility === "string" ? item.action.eligibility : "unknown"
            };
            const trigger = oneSidedTrigger(item.action);
            if (trigger) {
              snapshot.triggerType = trigger.type;
              snapshot.triggerPrice = trigger.price;
            }
            return snapshot;
          };

          const sameLockedAction = (previous, current) => {
            if (!previous || previous.zoneBasisDate !== current.zoneBasisDate || !validIsoDate(current.zoneBasisDate)) return false;
            if (current.triggerType) {
              return previous.triggerType === current.triggerType
                && previous.triggerPrice === current.triggerPrice
                && finitePositive(current.triggerPrice);
            }
            return previous.zoneLow === current.zoneLow
              && previous.zoneHigh === current.zoneHigh
              && finitePositive(current.zoneLow)
              && finitePositive(current.zoneHigh);
          };
          ''')

          old='''const automationEvent = (item, previous, report) => {
            const event = {
              id: `auto-${item.ticker}-${item.priceDate}`,
              tradeId: `${item.ticker}-${item.priceDate}`,
              type: "activated",
              mode: "automatic-eod",
              ticker: item.ticker,
              date: item.priceDate,
              price: item.close,
              zoneLow: item.action.zoneLow,
              zoneHigh: item.action.zoneHigh,
              zoneBasisDate: item.action.basisDate,
              stop: finitePositive(item.action.stop) ? item.action.stop : null,
              targets: Array.isArray(item.action.targets) ? item.action.targets.filter(finitePositive) : [],
              confirmation: {
                trigger: TRIGGER,
                priceTriggerPassed: true,
                eligibilityAtTrigger: "active",
                noHardVeto: true,
                zoneUnchangedSincePreviousEod: true,
                previousQuote: {
                  date: previous.date,
                  close: previous.close,
                  relation: previous.relation
                }
              },
              sourceUrl: item.priceSource,
              note: "Tự động kích hoạt theo giá đóng cửa EOD; điều kiện định tính không được máy tự suy diễn."
            };
            if (validSourceUrl(item.priceSourceSecondary)) event.sourceUrlSecondary = item.priceSourceSecondary;
            if (report?.id) event.reportId = report.id;
            if (report?.file) event.reportFile = report.file;
            return event;
          };
          '''
          new='''const automationEvent = (item, previous, report) => {
            const trigger = oneSidedTrigger(item.action);
            const event = {
              id: `auto-${item.ticker}-${item.priceDate}`,
              tradeId: `${item.ticker}-${item.priceDate}`,
              type: "activated",
              mode: "automatic-eod",
              ticker: item.ticker,
              date: item.priceDate,
              price: item.close,
              zoneLow: trigger ? null : item.action.zoneLow,
              zoneHigh: trigger ? null : item.action.zoneHigh,
              zoneBasisDate: item.action.basisDate,
              stop: finitePositive(item.action.stop) ? item.action.stop : null,
              targets: Array.isArray(item.action.targets) ? item.action.targets.filter(finitePositive) : [],
              confirmation: {
                trigger: trigger ? TRIGGER_THRESHOLD : TRIGGER_ZONE,
                priceTriggerPassed: true,
                eligibilityAtTrigger: "active",
                noHardVeto: true,
                lockedActionUnchangedSincePreviousEod: true,
                previousQuote: {
                  date: previous.date,
                  close: previous.close,
                  relation: previous.relation
                }
              },
              sourceUrl: item.priceSource,
              note: trigger
                ? "Tự động kích hoạt theo giá đóng cửa EOD và ngưỡng một phía đã khóa; điều kiện định tính không được máy tự suy diễn."
                : "Tự động kích hoạt theo giá đóng cửa EOD; điều kiện định tính không được máy tự suy diễn."
            };
            if (trigger) {
              event.triggerType = trigger.type;
              event.triggerPrice = trigger.price;
            }
            if (validSourceUrl(item.priceSourceSecondary)) event.sourceUrlSecondary = item.priceSourceSecondary;
            if (report?.id) event.reportId = report.id;
            if (report?.file) event.reportFile = report.file;
            return event;
          };
          '''
          replace_once('scripts/process-trade-ledger.mjs', old, new)

          replace_once('scripts/process-trade-ledger.mjs', '''    const priceEnteredZone = previous.relation !== "inside" && current.relation === "inside";
              const eligible = item.action?.eligibility === "active";
              const zoneUnchanged = sameLockedZone(previous, current);
              const canStart = item.priceDate >= next.meta.startedAt;
              const hasOpenPosition = openTickers.has(item.ticker);
              const shouldActivate = priceEnteredZone && eligible && zoneUnchanged && canStart && !hasOpenPosition;
          ''', '''    const priceEnteredZone = previous.relation !== "inside" && current.relation === "inside";
              const eligible = item.action?.eligibility === "active";
              const lockedActionUnchanged = sameLockedAction(previous, current);
              const canStart = item.priceDate >= next.meta.startedAt;
              const hasOpenPosition = openTickers.has(item.ticker);
              const shouldActivate = priceEnteredZone && eligible && lockedActionUnchanged && canStart && !hasOpenPosition;
          ''')

          replace_once('scripts/process-trade-ledger.mjs', '''      const reason = !eligible
                ? `eligibility=${item.action?.eligibility || "unknown"}`
                : !zoneUnchanged
                  ? "vùng mua đã thay đổi"
                  : !canStart
          ''', '''      const reason = !eligible
                ? `eligibility=${item.action?.eligibility || "unknown"}`
                : !lockedActionUnchanged
                  ? current.triggerType ? "ngưỡng kích hoạt đã thay đổi" : "vùng mua đã thay đổi"
                  : !canStart
          ''')

          replace_once('src/scripts/trade-ledger.mjs', '''const EVENT_TYPES = new Set(["activated", "partial_exit", "closed"]);
          const ACTIVATION_MODES = new Set(["manual", "automatic-eod"]);
          const ISO_DATE = /^\\d{4}-\\d{2}-\\d{2}$/;

          const finitePositive = (value) => Number.isFinite(value) && value > 0;
          ''', '''const EVENT_TYPES = new Set(["activated", "partial_exit", "closed"]);
          const ACTIVATION_MODES = new Set(["manual", "automatic-eod"]);
          const AUTOMATIC_TRIGGERS = new Set(["eod-close-transitioned-into-locked-zone", "eod-close-transitioned-into-locked-threshold"]);
          const ONE_SIDED_TRIGGER_TYPES = new Set(["at-or-below", "at-or-above"]);
          const ISO_DATE = /^\\d{4}-\\d{2}-\\d{2}$/;

          const finitePositive = (value) => Number.isFinite(value) && value > 0;
          const oneSidedTrigger = (value = {}) => ONE_SIDED_TRIGGER_TYPES.has(value.triggerType) && finitePositive(value.triggerPrice)
            ? { type: value.triggerType, price: value.triggerPrice }
            : null;
          ''')

          replace_once('src/scripts/trade-ledger.mjs', '''    return event.confirmation?.priceTriggerPassed === true
                && event.confirmation?.eligibilityAtTrigger === "active"
                && event.confirmation?.trigger === "eod-close-transitioned-into-locked-zone";
          ''', '''    return event.confirmation?.priceTriggerPassed === true
                && event.confirmation?.eligibilityAtTrigger === "active"
                && AUTOMATIC_TRIGGERS.has(event.confirmation?.trigger);
          ''')

          replace_once('src/scripts/trade-ledger.mjs', '''      if (!event.ticker || !finitePositive(event.zoneLow) || !finitePositive(event.zoneHigh) || event.zoneLow > event.zoneHigh || !validIsoDate(event.zoneBasisDate)) {
                issue(issues, event, "invalid_activation", "Sự kiện kích hoạt thiếu mã, ngày khóa hoặc vùng mua hợp lệ.");
                return;
              }
              if (event.price < event.zoneLow || event.price > event.zoneHigh) {
                issue(issues, event, "price_outside_locked_zone", "Giá kích hoạt không nằm trong vùng mua đã khóa.");
                return;
              }
          ''', '''      const lockedRange = finitePositive(event.zoneLow) && finitePositive(event.zoneHigh) && event.zoneLow <= event.zoneHigh;
              const trigger = oneSidedTrigger(event);
              if (!event.ticker || (!lockedRange && !trigger) || !validIsoDate(event.zoneBasisDate)) {
                issue(issues, event, "invalid_activation", "Sự kiện kích hoạt thiếu mã, ngày khóa hoặc điều kiện giá hợp lệ.");
                return;
              }
              const priceTriggerPassed = trigger?.type === "at-or-below"
                ? event.price <= trigger.price
                : trigger?.type === "at-or-above"
                  ? event.price >= trigger.price
                  : event.price >= event.zoneLow && event.price <= event.zoneHigh;
              if (!priceTriggerPassed) {
                issue(issues, event, "price_outside_locked_zone", "Giá kích hoạt không thỏa vùng/ngưỡng đã khóa.");
                return;
              }
          ''')

          replace_once('src/scripts/trade-ledger.mjs', '''        zoneLow: event.zoneLow,
                zoneHigh: event.zoneHigh,
                zoneBasisDate: event.zoneBasisDate,
          ''', '''        zoneLow: finitePositive(event.zoneLow) ? event.zoneLow : null,
                zoneHigh: finitePositive(event.zoneHigh) ? event.zoneHigh : null,
                triggerType: trigger?.type || null,
                triggerPrice: trigger?.price || null,
                zoneBasisDate: event.zoneBasisDate,
          ''')

          replace_once('src/scripts/app.js', '''  const ledgerReason = (value) => LEDGER_REASON_LABELS[value] || (value ? String(value).toLocaleUpperCase("vi") : "CHƯA GHI NHẬN");

            const renderLedgerEvent = (event) => {
          ''', '''  const ledgerReason = (value) => LEDGER_REASON_LABELS[value] || (value ? String(value).toLocaleUpperCase("vi") : "CHƯA GHI NHẬN");

            const lockedActionLabel = (value) => {
              if (value?.triggerType === "at-or-below" && Number.isFinite(value.triggerPrice)) return `Ngưỡng ≤ ${number(value.triggerPrice)}`;
              if (value?.triggerType === "at-or-above" && Number.isFinite(value.triggerPrice)) return `Ngưỡng ≥ ${number(value.triggerPrice)}`;
              return `Vùng ${number(value?.zoneLow)}–${number(value?.zoneHigh)}`;
            };

            const renderLedgerEvent = (event) => {
          ''')

          replace_once('src/scripts/app.js', '''    const detail = event.type === "activated"
                ? `Vùng khóa ${number(event.zoneLow)}–${number(event.zoneHigh)}`
                : ledgerReason(event.reason);
          ''', '''    const detail = event.type === "activated"
                ? `${lockedActionLabel(event)} đã khóa`
                : ledgerReason(event.reason);
          ''')

          replace_once('src/scripts/app.js', '''            <td data-label="Giá kích hoạt"><strong>${number(position.activationPrice)}</strong><span>Vùng ${number(position.zoneLow)}–${number(position.zoneHigh)}</span></td>
          ''', '''            <td data-label="Giá kích hoạt"><strong>${number(position.activationPrice)}</strong><span>${escapeHtml(lockedActionLabel(position))}</span></td>
          ''')

          tests=Path('tests/trade-ledger.test.mjs')
          s=tests.read_text()
          marker='''test("dừng xử lý nếu sổ đầu vào có sự kiện sai", () => {\n'''
          if marker not in s or 'SHB one-sided' in s:
              raise SystemExit('Unexpected test insertion state')
          block=r'''
          test("SHB one-sided: 11.650 -> 11.600 kích hoạt đúng một lần", () => {
            const shbAction = {
              zoneLow: null,
              zoneHigh: 11600,
              triggerType: "at-or-below",
              triggerPrice: 11600,
              basisDate: "2026-08-18",
              eligibility: "active",
              recommendation: "MUA",
              condition: "P <= 11.600",
              stop: 10950,
              targets: [12400, 16600]
            };
            assert.equal(quoteRelation(11650, shbAction), "above");
            assert.equal(quoteRelation(11600, shbAction), "inside");
            assert.equal(quoteRelation(11550, shbAction), "inside");

            const shbSource = {
              meta: { updated: "2026-08-18" },
              reports: [{ id: "SHB-20260818", ticker: "SHB", date: "2026-08-18", file: "reports/SHB_2026-08-18.pdf" }],
              coverage: [{ ticker: "SHB", close: 11600, priceDate: "2026-08-18", priceSource: priceUrl, action: shbAction }]
            };
            const shbLedger = ledger({ snapshot: false });
            shbLedger.meta.automation.lastEvaluatedQuotes = {
              SHB: {
                date: "2026-08-17",
                close: 11650,
                relation: "above",
                zoneLow: null,
                zoneHigh: 11600,
                triggerType: "at-or-below",
                triggerPrice: 11600,
                zoneBasisDate: "2026-08-18",
                eligibility: "active"
              }
            };
            shbLedger.meta.automation.lastEvaluatedAt = "2026-08-17";
            const first = processEodLedger(shbSource, shbLedger);
            assert.equal(first.stats.activated, 1);
            assert.equal(first.ledger.events.length, 1);
            assert.equal(first.ledger.events[0].id, "auto-SHB-2026-08-18");
            assert.equal(first.ledger.events[0].triggerType, "at-or-below");
            assert.equal(first.ledger.events[0].triggerPrice, 11600);
            assert.equal(first.ledger.events[0].price, 11600);
            assert.equal(first.ledger.events[0].confirmation.previousQuote.close, 11650);
            assert.equal(first.ledger.events[0].confirmation.previousQuote.relation, "above");

            const projected = projectTradeLedger(first.ledger, shbSource.coverage);
            assert.equal(projected.issues.length, 0);
            assert.equal(projected.positions.length, 1);
            assert.equal(projected.positions[0].ticker, "SHB");
            assert.equal(projected.positions[0].triggerType, "at-or-below");
            assert.equal(projected.positions[0].triggerPrice, 11600);

            const second = processEodLedger(shbSource, first.ledger);
            assert.equal(second.changed, false);
            assert.equal(second.stats.activated, 0);
            assert.equal(second.ledger.events.length, 1);
          });

          test("one-sided không kích hoạt nếu ngưỡng bị thay đổi giữa hai EOD", () => {
            const shbSource = {
              meta: { updated: "2026-08-18" },
              reports: [],
              coverage: [{
                ticker: "SHB",
                close: 11600,
                priceDate: "2026-08-18",
                priceSource: priceUrl,
                action: { zoneLow: null, zoneHigh: 11600, triggerType: "at-or-below", triggerPrice: 11600, basisDate: "2026-08-18", eligibility: "active" }
              }]
            };
            const base = ledger({ snapshot: false });
            base.meta.automation.lastEvaluatedQuotes = {
              SHB: { date: "2026-08-17", close: 11650, relation: "above", zoneLow: null, zoneHigh: 11700, triggerType: "at-or-below", triggerPrice: 11700, zoneBasisDate: "2026-08-18", eligibility: "active" }
            };
            base.meta.automation.lastEvaluatedAt = "2026-08-17";
            const result = processEodLedger(shbSource, base);
            assert.equal(result.stats.activated, 0);
            assert.equal(result.stats.blocked, 1);
            assert.match(result.warnings[0], /ngưỡng kích hoạt đã thay đổi/);
          });

          '''
          s=s.replace(marker,block+marker,1)
          tests.write_text(s)

          replace_once('index.html', 'assets/js/site.min.js?v=20260817-eod3', 'assets/js/site.min.js?v=20260818-shb-threshold1')
          PY

      - name: Upgrade SHB data and recover exact 18 Aug activation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import { execFileSync } from 'node:child_process';
          import { processEodLedger } from './scripts/process-trade-ledger.mjs';
          import { projectTradeLedger } from './src/scripts/trade-ledger.mjs';

          const DATA='src/data/research-data.js';
          const LEDGER='src/data/trade-ledger.json';
          const box={window:{}};
          vm.runInNewContext(fs.readFileSync(DATA,'utf8'),box,{filename:DATA});
          const data=box.window.RESEARCH_DATA;
          const shbCoverage=data.coverage.find(x=>x.ticker==='SHB');
          const shbReport=data.reports.find(x=>x.id==='SHB-20260818');
          if(!shbCoverage||!shbReport) throw new Error('SHB report/coverage missing');
          if(shbCoverage.close!==11600||shbCoverage.priceDate!=='2026-08-18'||shbCoverage.action.zoneLow!==null||shbCoverage.action.zoneHigh!==11600) throw new Error('SHB current EOD/action mismatch');
          for(const holder of [shbCoverage,shbReport]) {
            holder.action.triggerType='at-or-below';
            holder.action.triggerPrice=11600;
            holder.action.eligibility='active';
          }
          fs.writeFileSync(DATA,`window.RESEARCH_DATA = ${JSON.stringify(data,null,2)};\n`);

          const ledger=JSON.parse(fs.readFileSync(LEDGER,'utf8'));
          if(ledger.events.some(e=>e.ticker==='SHB'&&e.type==='activated')) throw new Error('Refuse duplicate SHB recovery');
          const oldLedger=JSON.parse(execFileSync('git',['show','22396d8a1c8c442ae2e0bd58d6571db360a111c5^:src/data/trade-ledger.json'],{encoding:'utf8'}));
          const previous=oldLedger.meta?.automation?.lastEvaluatedQuotes?.SHB;
          if(!previous||previous.date!=='2026-08-17'||previous.close!==11650) throw new Error('Verified prior SHB snapshot not found');
          const current=ledger.meta?.automation?.lastEvaluatedQuotes?.SHB;
          if(!current||current.date!=='2026-08-18'||current.close!==11600||current.relation!=='unavailable') throw new Error('Current SHB snapshot not in expected bug state');

          ledger.meta.automation.version=2;
          ledger.meta.automation.lastEvaluatedQuotes.SHB={
            date:'2026-08-17',
            close:11650,
            relation:'above',
            zoneLow:null,
            zoneHigh:11600,
            triggerType:'at-or-below',
            triggerPrice:11600,
            zoneBasisDate:'2026-08-18',
            eligibility:'active'
          };

          const result=processEodLedger(data,ledger);
          const event=result.ledger.events.find(e=>e.id==='auto-SHB-2026-08-18');
          if(result.stats.activated!==1||!event) throw new Error(`SHB recovery failed: ${JSON.stringify(result.stats)}`);
          if(event.price!==11600||event.triggerType!=='at-or-below'||event.triggerPrice!==11600||event.confirmation?.previousQuote?.date!=='2026-08-17'||event.confirmation?.previousQuote?.close!==11650) throw new Error('Recovered SHB event fields mismatch');
          event.migration={kind:'one-sided-trigger-recovery',reason:'Engine previously lacked one-sided threshold support',verifiedPreviousEod:{date:'2026-08-17',close:11650},verifiedTriggerEod:{date:'2026-08-18',close:11600},triggerType:'at-or-below',triggerPrice:11600};
          const projection=projectTradeLedger(result.ledger,data.coverage);
          if(projection.issues.length) throw new Error(`Projection issues: ${JSON.stringify(projection.issues)}`);
          const position=projection.positions.find(p=>p.ticker==='SHB');
          if(!position||position.activationPrice!==11600||position.activatedAt!=='2026-08-18'||position.triggerType!=='at-or-below'||position.triggerPrice!==11600) throw new Error('Projected SHB position mismatch');
          const rerun=processEodLedger(data,result.ledger);
          if(rerun.changed||rerun.stats.activated!==0||rerun.ledger.events.filter(e=>e.ticker==='SHB'&&e.type==='activated').length!==1) throw new Error('Idempotency/duplicate guard failed');
          fs.writeFileSync(LEDGER,`${JSON.stringify(result.ledger,null,2)}\n`);
          console.log('Recovered SHB activation:',JSON.stringify({date:event.date,price:event.price,triggerType:event.triggerType,triggerPrice:event.triggerPrice,previous:event.confirmation.previousQuote}));
          NODE

      - name: Run full Trade Ledger tests
        run: node --test tests/trade-ledger.test.mjs

      - name: Build production assets
        run: bash scripts/build/build-assets.sh

      - name: Audit site integrity
        run: node scripts/audit-site.mjs

      - name: Prepare lean production artifact
        run: bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"

      - name: Guard layout, CSS, public paths and exact change scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD^ -- reports favicon.svg robots.txt sitemap.xml .nojekyll src/data/daily-insights.js src/styles assets/css/site.min.css scripts/build scripts/audit-site.mjs
          python3 <<'PY'
          import subprocess
          before=subprocess.check_output(['git','show','HEAD^:index.html'],text=True)
          after=open('index.html').read()
          normalized=after.replace('assets/js/site.min.js?v=20260818-shb-threshold1','assets/js/site.min.js?v=20260817-eod3')
          if normalized!=before:
              raise SystemExit('index.html changed beyond JS cache token')
          order=['id="overview"','id="daily-market"','id="position-ledger"','id="action-radar"','id="research"']
          positions=[after.index(x) for x in order]
          if positions!=sorted(positions):
              raise SystemExit('section order changed')
          PY
          rm -f .github/workflows/fix-shb-one-sided-trigger-once.yml
          python3 <<'PY'
          import subprocess
          allowed={
            '.github/workflows/fix-shb-one-sided-trigger-once.yml',
            'index.html','assets/js/site.min.js','src/data/research-data.js','src/data/trade-ledger.json',
            'scripts/process-trade-ledger.mjs','src/scripts/trade-ledger.mjs','src/scripts/app.js','tests/trade-ledger.test.mjs'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          extra=changed-allowed
          missing={'src/data/research-data.js','src/data/trade-ledger.json','scripts/process-trade-ledger.mjs','src/scripts/trade-ledger.mjs','src/scripts/app.js','tests/trade-ledger.test.mjs','assets/js/site.min.js'}-changed
          if extra or missing:
              raise SystemExit(f'Unexpected change scope extra={sorted(extra)} missing={sorted(missing)} changed={sorted(changed)}')
          print('Allowed changed files:',*sorted(changed),sep='\n- ')
          PY

      - name: Commit repair and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support one-sided EOD trigger and recover SHB activation [skip ci]"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
