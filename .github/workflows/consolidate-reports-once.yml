name: Consolidate valuation reports once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/consolidate-reports-once.yml"

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge report metadata into primary data source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const dataPath = 'src/data/research-data.js';
          const overlayPath = 'src/data/report-updates-20260817.js';
          const tickers = ['FPT', 'BFC', 'PNJ', 'ACB'];
          const ids = new Set(tickers.map((ticker) => `${ticker}-20260817`));

          const baseText = fs.readFileSync(dataPath, 'utf8');
          const overlayText = fs.readFileSync(overlayPath, 'utf8');
          const context = { window: {} };
          vm.runInNewContext(baseText, context, { filename: dataPath });
          vm.runInNewContext(overlayText, context, { filename: overlayPath });
          const finalData = context.window.RESEARCH_DATA;
          const incoming = finalData.reports.filter((report) => ids.has(report.id));
          if (incoming.length !== 4) throw new Error(`Expected 4 incoming reports, got ${incoming.length}`);

          let text = baseText;
          for (const id of ids) {
            if (text.includes(`id: "${id}"`) || text.includes(`"id": "${id}"`)) {
              throw new Error(`Report ${id} already exists in primary source`);
            }
          }

          const indentObject = (value, spaces) => JSON.stringify(value, null, 2)
            .split('\n')
            .map((line) => ' '.repeat(spaces) + line)
            .join('\n');
          const insertion = incoming.map((report) => `${indentObject(report, 4)},`).join('\n');
          const reportsMarker = '  reports: [\n';
          if (!text.includes(reportsMarker)) throw new Error('reports marker not found');
          text = text.replace(reportsMarker, `${reportsMarker}${insertion}\n`);

          const coverageMarker = '  coverage: [\n';
          const coverageIndex = text.indexOf(coverageMarker);
          if (coverageIndex < 0) throw new Error('coverage marker not found');
          const head = text.slice(0, coverageIndex);
          let coverage = text.slice(coverageIndex);

          for (const ticker of tickers) {
            const report = incoming.find((item) => item.ticker === ticker);
            const finalCoverage = finalData.coverage.find((item) => item.ticker === ticker);
            if (!report || !finalCoverage) throw new Error(`Missing final data for ${ticker}`);
            const blockRe = new RegExp(`(\\n    \\{\\n      ticker: "${ticker}"[\\s\\S]*?\\n    \\})(?=,?\\n)`);
            const match = coverage.match(blockRe);
            if (!match) throw new Error(`Coverage block not found for ${ticker}`);
            let block = match[1];
            block = block.replace(/reportId: (null|"[^"]+")/, `reportId: "${report.id}"`);
            const actionCompact = JSON.stringify(finalCoverage.action);
            block = block.replace(/action: \{[^\n]*\}/, `action: ${actionCompact}`);
            coverage = coverage.replace(match[1], block);
          }

          fs.writeFileSync(dataPath, head + coverage, 'utf8');
          NODE

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import "./data/report-updates-20260817.js";\n', '')
          p.write_text(text, encoding='utf-8')

          html = Path('index.html')
          h = html.read_text(encoding='utf-8')
          h = h.replace('assets/js/site.min.js?v=20260817-eod2', 'assets/js/site.min.js?v=20260817-reports1')
          html.write_text(h, encoding='utf-8')
          PY

          rm -f src/data/report-updates-20260817.js

      - name: Validate build and integrity
        shell: bash
        run: |
          set -euo pipefail
          node --check src/data/research-data.js
          node --check src/index.js
          node scripts/process-trade-ledger.mjs
          node --test tests/trade-ledger.test.mjs
          ./scripts/build-assets.sh
          node scripts/audit-site.mjs

      - name: Commit clean consolidated state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/consolidate-reports-once.yml
          git config user.name 'Sunflower1509'
          git config user.email '72440024+Sunflower1509@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate FPT BFC PNJ ACB report metadata and refresh assets'
          git push origin HEAD:main
