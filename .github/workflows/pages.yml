name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Record pre-processing ledger
        run: cp src/data/trade-ledger.json "${RUNNER_TEMP}/trade-ledger-before.json"
      - name: Process EOD activation ledger
        run: node scripts/process-trade-ledger.mjs
      - name: Reconcile expected versus actual activations
        run: |
          node scripts/reconcile-trade-ledger.mjs \
            --before "${RUNNER_TEMP}/trade-ledger-before.json" \
            --after src/data/trade-ledger.json \
            --research src/data/research-data.js \
            --report "${RUNNER_TEMP}/ledger-reconciliation.json"
      - name: Run all trigger and ledger tests
        run: node --test tests/*.test.mjs
      - name: Build production assets
        run: bash scripts/build/build-assets.sh
      - name: Audit site integrity
        run: node scripts/audit-site.mjs
      - name: Prepare lean production artifact
        run: bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"
      - name: Persist new EOD ledger events
        run: |
          if ! git diff --quiet -- src/data/trade-ledger.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/trade-ledger.json assets/js/site.min.js
            git commit -m "Record EOD signal activations [skip ci]"
            git push origin HEAD:main
          fi
      - name: Guard against stale deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$local_sha" != "$remote_sha" ]]; then
            echo "Refusing stale Pages deployment: local=$local_sha remote=$remote_sha" >&2
            exit 3
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Post-deploy byte verification
        run: |
          node scripts/verify-live-site.mjs \
            --site-url "${{ steps.deployment.outputs.page_url }}" \
            --artifact-root "${RUNNER_TEMP}/site"
