name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture verified market snapshot 2026-08-18
        run: |
          set -u
          mkdir -p tmp
          fetch() {
            name="$1"; url="$2"
            code=$(curl --retry 2 --retry-delay 1 -sS -L -w '%{http_code}' -o "tmp/${name}.body" "$url" || true)
            printf '%s\n' "$code" > "tmp/${name}.status"
          }
          fetch vnmarket_api_finfo 'https://api-finfo.vndirect.com.vn/v4/vnmarket_prices?sort=code&q=date:2026-08-18&size=500'
          fetch vnmarket_finfo_api 'https://finfo-api.vndirect.com.vn/v4/vnmarket_prices?sort=code&q=date:2026-08-18&size=500'
          fetch hose_stocks_api_finfo 'https://api-finfo.vndirect.com.vn/v4/stock_prices?sort=code&q=floor:HOSE~date:2026-08-18&size=2000'
          fetch hose_stocks_finfo_api 'https://finfo-api.vndirect.com.vn/v4/stock_prices?sort=code&q=floor:HOSE~date:2026-08-18&size=2000'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const readJson = (p) => { try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return null; } };
          const market = readJson('tmp/vnmarket_api_finfo.body') || readJson('tmp/vnmarket_finfo_api.body') || {};
          const stocks = readJson('tmp/hose_stocks_api_finfo.body') || readJson('tmp/hose_stocks_finfo_api.body') || {};
          const rows = Array.isArray(market.data) ? market.data : [];
          const stockRows = Array.isArray(stocks.data) ? stocks.data : [];
          const wantedCodes = new Set(['VNINDEX','VN30','HNX','HNXINDEX','UPCOM','UPCOMINDEX']);
          const wanted = rows.filter(r => wantedCodes.has(String(r.code || '').toUpperCase()));
          const priceOf = r => Number(r.close ?? r.closePrice ?? r.adClose ?? r.price ?? NaN);
          const refOf = r => Number(r.reference ?? r.referencePrice ?? r.basicPrice ?? NaN);
          let advance=0, unchanged=0, decline=0, floor=0, ceiling=0, valid=0;
          for (const r of stockRows) {
            const c = priceOf(r); const ref = refOf(r);
            if (!(Number.isFinite(c) && Number.isFinite(ref) && c>0 && ref>0)) continue;
            valid++;
            if (c > ref) advance++; else if (c < ref) decline++; else unchanged++;
            const fl = Number(r.floor ?? r.floorPrice ?? NaN);
            const ce = Number(r.ceiling ?? r.ceilingPrice ?? NaN);
            if (Number.isFinite(fl) && Math.abs(c-fl)<1e-9) floor++;
            if (Number.isFinite(ce) && Math.abs(c-ce)<1e-9) ceiling++;
          }
          const statuses = Object.fromEntries(fs.readdirSync('tmp').filter(x=>x.endsWith('.status')).map(x=>[x.replace('.status',''),fs.readFileSync('tmp/'+x,'utf8').trim()]));
          const out = { fetchedAt: new Date().toISOString(), statuses, marketRows: wanted, rawMarketCount: rows.length, hoseStockCount: stockRows.length, breadth: { valid, advance, unchanged, decline, floor, ceiling } };
          fs.writeFileSync('tmp/market-summary-20260818.json', JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Record pre-processing ledger
        run: cp src/data/trade-ledger.json "${RUNNER_TEMP}/trade-ledger-before.json"
      - name: Process EOD activation ledger
        run: node scripts/process-trade-ledger.mjs
      - name: Reconcile expected versus actual activations
        run: |
          node scripts/reconcile-trade-ledger.mjs \
            --before "${RUNNER_TEMP}/trade-ledger-before.json" \
            --after src/data/trade-ledger.json \
            --research src/data/research-data.js \
            --report "${RUNNER_TEMP}/ledger-reconciliation.json"
      - name: Run all trigger and ledger tests
        run: node --test tests/*.test.mjs
      - name: Build production assets
        run: bash scripts/build/build-assets.sh
      - name: Audit site integrity
        run: node scripts/audit-site.mjs
      - name: Prepare lean production artifact
        run: bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"
      - name: Persist new EOD ledger events
        run: |
          if ! git diff --quiet -- src/data/trade-ledger.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/trade-ledger.json
            git commit -m "Record EOD signal activations [skip ci]"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Post-deploy byte verification
        run: |
          node scripts/verify-live-site.mjs \
            --site-url "${{ steps.deployment.outputs.page_url }}" \
            --artifact-root "${RUNNER_TEMP}/site"
      - name: Persist market snapshot after successful deploy proof
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/
          if ! git diff --cached --quiet; then
            git commit -m "Capture verified market snapshot 2026-08-18 [skip ci]"
            git push origin HEAD:main
          fi
