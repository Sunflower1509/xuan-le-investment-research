name: Fix report visibility 20260819 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add one-time report visibility fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch report-tab default sorting only
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path=Path('src/scripts/app.js')
          app=app_path.read_text()
          original=app

          old='''    sort: "priority",\n    view: "grid",'''
          new='''    sort: "newest",\n    view: "grid",'''
          if old not in app:
              raise SystemExit('Initial sort target not found')
          app=app.replace(old,new,1)

          old='''  const setTab = (tab) => {\n    state.tab = tab;\n    document.querySelectorAll("[data-tab]").forEach((button) => button.setAttribute("aria-selected", String(button.dataset.tab === tab)));\n    renderResearch();\n  };'''
          new='''  const defaultSortForTab = (tab) => tab === "reports" ? "newest" : "priority";\n\n  const setTab = (tab) => {\n    state.tab = tab;\n    state.sort = defaultSortForTab(tab);\n    if (refs.sort) refs.sort.value = state.sort;\n    document.querySelectorAll("[data-tab]").forEach((button) => button.setAttribute("aria-selected", String(button.dataset.tab === tab)));\n    renderResearch();\n  };'''
          if old not in app:
              raise SystemExit('setTab target not found')
          app=app.replace(old,new,1)

          old='''    state.sort = "priority";\n    refs.search.value = "";'''
          new='''    state.sort = defaultSortForTab(state.tab);\n    refs.search.value = "";'''
          if old not in app:
              raise SystemExit('resetFilters sort target not found')
          app=app.replace(old,new,1)

          old='''  refs.search.addEventListener("input", () => { state.query = refs.search.value; renderResearch(); });\n  refs.sort.addEventListener("change", () => { state.sort = refs.sort.value; renderResearch(); });'''
          new='''  refs.search.addEventListener("input", () => { state.query = refs.search.value; renderResearch(); });\n  refs.sort.value = state.sort;\n  refs.sort.addEventListener("change", () => { state.sort = refs.sort.value; renderResearch(); });'''
          if old not in app:
              raise SystemExit('sort select initialization target not found')
          app=app.replace(old,new,1)

          if app == original:
              raise SystemExit('No app changes applied')
          app_path.write_text(app)

          index_path=Path('index.html')
          html=index_path.read_text()
          html_before=html
          old='<option value="newest">Mới nhất</option>'
          new='<option value="newest" selected>Mới nhất</option>'
          if old not in html:
              raise SystemExit('Newest option target not found')
          html=html.replace(old,new,1)
          import re
          html,count=re.subn(r'assets/js/site\.min\.js\?v=[^"\']+', 'assets/js/site.min.js?v=20260819-report-sort1', html, count=1)
          if count != 1:
              raise SystemExit(f'Cache token replacements: {count}')
          if html == html_before:
              raise SystemExit('No index changes applied')
          index_path.write_text(html)
          PY
      - name: Verify sorting semantics before build
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const app=fs.readFileSync('src/scripts/app.js','utf8');
          if(!app.includes('sort: "newest"')) throw new Error('Reports do not initialize newest');
          if(!app.includes('defaultSortForTab = (tab) => tab === "reports" ? "newest" : "priority"')) throw new Error('Per-tab default sort missing');
          const code=fs.readFileSync('src/data/research-data.js','utf8');
          const sandbox={window:{}}; vm.runInNewContext(code,sandbox);
          const reports=[...sandbox.window.RESEARCH_DATA.reports].sort((a,b)=>b.date.localeCompare(a.date));
          const top5=reports.slice(0,5).map(r=>r.ticker);
          const expected=new Set(['MSB','VIB','TCB','PNJ','BSI']);
          if(top5.length!==5 || top5.some(t=>!expected.has(t)) || new Set(top5).size!==5) throw new Error(`Newest top5 unexpected: ${top5.join(',')}`);
          console.log('NEWEST_TOP5',top5.join(' -> '));
          NODE
      - name: Run regression suite and rebuild
        run: |
          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
      - name: Guard structure and CSS
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only | grep -Ev '^(src/scripts/app\.js|assets/js/site\.min\.js|index\.html)$' || true)"
          git diff --quiet -- src/index.css src/styles assets/css/site.min.css
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');
          const order=[...html.matchAll(/<section\b[^>]*\bid=(['"])([^'"]+)\1[^>]*>/g)].map(m=>m[2]);
          const expected=['overview','daily-market','position-ledger','action-radar','research'];
          if(order.join(',')!==expected.join(',')) throw new Error(`Section order changed: ${order.join(' -> ')}`);
          if(!html.includes('<option value="newest" selected>Mới nhất</option>')) throw new Error('Newest option is not selected in fallback HTML');
          console.log('STRUCTURE_OK',order.join(' -> '));
          NODE
      - name: Commit fix and remove temporary workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-report-visibility-20260819-once.yml
          git rm .github/workflows/diagnose-report-visibility-20260819-once.yml
          git add src/scripts/app.js assets/js/site.min.js index.html
          git commit -m 'Show newest valuation reports first'
          git push origin HEAD:main
