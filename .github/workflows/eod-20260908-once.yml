name: One-time verified EOD market update 2026-09-08

on:
  push:
    paths:
      - '.github/workflows/eod-20260908-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch daily market insight
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/data/daily-insights.js')
          text = path.read_text(encoding='utf-8')
          if 'id: "market-view-20260908"' in text:
              print('08/09 entry already exists; no duplicate write.')
          else:
              old_updated = '  updated: "2026-09-07",'
              if old_updated not in text:
                  raise SystemExit('Expected updated date 2026-09-07 not found; refusing unsafe patch')
              text = text.replace(old_updated, '  updated: "2026-09-08",', 1)
              anchor = '  entries: [\n'
              if text.count(anchor) != 1:
                  raise SystemExit('entries anchor missing or non-unique')
              entry = '''    {
                id: "market-view-20260908",
                date: "2026-09-08",
                publishedAt: "08/09/2026 • Sau phiên",
                edition: "Số 13",
                sentiment: "watch",
                sentimentLabel: "GIỮ / CHỜ",
                dataStatus: "ĐTCK + CafeF + Stockbiz • EOD 08.09.2026",
                title: "VN-Index hồi lên 1.830 nhưng thanh khoản chưa xác nhận",
                thesis: "VN-Index tăng 8,80 điểm (+0,48%) lên 1.830,44 điểm sau phiên giảm sâu 07/09. Độ rộng HOSE cân bằng với 152 mã tăng và 158 mã giảm; tổng GTGD đạt gần 14.185 tỷ đồng, giảm hơn 17% về giá trị và hơn 13% về khối lượng so với phiên trước. Khối ngoại tiếp tục bán ròng khoảng 399 tỷ đồng trên HOSE. TRẠNG THÁI TÁC NGHIỆP: GIỮ / CHỜ — chỉ số hồi phục nhưng chưa có xác nhận đồng thuận từ thanh khoản và dòng vốn ngoại.",
                author: "Xuân Lê TVS",
                role: "Môi giới và tư vấn đầu tư",
                readingTime: "2 phút đọc",
                metrics: [
                  { label: "VN-INDEX", value: "1.830,44", change: "+8,80 • +0,48%", tone: "positive" },
                  { label: "GTGD HOSE", value: "14.185 tỷ", change: "−17% giá trị • −13% khối lượng vs 07/09", tone: "warning" },
                  { label: "ĐỘ RỘNG HOSE", value: "152 tăng / 158 giảm", change: "Cân bằng nhưng chưa nghiêng rõ về bên mua", tone: "neutral" },
                  { label: "KHỐI NGOẠI HOSE", value: "BÁN RÒNG", change: "Khoảng −399 tỷ đồng", tone: "warning" }
                ],
                backdrop: [
                  "VN-Index rung lắc phần lớn thời gian nhưng hồi cuối phiên và đóng cửa tại 1.830,44 điểm, tăng 8,80 điểm. Chỉ số đã lấy lại vùng 1.830 sau cú giảm 31,44 điểm ngày 07/09, song đây mới là nhịp hồi kỹ thuật khi chưa xuất hiện xác nhận rõ từ dòng tiền.",
                  "Độ rộng HOSE gần cân bằng với 152 mã tăng và 158 mã giảm. Tổng khối lượng đạt hơn 559,4 triệu cổ phiếu, GTGD gần 14.185 tỷ đồng; cả khối lượng và giá trị đều giảm mạnh so với phiên trước, cho thấy áp lực bán đã hạ nhưng lực cầu chủ động cũng chưa đủ mạnh để xác nhận chuyển trạng thái tích cực.",
                  "VIC tăng khoảng 1,9% và đóng góp hơn 7,5 điểm cho VN-Index; GAS và BSR cũng tăng tốt, trong khi VRE, STB, VHM và LPB chịu áp lực. Dòng tiền vẫn mang tính phân hóa, nổi bật hơn ở dầu khí, năng lượng và một số mã vừa/nhỏ thay vì lan tỏa đồng đều toàn thị trường.",
                  "Khối ngoại tiếp tục bán ròng khoảng 399 tỷ đồng trên HOSE theo CafeF; toàn thị trường bán ròng khoảng 385 tỷ đồng. FPT được mua ròng nổi bật, nhưng áp lực bán tập trung ở một số cổ phiếu ngân hàng."
                ],
                levels: [
                  { label: "Vùng giữ nhịp / hỗ trợ gần", value: "1.805–1.820", note: "Nếu chỉ số quay lại và đóng dưới vùng này, rủi ro ngắn hạn tăng và ưu tiên trạng thái risk-off." },
                  { label: "Vùng cân bằng hiện tại", value: "1.830–1.850", note: "VN-Index vừa lấy lại 1.830 nhưng thanh khoản chưa xác nhận; cần giữ vùng và cải thiện độ rộng trước khi nâng trạng thái." },
                  { label: "Ngưỡng xác nhận tích cực", value: "> 1.870", note: "Chỉ chuyển sang positive khi đóng vượt 1.870 với số mã tăng áp đảo, thanh khoản cải thiện và không có VETO mới." }
                ],
                playbook: [
                  { state: "positive", if: "XÁC NHẬN TÍCH CỰC — VN-Index đóng vượt 1.870, độ rộng chuyển sang số mã tăng áp đảo, thanh khoản cải thiện rõ và không xuất hiện VETO mới", then: "TĂNG DẦN tỷ trọng ở leader/setup hợp lệ; chia lệnh, chỉ nhận giao dịch có R:R tối thiểu 2:1 và stoploss 3–7% theo cấu trúc từng mã." },
                  { state: "neutral", if: "CÂN BẰNG / CHƯA XÁC NHẬN — VN-Index giữ vùng 1.830–1.850 nhưng độ rộng chỉ cân bằng hoặc thanh khoản chưa đồng thuận", then: "GIỮ / CHỜ với tỷ trọng vừa phải; giữ mã khỏe, chờ điểm vào có R:R tốt. Không mua đuổi khi tín hiệu xác nhận chưa đủ." },
                  { state: "risk_off", if: "VETO / RISK-OFF — VN-Index đóng dưới 1.805–1.820 hoặc áp lực bán mở rộng trở lại, độ rộng xấu rõ hay nhóm dẫn dắt đồng loạt suy yếu", then: "GIẢM RỦI RO phần trading; không bắt đáy sớm, không bình quân giá xuống; tuân thủ stoploss 3–7% theo cấu trúc từng mã." }
                ],
                focus: "1.805–1.820 • vùng cân bằng 1.830–1.850 • thanh khoản suy giảm • VIC/dầu khí • khối ngoại bán ròng",
                inference: "VN-Index 1.830,44 điểm, tăng 8,80 điểm (+0,48%), độ rộng 152 tăng/158 giảm, khối lượng hơn 559,4 triệu cổ phiếu và GTGD gần 14.185 tỷ đồng được lấy từ Tin nhanh Chứng khoán ngày 08/09/2026; nguồn này ghi thanh khoản giảm hơn 13% về khối lượng và 17% về giá trị so với 07/09. Stockbiz đồng thời hiển thị VN-Index 1.830,44 điểm, +8,80 điểm (+0,48%) lúc sau đóng cửa. CafeF ghi khối ngoại bán ròng khoảng 399 tỷ đồng trên HOSE và khoảng 385 tỷ đồng toàn thị trường. Việc xếp trạng thái GIỮ / CHỜ là diễn giải tác nghiệp của Xuân Lê TVS theo quy tắc loại trừ: không có VETO đủ mạnh để duy trì risk-off, nhưng cũng chưa đủ điều kiện positive vì thanh khoản suy giảm và dòng vốn ngoại còn âm. Các vùng 1.805–1.820, 1.830–1.850 và trên 1.870 là mốc tác nghiệp có điều kiện, không phải mức được đảm bảo. Không nội suy số liệu thiếu. Với giao dịch mới, ưu tiên R:R tối thiểu 2:1 và stoploss 3–7% theo cấu trúc từng mã. Nội dung mang tính tham khảo, không phải khuyến nghị mua/bán; nhà đầu tư tự chịu trách nhiệm với quyết định của mình.",
                sources: [
                  { label: "Tin nhanh Chứng khoán — Lực cung được tiết giảm, VN-Index hồi phục lên 1.830 điểm", url: "https://www.tinnhanhchungkhoan.vn/luc-cung-duoc-tiet-giam-vn-index-hoi-phuc-len-1830-diem-post397214.html" },
                  { label: "CafeF — Phiên 8/9: Khối ngoại bán tiếp đà bán ròng", url: "https://cafef.vn/phien-8-9-khoi-ngoai-ban-tiep-da-ban-rong-xa-manh-hai-co-phieu-ngan-hang-188260908154734368.chn" },
                  { label: "Stockbiz — Snapshot chỉ số VN-Index 08/09/2026", url: "https://web.stockbiz.vn/Stocks/ACB/HistoricalQuotes.aspx" }
                ]
              },
'''
              text = text.replace(anchor, anchor + entry, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit market update
        run: |
          if git diff --quiet -- src/data/daily-insights.js; then
            echo "No daily insight change to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/daily-insights.js
            git commit -m "Update daily market view for 08-09-2026 [skip ci]"
            git push
          fi

      - name: Remove one-time workflow
        run: |
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/eod-20260908-once.yml
          git commit -m "Remove one-time EOD 08-09 workflow [skip ci]"
          git push
