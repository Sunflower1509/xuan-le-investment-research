name: One-time verified EOD market update 2026-09-08
on:
  push:
    paths:
      - '.github/workflows/eod-20260908-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch daily insight
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/data/daily-insights.js')
          t=p.read_text(encoding='utf-8')
          if 'id: "market-view-20260908"' not in t:
              if '  updated: "2026-09-07",' not in t:
                  raise SystemExit('unexpected current updated date')
              t=t.replace('  updated: "2026-09-07",','  updated: "2026-09-08",',1)
              a='  entries: [\n'
              e='''    {
                id: "market-view-20260908",
                date: "2026-09-08",
                publishedAt: "08/09/2026 • Sau phiên",
                edition: "Số 13",
                sentiment: "watch",
                sentimentLabel: "GIỮ / CHỜ",
                dataStatus: "ĐTCK + CafeF + Stockbiz • EOD 08.09.2026",
                title: "VN-Index hồi lên 1.830 nhưng thanh khoản chưa xác nhận",
                thesis: "VN-Index tăng 8,80 điểm (+0,48%) lên 1.830,44 điểm. Độ rộng HOSE gần cân bằng với 152 mã tăng và 158 mã giảm; tổng GTGD gần 14.185 tỷ đồng, giảm hơn 17% về giá trị và hơn 13% về khối lượng so với 07/09. Khối ngoại tiếp tục bán ròng khoảng 399 tỷ đồng trên HOSE. TRẠNG THÁI TÁC NGHIỆP: GIỮ / CHỜ vì nhịp hồi chưa được xác nhận bởi thanh khoản và dòng vốn ngoại.",
                author: "Xuân Lê TVS",
                role: "Môi giới và tư vấn đầu tư",
                readingTime: "2 phút đọc",
                metrics: [
                  { label: "VN-INDEX", value: "1.830,44", change: "+8,80 • +0,48%", tone: "positive" },
                  { label: "GTGD HOSE", value: "14.185 tỷ", change: "−17% giá trị • −13% khối lượng vs 07/09", tone: "warning" },
                  { label: "ĐỘ RỘNG HOSE", value: "152 tăng / 158 giảm", change: "Cân bằng, chưa nghiêng rõ về bên mua", tone: "neutral" },
                  { label: "KHỐI NGOẠI HOSE", value: "BÁN RÒNG", change: "Khoảng −399 tỷ đồng", tone: "warning" }
                ],
                backdrop: [
                  "VN-Index rung lắc phần lớn thời gian nhưng hồi cuối phiên lên 1.830,44 điểm. Chỉ số lấy lại vùng 1.830 sau cú giảm sâu ngày 07/09, song nhịp hồi chưa đủ mạnh để xác nhận đảo chiều ngắn hạn.",
                  "Độ rộng HOSE gần cân bằng với 152 mã tăng và 158 mã giảm. Khối lượng hơn 559,4 triệu cổ phiếu và GTGD gần 14.185 tỷ đồng, đều giảm mạnh so với phiên trước; áp lực bán hạ nhưng lực cầu chủ động cũng chưa tăng tương ứng.",
                  "VIC tăng khoảng 1,9% và đóng góp hơn 7,5 điểm; GAS và BSR cũng tăng tốt. Dòng tiền tiếp tục phân hóa, nổi bật hơn ở dầu khí, năng lượng và một số mã vừa/nhỏ.",
                  "Khối ngoại bán ròng khoảng 399 tỷ đồng trên HOSE; toàn thị trường khoảng 385 tỷ đồng. Đây vẫn là điểm trừ đối với độ tin cậy của nhịp hồi."
                ],
                levels: [
                  { label: "Vùng giữ nhịp / hỗ trợ gần", value: "1.805–1.820", note: "Đóng dưới vùng này làm tăng rủi ro và ưu tiên risk-off." },
                  { label: "Vùng cân bằng hiện tại", value: "1.830–1.850", note: "Cần giữ vùng và cải thiện độ rộng/thanh khoản trước khi nâng trạng thái." },
                  { label: "Ngưỡng xác nhận tích cực", value: "> 1.870", note: "Chỉ positive khi đóng vượt 1.870, số mã tăng áp đảo, thanh khoản cải thiện và không có VETO." }
                ],
                playbook: [
                  { state: "positive", if: "VN-Index đóng vượt 1.870, độ rộng tăng áp đảo, thanh khoản cải thiện rõ và không có VETO", then: "TĂNG DẦN tỷ trọng ở leader/setup hợp lệ; chia lệnh, ưu tiên R:R ≥ 2:1 và stoploss 3–7%." },
                  { state: "neutral", if: "VN-Index giữ 1.830–1.850 nhưng độ rộng chỉ cân bằng hoặc thanh khoản chưa đồng thuận", then: "GIỮ / CHỜ với tỷ trọng vừa phải; giữ mã khỏe, chờ điểm vào có R:R tốt; không mua đuổi khi chưa đủ xác nhận." },
                  { state: "risk_off", if: "VN-Index đóng dưới 1.805–1.820 hoặc áp lực bán mở rộng, độ rộng xấu rõ hay nhóm dẫn dắt đồng loạt suy yếu", then: "GIẢM RỦI RO phần trading; không bắt đáy sớm, không bình quân giá xuống; tuân thủ stoploss 3–7%." }
                ],
                focus: "1.805–1.820 • 1.830–1.850 • thanh khoản suy giảm • VIC/dầu khí • khối ngoại bán ròng",
                inference: "Số liệu VN-Index 1.830,44 điểm, +8,80 điểm (+0,48%), độ rộng 152 tăng/158 giảm, khối lượng hơn 559,4 triệu cổ phiếu và GTGD gần 14.185 tỷ đồng lấy từ Tin nhanh Chứng khoán ngày 08/09/2026; Stockbiz xác nhận lại điểm số và mức tăng. CafeF ghi khối ngoại bán ròng khoảng 399 tỷ đồng trên HOSE. Trạng thái GIỮ / CHỜ là diễn giải tác nghiệp của Xuân Lê TVS: không còn VETO đủ mạnh để duy trì risk-off, nhưng chưa đủ điều kiện positive do thanh khoản suy giảm và dòng vốn ngoại còn âm. Không nội suy số liệu thiếu. Với giao dịch mới, ưu tiên R:R ≥ 2:1 và stoploss 3–7%. Nội dung mang tính tham khảo, không phải khuyến nghị mua/bán; nhà đầu tư tự chịu trách nhiệm với quyết định của mình.",
                sources: [
                  { label: "Tin nhanh Chứng khoán — Lực cung được tiết giảm, VN-Index hồi phục lên 1.830 điểm", url: "https://www.tinnhanhchungkhoan.vn/luc-cung-duoc-tiet-giam-vn-index-hoi-phuc-len-1830-diem-post397214.html" },
                  { label: "CafeF — Phiên 8/9: Khối ngoại bán tiếp đà bán ròng", url: "https://cafef.vn/phien-8-9-khoi-ngoai-ban-tiep-da-ban-rong-xa-manh-hai-co-phieu-ngan-hang-188260908154734368.chn" },
                  { label: "Stockbiz — Snapshot VN-Index 08/09/2026", url: "https://web.stockbiz.vn/Stocks/ACB/HistoricalQuotes.aspx" }
                ]
              },
'''
              p.write_text(t.replace(a,a+e,1),encoding='utf-8')
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/daily-insights.js
          if ! git diff --cached --quiet; then git commit -m "Update daily market view for 08-09-2026 [skip ci]"; git push; fi
          git pull --rebase origin main
          git rm .github/workflows/eod-20260908-once.yml
          git commit -m "Remove one-time EOD 08-09 workflow [skip ci]"
          git push
