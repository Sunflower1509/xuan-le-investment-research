name: Temporary valuation import 2026-10-03

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-valuation-import-2026-10-03.yml"

permissions:
  contents: write

concurrency:
  group: tmp-valuation-import-2026-10-03
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download and verify eight valuation PDFs
        shell: bash
        env:
          FIRE_API: "https://api.firestorage.ai/dev/file"
          SHARE_ID: "AUdW0N_OmUGp"
        run: |
          set -euo pipefail
          listing="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL "${FIRE_API}/shares/${SHARE_ID}/files?maxResults=1000")"

          download_one() {
            local wanted="$1" output="$2" expected_sha="$3" expected_size="$4"
            local file_id payload url
            file_id="$(printf '%s' "$listing" | python3 -c 'import json,sys; w=sys.argv[1]; d=json.load(sys.stdin); m=[f for f in d.get("files",[]) if f.get("fileName")==w or f.get("name")==w]; assert len(m)==1, (w,len(m)); print(m[0].get("fileId") or m[0].get("id"))' "$wanted")"
            payload="$(curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 -fsSL -X POST "${FIRE_API}/shares/${SHARE_ID}/files/$file_id/download")"
            url="$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')"
            curl --retry 4 --retry-all-errors --connect-timeout 15 --max-time 120 -fsSL "$url" -o "$output"
            test "$(wc -c < "$output" | tr -d ' ')" = "$expected_size"
            echo "$expected_sha  $output" | sha256sum -c -
            test "$(head -c 5 "$output")" = "%PDF-"
          }

          download_one "TVS_2026-10-03.pdf" "reports/TVS_2026-10-03.pdf" "bf6a1f595301ef88e89ea492ad822be37d5d23bb42fb05710ce2931a87241c73" "448643"
          download_one "ABB_2026-10-03.pdf" "reports/ABB_2026-10-03.pdf" "b002e9dd5a95da1729d37b3feaef720e8880a94ee0c4cdbf22e3d391c2ce4b7f" "549814"
          download_one "QNS_2026-10-03.pdf" "reports/QNS_2026-10-03.pdf" "6055cb724e203c728c927c60801eecd6521cf1a60dafeb23cea359426eb40404" "568187"
          download_one "MSR_2026-10-03.pdf" "reports/MSR_2026-10-03.pdf" "1b6c2e478db571fba81bd278284bcae02cadb4b36a4f82ac30f72c851e90809f" "372076"
          download_one "PET_2026-10-03.pdf" "reports/PET_2026-10-03.pdf" "5bcf85caf8ae09066f60aec6af208cb3759d46fefbbb9cc5d91f9cb0a11a0b28" "501038"
          download_one "NLG_2026-10-03.pdf" "reports/NLG_2026-10-03.pdf" "8047d036ec59f91be673a85ac9eda9a7ba1c1de78292a8d190acafbded7ee9f5" "311618"
          download_one "VHM_2026-10-03.pdf" "reports/VHM_2026-10-03.pdf" "980def632fbbd1affaafe2a758f11c1eaa40bd3b38aabee9392f292a9b5bded7" "497824"
          download_one "VIC_2026-10-02.pdf" "reports/VIC_2026-10-02.pdf" "eeed9854f5da77bed57656710116d90b5f057b7010929268b1ee35d35ed79943" "545769"

          rm -f             reports/Bao_cao_dinh_gia_TVS_09072026.pdf             reports/QNS_2026-09-16.pdf             reports/MSR_17-08-2026.pdf             reports/PET_2026-08-28.pdf             reports/NLG_2026-08-26.pdf             reports/VHM_Equity_Valuation_Research_Xuan_Le_TVS_2026-08-12.pdf             reports/VIC_2026-09-04.pdf

      - name: Replace valuation registry, add ABB and preserve EOD snapshots
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("node:fs"), vm=require("node:vm");
          const dataPath="src/data/research-data.js";
          const sandbox={window:{}};
          vm.runInNewContext(fs.readFileSync(dataPath,"utf8"),sandbox,{filename:dataPath});
          const data=sandbox.window.RESEARCH_DATA;
          const targets=["TVS","ABB","QNS","MSR","PET","NLG","VHM","VIC"];
          const targetSet=new Set(targets);
          const targetDates={TVS:"2026-10-03",ABB:"2026-10-03",QNS:"2026-10-03",MSR:"2026-10-03",PET:"2026-10-03",NLG:"2026-10-03",VHM:"2026-10-03",VIC:"2026-10-02"};
          const oldValuations=(data.reports||[]).filter(r=>r.reportType!=="trading"&&targetSet.has(String(r.ticker||"").toUpperCase()));
          for(const r of oldValuations){
            if(String(r.date||"")>targetDates[r.ticker]) throw new Error(r.ticker+": newer valuation already exists: "+r.date);
          }
          if((data.reports||[]).some(r=>r.reportType!=="trading"&&r.ticker==="ABB")) throw new Error("ABB valuation unexpectedly already exists");
          if(data.meta?.updated!=="2026-10-02") throw new Error("Expected EOD lock 2026-10-02, got "+data.meta?.updated);

          const visual=(ticker,date,file)=>({
            src:"assets/images/reports/"+ticker.toLowerCase()+".webp?v="+date.replaceAll("-","")+"-cover1",
            alt:"Trang bìa báo cáo định giá "+ticker+" ngày "+date.split("-").reverse().join("/"),
            caption:"Bìa báo cáo định giá "+ticker,
            sourceLabel:"Xuân Lê TVS Equity Research",
            sourceUrl:file,
            kind:"report-cover"
          });

          const reports=[
            {
              id:"TVS-20261003",ticker:"TVS",company:"Công ty Cổ phần Chứng khoán Thiên Việt",sector:"Chứng khoán",exchange:"HOSE",
              date:"2026-10-03",recommendation:"THẬN TRỌNG / CHỜ",status:"wait",
              marketPrice:14300,marketPriceDate:"2026-10-02",baseValue:14210,valueLabel:"Giá trị kỳ vọng",
