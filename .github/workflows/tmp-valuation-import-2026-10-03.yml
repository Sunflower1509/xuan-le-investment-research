          data.reports=(data.reports||[]).filter(r=>!(r.reportType!=="trading"&&targetSet.has(String(r.ticker||"").toUpperCase()))).concat(reports);
          data.reports.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||String(a.ticker||"").localeCompare(String(b.ticker||""))||String(a.reportType||"valuation").localeCompare(String(b.reportType||"valuation")));

          const byCoverage=new Map((data.coverage||[]).map(c=>[c.ticker,c]));
          for(const r of reports){
            if(r.ticker==="ABB") continue;
            const c=byCoverage.get(r.ticker);
            if(!c) throw new Error(r.ticker+": coverage missing");
            if(c.priceDate!=="2026-10-02") throw new Error(r.ticker+": priceDate must remain 2026-10-02");
            if(r.ticker!=="VIC"&&Number(c.close)!==Number(r.marketPrice)) throw new Error(r.ticker+": EOD close mismatch report P0");
            if(r.ticker==="VIC"&&Number(c.close)!==224000) throw new Error("VIC coverage EOD 02/10 must remain 224000");
            c.company=r.company;
            c.sector=r.sector;
            c.exchange=r.exchange;
            c.reportId=r.id;
            c.action=structuredClone(r.action);
          }
          if(byCoverage.has("ABB")) throw new Error("ABB coverage unexpectedly already exists");
          data.coverage.push({
            ticker:"ABB",company:"Ngân hàng TMCP An Bình",sector:"Ngân hàng",exchange:"UPCOM",
            reportId:"ABB-20261003",close:17700,changePct:-0.5587,volume:450100,priceDate:"2026-10-02",
            priceSource:"https://vn.investing.com/equities/an-binh-commercial-joint-stock-bank-historical-data",
            priceSourceSecondary:"https://web.stockbiz.vn/Stocks/ABB/LookupQuote.aspx?Date=02%2F10%2F2026",
            action:structuredClone(reports.find(r=>r.ticker==="ABB").action)
          });
          data.coverage.sort((a,b)=>String(a.ticker).localeCompare(String(b.ticker)));

          const vals=data.reports.filter(r=>r.reportType!=="trading");
          if(vals.length!==131||data.coverage.length!==131) throw new Error("Expected 131 valuation reports and coverage");
          if(new Set(vals.map(r=>r.ticker)).size!==131||new Set(data.coverage.map(c=>c.ticker)).size!==131) throw new Error("Duplicate ticker invariant failed");
          for(const r of reports){
            const c=data.coverage.find(x=>x.ticker===r.ticker);
            if(vals.filter(x=>x.ticker===r.ticker).length!==1) throw new Error(r.ticker+": latest-only invariant failed");
            if(c.reportId!==r.id||c.action?.basisDate!==r.date||c.action?.eligibility!==r.action.eligibility) throw new Error(r.ticker+": report/coverage action sync failed");
          }
          if((data.coverage||[]).some(c=>c.priceDate!==data.meta.updated)) throw new Error("Coverage priceDate drift from meta.updated");

          const msg=" Báo cáo định giá TVS, ABB, QNS, MSR, PET, NLG, VHM và VIC đã được cập nhật/thêm bằng bản 02-03/10/2026; các bản định giá cũ tương ứng được loại theo quy tắc latest-only. Registry, action plan và ảnh bìa được đồng bộ theo báo cáo mới; dữ liệu EOD 02/10/2026 của các mã hiện hữu được giữ nguyên và ABB được bổ sung coverage EOD 02/10/2026. Không thay đổi bố cục HTML/CSS.";
          data.meta=data.meta||{};
          if(typeof data.meta.note!=="string") data.meta.note="";
          if(!data.meta.note.includes("Báo cáo định giá TVS, ABB, QNS, MSR, PET, NLG, VHM và VIC")) data.meta.note=data.meta.note.trim()+msg;
          fs.writeFileSync(dataPath,"window.RESEARCH_DATA = "+JSON.stringify(data,null,2)+";\n");

          const ledgerPath="src/data/trade-ledger.json";
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,"utf8"));
          let adjusted=0;
          for(const event of ledger.events||[]){
            if(typeof event.reportFile==="string"&&event.reportFile&&!fs.existsSync(event.reportFile)){
              const removed=event.reportFile;
              event.reportFile=null;
              const extra=" PDF nguồn lịch sử "+String(event.reportId||removed)+" đã được loại khỏi kho public theo quy tắc latest-only; reportId và toàn bộ thông số kích hoạt lịch sử được giữ nguyên.";
              if(!String(event.note||"").includes("đã được loại khỏi kho public theo quy tắc latest-only")) event.note=String(event.note||"").trim()+extra;
              adjusted++;
            }
          }
          fs.writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+"\n");
          console.log(JSON.stringify({oldValuations:oldValuations.map(r=>({ticker:r.ticker,id:r.id,date:r.date,file:r.file})),newReports:reports.map(r=>({ticker:r.ticker,id:r.id,date:r.date,file:r.file})),historicalLedgerRefsAdjusted:adjusted},null,2));
          NODE

      - name: Expand CIVS coverage universe for ABB without changing page layout
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("node:fs");
          const registryPath="src/data/company-visual-candidates.json";
          const registry=JSON.parse(fs.readFileSync(registryPath,"utf8"));
          registry.meta.coverageTarget=131;
          registry.meta.candidateCount=122;
          if(!registry.candidates.some(x=>x.ticker==="ABB")){
            registry.candidates.push({
              ticker:"ABB",
              sourceUrl:"https://www.abbank.vn/",
              officialDomain:"abbank.vn",
              sourceTier:"B",
              identityType:"corporate-banking",
              keywords:["ABBank","ngân hàng","chi nhánh","trụ sở","bank"]
            });
          }
          registry.candidates.sort((a,b)=>String(a.ticker).localeCompare(String(b.ticker)));
          if(registry.candidates.length!==122||new Set(registry.candidates.map(x=>x.ticker)).size!==122) throw new Error("CIVS registry must contain 122 unique candidates");
          fs.writeFileSync(registryPath,JSON.stringify(registry,null,2)+"\n");

          const files=[
            "scripts/ensure-company-visual-candidates.mjs",
            "scripts/sync-company-visuals-core.mjs",
            "scripts/audit-company-visuals-core.mjs",
            "tests/company-visuals.test.mjs",
            "docs/company-identity-visual-standard.md"
          ];
          for(const p of files){
            let s=fs.readFileSync(p,"utf8");
            s=s.replace(/\b130\b/g,"131").replace(/\b121\b/g,"122");
            fs.writeFileSync(p,s);
          }
          NODE
          if git grep -nE '\b130\b|\b121\b' -- scripts/ensure-company-visual-candidates.mjs scripts/sync-company-visuals-core.mjs scripts/audit-company-visuals-core.mjs tests/company-visuals.test.mjs docs/company-identity-visual-standard.md src/data/company-visual-candidates.json; then
            echo "Stale CIVS 130/121 constants remain" >&2
            exit 2
          fi

      - name: Regenerate report covers and validate imported set
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/images/reports/{tvs,abb,qns,msr,pet,nlg,vhm,vic}.webp
          node scripts/sync-report-covers.mjs

          command -v pdfinfo >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null; }
          test "$(pdfinfo reports/TVS_2026-10-03.pdf | awk '/^Pages:/ {print $2}')" = "22"
          test "$(pdfinfo reports/ABB_2026-10-03.pdf | awk '/^Pages:/ {print $2}')" = "19"
          test "$(pdfinfo reports/QNS_2026-10-03.pdf | awk '/^Pages:/ {print $2}')" = "23"
          test "$(pdfinfo reports/MSR_2026-10-03.pdf | awk '/^Pages:/ {print $2}')" = "12"
          test "$(pdfinfo reports/PET_2026-10-03.pdf | awk '/^Pages:/ {print $2}')" = "20"
          test "$(pdfinfo reports/NLG_2026-10-03.pdf | awk '/^Pages:/ {print $2}')" = "19"
          test "$(pdfinfo reports/VHM_2026-10-03.pdf | awk '/^Pages:/ {print $2}')" = "22"
          test "$(pdfinfo reports/VIC_2026-10-02.pdf | awk '/^Pages:/ {print $2}')" = "17"

          for old in             reports/Bao_cao_dinh_gia_TVS_09072026.pdf             reports/QNS_2026-09-16.pdf             reports/MSR_17-08-2026.pdf             reports/PET_2026-08-28.pdf             reports/NLG_2026-08-26.pdf             reports/VHM_Equity_Valuation_Research_Xuan_Le_TVS_2026-08-12.pdf             reports/VIC_2026-09-04.pdf; do
            test ! -e "$old"
          done

          node --test $(find tests -maxdepth 1 -name '*.test.mjs'             ! -name 'repository-governance.test.mjs'             ! -name 'company-visuals.test.mjs'             ! -name 'ui-company-logos.test.mjs' -print | sort)
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          node scripts/audit-report-covers.mjs

          layout_changes="$(git status --porcelain --untracked-files=all -- index.html src/index.css src/styles src/scripts)"
          test -z "$layout_changes"

          node <<'NODE'
          const fs=require("node:fs"),vm=require("node:vm");
          const s={window:{}}; vm.runInNewContext(fs.readFileSync("src/data/research-data.js","utf8"),s);
          const d=s.window.RESEARCH_DATA;
          const vals=d.reports.filter(r=>r.reportType!=="trading");
          const target=["TVS","ABB","QNS","MSR","PET","NLG","VHM","VIC"];
          const expected={
            TVS:"reports/TVS_2026-10-03.pdf",ABB:"reports/ABB_2026-10-03.pdf",QNS:"reports/QNS_2026-10-03.pdf",
            MSR:"reports/MSR_2026-10-03.pdf",PET:"reports/PET_2026-10-03.pdf",NLG:"reports/NLG_2026-10-03.pdf",
            VHM:"reports/VHM_2026-10-03.pdf",VIC:"reports/VIC_2026-10-02.pdf"
          };
          for(const t of target){
            const rows=vals.filter(r=>r.ticker===t);
            if(rows.length!==1||rows[0].file!==expected[t]) throw new Error(t+": latest-only registry mismatch");
            if(!fs.existsSync(expected[t])) throw new Error(t+": expected PDF missing");
          }
          const ledger=JSON.parse(fs.readFileSync("src/data/trade-ledger.json","utf8"));
          for(const e of ledger.events||[]){
            if(typeof e.reportFile==="string"&&e.reportFile&&!fs.existsSync(e.reportFile)) throw new Error("Broken historical reportFile: "+e.reportFile);
          }
          const tvsMarkets=fs.readdirSync("reports").filter(x=>/^TVS_Market_Report_/i.test(x));
          if(tvsMarkets.length<2) throw new Error("TVS market reports were accidentally removed");
          console.log(JSON.stringify({valuations:vals.length,coverage:d.coverage.length,targetLatestOnly:true,brokenLedgerRefs:0,tvsMarketReportsPreserved:tvsMarkets},null,2));
          NODE

      - name: Commit imported reports atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A --             reports/TVS_2026-10-03.pdf reports/Bao_cao_dinh_gia_TVS_09072026.pdf             reports/ABB_2026-10-03.pdf             reports/QNS_2026-10-03.pdf reports/QNS_2026-09-16.pdf             reports/MSR_2026-10-03.pdf reports/MSR_17-08-2026.pdf             reports/PET_2026-10-03.pdf reports/PET_2026-08-28.pdf             reports/NLG_2026-10-03.pdf reports/NLG_2026-08-26.pdf             reports/VHM_2026-10-03.pdf reports/VHM_Equity_Valuation_Research_Xuan_Le_TVS_2026-08-12.pdf             reports/VIC_2026-10-02.pdf reports/VIC_2026-09-04.pdf             assets/images/reports/tvs.webp assets/images/reports/abb.webp assets/images/reports/qns.webp assets/images/reports/msr.webp             assets/images/reports/pet.webp assets/images/reports/nlg.webp assets/images/reports/vhm.webp assets/images/reports/vic.webp             src/data/research-data.js src/data/trade-ledger.json src/data/company-visual-candidates.json             scripts/ensure-company-visual-candidates.mjs scripts/sync-company-visuals-core.mjs scripts/audit-company-visuals-core.mjs             tests/company-visuals.test.mjs docs/company-identity-visual-standard.md

          git diff --cached --quiet && { echo "No valuation changes to commit" >&2; exit 3; }
          if git diff --cached --name-only | grep -Eq '^(index\.html|src/index\.css|src/styles/|src/scripts/)'; then
            echo "Refusing to commit public layout/structure changes" >&2
            git diff --cached --name-only
            exit 2
          fi
          git diff --cached --name-status
          git commit -m "Publish eight valuation reports for 02-03 Oct 2026"
          git push origin HEAD:main

      - name: Remove temporary workflow after successful import
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git reset --hard origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-valuation-import-2026-10-03.yml
          git commit -m "Remove temporary valuation import workflow [skip ci]"
          git push origin HEAD:main
