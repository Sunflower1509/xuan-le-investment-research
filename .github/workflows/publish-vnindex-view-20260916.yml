              { label: 'VnEconomy — cổ phiếu vừa và nhỏ điều chỉnh mạnh, khối ngoại duy trì mua ròng', url: 'https://vneconomy.vn/co-phieu-vua-va-nho-dieu-chinh-manh-khoi-ngoai-duy-tri-mua-rong.htm' },
              { label: 'DNSE — VN-Index giảm nhẹ, nhóm tài chính và bất động sản gây sức ép', url: 'https://www.dnse.com.vn/senses/tin-tuc/vn-index-giam-nhe-nhom-tai-chinh-va-bat-dong-san-gay-suc-ep-35286641' },
              { label: 'VNIndex.ai — phiên 16/09 & khối ngoại HOSE', url: 'https://vnindex.ai/vnindex-hom-nay' },
              { label: 'VNSignal — VN30F1M 16/09/2026', url: 'https://vnsignal.vn/thi-truong/chung-khoan-phai-sinh/vn30f1m' },
              { label: 'Entrade — bản tin phái sinh 16/09/2026', url: 'https://blog.entrade.com.vn/ban-tin-phai-sinh-16-09-2026-vn30f1m-hoi-manh-giang-co-tai-vung-1-945-1-955/' },
              { label: 'VTV — bối cảnh chứng khoán toàn cầu & Fed 16/09', url: 'https://vtv.vn/chung-khoan-the-gioi-do-san-100260916092532132.htm' }
            ]
          };

          if (code.includes(`id: "${entry.id}"`) || code.includes(`id: '${entry.id}'`)) {
            throw new Error(`Entry ${entry.id} already exists; refusing duplicate publish.`);
          }
          if (entry.confluence.factors.reduce((sum, item) => sum + item.score, 0) !== entry.confluence.score) throw new Error('Confluence score mismatch');
          if (entry.scenarios.reduce((sum, item) => sum + item.probability, 0) !== 100) throw new Error('Scenario probabilities must sum to 100');
          if (entry.playbook.map(x => x.state).join('|') !== 'positive|neutral|risk_off') throw new Error('Playbook state order invalid');
          const marker = '  const entries = [\n';
          if (!code.includes(marker)) throw new Error('Automated archive marker missing');
          const serialized = JSON.stringify(entry, null, 2).split('\n').map(line => '    ' + line).join('\n');
          code = code.replace(marker, marker + serialized + ',\n');
          fs.writeFileSync(path, code);
          console.log('PUBLISHED_ENTRY', entry.id, entry.date, entry.confluence.score, entry.sentimentLabel);
          NODE

      - name: Validate syntax and policy tests
        shell: bash
        run: |
          set -euo pipefail
          node --check src/data/daily-insights-auto.js
          node --test tests/*.test.mjs

      - name: Commit verified VNINDEX view
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/daily-insights-auto.js
          git diff --cached --exit-code && { echo 'No insight changes to commit'; exit 1; } || true
          git commit -m "Publish verified VNINDEX view 2026-09-16"
          git push origin HEAD:main
