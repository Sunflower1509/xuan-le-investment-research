name: Fix valuation lock label 2026-09-16

on:
  push:
    paths:
      - ".github/workflows/eod-fix-lock-label-20260916.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Replace only stale valuation lock date label
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'index.html';
          const before = fs.readFileSync(path, 'utf8');
          const expected = ['overview', 'daily-market', 'position-ledger', 'action-radar', 'research'];
          const order = (html) => [...html.matchAll(/<section\b[^>]*\bid=(['"])([^'"]+)\1[^>]*>/g)].map((m) => m[2]);
          if (order(before).join(',') !== expected.join(',')) throw new Error(`Unexpected section order before fix: ${order(before).join(' -> ')}`);
          const from = 'Giá khóa 15.09';
          const to = 'Giá khóa 16.09';
          const count = before.split(from).length - 1;
          if (count !== 1) throw new Error(`Expected exactly one stale valuation lock label, found ${count}`);
          const after = before.replace(from, to);
          if (order(after).join(',') !== expected.join(',')) throw new Error(`Section order changed: ${order(after).join(' -> ')}`);
          const normalizedBefore = before.replace(from, 'Giá khóa DATE');
          const normalizedAfter = after.replace(to, 'Giá khóa DATE');
          if (normalizedBefore !== normalizedAfter) throw new Error('Detected change outside valuation lock date label');
          for (const stale of ['giá đóng cửa 15/09/2026','Giá theo dõi khóa EOD 15.09.2026','Action Radar • EOD 15.09.2026','Giá khóa 15.09']) {
            if (after.includes(stale)) throw new Error(`Stale 15/09 static label remains: ${stale}`);
          }
          fs.writeFileSync(path, after);
          NODE

      - name: Run complete tests and site audit
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          node scripts/audit-site.mjs

      - name: Guard exact mutation scope and commit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [[ "$changed" != "index.html" ]]; then
            echo "Unexpected changed paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Synchronize valuation lock label for 2026-09-16"
          git push origin HEAD:main

      - name: Dispatch full Pages verification on latest main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
          echo "Dispatched Pages verification after valuation lock label fix."
