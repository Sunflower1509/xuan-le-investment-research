name: Daily market three-state policy verification

on:
  push:
    branches:
      - update/daily-market-3-state-policy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out policy branch
        uses: actions/checkout@v5
        with:
          ref: update/daily-market-3-state-policy
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply guarded 3-state migration
        run: node scripts/apply-daily-market-3-state-policy.mjs
      - name: Assert only approved source scope changed before build
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html assets/css/site.min.css; then
            echo "HTML/CSS must remain unchanged." >&2
            git diff -- index.html assets/css/site.min.css >&2
            exit 2
          fi
          allowed='^(src/data/daily-insights\.js|scripts/audit-site\.mjs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected pre-build changed paths:" >&2
            echo "$unexpected" >&2
            exit 2
          fi
      - name: Run complete test suite
        run: node --test tests/*.test.mjs
      - name: Build production assets
        run: bash scripts/build/build-assets.sh
      - name: Audit site integrity
        run: node scripts/audit-site.mjs
      - name: Audit semantic report-cover integrity
        run: node scripts/audit-report-covers.mjs
      - name: Audit company-logo integrity
        run: node scripts/audit-company-logos.mjs
      - name: Guard public layout and build mutation scope
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- index.html assets/css/site.min.css; then
            echo "Refusing policy update because public layout changed." >&2
            git diff -- index.html assets/css/site.min.css >&2
            exit 2
          fi
          allowed='^(src/data/daily-insights\.js|scripts/audit-site\.mjs|assets/js/site\.min\.js)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected post-build changed paths:" >&2
            echo "$unexpected" >&2
            exit 2
          fi
      - name: Persist verified policy changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/daily-insights.js scripts/audit-site.mjs assets/js/site.min.js
          if ! git diff --cached --quiet; then
            git commit -m "Enforce three-state daily market playbook [skip ci]"
            git push origin HEAD:update/daily-market-3-state-policy
          fi
