name: EOD diagnostic 2026-09-15

on:
  push:
    paths:
      - ".github/workflows/eod-diagnostic-20260915.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query independent KBS date-specific OHLC
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const tickers = ['DDV', 'MSR', 'OIL', 'PHP'];
          const date = '15-09-2026';
          const normalize = (v) => {
            const n = Number(v);
            if (!Number.isFinite(n) || n <= 0) return null;
            return n < 1000 ? Math.round(n * 1000) : Math.round(n);
          };
          for (const ticker of tickers) {
            const url = `https://kbbuddywts.kbsec.com.vn/iis-server/investment/stocks/${ticker}/data_day?sdate=${date}&edate=${date}`;
            const response = await fetch(url, { headers: { accept: 'application/json', 'user-agent': 'XuanLeTVS-EOD-Diagnostic/1.0' }, signal: AbortSignal.timeout(20000) });
            if (!response.ok) throw new Error(`${ticker}: KBS HTTP ${response.status}`);
            const payload = await response.json();
            const rows = Array.isArray(payload?.data_day) ? payload.data_day : [];
            if (!rows.length) throw new Error(`${ticker}: KBS missing row`);
            const row = rows[0];
            const result = {
              ticker,
              open: normalize(row.o ?? row.open),
              high: normalize(row.h ?? row.high),
              low: normalize(row.l ?? row.low),
              close: normalize(row.c ?? row.close),
              volume: Number(row.v ?? row.volume),
              rawDate: row.t ?? row.time ?? null,
              source: url
            };
            if (![result.open, result.high, result.low, result.close].every((v) => Number.isFinite(v) && v > 0)) throw new Error(`${ticker}: incomplete OHLC`);
            if (!(Number.isFinite(result.volume) && result.volume >= 0)) throw new Error(`${ticker}: invalid volume`);
            if (result.high < Math.max(result.open, result.close) || result.low > Math.min(result.open, result.close) || result.low > result.high) throw new Error(`${ticker}: inconsistent OHLC`);
            console.log('KBS_DATE_SPECIFIC', JSON.stringify(result));
          }
          NODE
