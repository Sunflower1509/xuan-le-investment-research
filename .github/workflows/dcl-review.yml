name: Validate DCL report refresh on review branch
on:
  push:
    branches: [review/dcl-20261125]
    paths: ['.github/workflows/dcl-review.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify and stage original PDF
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.firestorage.ai/dev/file
          share=PCbDfbA_mKVo
          listing="$(curl -fsSL --retry 3 --max-time 60 "$api/shares/$share/files?maxResults=1000")"
          file_id="$(printf '%s' "$listing" | python3 -c 'import json,sys; d=json.load(sys.stdin); m=[f for f in d["files"] if (f.get("fileName") or f.get("name"))=="DCL_2026-11-25.pdf"]; assert len(m)==1; print(m[0].get("fileId") or m[0].get("id"))')"
          url="$(curl -fsSL --max-time 60 -X POST "$api/shares/$share/files/$file_id/download" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])')"
          test ! -e reports/DCL_2026-11-25.pdf
          curl -fsSL --retry 3 --max-time 120 "$url" -o reports/DCL_2026-11-25.pdf
          echo 'fefeffac62519ae2d99f1c1c0908853b128865fa95fbed08eb64c50623a68386  reports/DCL_2026-11-25.pdf' | sha256sum -c -
          test "$(wc -c < reports/DCL_2026-11-25.pdf)" = 811599
          command -v pdfinfo >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y poppler-utils; }
          test "$(pdfinfo reports/DCL_2026-11-25.pdf | awk '/^Pages:/ {print $2}')" = 33
      - name: Replace DCL metadata only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'), vm=require('node:vm'), assert=require('node:assert/strict');
          const p='src/data/research-data.js', sandbox={window:{}};
          vm.runInNewContext(fs.readFileSync(p,'utf8'),sandbox);
          const d=sandbox.window.RESEARCH_DATA, vals=d.reports.filter(r=>r.reportType!=='trading');
          const rs=vals.filter(r=>r.ticker==='DCL'), cs=d.coverage.filter(c=>c.ticker==='DCL');
          assert.equal(rs.length,1); assert.equal(cs.length,1);
          const r=rs[0], c=cs[0];
          assert.equal(r.id,'DCL-20260918'); assert.equal(c.reportId,r.id);
          assert.equal(r.file,'reports/DCL_2026-09-18.pdf');
          assert.equal(vals.length,136); assert.equal(d.coverage.length,136);
          assert.equal(new Set(vals.map(x=>x.ticker)).size,136);
          assert.equal(new Set(d.coverage.map(x=>x.ticker)).size,136);
          const file='reports/DCL_2026-11-25.pdf';
          const action={zoneLow:null,zoneHigh:null,baseValue:8000,stop:null,targets:[],basisDate:'2026-11-25',recommendation:'LOẠI - KHÔNG THIẾT LẬP KỊCH BẢN GIAO DỊCH',eligibility:'veto',condition:'Theo báo cáo có điều kiện ngày 25/11/2026, cổng dữ liệu và bộ lọc thanh khoản chưa đạt; không xác lập vùng mua, dừng lỗ, mục tiêu hoặc R/R. Ngưỡng M chỉ là kết quả mô hình, không phải điểm đặt lệnh.'};
          Object.assign(r,{id:'DCL-20261125',date:'2026-11-25',recommendation:'TRÁNH / LOẠI',status:'reject',marketPrice:30700,marketPriceDate:'2026-11-25',baseValue:8000,valueLabel:'Giá trị kỳ vọng có điều kiện',rangeLow:1600,rangeHigh:15100,gapLabel:'P0 30.700 đồng/cp vượt cận trên 15.100 đồng/cp của mô hình có điều kiện. Cổng dữ liệu KHÔNG ĐẠT, độ tin cậy THẤP.',method:'PP-01 FCFF 44,4% + PP-16 EV/EBITDA 55,6%; PP-18 kiểm tra, trọng số 0%',summary:'Báo cáo có điều kiện, độ tin cậy THẤP, cổng dữ liệu KHÔNG ĐẠT. GTKV 8.000 đồng/cp; dải giá trị 1.600–15.100 đồng/cp. Khối lượng phiên 25/11 trong PDF là 1.000 cp, khác lịch sử BSC 1.200 cp, cần đối chiếu. Trang 11 có lỗi diễn giải so sánh 1,03 và 0,8. Không thiết lập kịch bản giao dịch.',action,file,edition:'Bản định giá 25.11.2026',visual:{src:'assets/images/reports/dcl.webp?v=20261125-cover1',alt:'Trang bìa báo cáo định giá DCL ngày 25/11/2026',caption:'Bìa báo cáo định giá DCL',sourceLabel:'Xuân Lê TVS Equity Research',sourceUrl:file,kind:'report-cover'}});
          Object.assign(c,{reportId:r.id,action:structuredClone(action)});
          d.reports.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(a.ticker||'').localeCompare(String(b.ticker||''))||String(a.reportType||'valuation').localeCompare(String(b.reportType||'valuation')));
          assert.ok(d.coverage.every(x=>x.priceDate===d.meta.updated));
          assert.ok(d.coverage.every(x=>vals.some(y=>y.id===x.reportId&&y.ticker===x.ticker)));
          assert.ok(d.reports.every(x=>x.file!=='reports/DCL_2026-09-18.pdf'));
          fs.writeFileSync(p,'window.RESEARCH_DATA = '+JSON.stringify(d,null,2)+';\n');
          NODE
          rm reports/DCL_2026-09-18.pdf assets/images/reports/dcl.webp
          node scripts/sync-report-covers.mjs
      - name: Full tests and integrity audits
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/audit-site.mjs
          node scripts/audit-report-covers.mjs
          node scripts/audit-company-logos.mjs
          node scripts/audit-company-visuals.mjs
      - name: Verify exact change scope and persist only review branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/review/dcl-20261125
          rm .github/workflows/dcl-review.yml
          git add -A
          git diff --cached --name-only --no-renames | sort >/tmp/actual
          printf '%s\n' .github/workflows/dcl-review.yml assets/images/reports/dcl.webp reports/DCL_2026-09-18.pdf reports/DCL_2026-11-25.pdf src/data/research-data.js | sort >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --cached --exit-code -- index.html src/index.css src/styles
          echo 'fefeffac62519ae2d99f1c1c0908853b128865fa95fbed08eb64c50623a68386  reports/DCL_2026-11-25.pdf' | sha256sum -c -
          test -s assets/images/reports/dcl.webp
          git fetch origin review/dcl-20261125
          test "$(git rev-parse origin/review/dcl-20261125)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh DCL report to 25 November 2026; preserve layout'
          git push origin HEAD:refs/heads/review/dcl-20261125
