name: One-time EOD diagnostic 2026-09-22

on:
  push:
    paths:
      - ".github/workflows/eod-diagnostic-20260922.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Fetch exact-date OIL evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { parseKbsDaily, parseVndirect } from './scripts/update-eod-market-data.mjs';

          const date = '2026-09-22';
          const vndUrl = 'https://api-finfo.vndirect.com.vn/v4/stock_prices?sort=date&q=code:OIL~date:2026-09-22&size=10';
          const kbsUrl = 'https://kbbuddywts.kbsec.com.vn/iis-server/investment/stocks/OIL/data_day?sdate=22-09-2026&edate=22-09-2026';

          const getJson = async (url) => {
            const res = await fetch(url, { headers: { accept: 'application/json,text/plain,*/*', 'user-agent': 'Mozilla/5.0 XuanLeTVS-EOD-Diagnostic/1.0' } });
            if (!res.ok) throw new Error(url + ' HTTP ' + res.status);
            return await res.json();
          };

          const [vnd, kbs] = await Promise.all([getJson(vndUrl), getJson(kbsUrl)]);
          const vndRow = Array.isArray(vnd?.data) ? vnd.data.find(x => String(x.code).toUpperCase() === 'OIL' && String(x.date) === date) : null;
          console.log('VNDIRECT_RAW', JSON.stringify(vndRow));
          console.log('VNDIRECT_PARSED', JSON.stringify(parseVndirect(vnd, 'OIL', date)));
          console.log('KBS_RAW', JSON.stringify(kbs));
          console.log('KBS_PARSED', JSON.stringify(parseKbsDaily(kbs, date)));
          NODE
