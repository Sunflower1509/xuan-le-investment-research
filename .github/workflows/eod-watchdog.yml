# Manual recovery trigger: 2026-10-09 EOD validated 133 prices; retry after layout-contract doc test fix
name: EOD schedule watchdog

on:
  push:
    paths:
      - ".github/workflows/eod-watchdog.yml"
  schedule:
    - cron: "47 9 * * 1-5" # 16:47 Asia/Ho_Chi_Minh (UTC+7)
    - cron: "17 10 * * 1-5" # 17:17 Asia/Ho_Chi_Minh (UTC+7)
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: eod-watchdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out default branch
        uses: actions/checkout@v5

      - name: Check EOD freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const now = new Date();
          const parts = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Ho_Chi_Minh', year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
          }).formatToParts(now);
          const map = Object.fromEntries(parts.filter((part) => part.type !== 'literal').map((part) => [part.type, part.value]));
          const localToday = `${map.year}-${map.month}-${map.day}`;
          // Actions schedules may be delayed past midnight in Vietnam.
          // Always check the most recent *completed* trading session.
          const holidays2026 = new Set([
            '2026-01-01', '2026-01-02',
            '2026-02-16', '2026-02-17', '2026-02-18', '2026-02-19', '2026-02-20',
            '2026-04-27', '2026-04-30', '2026-05-01',
            '2026-08-31', '2026-09-01', '2026-09-02'
          ]);
          const previousDay = (date) => {
            const d = new Date(`${date}T12:00:00Z`);
            d.setUTCDate(d.getUTCDate() - 1);
            return d.toISOString().slice(0, 10);
          };
          const isTradingDay = (date) => {
            const weekday = new Date(`${date}T12:00:00Z`).getUTCDay();
            return weekday !== 0 && weekday !== 6 && !holidays2026.has(date);
          };
          const localMinutes = Number(map.hour) * 60 + Number(map.minute);
          let target = localToday;
          if (localMinutes < (15 * 60 + 15)) target = previousDay(target);
          while (!isTradingDay(target)) target = previousDay(target);
          const marketOpen = isTradingDay(target);
          const afterClose = target < localToday || localMinutes >= (15 * 60 + 15);
          const code = fs.readFileSync('src/data/research-data.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(code, sandbox, { filename: 'src/data/research-data.js' });
          const current = sandbox.window.RESEARCH_DATA?.meta?.updated || '';
          // Never re-dispatch an earlier session over a newer verified lock.
          const stale = marketOpen && afterClose && (!current || current < target);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `target=${target}\ncurrent=${current}\nmarket_open=${marketOpen ? 'true' : 'false'}\nafter_close=${afterClose ? 'true' : 'false'}\nstale=${stale ? 'true' : 'false'}\n`
          );
          console.log(`EOD freshness: localToday=${localToday} target=${target} marketOpen=${marketOpen} afterClose=${afterClose} current=${current || 'missing'}`);
          NODE

      - name: Dispatch verified EOD when stale
        if: steps.freshness.outputs.market_open == 'true' && steps.freshness.outputs.after_close == 'true' && steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active_runs="$(gh run list             --workflow eod-daily.yml             --branch main             --limit 20             --json status             --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
          if (( active_runs > 0 )); then
            echo "Verified EOD workflow already active; skip duplicate recovery dispatch."
            exit 0
          fi
          gh workflow run eod-daily.yml --ref main -f date="${{ steps.freshness.outputs.target }}"
          echo "Dispatched verified EOD recovery for ${{ steps.freshness.outputs.target }}"

      - name: Market closed - watchdog no-op
        if: steps.freshness.outputs.market_open == 'false'
        run: echo "Market closed for ${{ steps.freshness.outputs.target }}; watchdog will not dispatch EOD recovery."

      - name: Already current
        if: steps.freshness.outputs.market_open == 'true' && steps.freshness.outputs.stale == 'false'
        run: echo "EOD already current for ${{ steps.freshness.outputs.target }}; no action required."
