# Manual recovery trigger: 2026-10-19 verified EOD cross-check after ATC close
name: EOD schedule watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eod-watchdog.yml"
  schedule:
    - cron: "47 9 * * 1-5" # 16:47 Asia/Ho_Chi_Minh (UTC+7)
    - cron: "17 10 * * 1-5" # 17:17 Asia/Ho_Chi_Minh (UTC+7)
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: eod-watchdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchdog:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out default branch
        uses: actions/checkout@v5

      - name: Check EOD freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import { inspectRepositorySession } from './scripts/eod-watchdog-health.mjs';
          const now = new Date();
          const parts = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Ho_Chi_Minh', year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
          }).formatToParts(now);
          const map = Object.fromEntries(parts.filter((part) => part.type !== 'literal').map((part) => [part.type, part.value]));
          const localToday = `${map.year}-${map.month}-${map.day}`;
          // Actions schedules may be delayed past midnight in Vietnam.
          // Always check the most recent *completed* trading session.
          const holidays2026 = new Set([
            '2026-01-01', '2026-01-02',
            '2026-02-16', '2026-02-17', '2026-02-18', '2026-02-19', '2026-02-20',
            '2026-04-27', '2026-04-30', '2026-05-01',
            '2026-08-31', '2026-09-01', '2026-09-02',
            // Ngày Văn hóa Việt Nam — HOSE thông báo 11/11/2026; https://vsdc.vn/vi/ad/202680
            '2026-11-24'
          ]);
          const previousDay = (date) => {
            const d = new Date(`${date}T12:00:00Z`);
            d.setUTCDate(d.getUTCDate() - 1);
            return d.toISOString().slice(0, 10);
          };
          const isTradingDay = (date) => {
            const weekday = new Date(`${date}T12:00:00Z`).getUTCDay();
            return weekday !== 0 && weekday !== 6 && !holidays2026.has(date);
          };
          const localMinutes = Number(map.hour) * 60 + Number(map.minute);
          let target = localToday;
          if (localMinutes < (15 * 60 + 15)) target = previousDay(target);
          while (!isTradingDay(target)) target = previousDay(target);
          const marketOpen = isTradingDay(target);
          const afterClose = target < localToday || localMinutes >= (15 * 60 + 15);
          const code = fs.readFileSync('src/data/research-data.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(code, sandbox, { filename: 'src/data/research-data.js' });
          const { current, needsEod } = inspectRepositorySession(sandbox.window.RESEARCH_DATA, target);
          // A current meta date alone does not establish completeness.
          const stale = marketOpen && afterClose && needsEod;
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `target=${target}\ncurrent=${current}\nmarket_open=${marketOpen ? 'true' : 'false'}\nafter_close=${afterClose ? 'true' : 'false'}\nstale=${stale ? 'true' : 'false'}\n`
          );
          console.log(`EOD freshness: localToday=${localToday} target=${target} marketOpen=${marketOpen} afterClose=${afterClose} current=${current || 'missing'}`);
          NODE

      - name: Dispatch verified EOD when stale
        if: steps.freshness.outputs.market_open == 'true' && steps.freshness.outputs.after_close == 'true' && steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active_runs="$(gh run list             --workflow eod-daily.yml             --branch main             --limit 20             --json status             --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
          if (( active_runs > 0 )); then
            echo "Verified EOD workflow already active; skip duplicate recovery dispatch."
            exit 0
          fi
          gh workflow run eod-daily.yml --ref main -f date="${{ steps.freshness.outputs.target }}"
          echo "Dispatched verified EOD recovery for ${{ steps.freshness.outputs.target }}"

      - name: Check published EOD freshness
        id: live
        if: steps.freshness.outputs.market_open == 'true' && steps.freshness.outputs.stale == 'false'
        env:
          EXPECTED_DATE: ${{ steps.freshness.outputs.current }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { comparePublicSession } from './scripts/eod-watchdog-health.mjs';
          const current = process.env.EXPECTED_DATE;
          const local = comparePublicSession(fs.readFileSync('index.html','utf8'),current);
          if (local.needsPages) throw new Error('Repository first-paint date is stale; audit before deploy');
          const url = 'https://sunflower1509.github.io/xuan-le-investment-research/';
          let result;
          for (let i=0;i<3;i++) {
            const request = new URL(url);
            request.searchParams.set('watchdog',String(Date.now()));
            const response = await fetch(request,{cache:'no-store',signal:AbortSignal.timeout(15000)});
            if (!response.ok) throw new Error('Public site HTTP '+response.status);
            result = comparePublicSession(await response.text(),current);
            if (!result.needsPages) break;
            if (i<2) await new Promise(resolve=>setTimeout(resolve,5000));
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`needs_pages=${result.needsPages}\nlive_date=${result.liveDate}\n`);
          console.log(JSON.stringify({expectedDate:current,...result}));
          NODE

      - name: Recover stale published Pages without refetching quotes
        if: steps.live.outputs.needs_pages == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in eod-daily.yml pages.yml; do
            active_runs="$(gh run list --workflow "$workflow" --branch main --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
            if (( active_runs > 0 )); then
              echo "Production workflow $workflow already active; skip duplicate recovery."
              exit 0
            fi
          done
          gh workflow run pages.yml --ref main
          echo "Dispatched Pages-only recovery from verified repository data."

      - name: Market closed - watchdog no-op
        if: steps.freshness.outputs.market_open == 'false'
        run: echo "Market closed for ${{ steps.freshness.outputs.target }}; watchdog will not dispatch EOD recovery."

      - name: Already current
        if: steps.freshness.outputs.market_open == 'true' && steps.freshness.outputs.stale == 'false' && steps.live.outputs.needs_pages == 'false'
        run: echo "EOD already current for ${{ steps.freshness.outputs.target }}; no action required."
