name: Audit stock logo source

on:
  push:
    branches:
      - audit/stock-logo-source-20260903

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/stock-logo-source-20260903
      - name: Inspect unresolved CafeF profile logo markup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re,html,json
          tickers=['GEL','HDB','HHS','LPB','NLG','OIL','TCB','TCH','VCK','VIB','VJC','VPX']
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36','Accept':'text/html,*/*'}
          for ticker in tickers:
            url=f'https://cafef.vn/du-lieu/{ticker.lower()}/thong-tin-chung.chn'
            print('\n===== ',ticker,url,' =====')
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=12) as r: raw=r.read()
              text=raw.decode('utf-8','ignore')
              print('bytes',len(raw),'final')
              hits=[]
              for m in re.finditer(r'(?i)(?:LOGO|logo|Logo)',text):
                a=max(0,m.start()-500);b=min(len(text),m.end()+700)
                snippet=text[a:b].replace('\r',' ').replace('\n',' ')
                if ticker.lower() in snippet.lower() or '/LOGO/' in snippet or 'companylogo' in snippet.lower():
                  hits.append(snippet)
              for s in hits[:8]: print('SNIP',s[:1500])
              # print all exact cafef LOGO asset strings regardless of HTML validity
              urls=[]
              for p in re.findall(r'https?://[^"\'<>\s]+',text):
                p=html.unescape(p)
                if '/LOGO/' in p.upper() or '/logo/' in p.lower(): urls.append(p)
              print('ASSETS',json.dumps(list(dict.fromkeys(urls))[:20],ensure_ascii=False))
            except Exception as e: print('ERROR',repr(e))
          PY
