name: Audit stock logo source

on:
  push:
    branches:
      - audit/stock-logo-source-20260903

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/stock-logo-source-20260903
      - name: Trace dynamic CafeF company logo API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re,json
          tickers=['HHS','NLG','OIL','TCH','VJC']
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36','Accept':'text/html,*/*'}
          for ticker in tickers:
            url=f'https://cafef.vn/du-lieu/{ticker.lower()}/thong-tin-chung.chn'
            print(f'\n===== {ticker} =====')
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=15) as r: text=r.read().decode('utf-8','ignore')
            # Print compact snippets around likely data fetch/assignment instructions.
            patterns=[r'infoCompanyIntro\s*=\s*\{',r'async\s+init\s*\(',r'this\.data\s*=',r'fetch\s*\(',r'axios',r'\.ajax\s*\(',r'api[^"\'\s<]{0,120}',r'CompanyInfo',r'company-info',r'GetCompany']
            seen=[]
            for pat in patterns:
              for m in re.finditer(pat,text,re.I):
                a=max(0,m.start()-1300);b=min(len(text),m.end()+2500)
                sn=' '.join(text[a:b].replace('\r',' ').replace('\n',' ').split())
                if sn not in seen:
                  seen.append(sn); print('SNIP',sn[:3800])
                if len(seen)>=12: break
              if len(seen)>=12: break
            # Extract URL-ish literals near infoCompanyIntro block.
            pos=text.find('infoCompanyIntro')
            block=text[max(0,pos-3000):pos+22000] if pos>=0 else text
            urls=re.findall(r'["\']([^"\']*(?:api|Api|API|company|Company|symbol|Symbol|du-lieu)[^"\']*)["\']',block)
            print('URL_LITERALS',json.dumps(list(dict.fromkeys(urls))[:80],ensure_ascii=False))
          PY
