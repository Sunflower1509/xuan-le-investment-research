name: Audit stock logo source

on:
  push:
    branches:
      - audit/stock-logo-source-20260903

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/stock-logo-source-20260903
      - name: Audit CafeF logo coverage for every research ticker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, hashlib, struct
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed

          text=open('src/data/research-data.js','r',encoding='utf-8').read().strip()
          prefix='window.RESEARCH_DATA = '
          if not text.startswith(prefix): raise SystemExit('Unexpected research-data wrapper')
          payload=text[len(prefix):]
          if payload.endswith(';'): payload=payload[:-1]
          data=json.loads(payload)
          tickers=sorted({str(x['ticker']).strip().upper() for x in data['coverage']})
          print('coverage_tickers', len(tickers))

          def fetch_logo(ticker):
              url=f'https://cafefnew.mediacdn.vn/LOGO/{ticker}.png'
              req=urllib.request.Request(url,headers={
                  'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
                  'Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
                  'Referer':f'https://cafef.vn/du-lieu/{ticker.lower()}/thong-tin-chung.chn'
              })
              try:
                  with urllib.request.urlopen(req,timeout=8) as r:
                      body=r.read(); status=r.status; ctype=r.headers.get('content-type','')
                  is_png=body[:8]==b'\x89PNG\r\n\x1a\n'
                  w=h=None
                  if is_png and len(body)>=24 and body[12:16]==b'IHDR': w,h=struct.unpack('>II',body[16:24])
                  sha=hashlib.sha256(body).hexdigest()
                  ok=status==200 and is_png and len(body)>=500 and (w or 0)>=20 and (h or 0)>=20
                  return {'ticker':ticker,'ok':ok,'status':status,'contentType':ctype,'bytes':len(body),'width':w,'height':h,'sha256':sha,'url':url}
              except Exception as e:
                  return {'ticker':ticker,'ok':False,'error':repr(e),'url':url}

          rows=[]
          with ThreadPoolExecutor(max_workers=16) as pool:
              futures={pool.submit(fetch_logo,t):t for t in tickers}
              for i,fut in enumerate(as_completed(futures),1):
                  row=fut.result(); rows.append(row)
                  print(f'[{i:03d}/{len(tickers)}] {row["ticker"]} ok={row.get("ok")} status={row.get("status")} bytes={row.get("bytes")} dim={row.get("width")}x{row.get("height")} err={row.get("error","")}')

          rows.sort(key=lambda r:r['ticker'])
          hashes=defaultdict(list)
          for r in rows:
              if r.get('sha256'): hashes[r['sha256']].append(r['ticker'])
          failures=[r for r in rows if not r.get('ok')]
          dupes={sha:ts for sha,ts in hashes.items() if len(ts)>1}
          summary={
              'coverage':len(tickers),
              'success':sum(1 for r in rows if r.get('ok')),
              'failures':failures,
              'duplicateHashGroups':dupes,
              'uniqueHashes':len(hashes),
              'minBytes':min((r.get('bytes',10**18) for r in rows if r.get('ok')),default=None),
              'minWidth':min((r.get('width',10**9) for r in rows if r.get('ok')),default=None),
              'minHeight':min((r.get('height',10**9) for r in rows if r.get('ok')),default=None),
          }
          print('\nSUMMARY')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
