name: Audit stock logo source

on:
  push:
    branches:
      - audit/stock-logo-source-20260903

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/stock-logo-source-20260903
      - name: Resolve GEL official logo asset from GELEX Infrastructure
        shell: bash
        run: |
          set -euo pipefail
          curl -kfsSL --retry 3 --connect-timeout 15 --max-time 45 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36' \
            https://gelex-infra.vn/ -o /tmp/gel-home.html
          echo "homepage_bytes=$(wc -c </tmp/gel-home.html)"
          python - <<'PY'
          import re,html,json,subprocess,hashlib,os,struct
          from urllib.parse import urljoin
          page='https://gelex-infra.vn/'
          text=open('/tmp/gel-home.html','r',encoding='utf-8',errors='ignore').read()
          print('GEL markers', {'GEL (HOSE)': 'GEL (HOSE)' in text, 'Mã cổ phiếu': 'Mã cổ phiếu' in text})
          candidates=[]
          for tag in re.findall(r'<(?:img|source|link)\b[^>]*>',text,re.I):
            attrs={k.lower():html.unescape(v) for k,v in re.findall(r'([\w:-]+)\s*=\s*["\']([^"\']*)["\']',tag)}
            vals=[]
            for key in ('src','data-src','data-lazy-src','href'):
              if attrs.get(key): vals.append(attrs[key])
            if attrs.get('srcset'): vals += [x.strip().split()[0] for x in attrs['srcset'].split(',') if x.strip()]
            blob=' '.join([tag,attrs.get('alt',''),attrs.get('class',''),attrs.get('id',''),attrs.get('rel','')]).lower()
            for val in vals:
              if not val or val.startswith('data:'): continue
              u=urljoin(page,val); low=(blob+' '+u).lower(); score=0
              if 'logo' in low: score+=10
              if 'brand' in low: score+=4
              if 'header' in low: score+=3
              if 'gelex' in low: score+=4
              if 'infra' in low: score+=5
              if any(x in low for x in ['favicon','apple-touch','partner','award','cert']): score-=4
              if score>0: candidates.append((score,u,attrs.get('alt',''),tag[:400]))
          for m in re.findall(r'["\']([^"\']*(?:logo|Logo|LOGO|gelex|GELEX)[^"\']*\.(?:svg|png|jpe?g|webp)(?:\?[^"\']*)?)["\']',text):
            if not m.startswith('data:'): candidates.append((8,urljoin(page,html.unescape(m)),'embedded','embedded'))
          seen=set(); ranked=[]
          for row in sorted(candidates,key=lambda x:(-x[0],len(x[1]))):
            if row[1] in seen: continue
            seen.add(row[1]); ranked.append(row)
          rows=[]
          for idx,(score,u,alt,tag) in enumerate(ranked[:30]):
            out=f'/tmp/gel-candidate-{idx}'
            proc=subprocess.run(['curl','-kfsSL','--retry','2','--connect-timeout','10','--max-time','30','-A','Mozilla/5.0','-e',page,u,'-o',out],capture_output=True,text=True)
            if proc.returncode:
              rows.append({'score':score,'url':u,'alt':alt,'error':proc.stderr.strip(),'tag':tag}); continue
            body=open(out,'rb').read(); fmt='unknown'; w=h=None
            if body[:8]==b'\x89PNG\r\n\x1a\n' and len(body)>=24 and body[12:16]==b'IHDR': w,h=struct.unpack('>II',body[16:24]);fmt='png'
            elif body[:3]==b'\xff\xd8\xff': fmt='jpeg'
            elif body.lstrip().startswith(b'<svg') or b'<svg' in body[:500].lower(): fmt='svg'
            elif body[:4]==b'RIFF' and body[8:12]==b'WEBP': fmt='webp'
            rows.append({'score':score,'url':u,'alt':alt,'bytes':len(body),'width':w,'height':h,'format':fmt,'sha256':hashlib.sha256(body).hexdigest(),'tag':tag})
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
