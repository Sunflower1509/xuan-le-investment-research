name: CIVS reconciliation validation

on:
  push:
    branches:
      - reconcile/civs-pr33-pr35-20260927
    paths:
      - "scripts/civs-fetch-fallback.mjs"
      - "src/data/company-visual-overrides.json"
      - "tests/civs-fetch-fallback.test.mjs"
      - "tests/civs-source-overrides.test.mjs"
      - ".github/workflows/civs-reconciliation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civs-reconciliation-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run unit and regression tests
        run: node --test tests/*.test.mjs

      - name: Ensure complete CIVS candidate scaffold
        run: node scripts/ensure-company-visual-candidates.mjs

      - name: Synchronize CIVS in ephemeral runner only
        run: node scripts/sync-company-visuals.mjs

      - name: Audit CIVS integrity after live source discovery
        run: node scripts/audit-company-visuals.mjs

      - name: Build production assets
        run: bash scripts/build/build-assets.sh

      - name: Audit site integrity
        run: node scripts/audit-site.mjs

      - name: Guard public layout and show ephemeral mutations
        shell: bash
        run: |
          set -euo pipefail
          layout_changes="$(git status --porcelain --untracked-files=all -- index.html src/index.css src/styles)"
          if [[ -n "$layout_changes" ]]; then
            echo "Unexpected public layout mutation:" >&2
            echo "$layout_changes" >&2
            exit 2
          fi
          echo "Ephemeral CIVS mutations generated for validation only:"
          git status --short
          echo "No files are committed or pushed by this workflow."
