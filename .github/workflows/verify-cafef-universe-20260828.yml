name: Verify CafeF secondary gate for full 108 ticker universe

on:
  push:
    branches: [main]
    paths:
      - '.github/verify-cafef-universe-20260828.trigger'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare VNDIRECT vs CafeF close and matched volume for 108 tickers
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm';
          const s={window:{}};vm.runInNewContext(fs.readFileSync('src/data/research-data.js','utf8'),s);const base=s.window.RESEARCH_DATA.coverage.map(x=>x.ticker);
          const extra=['PET','HDG','SZC','LHG','DPG','MCH','SJS','CMG','VPI','SBT','BVH','FTS'];
          const tickers=[...new Set([...base,...extra])].sort();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const normalizePrice=v=>{const n=Number(v);return n>0?(n<1000?Math.round(n*1000):Math.round(n)):null};
          const parseViNumber=text=>{const t=String(text??'').trim().replace(/\./g,'').replace(',','.').replace(/[^0-9.+-]/g,'');const n=Number(t);return Number.isFinite(n)?n:null};
          const strip=s=>String(s??'').replace(/<[^>]*>/g,' ').replace(/&nbsp;|&#160;/gi,' ').replace(/\s+/g,' ').trim();
          const parseCafeF=(html,ticker)=>{
            const re=/<tr[^>]*>\s*<td[^>]*class=["']col1["'][^>]*>\s*28\/08\s*<\/td>[\s\S]*?<td[^>]*class=["']col2["'][^>]*>[\s\S]*?<div[^>]*class=["']l["'][^>]*>([^<]+)<\/div>[\s\S]*?<div[^>]*class=['"][^'"]*r[^'"]*['"][^>]*>([^<]+)<\/div>[\s\S]*?<td[^>]*class=["']col3["'][^>]*>([^<]+)<\/td>/i;
            const m=html.match(re);if(!m)throw new Error(`${ticker}: CafeF missing 28/08 history row`);
            const closeRaw=parseViNumber(strip(m[1])), changeText=strip(m[2]), volumeRaw=parseViNumber(strip(m[3]));
            const pctMatch=changeText.match(/\(([+-]?[\d.,]+)%\)/);const pct=pctMatch?parseViNumber(pctMatch[1]):null;
            if(!(closeRaw>0)||!(volumeRaw>=0)||pct===null)throw new Error(`${ticker}: CafeF parse incomplete close=${closeRaw} volume=${volumeRaw} pct=${pct}`);
            return {close:normalizePrice(closeRaw),volume:Math.round(volumeRaw),changePct:pct};
          };
          const fetchText=async(url)=>{let e;for(let a=1;a<=4;a++){try{const r=await fetch(url,{headers:{accept:'text/html,application/json','user-agent':'Mozilla/5.0 XuanLeTVS-EOD-Integrity-Gate/2.0'},signal:AbortSignal.timeout(20000)});if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.text();}catch(x){e=x;if(a<4)await sleep(a*500);}}throw e;};
          const results=[];let cursor=0;const workers=Array.from({length:5},async()=>{while(cursor<tickers.length){const i=cursor++,ticker=tickers[i];try{const vurl=`https://api-finfo.vndirect.com.vn/v4/stock_prices?sort=date&q=code:${ticker}~date:2026-08-28&size=10`;const curl=`https://cafef.vn/du-lieu/DuLieu.aspx?cat_id=1009&symbol=${ticker}`;const [vj,ch]=await Promise.all([fetchText(vurl),fetchText(curl)]);const vp=JSON.parse(vj),row=(vp.data||[]).find(x=>x.code===ticker&&x.date==='2026-08-28');if(!row)throw new Error(`${ticker}: VNDIRECT missing`);const v={close:normalizePrice(row.close),volume:Math.round(Number(row.nmVolume)),changePct:Number(row.pctChange)};const c=parseCafeF(ch,ticker);const closeOk=v.close===c.close,volumeOk=v.volume===c.volume,pctOk=Math.abs(v.changePct-c.changePct)<=0.011;results[i]={ticker,ok:closeOk&&volumeOk&&pctOk,v,c,closeOk,volumeOk,pctOk};}catch(e){results[i]={ticker,ok:false,error:String(e?.message||e)};}}});await Promise.all(workers);
          const bad=results.filter(x=>!x.ok);console.log(JSON.stringify({count:tickers.length,ok:results.length-bad.length,bad},null,2));if(bad.length)process.exit(2);
          NODE
