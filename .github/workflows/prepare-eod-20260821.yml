name: Prepare verified EOD 20260821 candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'feature/eod-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eod-20260821
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lock verified 58/58 stock EOD
        id: market
        run: |
          node scripts/update-eod-market-data.mjs \
            --date 2026-08-21 \
            --status-file "${RUNNER_TEMP}/eod-status.json" \
            --max-attempts 1 \
            --wait-ms 0
          cat "${RUNNER_TEMP}/eod-status.json"
          test "${{ steps.market.outputs.status }}" != 'not-ready'

      - name: Lock VNDIRECT market session 21 Aug
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm';
          const path='src/data/research-data.js'; const code=fs.readFileSync(path,'utf8'); const s={window:{}}; vm.runInNewContext(code,s); const d=s.window.RESEARCH_DATA;
          if(d.meta.updated!=='2026-08-21'||d.coverage.length!==58||d.coverage.some(x=>x.priceDate!=='2026-08-21')) throw new Error('Coverage EOD gate failed');
          const url='https://api-finfo.vndirect.com.vn/v4/vnmarket_prices?sort=code&q=date:2026-08-21&size=500';
          const res=await fetch(url,{headers:{accept:'application/json','user-agent':'XuanLeTVS-MarketSession/1.3'},signal:AbortSignal.timeout(15000)}); if(!res.ok) throw new Error(`HTTP ${res.status}`);
          const payload=await res.json(); const rows=Array.isArray(payload?.data)?payload.data:[]; const key=(r)=>String(r.code||r.indexCode||r.symbol||'').toUpperCase(); const find=(a)=>rows.find(r=>a.includes(key(r))); const num=(x)=>Number.isFinite(Number(x))?Number(x):null;
          const vn=find(['VNINDEX','VN-INDEX','HOSE']), vn30=find(['VN30','VN30-INDEX']), hnx=find(['HNX','HNXINDEX','HNX-INDEX']);
          const parse=(r,label)=>{if(!r)throw new Error(`Missing ${label}`);const close=num(r.close??r.index??r.value),change=num(r.change??r.changeValue),pct=num(r.pctChange??r.changePct??r.percentChange);if([close,change,pct].some(v=>v===null))throw new Error(`Incomplete ${label}`);return{code:label,close,change,changePct:pct};};
          const advance=num(vn?.nmAdvances??vn?.advances??vn?.advance??vn?.up), unchanged=num(vn?.nmNoChange??vn?.noChange??vn?.unchanged??vn?.reference), decline=num(vn?.nmDeclines??vn?.declines??vn?.decline??vn?.down), floor=num(vn?.nmFloors??vn?.floorStocks??vn?.floors??vn?.floor);
          if([advance,unchanged,decline,floor].some(v=>v===null)) throw new Error(`Breadth incomplete: ${JSON.stringify(vn)}`);
          d.marketSession={date:'2026-08-21',status:'Đã khóa EOD — VNDIRECT Finfo',indices:[parse(vn,'VN-INDEX'),parse(vn30,'VN30'),parse(hnx,'HNX-INDEX')],breadth:{advance,unchanged,decline,floor},sources:[{label:'VNDIRECT Finfo — chỉ số & độ rộng EOD 21/08/2026',url}]};
          fs.writeFileSync(path,`window.RESEARCH_DATA = ${JSON.stringify(d,null,2)};\n`);
          console.log(JSON.stringify(d.marketSession,null,2));
          NODE

      - name: Process and reconcile Trade Ledger
        run: |
          cp src/data/trade-ledger.json "${RUNNER_TEMP}/trade-ledger-before.json"
          node scripts/process-trade-ledger.mjs
          node scripts/reconcile-trade-ledger.mjs --before "${RUNNER_TEMP}/trade-ledger-before.json" --after src/data/trade-ledger.json --research src/data/research-data.js --report "${RUNNER_TEMP}/ledger-reconciliation.json"
          cat "${RUNNER_TEMP}/ledger-reconciliation.json"

      - name: Build cache labels and first paint
        run: |
          node --test tests/*.test.mjs
          bash scripts/build/build-assets.sh
          node scripts/update-cache-token.mjs --date 2026-08-21
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; const p='index.html'; let s=fs.readFileSync(p,'utf8');
          const reps=[
            [/Institutional Research Terminal của Xuân Lê TVS: giá đóng cửa \d{2}\/\d{2}\/2026/,'Institutional Research Terminal của Xuân Lê TVS: giá đóng cửa 21/08/2026'],
            [/(data-role="ledger-asof">)Giá theo dõi khóa EOD \d{2}\.\d{2}\.2026/,'$1Giá theo dõi khóa EOD 21.08.2026'],
            [/(data-role="coverage-eod-label">)Action Radar • EOD \d{2}\.\d{2}\.2026/,'$1Action Radar • EOD 21.08.2026'],
            [/(data-role="coverage-lock-label">)Giá khóa \d{2}\.\d{2}/,'$1Giá khóa 21.08']
          ];
          for(const [re,v] of reps){const b=s;s=s.replace(re,v);if(s===b)throw new Error(`Missing first-paint marker ${re}`);} fs.writeFileSync(p,s);
          NODE
          node scripts/audit-site.mjs
          bash scripts/build/prepare-site.sh "${RUNNER_TEMP}/site"

      - name: Guard layout CSS dates and mutation scope
        run: |
          set -euo pipefail
          git fetch origin main --depth=2
          git diff --quiet origin/main -- src/index.css src/styles assets/css/site.min.css
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import vm from 'node:vm';
          const h=fs.readFileSync('index.html','utf8');const order=[...h.matchAll(/<section\b[^>]*\bid=(['"])([^'"]+)\1[^>]*>/g)].map(m=>m[2]);const exp=['overview','daily-market','position-ledger','action-radar','research'];if(order.join(',')!==exp.join(','))throw new Error(`Section order changed: ${order}`);
          const c=fs.readFileSync('src/data/research-data.js','utf8');const s={window:{}};vm.runInNewContext(c,s);const d=s.window.RESEARCH_DATA;if(d.meta.updated!=='2026-08-21'||d.marketSession?.date!=='2026-08-21'||d.coverage.length!==58||d.coverage.some(x=>x.priceDate!=='2026-08-21'))throw new Error('Final date invariant failed');
          console.log(`EOD_OK coverage=${d.coverage.length} reports=${d.reports.length}`);console.log(JSON.stringify(d.marketSession));
          NODE
          allowed='^(src/data/research-data\.js|src/data/trade-ledger\.json|assets/js/site\.min\.js|index\.html|\.github/workflows/eod-20260821-once\.yml|\.github/workflows/prepare-eod-20260821\.yml)$'
          unexpected="$(git diff --name-only origin/main | grep -Ev "$allowed" || true)"; if [[ -n "$unexpected" ]]; then echo "$unexpected" >&2; exit 3; fi

      - name: Commit clean validated candidate and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-eod-20260821.yml
          git rm .github/workflows/eod-20260821-once.yml
          git add src/data/research-data.js src/data/trade-ledger.json assets/js/site.min.js index.html
          git diff --cached --name-status
          git commit -m 'Prepare verified EOD 21 Aug 2026 candidate [skip ci]'
          git push origin HEAD:feature/eod-20260821
