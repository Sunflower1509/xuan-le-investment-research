name: Diagnose DNSE EOD date alignment 28 Aug 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/diagnose-dnse-eod-20260828.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print DNSE candles and VNDIRECT rows around target date
        run: |
          node --input-type=module <<'NODE'
          const tickers=['ACB','PET','VGC','FTS'];
          const tzDate=(epoch)=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(epoch*1000));
          const from=Math.floor(Date.parse('2026-08-25T00:00:00+07:00')/1000);
          const to=Math.floor(Date.parse('2026-09-01T23:59:59+07:00')/1000);
          for(const ticker of tickers){
            const durl=`https://services.entrade.com.vn/chart-api/v2/ohlcs/stock?from=${from}&to=${to}&symbol=${ticker}&resolution=1D`;
            const d=await (await fetch(durl,{headers:{accept:'application/json','user-agent':'XuanLeTVS-DNSE-Diagnostic/1.0'}})).json();
            console.log('DNSE',ticker,JSON.stringify((d.t||[]).map((t,i)=>({epoch:t,utc:new Date(t*1000).toISOString(),vn:tzDate(t),o:d.o?.[i],h:d.h?.[i],l:d.l?.[i],c:d.c?.[i],v:d.v?.[i]}))));
            for(const date of ['2026-08-27','2026-08-28','2026-08-31']){
              const vurl=`https://api-finfo.vndirect.com.vn/v4/stock_prices?sort=date&q=code:${ticker}~date:${date}&size=10`;
              const v=await (await fetch(vurl,{headers:{accept:'application/json','user-agent':'XuanLeTVS-DNSE-Diagnostic/1.0'}})).json();
              console.log('VNDIRECT',ticker,date,JSON.stringify(v.data||[]));
            }
          }
          NODE
