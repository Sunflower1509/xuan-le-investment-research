name: XSMB Preflight 2026-09-21

on:
  push:
    branches: ["xsmb-v2.1-python312-runtime"]
    paths:
      - ".github/workflows/xsmb-preflight-20260921.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"

      - name: Install exact frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r xsmb_runtime/requirements-runtime.txt

      - name: Download finalized production workbook
        run: |
          curl -fL "https://at.adobe.com/Yy98l8l1w9IqtwnN" -o XSMB_RECONCILIATION_R5_1200_v2_1_PRODUCTION.xlsx
          echo "b3dcf99f334638b14272187c914a7b15813c0ded21246f9dd5559cb0d80a4676  XSMB_RECONCILIATION_R5_1200_v2_1_PRODUCTION.xlsx" | sha256sum -c -

      - name: Prepare observed-no-forecast manifest
        run: |
          mkdir -p manifests
          cp xsmb_runtime/fixtures/XSMB_OBSERVED_NO_FORECAST_20260920.json manifests/XSMB_OBSERVED_NO_FORECAST_20260920.json

      - name: Download exact-runtime 34-test evidence
        uses: actions/download-artifact@v4
        with:
          name: xsmb-r3-python312-34-tests
          path: test-evidence
          github-token: ${{ github.token }}
          run-id: 35517198556

      - name: Verify runtime
        run: python xsmb_runtime/runtime_gate.py

      - name: Run production preflight
        run: |
          python xsmb_runtime/xsmb_reference_runner_R3_final.py preflight             --workbook XSMB_RECONCILIATION_R5_1200_v2_1_PRODUCTION.xlsx             --forecast-date 2026-09-21             --data-cutoff 2026-09-20             --manifest-dir manifests             --test-evidence test-evidence/TEST_EVIDENCE_MANIFEST_V1.json             | tee PREFLIGHT_20260921.json

      - name: Enforce preflight pass
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("PREFLIGHT_20260921.json").read_text())
          assert p["status"] == "PREFLIGHT PASS", p
          assert p["forecast_date"] == "2026-09-21", p
          assert p["data_cutoff"] == "2026-09-20", p
          assert p["target_index"] == 1202, p
          assert p["runner_sha256"] == "7c9f1bf773a484c20a09942a90a31613179963869dca30e65be8541d5bc7fd7b", p
          assert p["data_hash"] == "824bf0c9f30475477ca904ff442f331741c7287d8c21c2df6f128e446278ffff", p
          print("PRODUCTION_PREFLIGHT_20260921=PASS")
          PY

      - name: Save preflight evidence
        run: |
          sha256sum XSMB_RECONCILIATION_R5_1200_v2_1_PRODUCTION.xlsx > PRODUCTION_WORKBOOK_SHA256.txt

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: xsmb-preflight-20260921-pass
          path: |
            PREFLIGHT_20260921.json
            PRODUCTION_WORKBOOK_SHA256.txt
          if-no-files-found: error
          retention-days: 90
