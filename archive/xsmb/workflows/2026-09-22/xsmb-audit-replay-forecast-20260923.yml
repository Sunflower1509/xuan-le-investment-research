name: XSMB Audit Replay Forecast 2026-09-23

on:
  push:
    branches: ["xsmb-ops-hardening-v1"]
    paths:
      - ".github/workflows/xsmb-audit-replay-forecast-20260923.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: xsmb-audit-replay-20260923
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.12"
      - name: Install exact frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r xsmb_runtime/requirements-runtime.txt
      - name: Download immutable 23 Sep locked artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xsmb-ops-hardened-run-next-20260923-locked
          path: locked
          github-token: ${{ github.token }}
          run-id: 35724042838
      - name: Verify immutable input pins
        run: |
          test "$(sha256sum locked/promoted.xlsx | awk '{print $1}')" = "7c2109160a590f3544b399d1f345f83b3355a3076066aca6b2ce84a0553ca28b"
          test "$(sha256sum xsmb_runtime/xsmb_reference_runner_R4_ops_hardened.py | awk '{print $1}')" = "1634a48ecadef5fa9c366292fcbb9964b9a9121f4286e78f549bca77d2d0c614"
      - name: Fresh-process reproducibility audit
        run: |
          PYTHONPATH=xsmb_runtime python xsmb_runtime/xsmb_reference_runner_R4_ops_hardened.py repro-test             --workbook locked/promoted.xlsx             --manifest-dir locked/manifests             --target-index 1204             --output REPRO_20260923.json             --fresh-process
          cat REPRO_20260923.json
      - name: Diagnose replay versus immutable locked forecast
        run: |
          PYTHONPATH=xsmb_runtime python - <<'PY'
          import json, hashlib, sys
          from pathlib import Path
          import numpy as np
          import xsmb_reference_runner_R4_ops_hardened as r

          locked=json.loads(Path("locked/RUN_NEXT_20260923.json").read_text())
          repro=json.loads(Path("REPRO_20260923.json").read_text())
          state=r.load_workbook_state("locked/promoted.xlsx","locked/manifests")
          pred=r.fit_predict(state.draws,1204)

          locked_vec=np.array([float(locked["probabilities"][f"{i:02d}"]) for i in range(100)],dtype=np.float64)
          replay_vec=np.array([float(pred["probabilities"][f"{i:02d}"]) for i in range(100)],dtype=np.float64)
          delta=np.abs(locked_vec-replay_vec)
          ranked_locked=sorted(locked["probabilities"].items(),key=lambda kv:(-float(kv[1]),kv[0]))
          ranked_replay=sorted(pred["probabilities"].items(),key=lambda kv:(-float(kv[1]),kv[0]))
          report={
            "status":"AUDIT_FINDING" if locked["probability_sha256"]!=pred["probability_sha256"] else "PASS",
            "audit_type":"READ_ONLY_NUMERICAL_REPLAY_DIAGNOSTIC",
            "forecast_date":"2026-09-23",
            "target_index":1204,
            "data_cutoff":pred["data_cutoff"],
            "data_hash_locked":locked["data_hash"],
            "data_hash_replay":pred["data_hash"],
            "locked_probability_sha256":locked["probability_sha256"],
            "replay_probability_sha256":pred["probability_sha256"],
            "repro_test_probability_sha256":repro["run_1_probability_sha256"],
            "top5_locked":locked["top5"],
            "top5_replay":pred["top5"],
            "top10_locked":ranked_locked[:10],
            "top10_replay":ranked_replay[:10],
            "max_absolute_probability_delta":float(delta.max()),
            "mean_absolute_probability_delta":float(delta.mean()),
            "nonzero_delta_count":int((delta!=0).sum()),
            "same_top5":locked["top5"]==pred["top5"],
            "same_top10": [x[0] for x in ranked_locked[:10]]==[x[0] for x in ranked_replay[:10]],
            "same_data_hash":locked["data_hash"]==pred["data_hash"],
            "same_model_snapshot_sha256":locked["model_snapshot_sha256"]==pred["model_snapshot_sha256"],
            "locked_model_snapshot_sha256":locked["model_snapshot_sha256"],
            "replay_model_snapshot_sha256":pred["model_snapshot_sha256"],
            "locked_workbook_sha256":hashlib.sha256(Path("locked/promoted.xlsx").read_bytes()).hexdigest(),
            "runner_sha256":hashlib.sha256(Path("xsmb_runtime/xsmb_reference_runner_R4_ops_hardened.py").read_bytes()).hexdigest(),
            "largest_deltas":[
              {"number":f"{i:02d}","locked":float(locked_vec[i]),"replay":float(replay_vec[i]),"abs_delta":float(delta[i])}
              for i in np.argsort(-delta)[:10]
            ]
          }
          Path("FORECAST_20260923_AUDIT_DIAGNOSTIC.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report,indent=2))
          assert report["same_data_hash"] is True, report
          assert report["same_top5"] is True, report
          PY
      - name: Upload audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xsmb-forecast-20260923-audit-diagnostic
          path: |
            REPRO_20260923.json
            FORECAST_20260923_AUDIT_DIAGNOSTIC.json
          if-no-files-found: error
          retention-days: 90
